<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="theme-color" content="#ff6600"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="Mutantes MC"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<link rel="icon" type="image/png" href="logo.png"/>
<link id="apple-touch-icon" rel="apple-touch-icon" href="logo.png"/>
<link id="pwa-manifest" rel="manifest" href="manifest.json"/>
<title>MUTANTES MC ITAJAÍ — Km Tracker</title>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
<meta http-equiv="Pragma" content="no-cache"/>
<meta http-equiv="Expires" content="0"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0f0f0f;--bg2:rgba(0,0,0,.45);--bg3:rgba(0,0,0,.3);--border:rgba(255,255,255,.1);--orange:#ff6600;--orange-glow:rgba(255,102,0,.28);--white:#ffffff;--muted:rgba(255,255,255,.75);--danger:#e05252;--green:#4caf7d;--shadow-card:0 8px 32px rgba(0,0,0,.4),0 1px 0 rgba(255,255,255,.06);--transition:200ms ease}


body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--white);min-height:100vh;font-size:15px;line-height:1.5}
body::before{content:'';position:fixed;inset:0;background:url('mobile.png') center/cover no-repeat;z-index:-2;pointer-events:none}
body::after{content:'';position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:-1;pointer-events:none}
.app{max-width:480px;margin:0 auto;background:transparent;height:100vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 0 80px rgba(0,0,0,.8),0 0 0 1px rgba(255,255,255,.03)}

.desktop-grid{margin-bottom:20px}
/* ── LAYOUT DESKTOP ────────────────────────────────── */
@media(min-width:768px){
  body::before{background-image:url('desktop1.png')}

  .app{
    max-width:100%;height:100vh;
    display:grid;
    grid-template-columns:200px 1fr;
    grid-template-rows:72px 1fr;
    grid-template-areas:
      "sidebar header"
      "sidebar content";
    box-shadow:none;border-radius:0;
    overflow:hidden;
  }

  /* Header fica no topo direito */
  .header{
    grid-area:header;
    padding:10px 24px !important;
    height:72px;
    border:none !important;
    background:transparent !important;
    backdrop-filter:none !important;
    -webkit-backdrop-filter:none !important;
    box-shadow:none !important;
  }
  .header-info h2{font-size:15px !important;font-weight:600 !important}
  .header-info p{font-size:11px !important;margin-top:1px !important}

  /* Sidebar esquerda */
  .bnav{
    grid-area:sidebar;
    flex-direction:column !important;
    height:100%;width:100%;
    border:none !important;
    padding:20px 10px 16px !important;
    overflow-y:auto;gap:2px !important;
    flex-shrink:0;
    justify-content:flex-start !important;
    align-items:stretch !important;
    background:transparent !important;
    backdrop-filter:none !important;
    -webkit-backdrop-filter:none !important;
    box-shadow:none !important;
  }
  .bnav-item{
    flex:none !important;min-height:46px;width:100%;
    flex-direction:row !important;justify-content:flex-start !important;
    gap:12px !important;padding:10px 16px !important;
    border-radius:12px !important;text-align:left;
    transition:background .18s,box-shadow .18s !important;
  }
  .bnav-item:hover{background:rgba(255,255,255,.06) !important}
  .bnav-item.nav-active{
    background:rgba(255,102,0,.14) !important;
    box-shadow:inset 0 0 0 1px rgba(255,102,0,.2),0 2px 12px rgba(255,102,0,.1) !important;
  }
  .bnav-icon{font-size:22px !important;width:26px;text-align:center;display:flex;align-items:center;justify-content:center;}
  .bnav-icon .lucide{width:22px !important;height:22px !important;}
  .bnav-label{font-size:14px !important;font-weight:500 !important;display:block !important}
  .bnav-item.nav-active .bnav-label{color:var(--orange) !important;font-weight:600 !important}
  .bnav-item.nav-active .bnav-icon .lucide{color:var(--orange) !important;stroke:var(--orange) !important}

  /* Logo do clube no topo da sidebar */
  .bnav-logo{
    display:block;
    padding:0 8px 14px;
    border-bottom:1px solid rgba(255,255,255,.07);
    margin-bottom:10px;width:100%;
    text-align:center;
  }
  .bnav-logo img{height:36px;object-fit:contain;}

  /* Conteúdo principal */
  .body{
    grid-area:content;
    flex:1;
    width:100%;
    padding:2rem !important;
    overflow-y:auto;
  }

  /* Cards em grid responsivo no painel */
  .desktop-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;margin-bottom:20px}
  .desktop-grid .card{margin-bottom:0}
}

/* ── LOGIN DESKTOP ─────────────────────────────────── */
@media(min-width:768px){
  .app:has(.login-wrap){
    display:flex;
    align-items:center;
    justify-content:center;
    background:transparent;
  }

  .login-wrap{
    width: 420px;
    min-width: 420px;
    background: rgba(0,0,0,.55);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 24px;
    padding: 44px;
    box-shadow: 0 24px 64px rgba(0,0,0,.6),0 0 0 1px rgba(255,102,0,.08);
  }

  .login-logo-img{max-width:220px}
}
.splash{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;transition:opacity .6s,transform .6s}
.splash.hide{opacity:0;transform:scale(1.05);pointer-events:none}
.splash-logo{width:130px;height:130px;border-radius:50%;border:3px solid var(--orange);object-fit:contain;background:#111;animation:splashPulse 1.5s ease-in-out infinite;box-shadow:0 0 30px rgba(232,103,10,.4)}
@keyframes splashPulse{0%,100%{box-shadow:0 0 20px rgba(232,103,10,.3)}50%{box-shadow:0 0 40px rgba(232,103,10,.7)}}
.splash-title{font-size:20px;font-weight:700;letter-spacing:2px;margin-top:20px;color:var(--white)}
.splash-sub{font-size:12px;color:var(--muted);margin-top:4px;letter-spacing:1px}
.splash-dots{display:flex;gap:6px;margin-top:24px}
.splash-dot{width:8px;height:8px;border-radius:50%;background:var(--orange);animation:splashDot 1.2s ease-in-out infinite}
.splash-dot:nth-child(2){animation-delay:.2s}
.splash-dot:nth-child(3){animation-delay:.4s}
@keyframes splashDot{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1.2)}}
.confete{position:fixed;inset:0;pointer-events:none;z-index:9998;overflow:hidden}
.confete-p{position:absolute;width:8px;height:8px;border-radius:2px;animation:confeteFall linear forwards}
@keyframes confeteFall{0%{top:-20px;opacity:1;transform:rotate(0deg)}100%{top:110vh;opacity:0;transform:rotate(720deg)}}
.header{display:flex;align-items:center;gap:12px;padding:11px 16px;border-bottom:1px solid rgba(255,102,0,.25);position:relative;overflow:hidden;background:rgba(0,0,0,.35);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);flex-shrink:0}
.header-flames{position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent 0%,rgba(255,102,0,.6) 20%,#ff6600 40%,#ff8c2a 60%,rgba(255,102,0,.6) 80%,transparent 100%)}
.header-info h2{font-size:17px;font-weight:700}
.header-info p{font-size:12px;color:var(--muted);margin-top:2px}
.header-right{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.body{padding:16px;padding-top:20px;flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.bnav{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;background:rgba(0,0,0,.2);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid rgba(255,255,255,.06);border-bottom:1px solid var(--border);flex-shrink:0;padding:6px 8px;gap:4px}
.bnav::-webkit-scrollbar{display:none}
@media(max-width:767px){.bnav-logo{display:none}}
.bnav-item{flex:0 0 auto;min-width:64px;scroll-snap-align:start;min-height:48px;padding:6px 2px 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;border:none;background:transparent;font-family:inherit;position:relative;-webkit-tap-highlight-color:transparent;border-radius:10px;transition:background .18s,box-shadow .18s}
.bnav-icon{font-size:18px;line-height:1;transition:transform .15s;display:flex;align-items:center;justify-content:center;}
.bnav-label{font-size:9px;color:var(--muted);font-weight:500;letter-spacing:.1px;white-space:nowrap}
.bnav-item.nav-active .bnav-label{color:var(--orange);font-weight:700}
.bnav-item.nav-active .bnav-icon{transform:scale(1.1)}
.bnav-item:active .bnav-icon{transform:scale(.85)}
.lucide{color:var(--orange);stroke:var(--orange)}
.bnav-icon .lucide{color:var(--muted);stroke:var(--muted)}
.bnav-item.nav-active .bnav-icon .lucide{color:var(--orange);stroke:var(--orange)}
.bnav-item.nav-active{background:rgba(255,102,0,.14);box-shadow:inset 0 0 0 1px rgba(255,102,0,.2)}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:20px;padding:20px;margin-bottom:16px;box-shadow:var(--shadow-card);transition:border-color .2s,box-shadow .2s;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);overflow:hidden;word-break:break-word;overflow-wrap:anywhere}
.prog-bar{height:6px;border-radius:3px;background:var(--bg3);overflow:hidden;margin:8px 0 4px}
.prog-fill{height:100%;border-radius:3px;transition:width 1s cubic-bezier(.4,0,.2,1)}
.prog-labels{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.metric{background:var(--bg3);border-radius:14px;padding:14px;border:1px solid var(--border);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.metric-label{font-size:10px;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.4px}
.metric-value{font-size:30px;font-weight:700}
.sec-title{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:14px}
.ev-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
.ev-row:last-child{border-bottom:none}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.3px}
.badge-sm{background:rgba(232,103,10,.15);color:var(--orange);border:1px solid rgba(232,103,10,.3)}
.badge-gr{background:rgba(76,175,125,.1);color:var(--green);border:1px solid rgba(76,175,125,.2)}
.badge-admin{background:rgba(232,103,10,.2);color:var(--orange);border:1px solid var(--orange);font-size:9px}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;margin-top:12px;text-transform:uppercase;letter-spacing:.4px;font-weight:600}
input,select{width:100%;padding:13px 14px;border:1px solid var(--border);border-radius:14px;font-size:15px;font-family:inherit;color:var(--white);background:var(--bg3);margin-bottom:14px;transition:border-color .2s,box-shadow .2s}
input:focus,select:focus{outline:none;border-color:var(--orange);box-shadow:0 0 0 3px rgba(255,102,0,.16)}
input::placeholder{color:#444}
select option{background:#161616;color:var(--white)}
.btn{padding:9px 16px;min-height:44px;border-radius:50px;border:1px solid var(--border);background:var(--bg3);cursor:pointer;font-size:13px;font-family:inherit;color:var(--white);transition:border-color var(--transition),background var(--transition)}
.btn-primary{width:100%;padding:14px;min-height:44px;border-radius:50px;border:none;background:linear-gradient(135deg,#ff6600,#ff8c2a);color:#fff;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;box-shadow:0 4px 18px rgba(255,102,0,.36);transition:transform var(--transition),box-shadow var(--transition)}
.btn-primary:disabled{opacity:.4;cursor:not-allowed}
.btn-outline{width:100%;padding:11px;min-height:44px;border-radius:50px;border:1px solid var(--border);background:transparent;color:var(--white);font-size:13px;cursor:pointer;font-family:inherit;transition:border-color var(--transition),background var(--transition)}
.btn-danger{padding:6px 10px;border-radius:6px;border:1px solid rgba(224,82,82,.3);background:transparent;color:var(--danger);font-size:11px;cursor:pointer;font-family:inherit}
.btn-edit{padding:6px 10px;border-radius:6px;border:1px solid rgba(232,103,10,.3);background:transparent;color:var(--orange);font-size:11px;cursor:pointer;font-family:inherit}
.ev-card{background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:14px;margin-bottom:10px;cursor:pointer;transition:border-color .18s;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.ev-card.ev-sim,.ev-card.ev-confirmado{border-color:var(--green);background:rgba(76,175,125,.05)}
.ev-card.ev-nao,.ev-card.ev-desistiu{border-color:var(--danger);background:rgba(224,82,82,.05)}
.ev-card.ev-compareceu{border-color:#2d6e4f;background:rgba(76,175,125,.1)}
.pres-compareceu{background:rgba(76,175,125,.2);border:1px solid rgba(76,175,125,.5);color:var(--green)}
.pres-desistiu{background:rgba(224,82,82,.1);border:1px solid rgba(224,82,82,.3);color:var(--danger)}
.pres-pendente{background:var(--bg3);border:1px solid var(--border);color:var(--muted)}
.pres-confirmado{background:rgba(76,175,125,.1);border:1px solid rgba(76,175,125,.3);color:var(--green)}
.hist-card{background:var(--bg2);border:1px solid var(--border);border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow-card);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.km-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;background:var(--bg3);border-radius:8px;padding:10px 12px;border:1px solid var(--border)}
.edit-box{background:var(--bg3);border-radius:8px;padding:12px;margin-bottom:10px;border:1px solid rgba(232,103,10,.3);display:none}
.det-box{display:none;margin-top:10px;background:var(--bg3);border-radius:8px;padding:12px;border:1px solid var(--border)}
.ev-det{display:none;margin-top:12px}
.user-card{background:var(--bg3);border:1px solid var(--border);border-radius:16px;padding:14px;margin-bottom:10px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.rota-result{background:var(--bg3);border-radius:14px;padding:14px;border:1px solid var(--border);margin-bottom:12px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.rota-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.rota-item small{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;display:block;margin-bottom:2px}
.rota-item span{font-size:14px;font-weight:600}
.alert-warn{font-size:11px;padding:8px 10px;border-radius:6px;color:var(--orange);background:rgba(232,103,10,.1);border:1px solid rgba(232,103,10,.2)}
.alert-ok{font-size:11px;padding:8px 10px;border-radius:6px;color:var(--green);background:rgba(76,175,125,.1);border:1px solid rgba(76,175,125,.2)}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(10px);background:rgba(22,22,22,.96);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);color:#fff;padding:12px 20px 14px;border-radius:16px;font-size:13px;font-weight:600;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;z-index:999;min-width:200px;max-width:320px;box-shadow:0 8px 32px rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.1)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err{border-color:rgba(224,82,82,.4)}
.toast-bar{height:3px;border-radius:2px;margin-top:8px;width:100%;animation:toastBar 2.5s linear forwards}
@keyframes toastBar{from{width:100%}to{width:0%}}
.sub-pills{display:flex;gap:6px;overflow-x:auto;margin-bottom:16px;padding-bottom:4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.sub-pills::-webkit-scrollbar{display:none}
.sub-pill{flex-shrink:0;padding:7px 14px;border-radius:20px;border:1px solid var(--border);background:var(--bg3);font-size:12px;font-weight:500;color:var(--muted);cursor:pointer;font-family:inherit;white-space:nowrap;transition:border-color var(--transition),color var(--transition)}
.sub-pill.active{background:linear-gradient(135deg,#ff6600,#ff8c2a);border-color:transparent;color:#fff;font-weight:600}
.msg-err{font-size:12px;color:var(--danger);margin-bottom:10px;padding:8px 12px;background:rgba(224,82,82,.1);border-radius:8px}
.senha-wrap{position:relative;margin-bottom:14px}
.senha-wrap input{margin-bottom:0;padding-right:44px}
.senha-olho{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:17px;padding:0;line-height:1;color:var(--muted);user-select:none;-webkit-user-select:none}
.msg-ok{font-size:12px;color:var(--green);margin-bottom:10px;padding:8px 12px;background:rgba(76,175,125,.1);border-radius:8px}
.hint-box{font-size:12px;color:var(--muted);margin-bottom:14px;padding:10px 14px;background:var(--bg3);border-radius:12px;border-left:3px solid var(--orange)}
.app-modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:8000;display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:fadeInOv .18s ease}
@keyframes fadeInOv{from{opacity:0}to{opacity:1}}
.app-modal-sheet{background:#111;border:1px solid rgba(255,255,255,.09);border-radius:24px 24px 0 0;width:100%;max-width:480px;max-height:92vh;overflow-y:auto;padding:20px 20px 32px;animation:slideUp .22s ease}
@keyframes slideUp{from{transform:translateY(60px);opacity:0}to{transform:translateY(0);opacity:1}}
.reaction-btn{background:var(--bg3);border:1px solid var(--border);border-radius:20px;padding:4px 10px;font-size:14px;cursor:pointer;font-family:inherit;color:var(--white);transition:border-color .15s,background .15s;display:inline-flex;align-items:center;gap:4px}
.reaction-btn.active{border-color:var(--orange);background:rgba(255,102,0,.12);color:var(--orange)}
.spin{display:inline-block;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes loginFadeIn{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
.login-logo-img{display:block;margin:0 auto 28px;max-width:180px;width:100%;height:auto;object-fit:contain;filter:drop-shadow(0 0 20px rgba(255,102,0,.4));animation:loginFadeIn .8s ease forwards}
.login-wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px;position:relative;overflow:hidden}
.login-wrap::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 30%,rgba(232,103,10,.12) 0%,transparent 70%);pointer-events:none}
.login-wrap::after{content:"";position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:repeating-linear-gradient(45deg,rgba(232,103,10,.02) 0px,rgba(232,103,10,.02) 1px,transparent 1px,transparent 40px);pointer-events:none}
.loading{padding:40px;text-align:center;color:var(--muted);font-size:14px}
.falta-txt{font-size:10px;color:var(--muted);margin-bottom:5px}
.divider{border:none;border-top:1px solid var(--border);margin:16px 0}
.pres-badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;font-size:12px;margin:2px}
.pres-sim{background:rgba(76,175,125,.1);border:1px solid rgba(76,175,125,.3);color:var(--green)}
.pres-nao{background:rgba(224,82,82,.1);border:1px solid rgba(224,82,82,.3);color:var(--danger)}
.lote-card{background:var(--bg2);border:2px solid rgba(255,102,0,.5);border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:0 0 0 1px rgba(255,102,0,.08);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}

/* ── MICROINTERAÇÕES ────────────────────────────────── */
.btn-primary:hover:not(:disabled){transform:scale(1.02);box-shadow:0 6px 26px rgba(255,102,0,.5)}
.btn-primary:active:not(:disabled){transform:scale(.98);box-shadow:0 2px 10px rgba(255,102,0,.3)}
.btn:hover{border-color:rgba(255,255,255,.18);background:rgba(255,255,255,.07)}
.btn:active{background:rgba(255,255,255,.04)}
.btn-outline:hover{border-color:rgba(255,255,255,.22);background:rgba(255,255,255,.04)}
.sub-pill:hover:not(.active){border-color:rgba(232,103,10,.35);color:var(--white)}
.card:hover{border-color:rgba(255,255,255,.14)}
.ev-card:hover{border-color:rgba(255,255,255,.14)}

/* ── SCROLLBAR ───────────────────────────────────────── */
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}

<script>
(function(){
  if(!/Mobi/i.test(navigator.userAgent))return;
  if(localStorage.getItem("pwa_install_dismissed"))return;
  let _deferredPrompt=null;
  const _showBanner=()=>{
    const banner=document.getElementById("pwa-install-banner");
    if(!banner)return;
    const logo=localStorage.getItem("mutantes_logo");
    const img=document.getElementById("pwa-banner-logo");
    if(img&&logo)img.src=logo;
    banner.style.display="block";
  };
  window.addEventListener("beforeinstallprompt",e=>{
    e.preventDefault();
    _deferredPrompt=e;
    _showBanner();
  });
  window.addEventListener("appinstalled",()=>{
    const banner=document.getElementById("pwa-install-banner");
    if(banner)banner.style.display="none";
    localStorage.setItem("pwa_install_dismissed","1");
    _deferredPrompt=null;
  });
  window._pwaBannerInstall=async function(){
    if(!_deferredPrompt)return;
    _deferredPrompt.prompt();
    await _deferredPrompt.userChoice;
    _deferredPrompt=null;
    localStorage.setItem("pwa_install_dismissed","1");
    const banner=document.getElementById("pwa-install-banner");
    if(banner)banner.style.display="none";
  };
  window._pwaBannerClose=function(){
    const banner=document.getElementById("pwa-install-banner");
    if(banner)banner.style.display="none";
    localStorage.setItem("pwa_install_dismissed","1");
  };
})();
</script>

function precoPorEstado(estado){
  const pSC=PRECOS_GAS["SC"]||6.20;
  const pDest=PRECOS_GAS[estado]||pSC;
  return(pSC+pDest)/2;
}

function calcRota(distIda,auto,tanque,estado,pedIda,gasManual){
  const gas=gasManual||precoPorEstado(estado||"SC");
  const dt=distIda*2,lit=dt/auto,comb=lit*gas;
  const ped=pedIda!=null?pedIda*2:0;
  const alcance=tanque*auto,precisa=distIda>alcance;
  const paradas=precisa?Math.ceil((dt-alcance)/alcance):0;
  return{dt,lit,comb,ped,total:comb+ped,precisa,paradas,gas,pedReal:pedIda!=null};
}

function evCardMembro(ev){
  const confRaw=CONF[ev.id]||"pendente";

  const conf=confRaw==="sim"?"confirmado":confRaw==="nao"?"desistiu":confRaw;
  const auto=parseFloat(UP.autonomia)||0,tanque=parseFloat(UP.tanque)||0;
  const calc=auto&&tanque&&ev.dist?calcRota(ev.dist,auto,tanque,ev.estado,PEDAGIOS_CUSTOM[ev.id]??ev.ped):null;
  const cls="ev-card"+(conf==="confirmado"?" ev-confirmado":conf==="desistiu"?" ev-desistiu":conf==="compareceu"?" ev-compareceu":"");
  const icon=conf==="confirmado"?"✅":conf==="desistiu"?"❌":conf==="compareceu"?"🏁":"📅";

  const enc=ENCONTROS[ev.id];
  // Dias faltando
  const hoje=new Date();hoje.setHours(0,0,0,0);
  const evData=new Date(ev.data+"T00:00:00");
  const diasFalt=Math.round((evData-hoje)/(1000*60*60*24));
  const diasLabel=diasFalt===0?"🔴 Hoje!":diasFalt===1?"🟠 Amanhã":diasFalt>0?`🕐 ${diasFalt} dias`:"";
  return`<div class="${cls}" onclick="window.toggleEvDet('evd${ev.id}')">
    <div style="display:flex;align-items:flex-start;gap:10px">
      <div style="flex:1">
        <div style="font-size:13px;font-weight:600">${icon} ${ev.nome}</div>
        <div style="font-size:11px;color:#888">${fmtDate(ev.data)} · ${ev.destino}</div>
        ${ev.dist>0?`<div style="font-size:11px;color:var(--orange)">📍 ${toInt(ev.dist*2)} km ida+volta</div>`:""}
        ${enc?`<div style="font-size:11px;color:var(--green);margin-top:3px">🕐 ${enc.hora} · 📌 ${enc.local}${enc.resp?` · 👤 ${enc.resp}`:""}</div>`:""}
      </div>
      <div style="display:flex;flex-direction:column;gap:4px;align-items:flex-end">
        ${badge}${ev.sm?`<span class="badge badge-sm">sem mulheres</span>`:""}
        ${diasFalt<0?`<span style="font-size:11px;color:#888;font-weight:700;background:var(--bg3);padding:3px 8px;border-radius:20px;border:1px solid var(--border)">✓ Realizado</span>`:diasLabel?`<span style="font-size:11px;color:${diasFalt===0?"var(--danger)":diasFalt<=7?"var(--orange)":"var(--muted)"};font-weight:700;background:${diasFalt===0?"rgba(224,82,82,.15)":diasFalt<=7?"rgba(232,103,10,.15)":"var(--bg3)"};padding:3px 8px;border-radius:20px;border:1px solid ${diasFalt===0?"rgba(224,82,82,.3)":diasFalt<=7?"rgba(232,103,10,.3)":"var(--border)"}">${diasLabel}</span>`:""}
      </div>
    </div>
    <div class="ev-det" id="evd${ev.id}">
      ${enc?`<div style="background:rgba(76,175,125,.08);border:1px solid rgba(76,175,125,.2);border-radius:8px;padding:10px 12px;margin-bottom:10px">
        <div style="font-size:11px;font-weight:600;color:var(--green);margin-bottom:6px">📍 PONTO DE ENCONTRO</div>

// ── CROPPER DE FOTO (Cropper.js) ─────────────────────────────────────
function abrirCropper(file, onCrop){
  const reader=new FileReader();
  reader.onload=e=>{
    const modal=document.createElement("div");
    modal.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;gap:14px";
    modal.innerHTML=`
      <div style="font-size:14px;font-weight:700;color:#fff">✂️ Ajuste a foto</div>
      <div style="width:min(85vw,320px);height:min(85vw,320px);background:#111">
        <img id="cropperjs-img" src="${e.target.result}" style="max-width:100%;display:block"/>
      </div>
      <div style="font-size:11px;color:#666">Pinça para zoom · Arraste para reposicionar</div>
      <div style="display:flex;gap:10px">
        <button id="crop-cancel" style="padding:12px 24px;border-radius:12px;border:1px solid #444;background:transparent;color:#aaa;font-size:14px;cursor:pointer;font-family:inherit">Cancelar</button>
        <button id="crop-ok" style="padding:12px 28px;border-radius:12px;border:none;background:var(--orange);color:#fff;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit">✓ Usar foto</button>
      </div>`;
    document.body.appendChild(modal);
    const img=document.getElementById("cropperjs-img");
    const cropper=new Cropper(img,{
      aspectRatio:1,viewMode:1,dragMode:"move",
      autoCropArea:1,restore:false,guides:false,
      center:false,highlight:false,cropBoxMovable:false,
      cropBoxResizable:false,toggleDragModeOnDblclick:false,
      background:false,
    });
    document.getElementById("crop-cancel").onclick=()=>{cropper.destroy();modal.remove();};
    document.getElementById("crop-ok").onclick=()=>{
      const canvas=cropper.getCroppedCanvas({width:400,height:400,imageSmoothingQuality:"high"});
      canvas.toBlob(blob=>{
        cropper.destroy();modal.remove();
        onCrop(new File([blob],"foto.jpg",{type:"image/jpeg"}));
      },"image/jpeg",0.92);
    };
  };
  reader.readAsDataURL(file);
}

async function uploadFoto(file){
  const fd=new FormData();
  fd.append("file",file);fd.append("upload_preset",PRESET);fd.append("folder","mutantes-mc");
  const r=await fetch("https://api.cloudinary.com/v1_1/"+CLOUD+"/image/upload",{method:"POST",body:fd});
  const d=await r.json();
  if(!d.secure_url)throw new Error("Falha no upload");
  return d.secure_url;
}

async function uploadFotoComCrop(file, onDone){
  abrirCropper(file, async croppedFile=>{
    showToast("Enviando foto...");
    try{
      console.log("uploadFotoComCrop: iniciando upload para Cloudinary...");
      const url=await uploadFoto(croppedFile);
      console.log("uploadFotoComCrop: upload OK, url=",url);
      await onDone(url);
    }catch(e){console.error("uploadFotoComCrop: ERRO",e);showToast("Erro ao enviar foto: "+e.message,true);}
  });
}

function atualizarIconePWA(url){
  if(!url)return;
  document.getElementById("apple-touch-icon").href=url;
  const origin=window.location.origin+window.location.pathname.replace(/\/[^/]*$/,"/");
  const manifest={name:"Mutantes MC Itajaí",short_name:"Mutantes MC",start_url:origin,display:"standalone",background_color:"#0f0f0f",theme_color:"#ff6600",icons:[{src:url,sizes:"192x192",type:"image/png",purpose:"any maskable"},{src:url,sizes:"512x512",type:"image/png"}]};
  const blob=new Blob([JSON.stringify(manifest)],{type:"application/json"});
  const old=document.getElementById("pwa-manifest");
  if(old._blobUrl)URL.revokeObjectURL(old._blobUrl);
  const blobUrl=URL.createObjectURL(blob);
  old._blobUrl=blobUrl;
  old.href=blobUrl;
}

function proxQuarta(){
  const hoje=new Date();
  const dia=hoje.getDay();
  const diff=dia<=3?3-dia:7-(dia-3);
  const q=new Date(hoje);
  q.setDate(hoje.getDate()+(diff===0&&dia===3?0:diff===0?7:diff));
  if(dia===3)q.setDate(hoje.getDate());
  return q.toISOString().slice(0,10);
}

}

function proxSexta(){
  const hoje=new Date();
  const dia=hoje.getDay();// 0=dom,5=sex
  const diff=dia<=5?5-dia:6+5-dia+1;
  const sx=new Date(hoje);
  sx.setDate(hoje.getDate()+(diff===0&&dia===5?0:diff===0?7:diff));
  // Se hoje é sexta, usa hoje
  if(dia===5)sx.setDate(hoje.getDate());
  return sx.toISOString().slice(0,10);
}

function meuSedeCount(){
  return Object.entries(CONF_SEDE).filter(([k,v])=>k.startsWith("presenca_")&&v==="sim").length;
}
async function carregarSedePresencas(){
  try{
    // Carrega TODOS os "sim" — documentos antigos não têm campo "tipo" (defaultam para presenca)
    const snap=await getDocs(query(collection(db,"sede_confirmacoes"),where("resposta","==","sim")));
    SEDE_COUNTS={};
    snap.docs.forEach(d=>{
      const r=d.data();
      const tp=r.tipo||"presenca";
      if(tp==="presenca"||tp==="sede"){
        const id=r.membroId;
        if(id)SEDE_COUNTS[id]=(SEDE_COUNTS[id]||0)+1;
      }
    });
  }catch(e){console.error("carregarSedePresencas:",e);}
}
async function carregarEscalaLista(){
  try{
    const canEdit=UP&&(UP.isAdmin||UP.isBarman||UP.isDiretor);
    const abaBar=window._barAba||"bar";
    const col=abaBar==="churrasco"?"escala_churrasco":"escala_bar";
    const snap=await getDocs(query(collection(db,col),orderBy("data","asc")));
    const el=document.getElementById("escala-lista");
    if(!el)return;
    const hoje=new Date().toISOString().slice(0,10);
    const docs=snap.docs.map(d=>({id:d.id,...d.data()})).filter(e=>e.data>=hoje);
    el.innerHTML=docs.length===0?`<span style="font-size:12px;color:#555">Nenhuma escala cadastrada.</span>`:
      docs.map(e=>{
        const nomes=abaBar==="churrasco"
          ?[e.m1,e.m2,e.m3,e.m4,e.m5].filter(Boolean).join(" · ")
          :`${e.m1} & ${e.m2}`;
        return`<div style="display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--border)">
          <div style="flex:1">
            <div style="font-size:13px;font-weight:600">${fmtDate(e.data)}</div>
            <div style="font-size:12px;color:${abaBar==="churrasco"?"var(--green)":"var(--orange)"}">
              ${abaBar==="churrasco"?"🔥":"🍺"} ${nomes}
            </div>
            ${e.obs?`<div style="font-size:11px;color:var(--muted)">📝 ${e.obs}</div>`:""}
          </div>
          ${canEdit?`<button onclick="window.excluirEscala('${e.id}','${col}')" class="btn-danger">✕</button>`:""}
        </div>`;
      }).join("");
  }catch(e){console.error(e);}
}

async function carregarVotacoes(){
  const el=document.getElementById("vot-admin-lista");
  if(!el)return;
  try{
    const snap=await getDocs(query(collection(db,"votacoes"),orderBy("criadoEm","desc")));
    if(snap.empty){el.innerHTML=`<div style="font-size:12px;color:#555">Nenhuma enquete ainda.</div>`;return;}
    el.innerHTML=snap.docs.map(d=>{
      const v=d.data();
      const total=Object.values(v.votos||{}).length;
      const contagem={};
      Object.values(v.votos||{}).forEach(op=>{contagem[op]=(contagem[op]||0)+1;});
      return`<div style="padding:12px 0;border-bottom:1px solid var(--border)">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
          <div style="font-size:13px;font-weight:600">${v.pergunta}</div>

        </div>
        ${v.opcoes.map(op=>{const n=contagem[op]||0;const pct=total?Math.round((n/total)*100):0;
          return`<div style="margin-bottom:6px"><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:2px"><span>${op}</span><span style="color:var(--muted)">${n} voto${n!==1?"s":""} (${pct}%)</span></div>
          <div style="height:6px;background:var(--bg3);border-radius:3px;overflow:hidden"><div style="height:100%;background:var(--orange);border-radius:3px;width:${pct}%"></div></div></div>`;
        }).join("")}

}

function dispararConfete(){
  const cores=["#e8670a","#ff8c2a","#ffd700","#4caf7d","#fff","#e05252"];
  const wrap=document.createElement("div");
  wrap.className="confete";
  document.body.appendChild(wrap);
  for(let i=0;i<80;i++){
    const p=document.createElement("div");
    p.className="confete-p";
    p.style.cssText=`left:${Math.random()*100}%;background:${cores[Math.floor(Math.random()*cores.length)]};width:${6+Math.random()*8}px;height:${6+Math.random()*8}px;animation-duration:${2+Math.random()*3}s;animation-delay:${Math.random()*2}s;border-radius:${Math.random()>0.5?"50%":"2px"}`;
    wrap.appendChild(p);
  }
  showToast("🏆 Meta de 5.000 km atingida! Parabéns!");
  setTimeout(()=>wrap.remove(),6000);
}

  </div>`;

async function carregarMural(){
  const el=document.getElementById("mural-lista");
  if(!el)return;
  try{
    const snap=await getDocs(query(collection(db,"mural"),orderBy("criadoEm","desc")));
    const docs=snap.docs.slice(0,30).map(d=>({id:d.id,...d.data()}));
    if(docs.length===0){el.innerHTML=`<div style="font-size:12px;color:#555">Nenhum recado ainda. Seja o primeiro!</div>`;return;}
    el.innerHTML=docs.map(r=>{
      const reacoes=r.reacoes||[];
      const meuId=CU?.uid||"";
      const emojiList=["🤘","❤️","😂","🏍️"];
      const reacBar=emojiList.map(emoji=>{
        const lista=reacoes.filter(rx=>rx.emoji===emoji);
        const jaTenho=lista.some(rx=>rx.membroId===meuId);
        return`<button class="reaction-btn${jaTenho?" active":""}" onclick="window.reagirMural('${r.id}','${emoji}')">${emoji}${lista.length>0?` <span style="font-size:11px">${lista.length}</span>`:""}</button>`;
      }).join("");
      return`<div style="padding:10px 0;border-bottom:1px solid var(--border);display:flex;gap:10px">
        <div onclick="window.abrirPerfilPublico('${r.autorId}')" style="cursor:pointer;flex-shrink:0">${avatarEl(r.fotoUrl||"",r.autor,36)}</div>
        <div style="flex:1">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:3px">
            <div onclick="window.abrirPerfilPublico('${r.autorId}')" style="font-size:12px;font-weight:700;color:var(--orange);cursor:pointer">${r.autor}</div>
            <div style="font-size:10px;color:#555">${r.criadoEm?.toDate?fmtDate(r.criadoEm.toDate().toISOString().slice(0,10)):""}</div>
          </div>
          <div style="font-size:13px;line-height:1.4;word-break:break-word;overflow-wrap:anywhere">${r.msg}</div>
          <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:8px">${reacBar}</div>
          ${UP&&(UP.isAdmin||r.autorId===CU.uid)?`<button onclick="window.excluirMural('${r.id}')" style="font-size:10px;color:var(--danger);background:transparent;border:none;cursor:pointer;margin-top:4px">✕ apagar</button>`:""}
        </div>
      </div>`;
    }).join("");
  }catch(e){el.innerHTML=`<div style="font-size:12px;color:var(--danger)">Erro.</div>`;}
}

window.postarMural=async()=>{
  const input=document.getElementById("mural-msg");
  const msg=input?.value.trim();
  if(!msg)return;
  try{
    await addDoc(collection(db,"mural"),{msg,autor:UP.apelido,autorId:CU.uid,fotoUrl:UP.fotoUrl||"",criadoEm:serverTimestamp()});
    input.value="";carregarMural();
  }catch{showToast("Erro ao postar.",true);}
};

window.excluirMural=async(id)=>{
  try{await deleteDoc(doc(db,"mural",id));carregarMural();}catch{showToast("Erro.",true);}
};

window.reagirMural=async(docId,emoji)=>{
  if(!CU)return;
  try{
    const ref=doc(db,"mural",docId);
    const snap=await getDoc(ref);
    const reacoes=(snap.data()?.reacoes)||[];
    const jaIdx=reacoes.findIndex(rx=>rx.membroId===CU.uid&&rx.emoji===emoji);
    if(jaIdx>=0){
      await updateDoc(ref,{reacoes:arrayRemove(reacoes[jaIdx])});
    }else{
      await updateDoc(ref,{reacoes:arrayUnion({membroId:CU.uid,emoji})});
    }
    carregarMural();
  }catch{showToast("Erro.",true);}
};

          </div>
          <span style="font-size:12px;font-weight:700;color:${pct>=100?"var(--green)":"var(--orange)"}">${toInt(m.totalKm||0)} km</span>
        </div>
        <div style="height:5px;background:var(--bg3);border-radius:3px;overflow:hidden">
          <div style="height:100%;width:${pct}%;background:${pct>=100?"var(--green)":"var(--orange)"};border-radius:3px;transition:width .8s"></div>
        </div>

    }).join("")}

    <div class="sec-title">${li("settings",16)} Utilitários admin</div>
    <button class="btn-outline" style="margin-bottom:10px;min-height:44px" onclick="window.recalcularTotalKm()">${li("refresh-cw",15)} Recalcular totalKm de todos os membros</button>
    <div style="font-size:11px;color:var(--muted);line-height:1.5">Soma todos os registros de km do Firestore e corrige o contador de cada membro. Use após migrações ou se os totais estiverem incorretos.</div>
  </div>`:""}`;
}

let _evView="lista";
let _calMes=new Date().getMonth();
let _calAno=new Date().getFullYear();

window.setEvView=(view)=>{
  _evView=view;
  const lista=document.getElementById("ev-lista-wrap");
  const cal=document.getElementById("ev-cal-wrap");
  const btnL=document.getElementById("ev-view-lista");
  const btnC=document.getElementById("ev-view-cal");
  if(!lista||!cal)return;
  lista.style.display=view==="lista"?"block":"none";
  cal.style.display=view==="cal"?"block":"none";
  if(btnL){btnL.style.background=view==="lista"?"var(--orange)":"var(--bg3)";btnL.style.color=view==="lista"?"#fff":"var(--muted)";btnL.style.border=view==="lista"?"none":"1px solid var(--border)";}
  if(btnC){btnC.style.background=view==="cal"?"var(--orange)":"var(--bg3)";btnC.style.color=view==="cal"?"#fff":"var(--muted)";btnC.style.border=view==="cal"?"none":"1px solid var(--border)";}
  if(view==="cal")renderCalendario();
};

function renderCalendario(){
  const cal=document.getElementById("ev-cal-wrap");
  if(!cal)return;
  const hoje=new Date();
  const ano=_calAno, mes=_calMes;
  const primeiroDia=new Date(ano,mes,1).getDay(); // 0=dom
  const diasNoMes=new Date(ano,mes+1,0).getDate();
  const meses=["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
  const dias=["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];

  // Mapear eventos do mês
  const eventosPorDia={};
  EVENTOS.forEach(ev=>{
    const d=new Date(ev.data+"T00:00:00");
    if(d.getMonth()===mes&&d.getFullYear()===ano){
      const dia=d.getDate();
      if(!eventosPorDia[dia])eventosPorDia[dia]=[];
      eventosPorDia[dia].push(ev);
    }
  });

  // Células do calendário
  let cells="";
  // Dias da semana header
  cells+=dias.map(d=>`<div style="text-align:center;font-size:10px;font-weight:700;color:var(--muted);padding:4px 0;text-transform:uppercase">${d}</div>`).join("");

  // Células vazias antes do primeiro dia
  for(let i=0;i<primeiroDia;i++) cells+=`<div></div>`;

  // Dias do mês
  for(let dia=1;dia<=diasNoMes;dia++){
    const ehHoje=hoje.getDate()===dia&&hoje.getMonth()===mes&&hoje.getFullYear()===ano;
    const evs=eventosPorDia[dia]||[];
    const temEv=evs.length>0;
    cells+=`<div onclick="${temEv?`window.verEvDia(${dia},${mes},${ano})`:"return false"}"
      style="min-height:44px;border-radius:8px;padding:4px;cursor:${temEv?"pointer":"default"};
      background:${ehHoje?"rgba(232,103,10,.2)":temEv?"rgba(232,103,10,.08)":"transparent"};
      border:1px solid ${ehHoje?"var(--orange)":temEv?"rgba(232,103,10,.3)":"transparent"};
      position:relative;transition:background .15s">
      <div style="font-size:12px;font-weight:${ehHoje?"700":"400"};color:${ehHoje?"var(--orange)":"var(--white)"};text-align:center">${dia}</div>
      ${temEv?`<div style="display:flex;flex-wrap:wrap;gap:2px;justify-content:center;margin-top:2px">${evs.map(()=>`<div style="width:6px;height:6px;border-radius:50%;background:var(--orange)"></div>`).join("")}</div>`:""}
    </div>`;
  }

  // Detalhe do evento selecionado
  cal.innerHTML=`
    <div class="card">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
        <button onclick="window.navCal(-1)" style="padding:6px 12px;border-radius:8px;border:1px solid var(--border);background:var(--bg3);color:var(--white);font-size:16px;cursor:pointer;font-family:inherit">‹</button>
        <div style="font-size:15px;font-weight:700">${meses[mes]} ${ano}</div>
        <button onclick="window.navCal(1)" style="padding:6px 12px;border-radius:8px;border:1px solid var(--border);background:var(--bg3);color:var(--white);font-size:16px;cursor:pointer;font-family:inherit">›</button>
      </div>
      <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:3px">
        ${cells}
      </div>
      ${Object.keys(eventosPorDia).length===0?`<div style="font-size:12px;color:#555;text-align:center;margin-top:14px">Nenhum evento neste mês</div>`:""}
    </div>
    <div id="ev-cal-detalhe"></div>`;
}

window.navCal=(dir)=>{
  _calMes+=dir;
  if(_calMes>11){_calMes=0;_calAno++;}
  if(_calMes<0){_calMes=11;_calAno--;}
  renderCalendario();
};

window.verEvDia=(dia,mes,ano)=>{
  const evs=EVENTOS.filter(ev=>{
    const d=new Date(ev.data+"T00:00:00");
    return d.getDate()===dia&&d.getMonth()===mes&&d.getFullYear()===ano;
  });
  const det=document.getElementById("ev-cal-detalhe");
  if(!det)return;
  det.innerHTML=evs.map(ev=>evCardMembro(ev)).join("");
  det.scrollIntoView({behavior:"smooth",block:"nearest"});
};

function htmlGaleria(){

      <div class="sec-title" style="margin-bottom:0">📸 Galeria de fotos</div>

    </div>

const GALERIA_POR_PAG=30;
let _galeriaCursor=null,_galeriaFiltro=null;

function _fotoHtml(f){
  return`<div style="position:relative;aspect-ratio:1;overflow:hidden;border-radius:8px;cursor:pointer" onclick="window.abrirFotoModal('${f.id}','${f.url}')">
    <img src="${f.url}" style="width:100%;height:100%;object-fit:cover" loading="lazy"/>
    ${UP&&(UP.isAdmin||f.autorId===CU.uid)?`<button onclick="event.stopPropagation();window.excluirFotoGaleria('${f.id}')" style="position:absolute;top:4px;right:4px;background:rgba(0,0,0,.7);color:#fff;border:none;border-radius:50%;width:22px;height:22px;font-size:11px;cursor:pointer">✕</button>`:""}
  </div>`;
}

function _galeriaBtnMais(){
  const wrap=document.createElement("div");
  wrap.style.cssText="grid-column:1/-1;text-align:center;padding:10px 0";
  wrap.innerHTML=`<button id="galeria-mais-btn" onclick="window.carregarMaisGaleria()" style="padding:8px 22px;border-radius:8px;border:1px solid var(--border);background:var(--bg3);color:var(--white);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit">Carregar mais</button>`;
  return wrap;
}

function _galeriaQuery(cursor){
  const parts=[collection(db,"galeria")];
  if(_galeriaFiltro&&_galeriaFiltro!=="geral")parts.push(where("eventoId","==",_galeriaFiltro));
  parts.push(orderBy("criadoEm","desc"));
  if(cursor)parts.push(startAfter(cursor));
  parts.push(limit(GALERIA_POR_PAG));
  return query(...parts);
}

async function carregarGaleria(eventoId){
  _galeriaFiltro=eventoId||null;
  _galeriaCursor=null;
  const el=document.getElementById("galeria-grid");
  if(!el)return;
  el.innerHTML=`<span class="spin">⟳</span>`;
  try{
    const snap=await getDocs(_galeriaQuery(null));
    let fotos=snap.docs.map(d=>({id:d.id,...d.data()}));
    if(_galeriaFiltro==="geral")fotos=fotos.filter(f=>!f.eventoId||f.eventoId==="geral");
    _galeriaCursor=snap.docs.length===GALERIA_POR_PAG?snap.docs[snap.docs.length-1]:null;
    if(fotos.length===0){el.innerHTML=`<div style="grid-column:1/-1;font-size:12px;color:#555;padding:10px 0">Nenhuma foto ainda. Seja o primeiro a postar!</div>`;return;}
    el.innerHTML=fotos.map(_fotoHtml).join("");
    if(_galeriaCursor)el.appendChild(_galeriaBtnMais());
  }catch(e){el.innerHTML=`<div style="font-size:12px;color:var(--danger)">Erro ao carregar.</div>`;}
}

window.carregarMaisGaleria=async()=>{
  if(!_galeriaCursor)return;
  const el=document.getElementById("galeria-grid");
  const btn=document.getElementById("galeria-mais-btn");
  if(!el||!btn)return;
  btn.textContent="Carregando...";btn.disabled=true;
  try{
    const snap=await getDocs(_galeriaQuery(_galeriaCursor));
    let fotos=snap.docs.map(d=>({id:d.id,...d.data()}));
    if(_galeriaFiltro==="geral")fotos=fotos.filter(f=>!f.eventoId||f.eventoId==="geral");
    _galeriaCursor=snap.docs.length===GALERIA_POR_PAG?snap.docs[snap.docs.length-1]:null;
    btn.parentElement.remove();
    fotos.forEach(f=>{
      const div=document.createElement("div");
      div.style.cssText="position:relative;aspect-ratio:1;overflow:hidden;border-radius:8px;cursor:pointer";
      div.onclick=()=>window.abrirFotoModal(f.id,f.url);
      div.innerHTML=`<img src="${f.url}" style="width:100%;height:100%;object-fit:cover" loading="lazy"/>${UP&&(UP.isAdmin||f.autorId===CU.uid)?`<button onclick="event.stopPropagation();window.excluirFotoGaleria('${f.id}')" style="position:absolute;top:4px;right:4px;background:rgba(0,0,0,.7);color:#fff;border:none;border-radius:50%;width:22px;height:22px;font-size:11px;cursor:pointer">✕</button>`:""}`;
      el.appendChild(div);
    });
    if(_galeriaCursor)el.appendChild(_galeriaBtnMais());
  }catch{btn.textContent="Carregar mais";btn.disabled=false;}
};

window.filtrarGaleria=()=>{
  const val=document.getElementById("galeria-filtro-evento")?.value;
  carregarGaleria(val||null);
};

window.uploadFotosGaleria=async(input)=>{
  const files=Array.from(input.files);
  if(!files.length)return;
  const eventoId=document.getElementById("galeria-filtro-evento")?.value||"geral";
  showToast(`Enviando ${files.length} foto(s)...`);
  try{
    for(const file of files){
      const url=await uploadFoto(file);
      const ref=await addDoc(collection(db,"galeria"),{url,eventoId:eventoId||"geral",autorId:CU.uid,autorApelido:UP.apelido,criadoEm:serverTimestamp()});
      // Adiciona foto imediatamente no grid sem esperar re-fetch do Firestore
      const grid=document.getElementById("galeria-grid");
      if(grid){
        const vazio=grid.querySelector("div[style*='Nenhuma foto']");
        if(vazio)grid.innerHTML="";
        const div=document.createElement("div");
        div.style.cssText="position:relative;aspect-ratio:1;overflow:hidden;border-radius:8px;cursor:pointer";
        div.onclick=()=>window.abrirFotoModal(ref.id,url);
        div.innerHTML=`<img src="${url}" style="width:100%;height:100%;object-fit:cover" loading="lazy"/><button onclick="event.stopPropagation();window.excluirFotoGaleria('${ref.id}')" style="position:absolute;top:4px;right:4px;background:rgba(0,0,0,.7);color:#fff;border:none;border-radius:50%;width:22px;height:22px;font-size:11px;cursor:pointer">✕</button>`;
        grid.insertBefore(div,grid.firstChild);
      }
    }
    showToast("✓ Fotos enviadas!");input.value="";
  }catch{showToast("Erro ao enviar.",true);}
};

window.excluirFotoGaleria=async(id)=>{
  if(!confirm("Excluir esta foto?"))return;
  try{await deleteDoc(doc(db,"galeria",id));showToast("Excluída.");carregarGaleria();}catch{showToast("Erro.",true);}
};

window.abrirFotoModal=async(fotoId,url)=>{

window.enviarComentFoto=async(fotoId)=>{

function calcConquistas(membro,regs){
  const km=membro.totalKm||0;
  const saidas=regs?regs.filter(r=>r.membroId===membro.authUid||r.membroId===membro.uid).length:0;
  const isSelf=membro.authUid===CU?.uid||membro.uid===MY_DOC_ID;
  const sc=_sedeCount(membro)||(isSelf?meuSedeCount():0);
  const badges=[];
  if(saidas>=1)badges.push({ic:"🏁",nome:"Primeira Saída",desc:"Participou da primeira saída"});
  if(km>=500)badges.push({ic:"🛣️",nome:"500 km",desc:"500 km rodados"});
  if(km>=1000)badges.push({ic:"🔥",nome:"1.000 km",desc:"1.000 km rodados"});
  if(km>=2500)badges.push({ic:"⚡",nome:"2.500 km",desc:"2.500 km rodados"});
  if(km>=META)badges.push({ic:"🏆",nome:"Meta Atingida",desc:`${toInt(META)} km — meta anual`});
  if(saidas>=5)badges.push({ic:"🤝",nome:"Membro Ativo",desc:"5 saídas no ano"});
  if(saidas>=10)badges.push({ic:"🦅",nome:"Veterano",desc:"10 saídas no ano"});
  if(sc>=1)badges.push({ic:"⛪",nome:"Presente na Sede",desc:"Confirmou presença em uma sexta-feira"});
  if(sc>=5)badges.push({ic:"🏠",nome:"Habitué da Sede",desc:"5 presenças confirmadas na sede"});
  if(sc>=10)badges.push({ic:"🔑",nome:"Dono da Sede",desc:"10 presenças confirmadas na sede"});
  if(membro.isDiretor||membro.isAdmin)badges.push({ic:"👑",nome:"Liderança",desc:"Membro da diretoria"});
  return badges;
}

function htmlConquistas(membro,regs){
  const badges=calcConquistas(membro,regs);
  if(badges.length===0)return`<div style="font-size:12px;color:#555">Nenhuma conquista ainda — comece a rodar!</div>`;
  return badges.map(b=>`<div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)">
    <span style="font-size:26px">${b.ic}</span>
    <div><div style="font-size:13px;font-weight:700">${b.nome}</div><div style="font-size:11px;color:var(--muted)">${b.desc}</div></div>
  </div>`).join("");
}

function nascForDisplay(v){
  if(!v)return"";
  if(/^\d{4}-\d{2}-\d{2}$/.test(v)){const[y,m,d]=v.split("-");return`${d}/${m}/${y}`;}
  return v;
}
function nascForStorage(v){
  const m=v.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
  return m?`${m[3]}-${m[2]}-${m[1]}`:"";
}
window.maskNasc=el=>{
  let v=el.value.replace(/\D/g,"").slice(0,8);
  if(v.length>4)v=v.slice(0,2)+"/"+v.slice(2,4)+"/"+v.slice(4);
  else if(v.length>2)v=v.slice(0,2)+"/"+v.slice(2);
  el.value=v;
};

function htmlAniversarios(){
  const hoje=new Date();
  const mesAtual=hoje.getMonth()+1;
  const diaAtual=hoje.getDate();
  const comAniversario=MEMBROS.filter(m=>m.nascimento).map(m=>{
    const [ano,mes,dia]=m.nascimento.split("-").map(Number);
    const idade=hoje.getFullYear()-ano-(mes>mesAtual||(mes===mesAtual&&dia>diaAtual)?1:0);
    return{...m,mes,dia,idade};
  }).sort((a,b)=>a.mes!==b.mes?a.mes-b.mes:a.dia-b.dia);
  const doMes=comAniversario.filter(m=>m.mes===mesAtual);
  const outros=comAniversario.filter(m=>m.mes!==mesAtual);
  const meses=["","Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
  const isHoje=(m)=>m.mes===mesAtual&&m.dia===diaAtual;
  const renderCard=(m)=>`<div style="display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)">
    ${avatarEl(m.fotoUrl,m.apelido,36)}
    <div style="flex:1">
      <div style="font-size:13px;font-weight:600">${m.apelido}${isHoje(m)?` <span style="color:var(--orange)">🎂 Hoje!</span>`:""}</div>
      <div style="font-size:11px;color:var(--muted)">${m.dia.toString().padStart(2,"0")}/${m.mes.toString().padStart(2,"0")} · ${m.idade} anos</div>
    </div>
  </div>`;
  return`<div class="card" style="${doMes.length>0?"border-color:rgba(232,103,10,.3)":""}">
    <div class="sec-title">🎂 ${meses[mesAtual]} — ${doMes.length} aniversariante${doMes.length!==1?"s":""}</div>
    ${doMes.length===0?`<div style="font-size:12px;color:#555">Nenhum aniversariante este mês.</div>`:doMes.map(renderCard).join("")}
  </div>
  ${outros.length>0?`<div class="card">
    <div class="sec-title">📅 Próximos meses</div>
    ${outros.map(renderCard).join("")}
  </div>`:""}
  ${MEMBROS.filter(m=>!m.nascimento).length>0?`<div class="hint-box">⚠️ ${MEMBROS.filter(m=>!m.nascimento).length} membros ainda não preencheram a data de nascimento no Perfil.</div>`:""}`;
}

async function carregarMensalidades(){
  const wrap=document.getElementById("mensalidades-wrap");
  if(!wrap)return;
  const hoje=new Date();
  const mesAtual=`${hoje.getFullYear()}-${String(hoje.getMonth()+1).padStart(2,"0")}`;
  const meses=[];
  for(let i=0;i<6;i++){
    const d=new Date(hoje.getFullYear(),hoje.getMonth()-i,1);
    meses.push(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`);
  }
  try{
    const snap=await getDocs(collection(db,"mensalidades"));
    const pagtos={};
    snap.docs.forEach(d=>{const r=d.data();const k=r.membroId+"_"+r.mes;pagtos[k]={id:d.id,...r};});
    const mesLabel=(m)=>{const [y,mo]=m.split("-");const nomes=["","Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];return`${nomes[parseInt(mo)]}/${y.slice(2)}`;};
    wrap.innerHTML=`<div class="card">
      <button onclick="window.exportarMensalidadesCSV()" style="width:100%;padding:10px;border-radius:10px;border:1px solid var(--border);background:var(--bg3);color:var(--white);font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;margin-bottom:12px">📥 Exportar mensalidades (.CSV)</button>
      <div style="display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:6px;margin-bottom:14px">
        ${meses.map(m=>`<button onclick="window._mesAtual='${m}';carregarMensalidades()" style="flex-shrink:0;padding:6px 14px;border-radius:20px;border:${(window._mesAtual||mesAtual)===m?"none":"1px solid var(--border)"};background:${(window._mesAtual||mesAtual)===m?"var(--orange)":"var(--bg3)"};color:${(window._mesAtual||mesAtual)===m?"#fff":"var(--muted)"};font-size:12px;font-weight:600;cursor:pointer;font-family:inherit">${mesLabel(m)}</button>`).join("")}
      </div>
      ${(()=>{
        const mes=window._mesAtual||mesAtual;
        const pagos=MEMBROS.filter(m=>pagtos[m.uid+"_"+mes]?.pago);
        const nao=MEMBROS.filter(m=>!pagtos[m.uid+"_"+mes]?.pago);
        return`<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px">
          <div class="metric" style="padding:12px"><div class="metric-label">✅ Pagos</div><div class="metric-value" style="color:var(--green)">${pagos.length}</div></div>
          <div class="metric" style="padding:12px"><div class="metric-label">❌ Pendentes</div><div class="metric-value" style="color:var(--danger)">${nao.length}</div></div>
        </div>
        ${MEMBROS.map(m=>{
          const k=m.uid+"_"+mes;
          const p=pagtos[k];
          return`<div style="display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border)">
            ${avatarEl(m.fotoUrl,m.apelido,32)}
            <div style="flex:1"><div style="font-size:13px;font-weight:600">${m.apelido}</div>${p?.pago&&p?.data?`<div style="font-size:10px;color:var(--muted)">${fmtDate(p.data)}</div>`:""}</div>
            <button onclick="window.toggleMensalidade('${m.uid}','${m.apelido}','${mes}','${p?.id||""}')" style="padding:7px 14px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;border:none;background:${p?.pago?"#2a6e3f":"var(--bg3)"};color:${p?.pago?"#fff":"var(--muted)"};">${p?.pago?"✅ Pago":"Marcar"}</button>
          </div>`;
        }).join("")}`;
      })()}
    </div>`;
  }catch(e){console.error(e);wrap.innerHTML=`<div style="font-size:12px;color:var(--danger)">Erro.</div>`;}
}

window.toggleMensalidade=async(uid,apelido,mes,docId)=>{
  try{
    if(docId){
      const snap=await getDoc(doc(db,"mensalidades",docId));
      const pago=snap.data()?.pago;
      await setDoc(doc(db,"mensalidades",docId),{pago:!pago,data:!pago?new Date().toISOString().slice(0,10):""},{merge:true});
    }else{
      await addDoc(collection(db,"mensalidades"),{membroId:uid,apelido,mes,pago:true,data:new Date().toISOString().slice(0,10),criadoPor:UP.apelido,criadoEm:serverTimestamp()});
    }
    carregarMensalidades();
  }catch{showToast("Erro.",true);}
};

async function carregarEventosSede(){
  const el=document.getElementById("eventos-sede-lista");
  if(!el)return;
  try{
    const hoje=new Date().toISOString().slice(0,10);
    const snap=await getDocs(query(collection(db,"eventos_sede"),orderBy("data","asc")));
    const docs=snap.docs.map(d=>({id:d.id,...d.data()}));
    const futuros=docs.filter(e=>e.data>=hoje);
    const passados=docs.filter(e=>e.data<hoje).slice(-3).reverse();
    if(docs.length===0){el.innerHTML=`<div style="font-size:12px;color:#555">Nenhum evento cadastrado.</div>`;return;}
    const isAdmin=UP&&(UP.isAdmin||UP.isDiretor);

    // Carregar contagem de confirmados por evento
    const confSnap=await getDocs(query(collection(db,"sede_confirmacoes"),where("tipo","==","evento_sede")));
    const confCounts={};
    confSnap.docs.forEach(d=>{
      const r=d.data();
      if(!confCounts[r.eventoId])confCounts[r.eventoId]={confirmado:0,compareceu:0};
      if(r.resposta==="confirmado")confCounts[r.eventoId].confirmado++;
      if(r.resposta==="compareceu")confCounts[r.eventoId].compareceu++;
    });

    const renderEv=(e,passado=false)=>{
      const hoje2=new Date();hoje2.setHours(0,0,0,0);
      const evData=new Date(e.data+"T00:00:00");
      const dias=Math.round((evData-hoje2)/(1000*60*60*24));
      const diasLabel=dias===0?"🔴 Hoje!":dias===1?"🟠 Amanhã":dias>0?`🕐 ${dias} dias`:"";
      const meuStatus=CONF_EVENTO_SEDE[e.id]||"sem_resposta";
      const counts=confCounts[e.id]||{};
      const confirmadosNum=(counts.confirmado||0)+(counts.compareceu||0);
      const acoesHtml=!passado?`<div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap">
        ${meuStatus==="confirmado"||meuStatus==="compareceu"
          ?`<button onclick="window.confirmarEventoSede('${e.id}','desistiu')" style="padding:6px 12px;border-radius:8px;border:1px solid var(--danger);background:transparent;color:var(--danger);font-size:12px;font-weight:700;cursor:pointer;font-family:inherit">❌ Desistir</button>
             <span style="font-size:11px;color:var(--green);align-self:center">${meuStatus==="compareceu"?"🏁 Compareceu":"✅ Confirmado"}</span>`
          :meuStatus==="desistiu"
          ?`<button onclick="window.confirmarEventoSede('${e.id}','confirmado')" style="padding:6px 12px;border-radius:8px;border:none;background:var(--orange);color:#fff;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit">✅ Confirmar presença</button>
             <span style="font-size:11px;color:var(--danger);align-self:center">🔴 Desistiu</span>`
          :`<button onclick="window.confirmarEventoSede('${e.id}','confirmado')" style="padding:6px 12px;border-radius:8px;border:none;background:var(--orange);color:#fff;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit">✅ Confirmar presença</button>`}
        ${isAdmin&&meuStatus==="confirmado"?`<button onclick="window.marcarCompareceuEventoSede('${e.id}')" style="padding:6px 12px;border-radius:8px;border:1px solid var(--green);background:transparent;color:var(--green);font-size:12px;font-weight:700;cursor:pointer;font-family:inherit">🏁 Compareceu</button>`:""}
        ${isAdmin?`<button onclick="window.verConfsEventoSede('${e.id}','${e.nome}')" style="padding:6px 10px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:11px;cursor:pointer;font-family:inherit">👥 Ver lista</button>`:""}
      </div>`:"";
      return`<div id="evs-card-${e.id}" style="padding:12px 0;border-bottom:1px solid var(--border);opacity:${passado?".6":"1"}">
        <div style="display:flex;align-items:flex-start;justify-content:space-between">
          <div style="flex:1">
            <div style="font-size:14px;font-weight:700">${e.nome}</div>
            <div style="font-size:12px;color:var(--muted)">${fmtDate(e.data)}${e.hora?` · ${e.hora}`:""}</div>
            ${e.desc?`<div style="font-size:12px;color:var(--muted);margin-top:2px">${e.desc}</div>`:""}
            ${confirmadosNum>0?`<div style="font-size:11px;color:var(--green);margin-top:3px">✅ ${confirmadosNum} confirmado${confirmadosNum!==1?"s":""}</div>`:""}
          </div>
          <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px">
            ${diasLabel?`<span style="font-size:10px;font-weight:700;color:${dias===0?"var(--danger)":dias<=7?"var(--orange)":"var(--muted)"};background:${dias===0?"rgba(224,82,82,.15)":dias<=7?"rgba(232,103,10,.15)":"var(--bg3)"};padding:2px 8px;border-radius:20px;border:1px solid ${dias===0?"rgba(224,82,82,.3)":dias<=7?"rgba(232,103,10,.3)":"var(--border)"}">${diasLabel}</span>`:""}
            ${isAdmin?`<button onclick="window.excluirEventoSede('${e.id}')" style="font-size:10px;color:var(--danger);background:transparent;border:none;cursor:pointer">✕</button>`:""}
          </div>
        </div>
        ${acoesHtml}
      </div>`;
    };
    el.innerHTML=(futuros.length===0?`<div style="font-size:12px;color:#555;margin-bottom:10px">Nenhum evento futuro.</div>`:"")
      +futuros.map(e=>renderEv(e)).join("")
      +(passados.length>0?`<div style="font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;margin-top:12px;margin-bottom:6px">Passados</div>`+passados.map(e=>renderEv(e,true)).join(""):"");
  }catch(e){el.innerHTML=`<div style="font-size:12px;color:var(--danger)">Erro.</div>`;}
}

window.salvarEventoSede=async()=>{

  const hora=document.getElementById("es-hora")?.value;
  const desc=document.getElementById("es-desc")?.value.trim();

window.marcarCompareceuEventoSede=async(eventoId)=>{

window.verConfsEventoSede=async(eventoId,nomeEvento)=>{

      <div style="font-size:15px;font-weight:700">👥 ${nomeEvento}</div>
      <button onclick="document.getElementById('evs-lista-ov').remove()" style="background:transparent;border:none;color:var(--muted);font-size:22px;cursor:pointer;line-height:1">×</button>

    ${lista.length===0?`<div style="font-size:12px;color:#555">Ninguém confirmou ainda.</div>`:lista.map(c=>{

      const m=MEMBROS.find(mb=>mb.uid===c.membroId)||{apelido:c.apelido||"?",fotoUrl:null};
      return`<div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)">
        ${avatarEl(m.fotoUrl,m.apelido,32)}

window.excluirConfEventoSede=async(docId,eventoId,nomeEvento)=>{

function htmlReunioes(){
  return`<div class="card">
    <div style="display:flex;gap:6px;margin-bottom:14px">
      <button id="reun-tab-proxima" onclick="window.trocarAbaReuniao('proxima')" style="padding:6px 14px;border-radius:20px;border:none;background:var(--orange);color:#fff;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit">📅 Próxima</button>
      <button id="reun-tab-agendar" onclick="window.trocarAbaReuniao('agendar')" style="padding:6px 14px;border-radius:20px;border:1px solid var(--border);background:var(--bg3);color:var(--muted);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit">➕ Agendar</button>
      <button id="reun-tab-historico" onclick="window.trocarAbaReuniao('historico')" style="padding:6px 14px;border-radius:20px;border:1px solid var(--border);background:var(--bg3);color:var(--muted);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit">📋 Histórico</button>
    </div>
    <div id="reun-conteudo"><span class="spin">⟳</span></div>
  </div>`;
}

window.trocarAbaReuniao=(aba)=>{
  ["proxima","agendar","historico"].forEach(a=>{
    const btn=document.getElementById("reun-tab-"+a);
    if(!btn)return;
    const active=a===aba;
    btn.style.background=active?"var(--orange)":"var(--bg3)";
    btn.style.color=active?"#fff":"var(--muted)";
    btn.style.border=active?"none":"1px solid var(--border)";
  });
  window._reunAba=aba;
  if(aba==="agendar")renderAbaAgendarReuniao();
  else carregarReunioes();
};

function renderAbaAgendarReuniao(){
  const el=document.getElementById("reun-conteudo");
  if(!el)return;
  el.innerHTML=`
    <label>Data</label><input type="date" id="reun-data" autocomplete="off" style="margin-bottom:8px"/>
    <label>Hora</label><input type="time" id="reun-hora" value="20:00" autocomplete="off" style="margin-bottom:8px"/>
    <label>Pauta</label>
    <textarea id="reun-pauta" placeholder="Tópicos que serão discutidos na reunião..." style="width:100%;min-height:80px;padding:10px;border:1px solid var(--border);border-radius:8px;background:var(--bg3);color:var(--white);font-family:inherit;font-size:13px;resize:vertical;margin-bottom:10px"></textarea>
    <div id="reun-err" class="msg-err" style="display:none"></div>
    <button class="btn-primary" onclick="window.agendarReuniao()">Agendar reunião</button>`;
}

async function carregarReunioes(){
  const el=document.getElementById("reun-conteudo");
  if(!el)return;
  const aba=window._reunAba||"proxima";
  el.innerHTML=`<span class="spin">⟳</span>`;
  try{
    const hoje=new Date().toISOString().slice(0,10);
    const snap=await getDocs(query(collection(db,"reunioes"),orderBy("data","desc")));
    const todas=snap.docs.map(d=>({id:d.id,...d.data()}));
    const futuras=[...todas.filter(r=>r.data>=hoje)].reverse();
    const passadas=todas.filter(r=>r.data<hoje);
    if(aba==="proxima"){
      if(futuras.length===0){el.innerHTML=`<div style="font-size:12px;color:#555;padding:8px 0">Nenhuma reunião agendada. Use ➕ Agendar para criar.</div>`;return;}
      const r=futuras[0];
      const hoje2=new Date();hoje2.setHours(0,0,0,0);
      const dias=Math.round((new Date(r.data+"T00:00:00")-hoje2)/(1000*60*60*24));
      const minhaResp=(r.confirmacoes||{})[CU.uid]||"";
      const podeEditar=UP&&(UP.isAdmin||UP.isDiretor);
      el.innerHTML=`
        <div style="background:rgba(232,103,10,.06);border:1px solid rgba(232,103,10,.2);border-radius:10px;padding:14px;margin-bottom:14px">
          <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:8px">
            <div>
              <div style="font-size:15px;font-weight:700">📅 ${fmtDate(r.data)}</div>
              <div style="font-size:13px;color:var(--muted)">🕐 ${r.hora||"--:--"}</div>
            </div>
            ${dias>=0?`<span style="font-size:11px;color:${dias===0?"var(--danger)":dias<=7?"var(--orange)":"var(--muted)"};font-weight:700;background:${dias===0?"rgba(224,82,82,.15)":dias<=7?"rgba(232,103,10,.15)":"var(--bg3)"};padding:3px 8px;border-radius:20px;border:1px solid ${dias===0?"rgba(224,82,82,.3)":dias<=7?"rgba(232,103,10,.3)":"var(--border)"}">${dias===0?"🔴 Hoje!":dias===1?"🟠 Amanhã":"🕐 "+dias+" dias"}</span>`:""}
          </div>
          ${r.pauta?`<div style="font-size:12px;background:var(--bg3);border-radius:6px;padding:8px;margin-bottom:10px;border-left:3px solid var(--orange)">📋 <strong>Pauta:</strong><br>${r.pauta}</div>`:""}
          <div style="display:flex;gap:8px;margin-bottom:10px">
            <button onclick="window.confirmarReuniao('${r.id}','sim')" style="flex:1;padding:10px;border-radius:8px;border:none;background:${minhaResp==="sim"?"#2a6e3f":"var(--orange)"};color:#fff;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit">✅ Vou!</button>
            <button onclick="window.confirmarReuniao('${r.id}','nao')" style="flex:1;padding:10px;border-radius:8px;border:1px solid var(--danger);background:${minhaResp==="nao"?"rgba(224,82,82,.2)":"transparent"};color:var(--danger);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit">❌ Não vou</button>
          </div>
          ${minhaResp?`<div class="hint-box">${minhaResp==="sim"?"✅ Você confirmou presença!":"❌ Você marcou que não vai."}</div>`:""}
        </div>
        <div class="sec-title">👥 Confirmações</div>
        <div style="margin-bottom:16px">${htmlConfirmacoesReuniao(r)}</div>
        <div style="border-top:1px solid var(--border);padding-top:14px">
          <div class="sec-title">📝 Ata pós-reunião</div>
          ${r.ata?`<div style="background:var(--bg3);border-radius:8px;padding:10px 12px;border-left:3px solid var(--green);margin-bottom:10px;font-size:13px;line-height:1.5;white-space:pre-wrap">${r.ata}</div>`:"<div style='font-size:12px;color:#555;margin-bottom:10px'>Ata não registrada ainda.</div>"}
          ${r.ataAnexoUrl?`<div style="margin-bottom:12px">${r.ataAnexoUrl.match(/\.(jpg|jpeg|png|gif|webp)/i)?`<img src="${r.ataAnexoUrl}" style="max-width:100%;border-radius:8px;cursor:pointer" onclick="window.open('${r.ataAnexoUrl}','_blank')">`:`<a href="${r.ataAnexoUrl}" target="_blank" style="display:inline-flex;align-items:center;gap:6px;color:var(--orange);font-size:12px;text-decoration:none;padding:8px 12px;border:1px solid rgba(232,103,10,.3);border-radius:8px">📎 ${r.ataAnexoNome||"Anexo da ata"}</a>`}</div>`:""}
          ${podeEditar?`
          <textarea id="reun-ata-${r.id}" placeholder="Registre as decisões, encaminhamentos, votações..." style="width:100%;min-height:100px;padding:10px;border:1px solid var(--border);border-radius:8px;background:var(--bg3);color:var(--white);font-family:inherit;font-size:13px;resize:vertical;margin-bottom:8px">${r.ata||""}</textarea>
          <div style="display:flex;gap:8px;align-items:center;margin-bottom:10px">
            <label for="reun-anexo-${r.id}" style="text-transform:none;letter-spacing:0;font-size:12px;cursor:pointer;padding:7px 12px;border:1px solid var(--border);border-radius:8px;background:var(--bg3);color:var(--white);margin:0;flex-shrink:0">📎 Anexar</label>
            <input type="file" id="reun-anexo-${r.id}" accept="image/*,.pdf,.doc,.docx" style="display:none;margin:0" onchange="document.getElementById('reun-anexo-nome-${r.id}').textContent=this.files[0]?.name||''"/>
            <span id="reun-anexo-nome-${r.id}" style="font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></span>

          <div style="display:flex;gap:8px">
            <button class="btn-primary" style="flex:1" onclick="window.salvarAta('${r.id}')">💾 Salvar ata</button>
            <button onclick="window.excluirReuniao('${r.id}')" style="padding:9px 14px;border-radius:8px;border:1px solid rgba(224,82,82,.3);background:transparent;color:var(--danger);cursor:pointer;font-family:inherit;font-size:13px">${li("trash-2",14)}</button>
          </div>`:""}
        </div>`;
    }else{
      if(passadas.length===0){el.innerHTML=`<div style="font-size:12px;color:#555">Nenhuma reunião passada ainda.</div>`;return;}
      el.innerHTML=passadas.map(r=>`
        <div style="padding:12px 0;border-bottom:1px solid var(--border)">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">
            <div>
              <div style="font-size:13px;font-weight:600">📅 ${fmtDate(r.data)} · 🕐 ${r.hora||"—"}</div>
              ${r.pauta?`<div style="font-size:11px;color:var(--muted);margin-top:2px">📋 ${r.pauta}</div>`:""}
            </div>
            <span style="font-size:10px;color:var(--muted)">✅ ${Object.values(r.confirmacoes||{}).filter(v=>v==="sim").length} presentes</span>
          </div>
          ${r.ata?`<div style="font-size:12px;background:var(--bg3);border-radius:6px;padding:8px;border-left:3px solid var(--green);white-space:pre-wrap;margin-bottom:4px">${r.ata}</div>`:`<div style="font-size:11px;color:#555">Sem ata.</div>`}
          ${r.ataAnexoUrl?`<a href="${r.ataAnexoUrl}" target="_blank" style="display:inline-flex;align-items:center;gap:5px;color:var(--orange);font-size:11px;text-decoration:none;margin-top:4px">📎 ${r.ataAnexoNome||"Anexo"}</a>`:""}
        </div>`).join("");
    }
  }catch(e){el.innerHTML=`<div style="font-size:12px;color:var(--danger)">Erro ao carregar.</div>`;}
}

function htmlConfirmacoesReuniao(r){
  const confs=r.confirmacoes||{};
  const vao=MEMBROS.filter(m=>confs[m.uid]==="sim");
  const nao=MEMBROS.filter(m=>confs[m.uid]==="nao");
  const semResp=MEMBROS.filter(m=>!confs[m.uid]);
  return`<div style="display:flex;flex-wrap:wrap;gap:4px;margin-bottom:5px">
    ${vao.map(m=>`<span class="pres-badge pres-sim" style="font-size:10px">✅ ${m.apelido}</span>`).join("")}
    ${nao.map(m=>`<span class="pres-badge pres-nao" style="font-size:10px">❌ ${m.apelido}</span>`).join("")}
  </div>
  <div style="font-size:10px;color:var(--muted)">✅ ${vao.length} · ❌ ${nao.length} · ⏳ ${semResp.length} sem resposta</div>`;
}

window.confirmarReuniao=async(reuniaoId,resp)=>{
  try{
    await setDoc(doc(db,"reunioes",reuniaoId),{[`confirmacoes.${CU.uid}`]:resp},{merge:true});
    showToast(resp==="sim"?"✅ Presença confirmada!":"❌ Ausência registrada.");
    carregarReunioes();
  }catch{showToast("Erro.",true);}
};

window.agendarReuniao=async()=>{
  const data=document.getElementById("reun-data")?.value;

  const pauta=document.getElementById("reun-pauta")?.value.trim();

  err.style.display="none";
  try{
    await addDoc(collection(db,"reunioes"),{data,hora:hora||"",pauta:pauta||"",confirmacoes:{},ata:"",ataAnexoUrl:"",ataAnexoNome:"",criadoPor:UP.apelido,criadoEm:serverTimestamp()});

window.salvarAta=async(reuniaoId)=>{
  const ata=document.getElementById("reun-ata-"+reuniaoId)?.value.trim();
  const input=document.getElementById("reun-anexo-"+reuniaoId);
  const f=input?.files[0];
  try{
    let anexoUrl="",anexoNome="";
    if(f){showToast("Enviando anexo...");anexoUrl=await uploadFoto(f);anexoNome=f.name;}
    const update={ata:ata||""};
    if(anexoUrl){update.ataAnexoUrl=anexoUrl;update.ataAnexoNome=anexoNome;}
    await setDoc(doc(db,"reunioes",reuniaoId),update,{merge:true});
    showToast("✅ Ata salva!");
    registrarLog("ata_salva","salvou ata da reunião","");
    carregarReunioes();

};

window.excluirReuniao=async(reuniaoId)=>{

  try{
    await deleteDoc(doc(db,"reunioes",reuniaoId));
    showToast("Reunião excluída.");carregarReunioes();

};

window.recalcTotal=(evId)=>{
  const key=evId!=null?evId:"custom";
  const pedEl=document.getElementById("ped-manual-"+key);
  const gasEl=document.getElementById("gas-manual-"+key);
  const totEl=document.getElementById("total-est-"+key);
  if(!pedEl||!gasEl||!totEl)return;
  const ped=parseFloat(pedEl.value.replace(",","."))||0;
  const gas=parseFloat(gasEl.value.replace(",","."))||0;
  // Busca litros da última calc (guardado em data-lit)
  const lit=parseFloat(pedEl.closest(".rota-result")?.dataset.lit)||0;
  const comb=lit*gas;
  totEl.textContent="R$"+brl(comb+ped);
};

window.confirmarSede=async(data,resposta,tipo)=>{
  const tp=tipo||"presenca";
  const docId=CU.uid+"_"+tp+"_"+data;
  const anterior=CONF_SEDE[tp+"_"+data];
  try{
    await setDoc(doc(db,"sede_confirmacoes",docId),{membroId:CU.uid,apelido:UP.apelido,data,resposta,tipo:tp,updatedAt:serverTimestamp()});
    CONF_SEDE[tp+"_"+data]=resposta;
    if(tp==="presenca"){
      const uid=CU.uid;
      if(resposta==="sim"&&anterior!=="sim")SEDE_COUNTS[uid]=(SEDE_COUNTS[uid]||0)+1;
      else if(resposta!=="sim"&&anterior==="sim")SEDE_COUNTS[uid]=Math.max(0,(SEDE_COUNTS[uid]||1)-1);
    }
    showToast(resposta==="sim"?(tp==="limpeza"?"🧹 Confirmado para limpeza!":"⛪ Presença confirmada!"):"❌ Ausência registrada.");
    registrarLog("sede_confirmada",`${resposta==="sim"?"confirmou":"recusou"} ${tp==="limpeza"?"limpeza":"presença na sede"}`,fmtDate(data));
    render();
    setTimeout(carregarSedeInfo,200);
  }catch{showToast("Erro ao confirmar.",true);}
};

  if(!data){showToast("Data inválida. Use DD/MM/AAAA.",true);return;}

  const docId1=CU.uid+"_presenca_"+data;

  try{

    if(snap1.exists()||snap2.exists()){showToast("Presença já registrada para esta data.",true);return;}

window.atualizarHistorico=async(tipo)=>{
  const el=document.getElementById("hist-conteudo-"+tipo);
  if(!el)return;
  const aberto=window["_hist_"+tipo];
  el.style.display=aberto?"block":"none";
  if(!aberto)return;
  el.innerHTML=`<span class="spin">⟳</span>`;
  try{
    if(tipo==="presenca"||tipo==="limpeza"){
      // Últimas 8 sextas (presenca) ou quartas (limpeza)
      const datas=[];
      const hoje=new Date();
      let d=new Date(hoje);
      const divoSemana=tipo==="limpeza"?3:5;
      const diasAtras=(hoje.getDay()>=divoSemana)?hoje.getDay()-divoSemana:7-(divoSemana-hoje.getDay());
      d.setDate(d.getDate()-diasAtras);
      for(let i=0;i<8;i++){datas.push(d.toISOString().slice(0,10));d.setDate(d.getDate()-7);}
      const snap=await getDocs(query(collection(db,"sede_confirmacoes"),where("data","in",datas),where("tipo","==",tipo)));
      const porData={};
      snap.docs.forEach(doc=>{const r=doc.data();if(!porData[r.data])porData[r.data]={sim:[],nao:[]};porData[r.data][r.resposta].push(r.apelido);});
      const html=datas.filter(s=>porData[s]).map(s=>{
        const v=porData[s].sim||[],n=porData[s].nao||[];
        return`<div style="padding:10px 0;border-bottom:1px solid var(--border)">
          <div style="display:flex;justify-content:space-between;margin-bottom:5px">
            <div style="font-size:13px;font-weight:600">${fmtDate(s)}</div>
            <div style="font-size:11px;color:var(--muted)">✅ ${v.length} · ❌ ${n.length}</div>
          </div>
          <div style="display:flex;flex-wrap:wrap;gap:3px">
            ${v.map(a=>`<span class="pres-badge pres-sim" style="font-size:10px;padding:2px 7px">${a}</span>`).join("")}
            ${n.map(a=>`<span class="pres-badge pres-nao" style="font-size:10px;padding:2px 7px">${a}</span>`).join("")}
          </div>
        </div>`;
      }).join("");
      el.innerHTML=html||`<div style="font-size:12px;color:#555;padding:8px 0">Nenhum histórico.</div>`;
    }else{
      // Bar ou Churrasco — últimas 8 semanas
      const col=tipo==="bar"?"escala_bar":"escala_churrasco";
      const hoje=new Date().toISOString().slice(0,10);
      const snap=await getDocs(query(collection(db,col),orderBy("data","desc")));
      const docs=snap.docs.filter(d=>d.data().data<hoje).slice(0,8);
      const html=docs.map(d=>{
        const e=d.data();
        const nomes=tipo==="bar"?`${e.m1} & ${e.m2}`:[e.m1,e.m2,e.m3,e.m4,e.m5].filter(Boolean).join(" · ");
        return`<div style="padding:10px 0;border-bottom:1px solid var(--border)">

  lcr();

    showToast(e.code==="auth/user-not-found"?"E-mail não encontrado.":"Erro ao enviar.",true);
  }
};
