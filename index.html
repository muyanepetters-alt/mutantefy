async function carregarProximosEventos(){
  const wrap=document.getElementById("pres-proximos-wrap");
  if(!wrap)return;
  wrap.innerHTML=`<span class="spin">⟳</span>`;
  try{
    const hoje=new Date().toISOString().slice(0,10);
    const futuros=EVENTOS.filter(e=>e.data>=hoje&&e.destino!=="A confirmar");
    if(!futuros.length){wrap.innerHTML=`<div style="font-size:13px;color:var(--muted)">Nenhum evento próximo.</div>`;return;}
    const [presSnaps,regSnaps]=await Promise.all([
      Promise.all(futuros.map(ev=>getDocs(query(collection(db,"presencas"),where("eventoId","==",ev.id))))),
      Promise.all(futuros.map(ev=>getDocs(query(collection(db,"registros"),where("eventoId","==",ev.id)))))
    ]);
    let html="";
    futuros.forEach((ev,i)=>{
      // Build enriched pDocs: presencas as base, registros wins for compareceu status
      const presMap={};
      presSnaps[i].docs.forEach(d=>{const p=d.data();presMap[p.membroId]=p;});
      regSnaps[i].docs.forEach(d=>{
        const r={...d.data(),id:d.id};
        const base=presMap[r.membroId]||{membroId:r.membroId,apelido:r.apelido};
        presMap[r.membroId]={...base,compareceu:true,resposta:"compareceu",registroId:r.id,kmLancado:r.km};
      });
      const pDocs=Object.values(presMap);
      const nComp=pDocs.filter(p=>p.compareceu||p.resposta==="compareceu").length;
      const nConf=pDocs.filter(p=>!p.compareceu&&p.resposta!=="compareceu"&&(p.resposta==="sim"||p.resposta==="confirmado")).length;
      const nDes=pDocs.filter(p=>!p.compareceu&&p.resposta!=="compareceu"&&(p.resposta==="nao"||p.resposta==="desistiu")).length;
      const isFirst=i===0;
      html+=`<div style="border:1px solid var(--border);border-radius:10px;margin-bottom:8px;overflow:hidden">
        <button onclick="window.togglePresAcc(${ev.id})" style="width:100%;background:var(--bg2);border:none;padding:12px 14px;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:10px;text-align:left">
          <div style="flex:1;min-width:0">
            <div style="font-size:13px;font-weight:600;color:var(--white);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${ev.nome}</div>
            <div style="font-size:11px;color:var(--muted)">${fmtDate(ev.data)} · ${ev.destino}</div>
          </div>
          <div style="display:flex;gap:4px;align-items:center;flex-shrink:0">
            ${nComp?`<span style="background:rgba(76,175,125,.2);color:var(--green);border-radius:20px;padding:2px 7px;font-size:10px;font-weight:700">🟢${nComp}</span>`:""}
            ${nConf?`<span style="background:rgba(245,197,24,.15);color:#f5c518;border-radius:20px;padding:2px 7px;font-size:10px;font-weight:700">🟡${nConf}</span>`:""}
            ${nDes?`<span style="background:rgba(224,82,82,.1);color:var(--danger);border-radius:20px;padding:2px 7px;font-size:10px;font-weight:700">🔴${nDes}</span>`:""}
            <span id="pres-acc-ic-${ev.id}" style="color:var(--muted);font-size:12px;margin-left:2px">${isFirst?"▲":"▼"}</span>
          </div>
        </button>
        <div id="pres-acc-body-${ev.id}" style="display:${isFirst?"block":"none"};padding:12px 14px;border-top:1px solid var(--border);background:var(--bg3)">
          ${_htmlPresencaEvento(ev,pDocs)}
        </div>
      </div>`;
    });
    wrap.innerHTML=html;
  }catch(e){wrap.innerHTML=`<div style="color:var(--danger);font-size:12px">Erro ao carregar.</div>`;}
}

window.toggleAccAnt=(evId)=>{
  document.querySelectorAll("[id^='ant-acc-body-']").forEach(el=>{if(el.id!==`ant-acc-body-${evId}`)el.style.display="none";});
  document.querySelectorAll("[id^='ant-acc-ic-']").forEach(el=>{if(el.id!==`ant-acc-ic-${evId}`)el.textContent="▼";});
  const body=document.getElementById(`ant-acc-body-${evId}`);
  const ic=document.getElementById(`ant-acc-ic-${evId}`);
  if(!body)return;
  const open=body.style.display==="none";
  body.style.display=open?"block":"none";
  if(ic)ic.textContent=open?"▲":"▼";
  if(open&&body.querySelector(".spin"))carregarCorpoEventoAnt(evId);
};

            <button onclick="window.salvarAntEdit('${r.id}','${r.membroId}',${r.km},${evId})" style="padding:7px 12px;border-radius:8px;border:none;background:var(--green);color:#fff;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit">Salvar</button>
            <button onclick="window.cancelarAntEdit('${r.id}')" style="padding:7px 9px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:12px;cursor:pointer;font-family:inherit">✕</button>
          </div>

window.mostrarAntEdit=(regId,kmAtual,evId)=>{
  const btns=document.getElementById("ant-btns-"+regId);
  const form=document.getElementById("ant-edit-form-"+regId);
  if(btns)btns.style.display="none";
  if(form)form.style.display="block";
  const inp=document.getElementById("ant-edit-inp-"+regId);
  if(inp){inp.value=kmAtual;inp.focus();}
};
window.cancelarAntEdit=(regId)=>{
  const btns=document.getElementById("ant-btns-"+regId);
  const form=document.getElementById("ant-edit-form-"+regId);
  if(btns)btns.style.display="";
  if(form)form.style.display="none";
};
window.salvarAntEdit=async(regId,membroId,kmAtual,evId)=>{
  const inp=document.getElementById("ant-edit-inp-"+regId);
  const km=parseFloat(inp?.value);
  if(!km||isNaN(km)||km<=0){showToast("Informe um km válido.",true);return;}
  inp.disabled=true;
  try{
    await setDoc(doc(db,"registros",regId),{km},{merge:true});
    const diff=km-kmAtual;
    const mSnap=await getDoc(doc(db,"usuarios",resolveDocId(membroId)));
    const nt=Math.max(0,(mSnap.data()?.totalKm||0)+diff);
    await setDoc(doc(db,"usuarios",resolveDocId(membroId)),{totalKm:nt},{merge:true});
    const m=findMembro(membroId);if(m)m.totalKm=nt;
    showToast(`✓ Km atualizado para ${toInt(km)}!`);
    await carregarCorpoEventoAnt(evId);
  }catch(e){showToast("Erro: "+e.message,true);inp.disabled=false;}
};
window.excluirAntReg=async(regId,membroId,km,evId)=>{
  if(!confirm("Excluir este registro?"))return;
  try{
    await deleteDoc(doc(db,"registros",regId));
    const mSnap=await getDoc(doc(db,"usuarios",resolveDocId(membroId)));
    const nt=Math.max(0,(mSnap.data()?.totalKm||0)-km);
    await setDoc(doc(db,"usuarios",resolveDocId(membroId)),{totalKm:nt},{merge:true});
    const m=findMembro(membroId);if(m)m.totalKm=nt;
    showToast("✓ Registro excluído.");
    await carregarCorpoEventoAnt(evId);
  }catch(e){showToast("Erro: "+e.message,true);}
};
window.mostrarAntAdd=(uid,evId)=>{

window.salvarAntAdd=async(uid,apelido,evId)=>{
  const inp=document.getElementById("ant-add-inp-"+uid);

  if(!km||isNaN(km)||km<=0){showToast("Informe um km válido.",true);return;}

  inp.disabled=true;
  try{

    const nt=(mSnap.data()?.totalKm||0)+km;

};

window.marcarTodosMassa=()=>{
  MEMBROS.forEach(m=>{const el=document.getElementById("chk-"+m.uid);if(el)el.checked=true;});
};

window.lancarKmMassa=async(evId)=>{
  const ev=EVENTOS.find(e=>e.id===evId);
  if(!ev)return;
  const selecionados=MEMBROS.filter(m=>document.getElementById("chk-"+m.uid)?.checked);
  if(!selecionados.length){showToast("Selecione ao menos um membro.",true);return;}
  const kms={};
  for(const m of selecionados){
    const km=parseFloat(document.getElementById("km-massa-"+m.uid)?.value);
    if(!km||isNaN(km)||km<=0){showToast(`Informe o km para ${m.apelido}.`,true);return;}
    kms[m.uid]=km;
  }
  showToast(`Lançando para ${selecionados.length} membro(s)...`);
  try{
    for(const m of selecionados){
      const km=kms[m.uid];
      await addDoc(collection(db,"registros"),{membroId:m.authUid,apelido:m.apelido||"",desc:ev.nome,data:ev.data,km,tipo:"rota",eventoId:ev.id,createdAt:serverTimestamp()});
      const nt=(m.totalKm||0)+km;
      await setDoc(doc(db,"usuarios",m.uid),{totalKm:nt},{merge:true});
      m.totalKm=nt;
    }
    showToast(`✓ ${selecionados.length} lançamento(s) salvos!`);
    selecionados.forEach(m=>{const el=document.getElementById("chk-"+m.uid);if(el)el.checked=false;});
    await window.carregarGestaoEvento(evId);
  }catch(e){showToast("Erro: "+e.message,true);}
};

async function _carregarCorpoModalPresenca(ev){
  const corpo=document.getElementById("modal-presenca-corpo");
  if(!corpo)return;
  try{
    const [regSnap,memSnap]=await Promise.all([
      getDocs(query(collection(db,"registros"),where("eventoId","==",ev.id))),
      getDocs(collection(db,"usuarios"))
    ]);
    const regs=regSnap.docs.map(d=>({id:d.id,...d.data()}));
    const todos=memSnap.docs.map(d=>({uid:d.id,...d.data()})).filter(m=>!m.isAdmin);
    const comRegs=new Set(regs.map(r=>r.membroId));
    const naoCompareceram=todos.filter(m=>!comRegs.has(m.uid));

    let html=`<div style="font-size:11px;font-weight:700;color:var(--green);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px">🟢 Compareceram (${regs.length})</div>`;
    if(regs.length===0){
      html+=`<div style="font-size:12px;color:var(--muted);margin-bottom:16px">Nenhum registro ainda.</div>`;
    }else{
      regs.forEach(r=>{
        html+=`<div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)">
          <div style="flex:1;min-width:0">
            <div style="font-size:13px;font-weight:600;color:var(--white)">${r.apelido||"?"}</div>
            <div style="font-size:11px;color:var(--muted)">${toInt(r.km)} km</div>
          </div>
          <button onclick="window.editarKmPresenca('${r.id}','${r.membroId}',${r.km},${ev.id})" style="padding:6px 10px;border-radius:7px;border:1px solid var(--border);background:transparent;color:var(--white);font-size:11px;cursor:pointer;font-family:inherit">✏️ Editar</button>
          <button onclick="window.excluirRegistroPresenca('${r.id}','${r.membroId}',${r.km},${ev.id})" style="padding:6px 10px;border-radius:7px;border:1px solid var(--danger);background:transparent;color:var(--danger);font-size:11px;cursor:pointer;font-family:inherit">✕</button>
        </div>`;
      });
    }

    html+=`<div style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:16px 0 8px">⚪ Não compareceram (${naoCompareceram.length})</div>`;
    if(naoCompareceram.length===0){
      html+=`<div style="font-size:12px;color:var(--muted)">Todos os membros já têm registro.</div>`;
    }else{
      naoCompareceram.forEach(m=>{
        html+=`<div id="ncomp-row-${m.uid}" style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)">
          <div style="flex:1;min-width:0">
            <div style="font-size:13px;font-weight:600;color:var(--white)">${m.apelido||"?"}</div>
          </div>
          <button onclick="window.marcarPresencaModal('${m.uid}','${m.apelido||""}',${ev.id})" id="btn-marcar-${m.uid}" style="padding:6px 12px;border-radius:7px;border:1px solid var(--green);background:transparent;color:var(--green);font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap">🏁 Marcar presença</button>
        </div>
        <div id="km-form-${m.uid}" style="display:none;padding:8px 0 10px;border-bottom:1px solid var(--border)">
          <div style="display:flex;gap:8px;align-items:center">
            <input id="km-inp-${m.uid}" type="number" min="1" step="1" placeholder="km total ida+volta" style="flex:1;padding:8px 10px;border-radius:8px;border:1px solid var(--border);background:var(--bg3);color:var(--white);font-size:13px;font-family:inherit"/>
            <button onclick="window.salvarPresencaModal('${m.uid}','${m.apelido||""}',${ev.id})" style="padding:8px 14px;border-radius:8px;border:none;background:var(--green);color:#fff;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit">Salvar</button>
            <button onclick="window.cancelarPresencaModal('${m.uid}')" style="padding:8px 10px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:12px;cursor:pointer;font-family:inherit">✕</button>
          </div>
        </div>`;
      });
    }
    corpo.innerHTML=html;
  }catch(e){corpo.innerHTML=`<div style="color:var(--danger);font-size:12px">Erro ao carregar: ${e.message}</div>`;}
}

async function carregarPresencasAdmin(){
  const wrap=document.getElementById("presenca-wrap");
  if(!wrap)return;
  wrap.innerHTML=`<span class="spin">⟳</span>`;
  try{
    const hoje=new Date().toISOString().slice(0,10);
    const futuros=EVENTOS.filter(e=>e.data>=hoje&&e.destino!=="A confirmar");
    const passados=EVENTOS.filter(e=>e.data<hoje).reverse();
    if(!futuros.length&&!passados.length){wrap.innerHTML=`<div style="font-size:13px;color:#555">Nenhum evento.</div>`;return;}
    // Carrega todos os futuros em paralelo
    const snaps=await Promise.all(futuros.map(ev=>getDocs(query(collection(db,"presencas"),where("eventoId","==",ev.id)))));
    let html="";
    futuros.forEach((ev,i)=>{
      const pDocs=snaps[i].docs.map(d=>d.data());
      const nComp=pDocs.filter(p=>p.compareceu||p.resposta==="compareceu").length;
      const nConf=pDocs.filter(p=>!p.compareceu&&p.resposta!=="compareceu"&&(p.resposta==="sim"||p.resposta==="confirmado")).length;
      const nDes=pDocs.filter(p=>!p.compareceu&&p.resposta!=="compareceu"&&(p.resposta==="nao"||p.resposta==="desistiu")).length;
      const isFirst=i===0;
      html+=`<div style="border:1px solid var(--border);border-radius:10px;margin-bottom:8px;overflow:hidden">
        <button onclick="window.togglePresAcc(${ev.id})" style="width:100%;background:var(--bg2);border:none;padding:12px 14px;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:10px;text-align:left">
          <div style="flex:1;min-width:0">
            <div style="font-size:13px;font-weight:600;color:var(--white);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${ev.nome}</div>
            <div style="font-size:11px;color:var(--muted)">${fmtDate(ev.data)} · ${ev.destino}</div>
          </div>
          <div style="display:flex;gap:4px;align-items:center;flex-shrink:0">
            ${nComp?`<span style="background:rgba(76,175,125,.2);color:var(--green);border-radius:20px;padding:2px 7px;font-size:10px;font-weight:700">🟢${nComp}</span>`:""}
            ${nConf?`<span style="background:rgba(245,197,24,.15);color:#f5c518;border-radius:20px;padding:2px 7px;font-size:10px;font-weight:700">🟡${nConf}</span>`:""}
            ${nDes?`<span style="background:rgba(224,82,82,.1);color:var(--danger);border-radius:20px;padding:2px 7px;font-size:10px;font-weight:700">🔴${nDes}</span>`:""}
            <span id="pres-acc-ic-${ev.id}" style="color:var(--muted);font-size:12px;margin-left:2px">${isFirst?"▲":"▼"}</span>
          </div>
        </button>
        <div id="pres-acc-body-${ev.id}" style="display:${isFirst?"block":"none"};padding:12px 14px;border-top:1px solid var(--border);background:var(--bg3)">
          ${_htmlPresencaEvento(ev,pDocs)}
        </div>
      </div>`;
    });
    if(passados.length){
      const passadosSnaps=await Promise.all(passados.map(ev=>getDocs(query(collection(db,"presencas"),where("eventoId","==",ev.id)))));
      html+=`<div style="border-top:1px solid var(--border);margin:12px 0 8px"></div>
        <button onclick="window.togglePresAnteriores()" style="width:100%;background:transparent;border:none;color:var(--muted);font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;text-align:left;display:flex;justify-content:space-between;align-items:center;text-transform:uppercase;letter-spacing:.5px;padding:4px 0;margin-bottom:6px">
          <span>📋 EVENTOS ANTERIORES (${passados.length})</span><span id="pres-ant-ic">▼</span>
        </button>
        <div id="pres-ant-wrap" style="display:none">`;
      passados.forEach((ev,i)=>{
        const pDocs=passadosSnaps[i].docs.map(d=>d.data());
        const nComp=pDocs.filter(p=>p.compareceu||p.resposta==="compareceu").length;
        const nConf=pDocs.filter(p=>!p.compareceu&&p.resposta!=="compareceu"&&(p.resposta==="sim"||p.resposta==="confirmado")).length;
        const nDes=pDocs.filter(p=>!p.compareceu&&p.resposta!=="compareceu"&&(p.resposta==="nao"||p.resposta==="desistiu")).length;
        html+=`<div style="border:1px solid var(--border);border-radius:10px;margin-bottom:8px;overflow:hidden">
          <button onclick="window.abrirModalPresenca(${ev.id})" style="width:100%;background:var(--bg2);border:none;padding:12px 14px;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:10px;text-align:left">
            <div style="flex:1;min-width:0">
              <div style="font-size:13px;font-weight:600;color:var(--white);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${ev.nome}</div>
              <div style="font-size:11px;color:var(--muted)">${fmtDate(ev.data)} · ${ev.destino}</div>
            </div>
            <div style="display:flex;gap:4px;align-items:center;flex-shrink:0">
              ${nComp?`<span style="background:rgba(76,175,125,.2);color:var(--green);border-radius:20px;padding:2px 7px;font-size:10px;font-weight:700">🟢${nComp}</span>`:""}
              ${nConf?`<span style="background:rgba(245,197,24,.15);color:#f5c518;border-radius:20px;padding:2px 7px;font-size:10px;font-weight:700">🟡${nConf}</span>`:""}
              ${nDes?`<span style="background:rgba(224,82,82,.1);color:var(--danger);border-radius:20px;padding:2px 7px;font-size:10px;font-weight:700">🔴${nDes}</span>`:""}
              <span style="font-size:10px;color:#888;font-weight:700;background:var(--bg3);padding:2px 7px;border-radius:20px;border:1px solid var(--border)">✓ Realizado</span>
              <span style="color:var(--muted);font-size:12px;margin-left:2px">›</span>
            </div>
          </button>
        </div>`;
      });
      html+=`</div>`;
    }
    wrap.innerHTML=html;
  }catch(e){console.error(e);wrap.innerHTML=`<div style="font-size:12px;color:var(--danger)">Erro ao carregar.</div>`;}
}

window.confirmarTodosPresentes=async(eventoId)=>{
  const ev=EVENTOS.find(e=>e.id===eventoId);
  if(!confirm(`Confirmar presença de todos os confirmados em "${ev.nome}"?`))return;
  showToast("Confirmando...");
  const pSnap=await getDocs(query(collection(db,"presencas"),where("eventoId","==",eventoId)));
  const confirmados=pSnap.docs.map(d=>d.data()).filter(p=>!p.compareceu&&(p.resposta==="sim"||p.resposta==="confirmado"));
  for(const p of confirmados){
    await window.registrarComparecimento(p.membroId,p.apelido,eventoId);
  }
};
      
onAuthStateChanged(auth,async user=>{
  // Mostrar splash com logo
  const splashLogo=document.getElementById("splash-logo");
  const splashFb=document.getElementById("splash-logo-fb");
  const logoSalva=localStorage.getItem("mutantes_logo");
  if(splashLogo&&logoSalva){splashLogo.src=logoSalva;splashLogo.style.display="block";if(splashFb)splashFb.style.display="none";}

  CU=user;TA="home";TM="painel";CONF={};
  const esconderSplash=()=>{const s=document.getElementById("splash");if(s){s.classList.add("hide");setTimeout(()=>{s.style.display="none";},650);}};
  if(!user){UP=null;REGS=[];MEMBROS=[];render();setTimeout(esconderSplash,600);return;}
  document.getElementById("app").innerHTML=`<div class="loading"><span class="spin">⟳</span> Carregando...</div>`;
  try{
    // Fase 1: perfil + logo em paralelo
    MY_DOC_ID=localStorage.getItem("mutantes_docid")||user.uid;
    const [snap,logoSnap]=await Promise.all([
      getDoc(doc(db,"usuarios",MY_DOC_ID)),
      getDoc(doc(db,"config","logo"))
    ]);
    UP=snap.exists()?{uid:user.uid,...snap.data()}:{uid:user.uid,apelido:"Admin",isAdmin:true};
    if(!snap.exists())await setDoc(doc(db,"usuarios",MY_DOC_ID),{apelido:"Admin",email:user.email,isAdmin:true,totalKm:0});
    if(logoSnap.exists()){const url=logoSnap.data().url;localStorage.setItem("mutantes_logo",url);atualizarIconePWA(url);UP.logoUrl=url;}
    // Fase 2: todo o resto em paralelo
    const tarefas=[carregarRegistros(),carregarConfirmacoes(),carregarPedagiosCustom(),carregarEncontros()];
    if(UP.isAdmin||UP.isDiretor||UP.isBarman){tarefas.push(carregarMembros());}
    await Promise.all(tarefas);
    registrarTokenPush();
  }catch(e){console.error(e);}
  render();
  // Esconder splash
  setTimeout(esconderSplash,800);
  // Confete se bateu a meta recentemente (primeiro login do dia com meta>=100%)
  const km=UP.totalKm||0;
  if(km>=META){
    const key="meta_confete_"+new Date().toDateString();
    if(!localStorage.getItem(key)){localStorage.setItem(key,"1");setTimeout(dispararConfete,1200);}
  }
});
