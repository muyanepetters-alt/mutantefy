<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="theme-color" content="#ff6600"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="Mutantes MC"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<link rel="icon" type="image/png" href="logo.png"/>
<link id="apple-touch-icon" rel="apple-touch-icon" href="logo.png"/>
<link id="pwa-manifest" rel="manifest" href="manifest.json"/>
<title>MUTANTES MC ITAJAÍ — Km Tracker</title>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
<meta http-equiv="Pragma" content="no-cache"/>
<meta http-equiv="Expires" content="0"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0f0f0f;--bg2:rgba(0,0,0,.45);--bg3:rgba(0,0,0,.3);--border:rgba(255,255,255,.1);--orange:#ff6600;--orange-glow:rgba(255,102,0,.28);--white:#ffffff;--muted:rgba(255,255,255,.75);--danger:#e05252;--green:#4caf7d;--shadow-card:0 8px 32px rgba(0,0,0,.4),0 1px 0 rgba(255,255,255,.06);--transition:200ms ease}


body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--white);min-height:100vh;font-size:15px;line-height:1.5}
body::before{content:'';position:fixed;inset:0;background:url('mobile.png') center/cover no-repeat;z-index:-2;pointer-events:none}
body::after{content:'';position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:-1;pointer-events:none}
.app{max-width:480px;margin:0 auto;background:transparent;height:100vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 0 80px rgba(0,0,0,.8),0 0 0 1px rgba(255,255,255,.03)}

.desktop-grid{margin-bottom:20px}
/* ── LAYOUT DESKTOP ────────────────────────────────── */
@media(min-width:768px){
  body::before{background-image:url('desktop1.png')}

  .app{
    max-width:100%;height:100vh;
    display:grid;
    grid-template-columns:200px 1fr;
    grid-template-rows:72px 1fr;
    grid-template-areas:
      "sidebar header"
      "sidebar content";
    box-shadow:none;border-radius:0;
    overflow:hidden;
  }

  /* Header fica no topo direito — linha única horizontal */
  .header{
    grid-area:header;
    display:flex !important;
    align-items:center !important;
    flex-direction:row !important;
    gap:12px;
    padding:0 24px !important;
    height:72px;
    min-height:72px;
    max-height:72px;
    overflow:hidden;
    border:none !important;
    background:transparent !important;
    backdrop-filter:none !important;
    -webkit-backdrop-filter:none !important;
    box-shadow:none !important;
  }
  /* header-info: linha única — nome · subsede · clima num row */
  .header-info{
    display:flex !important;
    flex-direction:row !important;
    align-items:center !important;
    gap:8px;
    flex:1;
    min-width:0;
    overflow:hidden;
  }
  .header-info h2{font-size:14px !important;font-weight:700 !important;white-space:nowrap;flex-shrink:0;margin:0 !important;line-height:1 !important;}
  .header-info p{font-size:11px !important;color:var(--muted);white-space:nowrap;flex-shrink:0;margin:0 !important;line-height:1 !important;}
  #hdr-status{display:none !important;}
  #clima-widget{margin-top:0 !important;flex-shrink:0 !important;}
  /* header-right: km + Sair em linha */
  .header-right{
    display:flex !important;
    flex-direction:row !important;
    align-items:center !important;
    gap:10px;
    flex-shrink:0;
    margin-left:0 !important;
  }

  /* Sidebar esquerda */
  .bnav{
    grid-area:sidebar;
    flex-direction:column !important;
    height:100%;width:100%;
    border:none !important;
    padding:20px 10px 16px !important;
    overflow-y:auto;gap:2px !important;
    flex-shrink:0;
    justify-content:flex-start !important;
    align-items:stretch !important;
    background:transparent !important;
    backdrop-filter:none !important;
    -webkit-backdrop-filter:none !important;
    box-shadow:none !important;
  }
  .bnav-item{
    flex:none !important;min-height:46px;width:100%;
    flex-direction:row !important;justify-content:flex-start !important;
    gap:12px !important;padding:10px 16px !important;
    border-radius:12px !important;text-align:left;
    transition:background .18s,box-shadow .18s !important;
  }
  .bnav-item:hover{background:rgba(255,255,255,.06) !important}
  .bnav-item.nav-active{
    background:rgba(255,102,0,.14) !important;
    box-shadow:inset 0 0 0 1px rgba(255,102,0,.2),0 2px 12px rgba(255,102,0,.1) !important;
  }
  .bnav-icon{font-size:22px !important;width:26px;text-align:center;display:flex;align-items:center;justify-content:center;}
  .bnav-icon .lucide{width:22px !important;height:22px !important;}
  .bnav-label{font-size:14px !important;font-weight:500 !important;display:block !important}
  .bnav-item.nav-active .bnav-label{color:var(--orange) !important;font-weight:600 !important}
  .bnav-item.nav-active .bnav-icon .lucide{color:var(--orange) !important;stroke:var(--orange) !important}

  /* Logo do clube no topo da sidebar */
  .bnav-logo{
    display:block;
    padding:0 8px 14px;
    border-bottom:1px solid rgba(255,255,255,.07);
    margin-bottom:10px;width:100%;
    text-align:center;
  }
  .bnav-logo img{height:36px;object-fit:contain;}

  /* Conteúdo principal */
  .body{
    grid-area:content;
    flex:1;
    width:100%;
    padding:2rem !important;
    overflow-y:auto;
  }

  /* Cards em grid responsivo no painel */
  .desktop-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;margin-bottom:20px}
  .desktop-grid .card{margin-bottom:0}
}

/* ── LOGIN DESKTOP ─────────────────────────────────── */
@media(min-width:768px){
  .app:has(.login-wrap){
    display:flex;
    align-items:center;
    justify-content:center;
    background:transparent;
  }

  .login-wrap{
    width: 420px;
    min-width: 420px;
    background: rgba(0,0,0,.55);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 24px;
    padding: 44px;
    box-shadow: 0 24px 64px rgba(0,0,0,.6),0 0 0 1px rgba(255,102,0,.08);
  }

  .login-logo-img{max-width:220px}
}
.splash{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;transition:opacity .6s,transform .6s}
.splash.hide{opacity:0;transform:scale(1.05);pointer-events:none}
.splash-logo{width:160px;object-fit:contain;animation:splashPulse 1.5s ease-in-out infinite;filter:drop-shadow(0 0 20px rgba(255,102,0,.4))}
@keyframes splashPulse{0%,100%{box-shadow:0 0 20px rgba(232,103,10,.3)}50%{box-shadow:0 0 40px rgba(232,103,10,.7)}}
.splash-title{font-size:20px;font-weight:700;letter-spacing:2px;margin-top:20px;color:var(--white)}
.splash-sub{font-size:12px;color:var(--muted);margin-top:4px;letter-spacing:1px}
.splash-dots{display:flex;gap:6px;margin-top:24px}
.splash-dot{width:8px;height:8px;border-radius:50%;background:var(--orange);animation:splashDot 1.2s ease-in-out infinite}
.splash-dot:nth-child(2){animation-delay:.2s}
.splash-dot:nth-child(3){animation-delay:.4s}
@keyframes splashDot{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1.2)}}
.confete{position:fixed;inset:0;pointer-events:none;z-index:9998;overflow:hidden}
.confete-p{position:absolute;width:8px;height:8px;border-radius:2px;animation:confeteFall linear forwards}
@keyframes confeteFall{0%{top:-20px;opacity:1;transform:rotate(0deg)}100%{top:110vh;opacity:0;transform:rotate(720deg)}}
.header{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid rgba(255,102,0,.25);position:relative;overflow:hidden;background:rgba(0,0,0,.35);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);flex-shrink:0}
.header-flames{position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent 0%,rgba(255,102,0,.6) 20%,#ff6600 40%,#ff8c2a 60%,rgba(255,102,0,.6) 80%,transparent 100%)}
.header-info h2{font-size:16px;font-weight:700}
.header-info p{font-size:12px;color:var(--muted);margin-top:2px}
.header-right{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.body{padding:16px;padding-top:20px;flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.body>.card,.body>.desktop-grid{margin-bottom:16px}
.bnav{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;background:rgba(0,0,0,.45);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid rgba(255,255,255,.06);border-bottom:1px solid var(--border);flex-shrink:0;padding:6px 8px;gap:4px}
.bnav::-webkit-scrollbar{display:none}
@media(max-width:767px){.bnav-logo{display:none}}
.bnav-item{flex:0 0 auto;min-width:64px;scroll-snap-align:start;min-height:48px;padding:6px 2px 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;border:none;background:transparent;font-family:inherit;position:relative;-webkit-tap-highlight-color:transparent;border-radius:10px;transition:background .18s,box-shadow .18s}
.bnav-icon{font-size:18px;line-height:1;transition:transform .15s;display:flex;align-items:center;justify-content:center;}
.bnav-label{font-size:9px;color:var(--muted);font-weight:500;letter-spacing:.1px;white-space:nowrap}
.bnav-item.nav-active .bnav-label{color:var(--orange);font-weight:700}
.bnav-item.nav-active .bnav-icon{transform:scale(1.1)}
.bnav-item:active .bnav-icon{transform:scale(.85)}
.lucide{color:var(--orange);stroke:var(--orange)}
.bnav-icon .lucide{color:var(--muted);stroke:var(--muted)}
.bnav-item.nav-active .bnav-icon .lucide{color:var(--orange);stroke:var(--orange)}
.bnav-item.nav-active{background:rgba(255,102,0,.14);box-shadow:inset 0 0 0 1px rgba(255,102,0,.2)}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:20px;padding:20px;margin-bottom:16px;box-shadow:var(--shadow-card);transition:border-color .2s,box-shadow .2s;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);overflow:hidden;word-break:break-word;overflow-wrap:anywhere}
.prog-bar{height:6px;border-radius:3px;background:var(--bg3);overflow:hidden;margin:8px 0 4px}
.prog-fill{height:100%;border-radius:3px;transition:width 1s cubic-bezier(.4,0,.2,1)}
.prog-labels{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.metric{background:var(--bg3);border-radius:14px;padding:14px;border:1px solid var(--border);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.metric-label{font-size:10px;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.4px}
.metric-value{font-size:30px;font-weight:700}
.sec-title{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:14px}
.ev-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
.ev-row:last-child{border-bottom:none}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.3px}
.badge-sm{background:rgba(232,103,10,.15);color:var(--orange);border:1px solid rgba(232,103,10,.3)}
.badge-gr{background:rgba(76,175,125,.1);color:var(--green);border:1px solid rgba(76,175,125,.2)}
.badge-admin{background:rgba(232,103,10,.2);color:var(--orange);border:1px solid var(--orange);font-size:9px}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;margin-top:12px;text-transform:uppercase;letter-spacing:.4px;font-weight:600}
input,select{width:100%;padding:13px 14px;border:1px solid var(--border);border-radius:14px;font-size:15px;font-family:inherit;color:var(--white);background:var(--bg3);margin-bottom:14px;transition:border-color .2s,box-shadow .2s}
input:focus,select:focus{outline:none;border-color:var(--orange);box-shadow:0 0 0 3px rgba(255,102,0,.16)}
input::placeholder{color:#444}
select option{background:#161616;color:var(--white)}
.btn{padding:9px 16px;min-height:44px;border-radius:50px;border:1px solid var(--border);background:var(--bg3);cursor:pointer;font-size:13px;font-family:inherit;color:var(--white);transition:border-color var(--transition),background var(--transition)}
.btn-primary{width:100%;padding:14px;min-height:44px;border-radius:50px;border:none;background:linear-gradient(135deg,#ff6600,#ff8c2a);color:#fff;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;box-shadow:0 4px 18px rgba(255,102,0,.36);transition:transform var(--transition),box-shadow var(--transition)}
.btn-orange-glow{transition:box-shadow .2s,transform .1s}
.btn-orange-glow:hover,.btn-orange-glow:focus{box-shadow:0 0 12px rgba(255,102,0,.5);outline:none}
.btn-orange-glow:active{transform:scale(.97)}
@keyframes progGrow{from{width:0%}to{width:var(--prog-target)}}
.prog-fill-anim{animation:progGrow 1.5s cubic-bezier(.22,1,.36,1) forwards}
.btn-primary:disabled{opacity:.4;cursor:not-allowed}
.btn-outline{width:100%;padding:11px;min-height:44px;border-radius:50px;border:1px solid var(--border);background:transparent;color:var(--white);font-size:13px;cursor:pointer;font-family:inherit;transition:border-color var(--transition),background var(--transition)}
.btn-danger{padding:6px 10px;border-radius:6px;border:1px solid rgba(224,82,82,.3);background:transparent;color:var(--danger);font-size:11px;cursor:pointer;font-family:inherit}
.btn-edit{padding:6px 10px;border-radius:6px;border:1px solid rgba(232,103,10,.3);background:transparent;color:var(--orange);font-size:11px;cursor:pointer;font-family:inherit}
.ev-card{background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:14px;margin-bottom:10px;cursor:pointer;transition:border-color .18s;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.ev-card.ev-sim,.ev-card.ev-confirmado{border-color:var(--green);background:rgba(76,175,125,.05)}
.ev-card.ev-nao,.ev-card.ev-desistiu{border-color:var(--danger);background:rgba(224,82,82,.05)}
.ev-card.ev-compareceu{border-color:#2d6e4f;background:rgba(76,175,125,.1)}
.pres-compareceu{background:rgba(76,175,125,.2);border:1px solid rgba(76,175,125,.5);color:var(--green)}
.pres-desistiu{background:rgba(224,82,82,.1);border:1px solid rgba(224,82,82,.3);color:var(--danger)}
.pres-pendente{background:var(--bg3);border:1px solid var(--border);color:var(--muted)}
.pres-confirmado{background:rgba(76,175,125,.1);border:1px solid rgba(76,175,125,.3);color:var(--green)}
.hist-card{background:var(--bg2);border:1px solid var(--border);border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow-card);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.km-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;background:var(--bg3);border-radius:8px;padding:10px 12px;border:1px solid var(--border)}
.edit-box{background:var(--bg3);border-radius:8px;padding:12px;margin-bottom:10px;border:1px solid rgba(232,103,10,.3);display:none}
.det-box{display:none;margin-top:10px;background:var(--bg3);border-radius:8px;padding:12px;border:1px solid var(--border)}
.ev-det{display:none;margin-top:12px}
.user-card{background:var(--bg3);border:1px solid var(--border);border-radius:16px;padding:14px;margin-bottom:10px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.rota-result{background:var(--bg3);border-radius:14px;padding:14px;border:1px solid var(--border);margin-bottom:12px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.rota-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.rota-item small{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;display:block;margin-bottom:2px}
.rota-item span{font-size:14px;font-weight:600}
.alert-warn{font-size:11px;padding:8px 10px;border-radius:6px;color:var(--orange);background:rgba(232,103,10,.1);border:1px solid rgba(232,103,10,.2)}
.alert-ok{font-size:11px;padding:8px 10px;border-radius:6px;color:var(--green);background:rgba(76,175,125,.1);border:1px solid rgba(76,175,125,.2)}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(10px);background:rgba(22,22,22,.96);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);color:#fff;padding:12px 20px 14px;border-radius:16px;font-size:13px;font-weight:600;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;z-index:999;min-width:200px;max-width:320px;box-shadow:0 8px 32px rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.1)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err{border-color:rgba(224,82,82,.4)}
.toast-bar{height:3px;border-radius:2px;margin-top:8px;width:100%;animation:toastBar 2.5s linear forwards}
@keyframes toastBar{from{width:100%}to{width:0%}}
.sub-pills{display:flex;gap:6px;overflow-x:auto;margin-bottom:16px;padding-bottom:4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.sub-pills::-webkit-scrollbar{display:none}
.sub-pill{flex-shrink:0;padding:7px 14px;border-radius:20px;border:1px solid var(--border);background:var(--bg3);font-size:12px;font-weight:500;color:var(--muted);cursor:pointer;font-family:inherit;white-space:nowrap;transition:border-color var(--transition),color var(--transition)}
.sub-pill.active{background:linear-gradient(135deg,#ff6600,#ff8c2a);border-color:transparent;color:#fff;font-weight:600}
.msg-err{font-size:12px;color:var(--danger);margin-bottom:10px;padding:8px 12px;background:rgba(224,82,82,.1);border-radius:8px}
.senha-wrap{position:relative;margin-bottom:14px}
.senha-wrap input{margin-bottom:0;padding-right:44px}
.senha-olho{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:17px;padding:0;line-height:1;color:var(--muted);user-select:none;-webkit-user-select:none}
.msg-ok{font-size:12px;color:var(--green);margin-bottom:10px;padding:8px 12px;background:rgba(76,175,125,.1);border-radius:8px}
.hint-box{font-size:12px;color:var(--muted);margin-bottom:14px;padding:10px 14px;background:var(--bg3);border-radius:12px;border-left:3px solid var(--orange)}
.app-modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:8000;display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:fadeInOv .2s ease}
@keyframes fadeInOv{from{opacity:0}to{opacity:1}}
.app-modal-sheet{background:#111;border:1px solid rgba(255,255,255,.09);border-radius:24px 24px 0 0;width:100%;max-width:480px;max-height:92vh;overflow-y:auto;padding:20px 20px 32px;animation:slideUp .22s cubic-bezier(.34,1.2,.64,1)}
@keyframes slideUp{from{transform:translateY(60px) scale(0.95);opacity:0}to{transform:translateY(0) scale(1);opacity:1}}
@keyframes fadeInScale{from{transform:scale(0.88);opacity:0}to{transform:scale(1);opacity:1}}
.reaction-btn{background:var(--bg3);border:1px solid var(--border);border-radius:20px;padding:4px 10px;font-size:14px;cursor:pointer;font-family:inherit;color:var(--white);transition:border-color .15s,background .15s;display:inline-flex;align-items:center;gap:4px}
.reaction-btn.active{border-color:var(--orange);background:rgba(255,102,0,.12);color:var(--orange)}
.spin{display:inline-block;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes loginFadeIn{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
.login-logo-img{display:block;margin:0 auto 28px;max-width:180px;width:100%;height:auto;object-fit:contain;filter:drop-shadow(0 0 20px rgba(255,102,0,.4));animation:loginFadeIn .8s ease forwards}
.login-wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px;position:relative;overflow:hidden}
.login-wrap::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 30%,rgba(232,103,10,.12) 0%,transparent 70%);pointer-events:none}
.login-wrap::after{content:"";position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:repeating-linear-gradient(45deg,rgba(232,103,10,.02) 0px,rgba(232,103,10,.02) 1px,transparent 1px,transparent 40px);pointer-events:none}
.loading{padding:40px;text-align:center;color:var(--muted);font-size:14px}
.falta-txt{font-size:10px;color:var(--muted);margin-bottom:5px}
.hide-scroll{scrollbar-width:none;-ms-overflow-style:none}.hide-scroll::-webkit-scrollbar{display:none}

<script>
(function(){
  if(!/Mobi/i.test(navigator.userAgent))return;
  if(localStorage.getItem("pwa_install_dismissed"))return;
  let _deferredPrompt=null;
  const _showBanner=()=>{
    const banner=document.getElementById("pwa-install-banner");
    if(!banner)return;
    const logo=localStorage.getItem("mutantes_logo");
    const img=document.getElementById("pwa-banner-logo");
    if(img&&logo)img.src=logo;
    banner.style.display="block";
  };
  window.addEventListener("beforeinstallprompt",e=>{
    e.preventDefault();
    _deferredPrompt=e;
    _showBanner();
  });
  window.addEventListener("appinstalled",()=>{
    const banner=document.getElementById("pwa-install-banner");
    if(banner)banner.style.display="none";
    localStorage.setItem("pwa_install_dismissed","1");
    _deferredPrompt=null;
  });
  window._pwaBannerInstall=async function(){
    if(!_deferredPrompt)return;
    _deferredPrompt.prompt();
    await _deferredPrompt.userChoice;
    _deferredPrompt=null;
    localStorage.setItem("pwa_install_dismissed","1");
    const banner=document.getElementById("pwa-install-banner");
    if(banner)banner.style.display="none";
  };
  window._pwaBannerClose=function(){
    const banner=document.getElementById("pwa-install-banner");
    if(banner)banner.style.display="none";
    localStorage.setItem("pwa_install_dismissed","1");
  };
})();
</script>

<script>
(function(){
  if(!('serviceWorker' in navigator))return;
  var hadCtrl=!!navigator.serviceWorker.controller;
  function mostrarBannerAtualizacao(){
    if(document.getElementById('sw-update-banner'))return;
    var b=document.createElement('div');
    b.id='sw-update-banner';
    b.style.cssText='position:fixed;top:0;left:0;right:0;z-index:99999;background:#ff6600;color:#fff;text-align:center;padding:14px 16px;font-size:14px;font-weight:700;cursor:pointer;box-shadow:0 2px 16px rgba(0,0,0,.5);-webkit-tap-highlight-color:transparent';
    b.textContent='🔄 Nova versão disponível! Toque para atualizar';
    b.onclick=function(){window.location.reload();};
    document.body.appendChild(b);
  }
  navigator.serviceWorker.addEventListener('controllerchange',function(){
    if(hadCtrl)mostrarBannerAtualizacao();
    hadCtrl=true;
  });
  var swPath=location.pathname.replace(/\/[^/]*$/,'/')+'firebase-messaging-sw.js';
  navigator.serviceWorker.register(swPath).then(function(reg){
    reg.update();
    reg.addEventListener('updatefound',function(){
      var nw=reg.installing;
      if(!nw)return;
      nw.addEventListener('statechange',function(){
        if(nw.state==='installed'&&navigator.serviceWorker.controller)mostrarBannerAtualizacao();
      });
    });
  }).catch(function(){});
})();
</script>

function precoPorEstado(estado){
  const pSC=PRECOS_GAS["SC"]||6.20;
  const pDest=PRECOS_GAS[estado]||pSC;
  return(pSC+pDest)/2;
}

function calcRota(distIda,auto,tanque,estado,pedIda,gasManual){
  const gas=gasManual||precoPorEstado(estado||"SC");
  const dt=distIda*2,lit=dt/auto,comb=lit*gas;
  const ped=pedIda!=null?pedIda*2:0;
  const alcance=tanque*auto,precisa=distIda>alcance;
  const paradas=precisa?Math.ceil((dt-alcance)/alcance):0;
  return{dt,lit,comb,ped,total:comb+ped,precisa,paradas,gas,pedReal:pedIda!=null};
}

// ── CROPPER DE FOTO (Cropper.js) ─────────────────────────────────────
function abrirCropper(file, onCrop){
  const reader=new FileReader();
  reader.onload=e=>{
    const modal=document.createElement("div");
    modal.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;gap:14px";
    modal.innerHTML=`
      <div style="font-size:14px;font-weight:700;color:#fff">✂️ Ajuste a foto</div>
      <div style="width:min(85vw,320px);height:min(85vw,320px);background:#111">
        <img id="cropperjs-img" src="${e.target.result}" style="max-width:100%;display:block"/>
      </div>
      <div style="font-size:11px;color:#666">Pinça para zoom · Arraste para reposicionar</div>
      <div style="display:flex;gap:10px">
        <button id="crop-cancel" style="padding:12px 24px;border-radius:12px;border:1px solid #444;background:transparent;color:#aaa;font-size:14px;cursor:pointer;font-family:inherit">Cancelar</button>
        <button id="crop-ok" style="padding:12px 28px;border-radius:12px;border:none;background:var(--orange);color:#fff;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit">✓ Usar foto</button>
      </div>`;
    document.body.appendChild(modal);
    const img=document.getElementById("cropperjs-img");
    const cropper=new Cropper(img,{
      aspectRatio:1,viewMode:1,dragMode:"move",
      autoCropArea:1,restore:false,guides:false,
      center:false,highlight:false,cropBoxMovable:false,
      cropBoxResizable:false,toggleDragModeOnDblclick:false,
      background:false,
    });
    document.getElementById("crop-cancel").onclick=()=>{cropper.destroy();modal.remove();};
    document.getElementById("crop-ok").onclick=()=>{
      const canvas=cropper.getCroppedCanvas({width:400,height:400,imageSmoothingQuality:"high"});
      canvas.toBlob(blob=>{
        cropper.destroy();modal.remove();
        onCrop(new File([blob],"foto.jpg",{type:"image/jpeg"}));
      },"image/jpeg",0.92);
    };
  };
  reader.readAsDataURL(file);
}

async function uploadFoto(file){
  const fd=new FormData();
  fd.append("file",file);fd.append("upload_preset",PRESET);fd.append("folder","mutantes-mc");
  const r=await fetch("https://api.cloudinary.com/v1_1/"+CLOUD+"/image/upload",{method:"POST",body:fd});
  const d=await r.json();
  if(!d.secure_url)throw new Error("Falha no upload");
  return d.secure_url;
}

async function uploadFotoComCrop(file, onDone){

      await onDone(url);
    }catch(e){console.error("uploadFotoComCrop: ERRO",e);showToast("Erro ao enviar foto: "+e.message,true);}
  });
}

function atualizarIconePWA(url){
  if(!url)return;
  document.getElementById("apple-touch-icon").href=url;
  const origin=window.location.origin+window.location.pathname.replace(/\/[^/]*$/,"/");
  const manifest={name:"Mutantes MC Itajaí",short_name:"Mutantes MC",start_url:origin,display:"standalone",background_color:"#0f0f0f",theme_color:"#ff6600",icons:[{src:url,sizes:"192x192",type:"image/png",purpose:"any maskable"},{src:url,sizes:"512x512",type:"image/png"}]};
  const blob=new Blob([JSON.stringify(manifest)],{type:"application/json"});
  const old=document.getElementById("pwa-manifest");
  if(old._blobUrl)URL.revokeObjectURL(old._blobUrl);
  const blobUrl=URL.createObjectURL(blob);
  old._blobUrl=blobUrl;
  old.href=blobUrl;
}

  return`<div>
    <div style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px">📅 PRÓXIMOS EVENTOS (${proximos.length})</div>

function _sedeCount(m){return SEDE_COUNTS[m.authUid]||SEDE_COUNTS[m.uid]||0;}
function _sedeCountEv(m){return SEDE_COUNTS_EV[m.authUid]||SEDE_COUNTS_EV[m.uid]||0;}
function _sedeCountLimp(m){return SEDE_COUNTS_LIMP[m.authUid]||SEDE_COUNTS_LIMP[m.uid]||0;}
function _maxSedeCount(){return Math.max(0,...MEMBROS.map(_sedeCount));}
function contarSextasDoAno(ano){
  let total=0;
  for(let mm=0;mm<12;mm++){const dias=new Date(ano,mm+1,0).getDate();for(let dd=1;dd<=dias;dd++){if(new Date(ano,mm,dd).getDay()===5)total++;}}
  return total;
}
function sextaAtual(ano){
  const hoje=new Date();hoje.setHours(23,59,59,999);let total=0;
  for(let mm=0;mm<12;mm++){const dias=new Date(ano,mm+1,0).getDate();for(let dd=1;dd<=dias;dd++){const d=new Date(ano,mm,dd);if(d>hoje)return total;if(d.getDay()===5)total++;}}
  return total;
}

      <div style="font-size:11px;color:var(--muted);margin-top:8px;line-height:1.5">Inicia uma nova temporada: arquiva todos os registros de km, zera o km de todos os membros e atualiza o ano ativo. Essa ação é irreversível.</div>

window.novaTemporada=async()=>{
  if(!UP?.isAdmin)return;
  const novoAnoStr=prompt(`Ano da nova temporada (atual: ${ANO_ATIVO}):`);
  const novoAno=parseInt(novoAnoStr);
  if(!novoAno||novoAno<=ANO_ATIVO){showToast("Ano inválido.",true);return;}
  if(!confirm(`⚠️ Iniciar temporada ${novoAno}?\n\nIsso irá:\n• Arquivar todos os registros de km\n• Zerar o km de todos os membros\n• Atualizar o ano ativo para ${novoAno}\n\nEssa ação não pode ser desfeita.`))return;
  const confirmText=prompt("Para confirmar, digite CONFIRMAR:");
  if(confirmText!=="CONFIRMAR"){showToast("Operação cancelada.",true);return;}
  try{
    showToast("Arquivando temporada...");
    const anoAnterior=ANO_ATIVO;
    const snap=await getDocs(collection(db,"registros"));
    for(const d of snap.docs){
      await setDoc(doc(db,"registros_arquivo",String(anoAnterior),"registros",d.id),d.data());
      await deleteDoc(doc(db,"registros",d.id));
    }
    for(const m of MEMBROS){
      const docId=resolveDocId(m.uid)||m.uid;
      await setDoc(doc(db,"usuarios",docId),{totalKm:0},{merge:true});
      m.totalKm=0;
    }
    if(UP)UP.totalKm=0;
    REGS=[];
    ANO_ATIVO=novoAno;
    await setDoc(doc(db,"config","temporada"),{anoAtivo:novoAno,atualizadoEm:serverTimestamp(),atualizadoPor:UP.apelido},{merge:true});
    registrarLog("nova_temporada",`iniciou temporada ${novoAno}`,`anterior: ${anoAnterior}`);
    showToast(`✓ Temporada ${novoAno} iniciada!`);
    render();
  }catch(e){showToast("Erro: "+e.message,true);}
};

function proxQuarta(){
  const hoje=new Date();
  const dia=hoje.getDay();
  const diff=dia<=3?3-dia:7-(dia-3);
  const q=new Date(hoje);
  q.setDate(hoje.getDate()+(diff===0&&dia===3?0:diff===0?7:diff));
  if(dia===3)q.setDate(hoje.getDate());
  return q.toISOString().slice(0,10);
}

}

function proxSexta(){
  const hoje=new Date();
  const dia=hoje.getDay();// 0=dom,5=sex
  const diff=dia<=5?5-dia:6+5-dia+1;
  const sx=new Date(hoje);
  sx.setDate(hoje.getDate()+(diff===0&&dia===5?0:diff===0?7:diff));
  // Se hoje é sexta, usa hoje
  if(dia===5)sx.setDate(hoje.getDate());
  return sx.toISOString().slice(0,10);
}

    const [snapBar,snapChur]=await Promise.all([
      getDocs(query(collection(db,"escala_bar"),where("data","==",proxSexta()))),

        </div>`:""}

window.lancarLimpezaMassa=async(data)=>{

function meuSedeCount(){
  return Object.entries(CONF_SEDE).filter(([k,v])=>k.startsWith("presenca_")&&v==="sim").length;

async function carregarSedePresencas(){
  try{
    const snap=await getDocs(query(collection(db,"sede_confirmacoes"),where("resposta","==","sim")));
    SEDE_COUNTS={};SEDE_COUNTS_EV={};SEDE_COUNTS_LIMP={};
    snap.docs.forEach(d=>{
      const r=d.data();const tp=r.tipo||"presenca";const id=r.membroId;if(!id)return;
      if(tp==="presenca"||tp==="sede"){SEDE_COUNTS[id]=(SEDE_COUNTS[id]||0)+1;}
      else if(tp==="evento_sede"){SEDE_COUNTS_EV[id]=(SEDE_COUNTS_EV[id]||0)+1;}
      else if(tp==="limpeza"){SEDE_COUNTS_LIMP[id]=(SEDE_COUNTS_LIMP[id]||0)+1;}
    });
    const evSnap=await getDocs(collection(db,"eventos_sede"));
    const anoStr=String(ANO_ATIVO);
    TOTAL_EVENTOS_SEDE=evSnap.docs.filter(d=>{const ev=d.data();return(ev.data||'').startsWith(anoStr)&&ev.categoria!=='viagem'&&ev.categoria!=='limpeza';}).length;
    TOTAL_LIMPEZAS=evSnap.docs.filter(d=>{const ev=d.data();return(ev.data||'').startsWith(anoStr)&&ev.categoria==='limpeza';}).length;
    window._sedeCountsLoaded=true;
  }catch(e){console.error("carregarSedePresencas:",e);window._sedeCountsLoaded=false;}
}
async function carregarEscalaLista(){
  try{
    const canEdit=UP&&(UP.isAdmin||UP.isBarman||UP.isDiretor);
    const abaBar=window._barAba||"bar";
    const col=abaBar==="churrasco"?"escala_churrasco":"escala_bar";
    const snap=await getDocs(query(collection(db,col),orderBy("data","asc")));
    const el=document.getElementById("escala-lista");
    if(!el)return;
    const hoje=new Date().toISOString().slice(0,10);
    const docs=snap.docs.map(d=>({id:d.id,...d.data()})).filter(e=>e.data>=hoje);
    el.innerHTML=docs.length===0?`<span style="font-size:12px;color:#555">Nenhuma escala cadastrada.</span>`:
      docs.map(e=>{
        const nomes=abaBar==="churrasco"
          ?[e.m1,e.m2,e.m3,e.m4,e.m5].filter(Boolean).join(" · ")
          :`${e.m1} & ${e.m2}`;
        return`<div style="display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--border)">
          <div style="flex:1">
            <div style="font-size:13px;font-weight:600">${fmtDate(e.data)}</div>
            <div style="font-size:12px;color:${abaBar==="churrasco"?"var(--green)":"var(--orange)"}">
              ${abaBar==="churrasco"?"🔥":"🍺"} ${nomes}
            </div>
            ${e.obs?`<div style="font-size:11px;color:var(--muted)">📝 ${e.obs}</div>`:""}
          </div>
          ${canEdit?`<button onclick="window.excluirEscala('${e.id}','${col}')" class="btn-danger">✕</button>`:""}
        </div>`;
      }).join("");
  }catch(e){console.error(e);}
}

window.setSubMsg=(aba)=>{
  window._socialAba=aba;
  ["atividades","mural","galeria","votacoes","aniversarios"].forEach(a=>{
    const btn=document.getElementById("sub-"+a);
    const el=document.getElementById("sub-msg-"+a);
    const active=a===aba;
    if(btn){btn.style.background=active?"#ff6600":"transparent";btn.style.color=active?"#fff":"rgba(255,255,255,.5)";btn.style.border=active?"none":"1px solid rgba(255,255,255,.1)";}
    if(el){
      el.style.display=active?"block":"none";
      if(active&&a==="atividades")setTimeout(carregarAtividades,50);
      if(active&&a==="mural"){el.innerHTML=htmlMural();setTimeout(carregarMural,50);}
      if(active&&a==="galeria"){el.innerHTML=htmlGaleria();setTimeout(carregarGaleria,50);}
      if(active&&a==="votacoes"){el.innerHTML=htmlVotacoesTab();setTimeout(carregarPainelResumo,50);}
      if(active&&a==="aniversarios")el.innerHTML=htmlAniversarios();
    }
  });
};

// CLIMA (Open-Meteo + Geolocation)
// ═══════════════════════════════════════════════════
async function _fetchClimaCoords(lat,lon,cidade){
  const meteo=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code&timezone=auto`).then(r=>r.json());
  console.log("[Clima] Open-Meteo resposta:", meteo.current);
  _CLIMA={temp:Math.round(meteo.current.temperature_2m),code:meteo.current.weather_code,cidade,lat,lon};
  console.log("[Clima] Estado final:", _CLIMA);
  _CLIMA_LOADING=false;
  render();
}
function initClima(){
  if(_CLIMA_LOADING)return;
  _CLIMA_LOADING=true;
  console.log("[Clima] Iniciando — geolocation disponível:", !!navigator.geolocation);
  const fallbackItajai=()=>{
    console.warn("[Clima] Usando fallback Itajaí, SC");
    _fetchClimaCoords(-26.9078,-48.6619,"Itajaí, SC").catch(e=>{console.error("[Clima] Fallback falhou:",e);_CLIMA_LOADING=false;});
  };
  if(!navigator.geolocation){fallbackItajai();return;}
  navigator.geolocation.getCurrentPosition(
    async pos=>{
      try{
        const {latitude:lat,longitude:lon}=pos.coords;
        console.log("[Clima] Localização obtida:", lat, lon);
        const geo=await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&format=json`).then(r=>r.json());
        console.log("[Clima] Geocode:", geo?.address);
        const cidade=geo?.address?.city||geo?.address?.town||geo?.address?.municipality||"Itajaí";
        const _sc=geo?.address?.state_code||"";const _st=geo?.address?.state||"";const _ufMap={"Santa Catarina":"SC","Rio Grande do Sul":"RS","Paraná":"PR","São Paulo":"SP","Rio de Janeiro":"RJ","Minas Gerais":"MG","Bahia":"BA","Pernambuco":"PE","Ceará":"CE","Goiás":"GO","Maranhão":"MA","Pará":"PA","Mato Grosso":"MT","Mato Grosso do Sul":"MS","Rio Grande do Norte":"RN","Paraíba":"PB","Alagoas":"AL","Piauí":"PI","Espírito Santo":"ES","Rondônia":"RO","Tocantins":"TO","Amapá":"AP","Roraima":"RR","Amazonas":"AM","Acre":"AC","Sergipe":"SE","Distrito Federal":"DF"};const uf=_sc.includes("-")?_sc.split("-").pop().toUpperCase().slice(0,2):_sc?_sc.slice(0,2).toUpperCase():(_ufMap[_st]||_st.slice(0,2).toUpperCase()||"SC");
        await _fetchClimaCoords(lat,lon,cidade+", "+uf);
      }catch(e){
        console.error("[Clima] Erro na geolocation flow:", e);
        fallbackItajai();
      }
    },
    e=>{console.warn("[Clima] Geolocation negado/timeout:", e.code, e.message);fallbackItajai();},
    {timeout:6000,maximumAge:300000,enableHighAccuracy:false}
  );
}

async function _carregarDadosClima(cidade){
  const el=document.getElementById("clima-dados");
  if(!el)return;
  el.innerHTML=`<div style="display:flex;align-items:center;justify-content:center;height:120px;font-size:14px;color:var(--muted)">Carregando...</div>`;
  try{
    let lat=cidade.lat,lon=cidade.lon;
    if(lat===null||lat===undefined){
      const geo=await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(cidade.nome.split(" - ")[0])}&count=1&language=pt`).then(r=>r.json());
      const res=geo?.results?.[0];
      if(!res){el.innerHTML=`<div style="color:#f55;font-size:14px;text-align:center;padding:20px">Cidade não encontrada.</div>`;return;}
      lat=res.latitude;lon=res.longitude;cidade.lat=lat;cidade.lon=lon;
    }
    const meteo=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min,weather_code&timezone=auto&forecast_days=8`).then(r=>r.json());
    const cur=meteo.current;const dias=meteo.daily;
    const diasNm=["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];
    el.innerHTML=`
      <div style="text-align:center;padding:14px 0 18px">
        <div style="font-size:52px;line-height:1">${WMO_EMOJI(cur.weather_code)}</div>
        <div style="font-size:42px;font-weight:800;color:var(--orange);margin-top:6px">${Math.round(cur.temperature_2m)}°C</div>
        <div style="font-size:14px;color:var(--muted);margin-top:6px">${WMO_DESC(cur.weather_code)} · ${cidade.nome}</div>
      </div>
      <div class="clima-forecast">
        ${dias.time.slice(0,7).map((d,i)=>{
          const dt=new Date(d+"T12:00:00");
          const dNome=i===0?"Hoje":i===1?"Amanhã":diasNm[dt.getDay()];
          return`<div class="clima-card-dia">
            <span style="font-size:24px;flex-shrink:0">${WMO_EMOJI(dias.weather_code[i])}</span>
            <div style="flex:1;min-width:0">
              <div style="font-size:14px;font-weight:600">${dNome}</div>
              <div style="font-size:12px;color:var(--muted)">${d.slice(8,10)}/${d.slice(5,7)}</div>
            </div>
            <div style="flex-shrink:0;text-align:right">
              <span style="font-size:16px;font-weight:700;color:var(--orange)">${Math.round(dias.temperature_2m_max[i])}°</span>
              <span style="font-size:14px;color:var(--muted);margin-left:5px">${Math.round(dias.temperature_2m_min[i])}°</span>
            </div>
          </div>`;
        }).join("")}
      </div>`;
  }catch(e){console.error("[Clima] _carregarDadosClima erro:",e);el.innerHTML=`<div style="color:#f55;font-size:14px;text-align:center;padding:20px">Erro ao carregar. Verifique a conexão.</div>`;}
}

  _climaSearchTimer=setTimeout(async()=>{
    try{
      const res=await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(val)}&count=5&language=pt`).then(r=>r.json());

window._climaFromSearch=async(lat,lon,nome)=>{
  const el=document.getElementById("clima-search-results");
  const inp=document.getElementById("clima-search-inp");
  if(el)el.style.display="none";if(inp)inp.value="";
  if(!window._climaCidades)return;
  const exists=window._climaCidades.findIndex(c=>Math.abs((c.lat||0)-lat)<0.01&&Math.abs((c.lon||0)-lon)<0.01);
  if(exists<0)window._climaCidades.push({nome,lat,lon});
  window._climaAtual=exists>=0?exists:window._climaCidades.length-1;
  _renderClimaCidadesBar();
  await _carregarDadosClima(window._climaCidades[window._climaAtual]);
};

window.postarMural=async()=>{
  const input=document.getElementById("mural-msg");
  const msg=input?.value.trim();
  if(!msg)return;
  try{
    await addDoc(collection(db,"mural"),{msg,autor:UP.apelido,autorId:CU.uid,fotoUrl:UP.fotoUrl||"",criadoEm:serverTimestamp()});
    registrarFeed(CU.uid,UP.apelido,"mural",`${UP.apelido} postou uma mensagem`);
    input.value="";carregarMural();
  }catch{showToast("Erro ao postar.",true);}
};

window.excluirMural=async(id)=>{
  try{await deleteDoc(doc(db,"mural",id));carregarMural();}catch{showToast("Erro.",true);}
};

window.reagirMural=async(docId,emoji)=>{
  if(!CU)return;
  try{
    const ref=doc(db,"mural",docId);
    const snap=await getDoc(ref);
    const reacoes=(snap.data()?.reacoes)||[];
    const jaIdx=reacoes.findIndex(rx=>rx.membroId===CU.uid&&rx.emoji===emoji);
    if(jaIdx>=0){
      await updateDoc(ref,{reacoes:arrayRemove(reacoes[jaIdx])});
    }else{
      await updateDoc(ref,{reacoes:arrayUnion({membroId:CU.uid,emoji})});
    }
    carregarMural();
  }catch{showToast("Erro.",true);}
};


window.abrirResposta=(id)=>{
  const form=document.getElementById("reply-form-"+id);
  if(form){form.style.display="block";const ta=document.getElementById("reply-ta-"+id);if(ta)ta.focus();}
};
window.cancelarResposta=(id)=>{
  const form=document.getElementById("reply-form-"+id);
  if(form)form.style.display="none";
  const ta=document.getElementById("reply-ta-"+id);if(ta)ta.value="";
};
window.toggleRespostas=(id)=>{
  const el=document.getElementById("replies-"+id);
  if(!el)return;
  el.style.display=el.style.display==="none"?"block":"none";
};
window.inserirEmojiResposta=(id,emoji)=>{
  const ta=document.getElementById("reply-ta-"+id);
  if(!ta)return;
  const s=ta.selectionStart,e=ta.selectionEnd;
  ta.value=ta.value.slice(0,s)+emoji+ta.value.slice(e);
  ta.selectionStart=ta.selectionEnd=s+[...emoji].length;
  ta.focus();
};
window.enviarResposta=async(id)=>{
  if(!CU||!UP)return;
  const ta=document.getElementById("reply-ta-"+id);
  const texto=ta?.value.trim();
  if(!texto){showToast("Escreva algo antes de enviar.",true);return;}
  try{
    await updateDoc(doc(db,"mural",id),{respostas:arrayUnion({membroId:CU.uid,apelido:UP.apelido,fotoUrl:UP.fotoUrl||"",texto,data:new Date().toISOString()})});
    if(ta)ta.value="";
    if(document.getElementById("reply-form-"+id))document.getElementById("reply-form-"+id).style.display="none";
    carregarMural();
  }catch(e){showToast("Erro ao enviar resposta.",true);}
};

async function carregarAtividades(append=false){
  const el=document.getElementById("social-feed-atividades");
  if(!el||_feedLoading)return;
  _feedLoading=true;
  if(!append){el.innerHTML=`<div style="text-align:center;padding:20px 0"><span class="spin">⟳</span></div>`;_feedLastDoc=null;}
  document.getElementById("feed-ver-mais")?.remove();
  try{
    const q=append&&_feedLastDoc
      ?query(collection(db,"feed"),orderBy("data","desc"),startAfter(_feedLastDoc),limit(10))
      :query(collection(db,"feed"),orderBy("data","desc"),limit(10));
    const snap=await getDocs(q);
    const agora=Date.now();
    if(snap.empty&&!append){
      el.innerHTML=`<div style="font-size:12px;color:#555;text-align:center;padding:20px 0">Nenhuma atividade ainda.</div>`;
      _feedLoading=false;return;
    }
    if(snap.docs.length>0)_feedLastDoc=snap.docs[snap.docs.length-1];
    const _feedDayLabel=ts=>{const diff=Math.floor((agora-ts)/86400000);if(diff<1)return'Hoje';if(diff<2)return'Ontem';if(diff<7)return'Esta semana';return'Mais antigo';};
    let _lastGroup='';
    const html=snap.docs.map(d=>{
      const r2=d.data();const ts2=r2.data?.toMillis?r2.data.toMillis():(r2.data?.seconds?r2.data.seconds*1000:agora);
      const grp=_feedDayLabel(ts2);
      let sep='';
      if(!append&&grp!==_lastGroup){_lastGroup=grp;sep=`<div style="font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;padding:12px 0 4px">${grp}</div>`;}
      return sep+_renderFeedItem({id:d.id,data:d.data.bind(d)},agora);
    }).join("");
    if(!append)el.innerHTML=html;
    else el.insertAdjacentHTML("beforeend",html);
    if(snap.docs.length===10)el.insertAdjacentHTML("beforeend",`<div id="feed-ver-mais" style="text-align:center;padding:14px 0"><button onclick="carregarAtividades(true)" style="background:transparent;border:1px solid var(--border);border-radius:20px;padding:8px 20px;color:var(--orange);font-size:12px;cursor:pointer;font-family:inherit">Ver mais ↓</button></div>`);
  }catch(e){
    if(!append)el.innerHTML=`<div style="font-size:12px;color:var(--danger)">Erro ao carregar.</div>`;
  }
  _feedLoading=false;
}
window.reagirFeed=async(id,emoji)=>{
  if(!CU)return;
  const ref=doc(db,"feed",id);
  try{
    const snap=await getDoc(ref);
    if(!snap.exists())return;
    const reacoes={...(snap.data().reacoes||{})};
    if(reacoes[CU.uid]===emoji)delete reacoes[CU.uid];
    else reacoes[CU.uid]=emoji;
    await updateDoc(ref,{reacoes});
    const updated=await getDoc(ref);
    const el=document.getElementById(`feed-item-${id}`);
    if(el){const tmp=document.createElement("div");tmp.innerHTML=_renderFeedItem({id,data:updated.data.bind(updated)},Date.now());el.replaceWith(tmp.firstElementChild);}
  }catch(e){showToast("Erro.",true);}
};
window.toggleReplyFeed=id=>{
  const el=document.getElementById(`reply-feed-${id}`);
  if(!el)return;
  const open=el.style.display==="none";
  el.style.display=open?"block":"none";
  if(open)document.getElementById(`reply-feed-ta-${id}`)?.focus();
};
window.enviarRespostaFeed=async(id)=>{
  if(!CU||!UP)return;
  const ta=document.getElementById(`reply-feed-ta-${id}`);
  const texto=ta?.value.trim();
  if(!texto){showToast("Escreva algo antes de enviar.",true);return;}
  try{
    await updateDoc(doc(db,"feed",id),{respostas:arrayUnion({membroId:CU.uid,apelido:UP.apelido,fotoUrl:UP.fotoUrl||"",texto,data:new Date().toISOString()})});
    if(ta)ta.value="";
    window.toggleReplyFeed(id);
    const updated=await getDoc(doc(db,"feed",id));
    const el=document.getElementById(`feed-item-${id}`);
    if(el){const tmp=document.createElement("div");tmp.innerHTML=_renderFeedItem({id,data:updated.data.bind(updated)},Date.now());el.replaceWith(tmp.firstElementChild);}
  }catch(e){showToast("Erro ao enviar resposta.",true);}
};
window._expandRepliesFeed=async(id)=>{
  try{
    const snap=await getDoc(doc(db,"feed",id));
    if(!snap.exists())return;
    const el=document.getElementById(`feed-item-${id}`);
    if(el){
      const data={...snap.data(),_showAllReplies:true};
      const tmp=document.createElement("div");
      tmp.innerHTML=_renderFeedItem({id,data:()=>data},Date.now());
      el.replaceWith(tmp.firstElementChild);
    }
  }catch(e){}
};

};

function htmlRelatorio(){
  const totalKmClube=MEMBROS.reduce((a,m)=>a+(m.totalKm||0),0);

  const bateram=MEMBROS.filter(m=>(m.totalKm||0)>=META).length;
  const hoje=new Date();
  const eventosRealizados=EVENTOS.filter(e=>new Date(e.data+'T00:00:00')<hoje).length;
  const totalEventos=EVENTOS.length;
  const sorted=[...MEMBROS].filter(m=>m.apelido&&m.apelido!=='undefined').sort((a,b)=>(b.totalKm||0)-(a.totalKm||0));
  const membroTop=sorted[0];

  // Média presença nos eventos (via REGS tipo=rota)
  const evRealizadosIds=EVENTOS.filter(e=>new Date(e.data+'T00:00:00')<hoje).map(e=>e.id);
  const totalPossivel=MEMBROS.filter(m=>m.apelido&&m.apelido!=='undefined').length*evRealizadosIds.length;
  const presUnicas=new Set(REGS.filter(r=>r.tipo==='rota'&&evRealizadosIds.includes(r.eventoId||parseInt(r.eventoId))).map(r=>`${r.membroId}_${r.eventoId}`)).size;
  const mediaPresenca=totalPossivel>0?Math.round((presUnicas/totalPossivel)*100):0;

  const mesesLb=["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];

  const mc=(label,val,color='#ff6600')=>`<div style="background:rgba(255,255,255,.06);border:1px solid rgba(255,102,0,.2);border-radius:10px;padding:12px 8px;text-align:center">

  return`<div class="card" style="border-color:rgba(232,103,10,.3)">

    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;margin-bottom:14px">

      ${mc('Membros Ativos',membrosAtivos,'#ddd')}
      ${mc('Eventos',`${eventosRealizados}<span style="font-size:13px;font-weight:400;color:#999">/${totalEventos}</span>`,'#ddd')}
      ${mc('Bateram Meta',bateram,'var(--green)')}
      ${mc('Média Presença',`${mediaPresenca}<span style="font-size:13px;font-weight:400;color:#999">%</span>`)}
      ${membroTop?mc('Mais Ativo',`<span style="font-size:13px;line-height:1.3;display:block">${membroTop.apelido}</span>`):'<div></div>'}
    </div>

    <div style="font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px">📈 Km por mês</div>
    <div style="display:flex;align-items:flex-end;gap:3px;height:150px;margin-bottom:14px">
      ${kmMes.map((km,i)=>`<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:2px">
        <div style="font-size:8px;color:var(--muted);line-height:1;min-height:10px">${km>0?toInt(km):''}</div>
        <div style="width:100%;background:${km>0?'var(--orange)':'rgba(255,255,255,.07)'};height:${Math.max(4,Math.round((km/maxKm)*110))}px;border-radius:3px 3px 0 0"></div>
        <div style="font-size:9px;color:var(--muted)">${mesesLb[i]}</div>
      </div>`).join("")}
    </div>

    <div style="font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px">🏆 Ranking</div>
    ${sorted.map((m,i)=>{
      const pct=Math.min(100,Math.round(((m.totalKm||0)/META)*100));
      const medal=i===0?'🥇':i===1?'🥈':i===2?'🥉':`<span style="font-size:10px;color:var(--muted)">${i+1}</span>`;
      const bc2=pct>=100?'var(--green)':pct>=60?'var(--orange)':'var(--danger)';
      return`<div style="display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.05)">
        <span style="width:22px;text-align:center;flex-shrink:0;font-size:${i<3?'15':'11'}px">${medal}</span>

          <div style="margin-top:3px;height:3px;background:rgba(255,255,255,.08);border-radius:2px;overflow:hidden"><div style="width:${pct}%;height:100%;background:${bc2};border-radius:2px"></div></div>
        </div>
        <div style="text-align:right;flex-shrink:0">
          <div style="font-size:12px;font-weight:700;color:${bc2}">${toInt(m.totalKm||0)} km</div>
          <div style="font-size:9px;color:var(--muted)">${pct}%</div>
        </div>
      </div>`;
    }).join("")}

    ${TOTAL_LIMPEZAS>0?`<div style="margin-top:12px;padding:10px 12px;background:rgba(96,184,255,.06);border:1px solid rgba(96,184,255,.2);border-radius:10px">
      <div style="font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px">🧹 Limpezas ${ANO_ATIVO}</div>
      <div style="display:flex;gap:16px;font-size:12px">
        <div><span style="color:var(--muted)">Agendadas:</span> <b>${TOTAL_LIMPEZAS}</b></div>
        ${(()=>{const top=MEMBROS.filter(m=>_sedeCountLimp(m)>0).sort((a,b)=>_sedeCountLimp(b)-_sedeCountLimp(a))[0];return top?`<div><span style="color:var(--muted)">Mais ativo:</span> <b>${top.apelido}</b> (${_sedeCountLimp(top)}x)</div>`:'';})()}
      </div>
    </div>`:''}
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px">
      <button onclick="window.abrirModalRelIndividual()" style="padding:11px 8px;border-radius:10px;border:1px solid rgba(255,102,0,.35);background:transparent;color:var(--orange);font-size:12px;font-weight:700;cursor:pointer;font-family:inherit">👤 Relatório Individual</button>
      <button onclick="window.abrirModalRelTemporada()" style="padding:11px 8px;border-radius:10px;border:none;background:var(--orange);color:#fff;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit">📊 Relatório da Temporada</button>
    </div>
  </div>

  ${UP?.isAdmin?`<div class="card" style="margin-top:8px;border-color:rgba(255,255,255,.06)">
    <div style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px">${li("settings",13)} Utilitários Admin</div>
    <div style="display:flex;flex-direction:column;gap:6px">
      <button class="btn-outline" style="min-height:40px;font-size:12px;justify-content:flex-start;gap:8px" onclick="window.recalcularTotalKm()">${li("refresh-cw",13)} Recalcular totalKm de todos os membros</button>
      <button class="btn-outline" style="min-height:40px;font-size:12px;justify-content:flex-start;gap:8px" onclick="window.zerarTemporada()">${li("alert-triangle",13)} Zerar Temporada</button>
      <button class="btn-outline" style="min-height:40px;font-size:12px;justify-content:flex-start;gap:8px" onclick="window.novaTemporada()">${li("plus-circle",13)} Nova Temporada</button>
    </div>
  </div>`:''}`;
}

window.gerarRelPDF=()=>{
  if(!window.jspdf){showToast("Aguarde, carregando PDF...",true);return;}
  const {jsPDF}=window.jspdf;
  const pdf=new jsPDF({orientation:'portrait',unit:'mm',format:'a4'});
  const W=210,H=297;

  const newPage=()=>{
    pdf.addPage();
    pdf.setFillColor(13,13,13);
    pdf.rect(0,0,W,H,'F');
  };

  // Dark background — first page
  pdf.setFillColor(13,13,13);
  pdf.rect(0,0,W,H,'F');

  // Orange top bar
  pdf.setFillColor(255,102,0);
  pdf.rect(0,0,W,7,'F');

  // Header
  pdf.setFont('helvetica','bold');
  pdf.setFontSize(18);
  pdf.setTextColor(255,102,0);
  pdf.text('MUTANTES MC ITAJAÍ',14,18);

  pdf.setFont('helvetica','normal');
  pdf.setFontSize(11);
  pdf.setTextColor(200,200,200);
  pdf.text(`Relatório Temporada ${ANO_ATIVO}`,14,26);

  pdf.setFontSize(8);
  pdf.setTextColor(90,90,90);
  pdf.text(`Gerado em ${new Date().toLocaleDateString('pt-BR')} · Mutantefy`,14,32);

  pdf.setDrawColor(255,102,0);
  pdf.setLineWidth(0.25);
  pdf.line(14,35,W-14,35);

  let y=42;

  // Metrics
  const totalKm=MEMBROS.reduce((a,m)=>a+(m.totalKm||0),0);
  const bateram=MEMBROS.filter(m=>(m.totalKm||0)>=META).length;
  const eventosReal=EVENTOS.filter(e=>new Date(e.data+'T00:00:00')<new Date()).length;
  const metrics=[
    {lb:'KM DO CLUBE',val:`${toInt(totalKm)} km`},
    {lb:'MEMBROS',val:`${MEMBROS.length}`},
    {lb:'EVENTOS',val:`${eventosReal}/${EVENTOS.length}`},
    {lb:'BATERAM A META',val:`${bateram}`},
  ];
  const colW=(W-28)/4;
  metrics.forEach((mt,i)=>{
    const x=14+i*colW;
    pdf.setFillColor(22,22,22);
    pdf.roundedRect(x,y,colW-2,16,2,2,'F');
    pdf.setDrawColor(45,45,45);
    pdf.roundedRect(x,y,colW-2,16,2,2,'S');
    pdf.setFontSize(6.5);
    pdf.setFont('helvetica','normal');
    pdf.setTextColor(120,120,120);
    pdf.text(mt.lb,x+(colW-2)/2,y+5.5,{align:'center'});
    pdf.setFontSize(10);
    pdf.setFont('helvetica','bold');
    pdf.setTextColor(255,102,0);
    pdf.text(mt.val,x+(colW-2)/2,y+12,{align:'center'});
  });
  y+=20;

  // Km por mês chart
  pdf.setFontSize(7.5);
  pdf.setFont('helvetica','bold');
  pdf.setTextColor(120,120,120);
  pdf.text('KM POR MÊS',14,y);
  y+=3;

  const mesesLb=["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];
  const kmMes=Array(12).fill(0);
  REGS.forEach(r=>{const mi=parseInt((r.data||"").slice(5,7))-1;if(mi>=0&&mi<12)kmMes[mi]+=(r.km||0);});
  const maxKm=Math.max(...kmMes,1);
  const chartH=24,chartW=W-28,barW=chartW/12;

  kmMes.forEach((km,i)=>{
    const bh=km>0?Math.max(2,Math.round((km/maxKm)*chartH)):2;
    const bx=14+i*barW+barW*0.12;
    const bww=barW*0.76;
    pdf.setFillColor(km>0?255:35,km>0?102:35,km>0?0:35);
    pdf.rect(bx,y+chartH-bh,bww,bh,'F');
    if(km>0){
      pdf.setFontSize(5);
      pdf.setFont('helvetica','normal');
      pdf.setTextColor(255,102,0);
      pdf.text(String(toInt(km)),bx+bww/2,y+chartH-bh-1,{align:'center'});
    }
    pdf.setFontSize(5);
    pdf.setTextColor(90,90,90);
    pdf.text(mesesLb[i],14+i*barW+barW/2,y+chartH+3.5,{align:'center'});
  });
  y+=chartH+7;

  // Ranking header
  pdf.setDrawColor(255,102,0);
  pdf.setLineWidth(0.2);
  pdf.line(14,y,W-14,y);
  y+=4;
  pdf.setFontSize(7.5);
  pdf.setFont('helvetica','bold');
  pdf.setTextColor(120,120,120);
  pdf.text('RANKING DE KM',14,y);
  y+=5;

  const sortedM=[...MEMBROS].filter(m=>m.apelido&&m.apelido!=='undefined').sort((a,b)=>(b.totalKm||0)-(a.totalKm||0));
  sortedM.forEach((m,i)=>{
    if(y>280){newPage();y=14;}
    const km2=m.totalKm||0;
    const pct2=Math.round((km2/META)*100);
    if(i%2===0){pdf.setFillColor(20,20,20);pdf.rect(14,y-3,W-28,6.5,'F');}
    pdf.setFontSize(7);
    pdf.setFont('helvetica','bold');
    pdf.setTextColor(i<3?255:140,i<3?102:140,i<3?0:140);
    pdf.text(`${i+1}.`,16,y+1);
    pdf.setFont('helvetica','normal');
    pdf.setTextColor(210,210,210);
    pdf.text(m.apelido||'',24,y+1);
    const rCol=pct2>=100?[76,175,80]:(pct2>=60?[255,102,0]:[224,82,82]);
    const bx2=102,bw2=64,pctC=Math.min(pct2,100);
    pdf.setFillColor(35,35,35);
    pdf.rect(bx2,y-1.5,bw2,3,'F');
    pdf.setFillColor(...rCol);
    pdf.rect(bx2,y-1.5,bw2*pctC/100,3,'F');
    pdf.setFontSize(6.5);
    pdf.setFont('helvetica','bold');
    pdf.setTextColor(...rCol);
    pdf.text(`${toInt(km2)} km · ${pct2}%`,W-15,y+1,{align:'right'});
    y+=6.5;
  });

  const _anoG=ANO_ATIVO;
  const totalSextasG=contarSextasDoAno(_anoG);

  // ── Destaques da Temporada
  if(y>220){newPage();y=14;}
  pdf.setDrawColor(255,102,0);pdf.setLineWidth(0.2);pdf.line(14,y,W-14,y);y+=4;
  pdf.setFontSize(7.5);pdf.setFont('helvetica','bold');pdf.setTextColor(120,120,120);
  pdf.text('DESTAQUES DA TEMPORADA',14,y);y+=6;
  {
    const maxKmAll=Math.max(...sortedM.map(m=>m.totalKm||0),1);
    const maxSedeAll=Math.max(...sortedM.map(m=>_sedeCount(m)||0),1);
    const mvp=sortedM.map(m=>({m,sc:((m.totalKm||0)/maxKmAll)*0.6+((_sedeCount(m)||0)/maxSedeAll)*0.4})).sort((a,b)=>b.sc-a.sc)[0];
    const tripCntMap={};
    REGS.forEach(r=>{if(r.eventoId!=null){const k=String(r.eventoId);if(!tripCntMap[k])tripCntMap[k]=new Set();tripCntMap[k].add(r.membroId);}});
    const popE=Object.entries(tripCntMap).map(([k,s])=>({id:k,cnt:s.size})).sort((a,b)=>b.cnt-a.cnt)[0];
    const popTripEv=popE?EVENTOS.find(e=>String(e.id)===popE.id):null;
    const maxMesKm=Math.max(...kmMes,0);const maxMesIdx=kmMes.indexOf(maxMesKm);
    const passedIds=EVENTOS.filter(e=>new Date(e.data+'T00:00:00')<new Date()).map(e=>e.id);
    const neverMissed=passedIds.length?sortedM.filter(m=>passedIds.every(eid=>REGS.some(r=>(r.membroId===m.uid||r.membroId===m.authUid)&&String(r.eventoId)===String(eid)&&r.tipo==='rota'))):[];
    const hlW=(W-30)/2,hlH=19;
    const hls=[
      {lb:'MVP DA TEMPORADA',val:mvp?mvp.m.apelido:'—',sub:mvp?toInt(mvp.m.totalKm||0)+' km · '+(_sedeCount(mvp.m)||0)+' presenças sede':''},
      {lb:'VIAGEM MAIS POPULAR',val:popTripEv?popTripEv.nome:'—',sub:popE?popE.cnt+' participantes':''},
      {lb:'MES MAIS ATIVO',val:maxMesKm>0?mesesLb[maxMesIdx]:'—',sub:maxMesKm>0?toInt(maxMesKm)+' km':''},
      {lb:'NUNCA FALTARAM',val:neverMissed.length?neverMissed.slice(0,3).map(m=>m.apelido).join(', ')+(neverMissed.length>3?'...':''):'Nenhum',sub:neverMissed.length+' membro'+(neverMissed.length!==1?'s':'')},
    ];
    hls.forEach((hl,i)=>{
      const hx=14+(i%2)*(hlW+2),hy=y+Math.floor(i/2)*(hlH+4);
      pdf.setFillColor(22,22,22);pdf.roundedRect(hx,hy,hlW,hlH,2,2,'F');
      pdf.setDrawColor(45,45,45);pdf.roundedRect(hx,hy,hlW,hlH,2,2,'S');
      pdf.setFontSize(6);pdf.setFont('helvetica','normal');pdf.setTextColor(120,120,120);pdf.text(hl.lb,hx+4,hy+5.5);
      pdf.setFontSize(9);pdf.setFont('helvetica','bold');pdf.setTextColor(255,102,0);
      pdf.text(pdf.splitTextToSize(hl.val,hlW-8)[0]||hl.val,hx+4,hy+11.5);
      if(hl.sub){pdf.setFontSize(6.5);pdf.setFont('helvetica','normal');pdf.setTextColor(100,100,100);pdf.text(hl.sub,hx+4,hy+17);}
    });
    y+=Math.ceil(hls.length/2)*(hlH+4)+8;
  }

  // ── Mapa de Atividade (heatmap estilo GitHub)
  if(y>230){newPage();y=14;}
  pdf.setDrawColor(255,102,0);pdf.setLineWidth(0.2);pdf.line(14,y,W-14,y);y+=4;
  pdf.setFontSize(7.5);pdf.setFont('helvetica','bold');pdf.setTextColor(120,120,120);
  pdf.text('MAPA DE ATIVIDADE',14,y);y+=6;
  {
    const hW=(W-28)/53,hH=7;
    const refD=new Date(_anoG,0,1);
    const wkAct={};
    REGS.forEach(r=>{
      if(!r.data)return;const d=new Date(r.data+'T12:00:00');
      if(d.getFullYear()!==_anoG)return;
      const wk=Math.floor((d-refD)/(7*24*3600*1000));
      wkAct[wk]=(wkAct[wk]||0)+(r.km||0);
    });
    mesesLb.forEach((lb,mm)=>{
      const d=new Date(_anoG,mm,1);
      const wk=Math.floor((d-refD)/(7*24*3600*1000));
      pdf.setFontSize(4.5);pdf.setTextColor(100,100,100);
      pdf.text(lb,14+wk*hW,y);
    });
    y+=3;
    for(let w=0;w<53;w++){
      const km=wkAct[w]||0;
      if(km===0)pdf.setFillColor(25,25,25);
      else if(km<300)pdf.setFillColor(38,115,50);
      else pdf.setFillColor(255,102,0);
      pdf.roundedRect(14+w*hW,y,hW-0.4,hH,0.3,0.3,'F');
    }
    y+=hH+3;
    [{c:[25,25,25],t:'Sem atividade'},{c:[38,115,50],t:'Presença (<300km)'},{c:[255,102,0],t:'Viagem (300km+)'}].forEach((l,i)=>{
      pdf.setFillColor(...l.c);pdf.roundedRect(14+i*40,y,4,3,0.5,0.5,'F');
      pdf.setFontSize(5);pdf.setTextColor(100,100,100);pdf.text(l.t,20+i*40,y+2.5);
    });
    y+=8;
  }

  // ── Presenças nas Sextas
  if(y>210){newPage();y=14;}
  pdf.setDrawColor(255,102,0);pdf.setLineWidth(0.2);pdf.line(14,y,W-14,y);y+=4;
  pdf.setFontSize(7.5);pdf.setFont('helvetica','bold');pdf.setTextColor(120,120,120);
  const _sAtual=sextaAtual(_anoG);
  pdf.text('PRESENCAS NAS SEXTAS  (sexta '+_sAtual+' de '+totalSextasG+' em '+_anoG+')',14,y);y+=6;
  {
    const sedeRows=[...sortedM].map(m=>({ap:m.apelido,cnt:_sedeCount(m)||0,pct:totalSextasG>0?Math.round((_sedeCount(m)||0)/totalSextasG*100):0})).sort((a,b)=>b.cnt-a.cnt);
    const sCols=[14,90,130,165];
    pdf.setFillColor(50,50,50);pdf.rect(14,y-3,W-28,6,'F');
    pdf.setFontSize(7.5);pdf.setFont('helvetica','bold');pdf.setTextColor(255,102,0);
    ['Membro','Presenças','% Presença','Barra'].forEach((h,i)=>pdf.text(h,sCols[i]+1,y));
    y+=4;
    sedeRows.forEach((row,i)=>{
      if(y>280){newPage();y=14;}
      pdf.setFillColor(i%2===0?20:16,i%2===0?20:16,i%2===0?20:16);pdf.rect(14,y-3,W-28,6.5,'F');
      pdf.setFontSize(7.5);pdf.setFont('helvetica','normal');pdf.setTextColor(200,200,200);
      pdf.text(row.ap,sCols[0]+1,y+0.5);
      pdf.text(String(row.cnt),sCols[1]+1,y+0.5);
      const pC=row.pct>=80?[76,175,80]:row.pct>=50?[255,102,0]:[150,150,150];
      pdf.setTextColor(...pC);pdf.setFont('helvetica','bold');pdf.text(row.pct+'%',sCols[2]+1,y+0.5);
      const bW=28;pdf.setFillColor(35,35,35);pdf.rect(sCols[3]+1,y-1.5,bW,3,'F');
      pdf.setFillColor(...pC);pdf.rect(sCols[3]+1,y-1.5,bW*row.pct/100,3,'F');
      y+=6.5;
    });
    y+=8;
  }
  // ── Presenças nos Eventos da Sede
  if(y>220){newPage();y=14;}
  pdf.setDrawColor(255,102,0);pdf.setLineWidth(0.2);pdf.line(14,y,W-14,y);y+=4;
  pdf.setFontSize(7.5);pdf.setFont('helvetica','bold');pdf.setTextColor(120,120,120);
  pdf.text('PRESENCAS NOS EVENTOS DA SEDE  ('+TOTAL_EVENTOS_SEDE+' eventos este ano)',14,y);y+=6;
  {
    const evRows=[...sortedM].map(m=>({ap:m.apelido,cnt:_sedeCountEv(m)||0,pct:TOTAL_EVENTOS_SEDE>0?Math.round((_sedeCountEv(m)||0)/TOTAL_EVENTOS_SEDE*100):0})).sort((a,b)=>b.cnt-a.cnt);
    const sCols=[14,90,130,165];
    pdf.setFillColor(50,50,50);pdf.rect(14,y-3,W-28,6,'F');
    pdf.setFontSize(7.5);pdf.setFont('helvetica','bold');pdf.setTextColor(255,102,0);
    ['Membro','Compareceu','% Presença','Barra'].forEach((h,i)=>pdf.text(h,sCols[i]+1,y));
    y+=4;
    evRows.forEach((row,i)=>{
      if(y>280){newPage();y=14;}
      pdf.setFillColor(i%2===0?20:16,i%2===0?20:16,i%2===0?20:16);pdf.rect(14,y-3,W-28,6.5,'F');
      pdf.setFontSize(7.5);pdf.setFont('helvetica','normal');pdf.setTextColor(200,200,200);
      pdf.text(row.ap,sCols[0]+1,y+0.5);
      pdf.text(String(row.cnt),sCols[1]+1,y+0.5);
      const pC=row.pct>=80?[76,175,80]:row.pct>=50?[255,102,0]:[150,150,150];
      pdf.setTextColor(...pC);pdf.setFont('helvetica','bold');pdf.text(row.pct+'%',sCols[2]+1,y+0.5);
      const bW=28;pdf.setFillColor(35,35,35);pdf.rect(sCols[3]+1,y-1.5,bW,3,'F');
      pdf.setFillColor(...pC);pdf.rect(sCols[3]+1,y-1.5,bW*row.pct/100,3,'F');
      y+=6.5;
    });
    y+=6;
  }

  // ── Detalhamento por Membro
  newPage();y=14;
  pdf.setFontSize(7.5);pdf.setFont('helvetica','bold');pdf.setTextColor(120,120,120);
  pdf.text('DETALHAMENTO POR MEMBRO',14,y);y+=6;
  sortedM.forEach((m,mi)=>{
    if(y>265){newPage();y=14;}
    pdf.setFillColor(22,22,22);pdf.rect(14,y-3,W-28,8,'F');
    pdf.setDrawColor(255,102,0);pdf.setLineWidth(0.3);pdf.line(14,y+5,W-14,y+5);
    pdf.setFontSize(8.5);pdf.setFont('helvetica','bold');pdf.setTextColor(255,102,0);
    pdf.text((mi+1)+'. '+m.apelido,16,y+2);
    pdf.setFontSize(7.5);pdf.setFont('helvetica','normal');pdf.setTextColor(180,180,180);
    pdf.text(toInt(m.totalKm||0)+' km',W-16,y+2,{align:'right'});
    y+=10;
    const memTrips=REGS.filter(r=>(r.membroId===m.uid||r.membroId===m.authUid)&&r.tipo==='rota').sort((a,b)=>(b.data||'').localeCompare(a.data||''));
    if(memTrips.length){
      memTrips.forEach((r,ri)=>{
        if(y>282){newPage();y=14;}
        pdf.setFillColor(ri%2===0?14:18,ri%2===0?14:18,ri%2===0?14:18);pdf.rect(14,y-2.5,W-28,5.5,'F');
        const ev2=EVENTOS.find(e=>String(e.id)===String(r.eventoId));
        pdf.setFontSize(7);pdf.setFont('helvetica','normal');pdf.setTextColor(120,120,120);
        pdf.text(r.data?r.data.slice(8)+'/'+r.data.slice(5,7):'—',16,y+1.5);
        pdf.setTextColor(190,190,190);
        const nm2=pdf.splitTextToSize(ev2?.nome||r.desc||'—',82)[0];
        pdf.text(nm2,35,y+1.5);
        const lcl=[(ev2?.destino||''),(ev2?.estado||'')].filter(Boolean).join(' · ');
        if(lcl){pdf.setTextColor(100,100,100);pdf.text(pdf.splitTextToSize(lcl,48)[0],118,y+1.5);}
        pdf.setFont('helvetica','bold');pdf.setTextColor(255,102,0);
        pdf.text(toInt(r.km||0)+' km',W-16,y+1.5,{align:'right'});
        y+=5.5;
      });
    }else{pdf.setFontSize(7);pdf.setTextColor(80,80,80);pdf.text('Sem viagens registradas.',18,y+1);y+=6;}
    y+=3;
  });

  // Footer on last page
  pdf.setFillColor(255,102,0);
  pdf.rect(0,H-7,W,7,'F');
  pdf.setFontSize(7.5);
  pdf.setFont('helvetica','normal');
  pdf.setTextColor(255,255,255);
  pdf.text(`Mutantefy · Mutantes MC Itajaí · Temporada ${ANO_ATIVO}`,W/2,H-2.5,{align:'center'});

  pdf.save(`Relatorio_Mutantes_${ANO_ATIVO}.pdf`);
};

// CALENDÁRIO VISUAL DE EVENTOS
// ═══════════════════════════════════════════════════
let _evView="lista";
let _calMes=new Date().getMonth();
let _calAno=new Date().getFullYear();

window.setEvView=(view)=>{
  _evView=view;
  const lista=document.getElementById("ev-lista-wrap");
  const cal=document.getElementById("ev-cal-wrap");
  const btnL=document.getElementById("ev-view-lista");
  const btnC=document.getElementById("ev-view-cal");
  if(!lista||!cal)return;
  lista.style.display=view==="lista"?"block":"none";
  cal.style.display=view==="cal"?"block":"none";
  if(btnL){btnL.style.background=view==="lista"?"var(--orange)":"var(--bg3)";btnL.style.color=view==="lista"?"#fff":"var(--muted)";btnL.style.border=view==="lista"?"none":"1px solid var(--border)";}
  if(btnC){btnC.style.background=view==="cal"?"var(--orange)":"var(--bg3)";btnC.style.color=view==="cal"?"#fff":"var(--muted)";btnC.style.border=view==="cal"?"none":"1px solid var(--border)";}
  if(view==="cal")renderCalendario();
};

function renderCalendario(){
  const cal=document.getElementById("ev-cal-wrap");
  if(!cal)return;
  const hoje=new Date();
  const ano=_calAno, mes=_calMes;
  const primeiroDia=new Date(ano,mes,1).getDay(); // 0=dom
  const diasNoMes=new Date(ano,mes+1,0).getDate();
  const meses=["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
  const dias=["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];

  // Mapear eventos do mês
  const eventosPorDia={};
  EVENTOS.forEach(ev=>{
    const d=new Date(ev.data+"T00:00:00");
    if(d.getMonth()===mes&&d.getFullYear()===ano){
      const dia=d.getDate();
      if(!eventosPorDia[dia])eventosPorDia[dia]=[];
      eventosPorDia[dia].push(ev);
    }
  });

  // Células do calendário
  let cells="";
  // Dias da semana header
  cells+=dias.map(d=>`<div style="text-align:center;font-size:10px;font-weight:700;color:var(--muted);padding:4px 0;text-transform:uppercase">${d}</div>`).join("");

  // Células vazias antes do primeiro dia
  for(let i=0;i<primeiroDia;i++) cells+=`<div></div>`;

  // Dias do mês
  for(let dia=1;dia<=diasNoMes;dia++){
    const ehHoje=hoje.getDate()===dia&&hoje.getMonth()===mes&&hoje.getFullYear()===ano;
    const evs=eventosPorDia[dia]||[];
    const temEv=evs.length>0;
    cells+=`<div onclick="${temEv?`window.verEvDia(${dia},${mes},${ano})`:"return false"}"
      style="min-height:44px;border-radius:8px;padding:4px;cursor:${temEv?"pointer":"default"};
      background:${ehHoje?"rgba(232,103,10,.2)":temEv?"rgba(232,103,10,.08)":"transparent"};
      border:1px solid ${ehHoje?"var(--orange)":temEv?"rgba(232,103,10,.3)":"transparent"};
      position:relative;transition:background .15s">
      <div style="font-size:12px;font-weight:${ehHoje?"700":"400"};color:${ehHoje?"var(--orange)":"var(--white)"};text-align:center">${dia}</div>
      ${temEv?`<div style="display:flex;flex-wrap:wrap;gap:2px;justify-content:center;margin-top:2px">${evs.map(()=>`<div style="width:6px;height:6px;border-radius:50%;background:var(--orange)"></div>`).join("")}</div>`:""}
    </div>`;
  }

  // Detalhe do evento selecionado
  cal.innerHTML=`
    <div class="card">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
        <button onclick="window.navCal(-1)" style="padding:6px 12px;border-radius:8px;border:1px solid var(--border);background:var(--bg3);color:var(--white);font-size:16px;cursor:pointer;font-family:inherit">‹</button>
        <div style="font-size:15px;font-weight:700">${meses[mes]} ${ano}</div>
        <button onclick="window.navCal(1)" style="padding:6px 12px;border-radius:8px;border:1px solid var(--border);background:var(--bg3);color:var(--white);font-size:16px;cursor:pointer;font-family:inherit">›</button>
      </div>
      <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:3px">
        ${cells}
      </div>
      ${Object.keys(eventosPorDia).length===0?`<div style="font-size:12px;color:#555;text-align:center;margin-top:14px">Nenhum evento neste mês</div>`:""}
    </div>
    <div id="ev-cal-detalhe"></div>`;
}

window.navCal=(dir)=>{
  _calMes+=dir;
  if(_calMes>11){_calMes=0;_calAno++;}
  if(_calMes<0){_calMes=11;_calAno--;}
  renderCalendario();
};

window.verEvDia=(dia,mes,ano)=>{
  const evs=EVENTOS.filter(ev=>{
    const d=new Date(ev.data+"T00:00:00");
    return d.getDate()===dia&&d.getMonth()===mes&&d.getFullYear()===ano;
  });
  const det=document.getElementById("ev-cal-detalhe");
  if(!det)return;
  det.innerHTML=evs.map(ev=>evCardMembro(ev)).join("");
  det.scrollIntoView({behavior:"smooth",block:"nearest"});
};

const GALERIA_POR_PAG=30;
let _galeriaCursor=null,_galeriaFiltro=null;

function _fotoHtml(f){
  return`<div style="position:relative;aspect-ratio:1;overflow:hidden;border-radius:8px;cursor:pointer" onclick="window.abrirFotoModal('${f.id}','${f.url}')">
    <img src="${f.url}" style="width:100%;height:100%;object-fit:cover" loading="lazy"/>
    ${UP&&(UP.isAdmin||f.autorId===CU.uid)?`<button onclick="event.stopPropagation();window.excluirFotoGaleria('${f.id}')" style="position:absolute;top:4px;right:4px;background:rgba(0,0,0,.7);color:#fff;border:none;border-radius:50%;width:22px;height:22px;font-size:11px;cursor:pointer">✕</button>`:""}
  </div>`;
}

function _galeriaBtnMais(){
  const wrap=document.createElement("div");
  wrap.style.cssText="grid-column:1/-1;text-align:center;padding:10px 0";
  wrap.innerHTML=`<button id="galeria-mais-btn" onclick="window.carregarMaisGaleria()" style="padding:8px 22px;border-radius:8px;border:1px solid var(--border);background:var(--bg3);color:var(--white);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit">Carregar mais</button>`;
  return wrap;
}

function _galeriaQuery(cursor){
  const parts=[collection(db,"galeria")];
  if(_galeriaFiltro&&_galeriaFiltro!=="geral")parts.push(where("eventoId","==",_galeriaFiltro));
  parts.push(orderBy("criadoEm","desc"));
  if(cursor)parts.push(startAfter(cursor));
  parts.push(limit(GALERIA_POR_PAG));
  return query(...parts);
}

async function carregarGaleria(eventoId){
  _galeriaFiltro=eventoId||null;
  _galeriaCursor=null;
  const el=document.getElementById("galeria-grid");
  if(!el)return;
  el.innerHTML=`<span class="spin">⟳</span>`;
  try{
    const snap=await getDocs(_galeriaQuery(null));
    let fotos=snap.docs.map(d=>({id:d.id,...d.data()}));
    if(_galeriaFiltro==="geral")fotos=fotos.filter(f=>!f.eventoId||f.eventoId==="geral");
    _galeriaCursor=snap.docs.length===GALERIA_POR_PAG?snap.docs[snap.docs.length-1]:null;
    if(fotos.length===0){el.innerHTML=`<div style="grid-column:1/-1;font-size:12px;color:#555;padding:10px 0">Nenhuma foto ainda. Seja o primeiro a postar!</div>`;return;}
    el.innerHTML=fotos.map(_fotoHtml).join("");
    if(_galeriaCursor)el.appendChild(_galeriaBtnMais());
  }catch(e){el.innerHTML=`<div style="font-size:12px;color:var(--danger)">Erro ao carregar.</div>`;}
}

window.carregarMaisGaleria=async()=>{
  if(!_galeriaCursor)return;
  const el=document.getElementById("galeria-grid");
  const btn=document.getElementById("galeria-mais-btn");
  if(!el||!btn)return;
  btn.textContent="Carregando...";btn.disabled=true;
  try{
    const snap=await getDocs(_galeriaQuery(_galeriaCursor));
    let fotos=snap.docs.map(d=>({id:d.id,...d.data()}));
    if(_galeriaFiltro==="geral")fotos=fotos.filter(f=>!f.eventoId||f.eventoId==="geral");
    _galeriaCursor=snap.docs.length===GALERIA_POR_PAG?snap.docs[snap.docs.length-1]:null;
    btn.parentElement.remove();
    fotos.forEach(f=>{
      const div=document.createElement("div");
      div.style.cssText="position:relative;aspect-ratio:1;overflow:hidden;border-radius:8px;cursor:pointer";
      div.onclick=()=>window.abrirFotoModal(f.id,f.url);
      div.innerHTML=`<img src="${f.url}" style="width:100%;height:100%;object-fit:cover" loading="lazy"/>${UP&&(UP.isAdmin||f.autorId===CU.uid)?`<button onclick="event.stopPropagation();window.excluirFotoGaleria('${f.id}')" style="position:absolute;top:4px;right:4px;background:rgba(0,0,0,.7);color:#fff;border:none;border-radius:50%;width:22px;height:22px;font-size:11px;cursor:pointer">✕</button>`:""}`;
      el.appendChild(div);
    });
    if(_galeriaCursor)el.appendChild(_galeriaBtnMais());
  }catch{btn.textContent="Carregar mais";btn.disabled=false;}
};

window.filtrarGaleria=()=>{
  const val=document.getElementById("galeria-filtro-evento")?.value;
  carregarGaleria(val||null);
};

window.uploadFotosGaleria=async(input)=>{
  const files=Array.from(input.files);
  if(!files.length)return;
  const eventoId=document.getElementById("galeria-filtro-evento")?.value||"geral";
  showToast(`Enviando ${files.length} foto(s)...`);
  try{
    for(const file of files){
      const url=await uploadFoto(file);
      const ref=await addDoc(collection(db,"galeria"),{url,eventoId:eventoId||"geral",autorId:CU.uid,autorApelido:UP.apelido,criadoEm:serverTimestamp()});
      // Adiciona foto imediatamente no grid sem esperar re-fetch do Firestore
      const grid=document.getElementById("galeria-grid");
      if(grid){
        const vazio=grid.querySelector("div[style*='Nenhuma foto']");
        if(vazio)grid.innerHTML="";
        const div=document.createElement("div");
        div.style.cssText="position:relative;aspect-ratio:1;overflow:hidden;border-radius:8px;cursor:pointer";
        div.onclick=()=>window.abrirFotoModal(ref.id,url);
        div.innerHTML=`<img src="${url}" style="width:100%;height:100%;object-fit:cover" loading="lazy"/><button onclick="event.stopPropagation();window.excluirFotoGaleria('${ref.id}')" style="position:absolute;top:4px;right:4px;background:rgba(0,0,0,.7);color:#fff;border:none;border-radius:50%;width:22px;height:22px;font-size:11px;cursor:pointer">✕</button>`;
        grid.insertBefore(div,grid.firstChild);
      }
    }
    showToast("✓ Fotos enviadas!");input.value="";
  }catch{showToast("Erro ao enviar.",true);}
};

window.excluirFotoGaleria=async(id)=>{
  if(!confirm("Excluir esta foto?"))return;
  try{await deleteDoc(doc(db,"galeria",id));showToast("Excluída.");carregarGaleria();}catch{showToast("Erro.",true);}
};

window.abrirFotoModal=async(fotoId,url)=>{

  ov.className="app-modal-overlay";
  ov.id="foto-modal-ov";

    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">

      <button onclick="document.getElementById('foto-modal-ov').remove()" style="background:transparent;border:none;color:var(--muted);font-size:22px;cursor:pointer;line-height:1">×</button>
    </div>

    <div style="font-size:13px;font-weight:600;margin-bottom:10px">💬 Comentários</div>
    <div id="foto-coment-lista"><span class="spin">⟳</span></div>
    <div style="display:flex;gap:8px;margin-top:12px">

    </div>
  </div>`;

  carregarComentFoto(fotoId);

async function carregarComentFoto(fotoId){
  const el=document.getElementById("foto-coment-lista");
  if(!el)return;
  try{
    const snap=await getDoc(doc(db,"galeria",fotoId));
    const comentarios=(snap.data()?.comentarios)||[];
    if(comentarios.length===0){el.innerHTML=`<div style="font-size:12px;color:#555">Sem comentários ainda.</div>`;return;}
    el.innerHTML=comentarios.map(c=>`
      <div style="display:flex;gap:8px;padding:6px 0;border-bottom:1px solid var(--border)">
        <div onclick="window.abrirPerfilPublico('${c.membroId||""}')" style="cursor:pointer;flex-shrink:0">${avatarEl(c.fotoUrl||"",c.apelido,28)}</div>
        <div style="flex:1">
          <div style="font-size:11px;font-weight:700;color:var(--orange)">${c.apelido}</div>
          <div style="font-size:12px;line-height:1.4;word-break:break-word">${c.texto}</div>
          <div style="font-size:10px;color:#555">${fmtDate(c.data||"")}</div>
        </div>
      </div>`).join("");
  }catch{el.innerHTML=`<div style="font-size:12px;color:var(--danger)">Erro.</div>`;}
}

window.enviarComentFoto=async(fotoId)=>{
  const inp=document.getElementById("foto-coment-inp");
  const texto=inp?.value.trim();
  if(!texto||!CU)return;
  const comentario={membroId:CU.uid,apelido:UP.apelido,fotoUrl:UP.fotoUrl||"",texto,data:new Date().toISOString().slice(0,10)};
  try{
    await updateDoc(doc(db,"galeria",fotoId),{comentarios:arrayUnion(comentario)});
    inp.value="";carregarComentFoto(fotoId);
  }catch{showToast("Erro.",true);}
};
