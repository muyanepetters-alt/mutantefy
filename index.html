window.exportarRankingCSV=()=>{
  const sorted=[...MEMBROS].filter(m=>m.totalKm>0).sort((a,b)=>(b.totalKm||0)-(a.totalKm||0));
  const linhas=[["Posição","Apelido","Km Rodados","% da Meta","Meta Atingida"]];
  sorted.forEach((m,i)=>{
    const pct=Math.round(((m.totalKm||0)/META)*100);
    linhas.push([i+1,m.apelido,m.totalKm||0,pct+"%",pct>=100?"Sim":"Não"]);
  });
  const csv=linhas.map(l=>l.join(";")).join("\n");
  const blob=new Blob(["\uFEFF"+csv],{type:"text/csv;charset=utf-8;"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;a.download="ranking_mutantes_"+new Date().getFullYear()+".csv";a.click();
  URL.revokeObjectURL(url);
  showToast("✅ Ranking exportado!");
};

// ── RELATÓRIO INDIVIDUAL ────────────────────────────
window.carregarRelMembro=async(uid)=>{
  const area=document.getElementById('rel-membro-area');
  if(!area)return;
  if(!uid){area.innerHTML='';return;}
  area.innerHTML='<div style="text-align:center;padding:24px"><span class="spin">⟳</span></div>';
  const m=MEMBROS.find(mb=>mb.uid===uid);
  if(!m){area.innerHTML='<div style="font-size:13px;color:var(--muted);padding:12px 0">Membro não encontrado.</div>';return;}

  let savedObs='',savedObsTs='';
  try{
    const snap=await getDoc(doc(db,'usuarios',uid));
    if(snap.exists()){savedObs=snap.data().observacoes||'';savedObsTs=snap.data().observacoesData||'';}
  }catch{}

  const memRegs=REGS.filter(r=>r.membroId===m.authUid||r.membroId===m.uid);
  const nowD=new Date();

  const meses=Array.from({length:12},(_,i)=>{
    const d=new Date(nowD.getFullYear(),nowD.getMonth()-11+i,1);
    return{label:d.toLocaleDateString('pt-BR',{month:'short'}).replace('.','')+" '"+String(d.getFullYear()).slice(2),km:0,mes:d.getMonth(),ano:d.getFullYear()};
  });
  memRegs.forEach(r=>{
    const rd=r.data?new Date(r.data+'T12:00:00'):(r.createdAt?.toDate?r.createdAt.toDate():r.createdAt?new Date(r.createdAt):null);
    if(!rd)return;
    const b=meses.find(b=>b.mes===rd.getMonth()&&b.ano===rd.getFullYear());
    if(b)b.km+=(r.km||0);
  });

  const kmAvulso=memRegs
    .filter(r=>r.tipo==='extra')
    .map(r=>{const ds=r.data||'';return{data:ds,dataDisplay:nascForDisplay(ds)||ds,km:r.km||0,desc:r.desc||''};})
    .sort((a,b)=>b.data.localeCompare(a.data));

  let evComp=0,evHistorico=[];
  const evTotal=EVENTOS.filter(e=>new Date(e.data+'T00:00:00')<=nowD).length;
  try{
    const pSnap=await getDocs(query(collection(db,'presencas'),where('membroId','==',m.authUid)));
    const presCompareceu=pSnap.docs.filter(d=>d.data().resposta==='compareceu').map(d=>d.data());
    evComp=presCompareceu.length;
    evHistorico=presCompareceu.map(p=>{
      const ev=EVENTOS.find(e=>e.id===p.eventoId);
      const reg=memRegs.find(r=>r.eventoId===p.eventoId&&r.tipo==='rota');
      const ds=ev?.data||'';
      return{nome:p.nomeEvento||ev?.nome||'—',data:ds,dataDisplay:nascForDisplay(ds)||ds,local:[ev?.destino,ev?.estado].filter(Boolean).join(' ')||'—',km:reg?.km||p.kmLancado||0};
    }).sort((a,b)=>b.data.localeCompare(a.data));
  }catch{}

  const sc=_sedeCount(m);
  const anoAtual=nowD.getFullYear();
  let totalSextas=0;
  for(let mm=0;mm<12;mm++){
    const dias=new Date(anoAtual,mm+1,0).getDate();
    for(let dd=1;dd<=dias;dd++){
      const d2=new Date(anoAtual,mm,dd);
      if(d2>nowD)break;
      if(d2.getDay()===5)totalSextas++;
    }
  }
  const pctSede=totalSextas>0?Math.round((sc/totalSextas)*100):0;
  const pctEv=evTotal>0?Math.round((evComp/evTotal)*100):0;

  const kmRaw=m.totalKm||0;
  const pct=Math.round((kmRaw/META)*100);
  const pctColor=pct>=100?'var(--green)':pct>=60?'var(--orange)':'var(--danger)';
  const badges=calcConquistas(m,REGS);

  const maxKm=Math.max(...meses.map(b=>b.km),1);
  const chartBars=meses.map(b=>{
    const h=Math.round((b.km/maxKm)*56);
    return`<div style="display:flex;flex-direction:column;align-items:center;justify-content:flex-end;flex:1;min-width:0;gap:2px">
      <div style="font-size:8px;color:var(--muted);line-height:1;white-space:nowrap">${b.km>0?toInt(b.km):''}</div>
      <div style="width:90%;background:${b.km>0?'var(--orange)':'rgba(255,255,255,.06)'};height:${Math.max(h,2)}px;border-radius:2px 2px 0 0;transition:height .4s"></div>
      <div style="font-size:7.5px;color:#555;white-space:nowrap;text-align:center">${b.label}</div>
    </div>`;
  }).join('');

  const nascDisplay=nascForDisplay(m.nascimento)||'—';
  let cadastroDisplay='—';
  try{if(m.createdAt){const cd=m.createdAt?.toDate?m.createdAt.toDate():new Date(m.createdAt);cadastroDisplay=cd.toLocaleDateString('pt-BR');}}catch{}
  const obsDataDisplay=savedObsTs?new Date(savedObsTs).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}):'';

  area.innerHTML=`<div style="margin-top:14px">
    <div style="display:flex;align-items:center;gap:12px;padding:12px 14px;background:rgba(255,102,0,.06);border:1px solid rgba(255,102,0,.2);border-radius:12px;margin-bottom:14px">
      ${avatarEl(m.fotoUrl,m.apelido,52)}
      <div>
        <div style="font-size:17px;font-weight:700;color:var(--orange)">${m.apelido}</div>
        <div style="font-size:12px;color:var(--muted);margin-top:2px">${m.nivel||'Membro'}</div>
        ${m.isDiretor||m.isAdmin?'<div style="font-size:10px;color:var(--green);font-weight:700;margin-top:3px">DIRETORIA</div>':''}
      </div>
    </div>
    <div class="grid2" style="margin-bottom:14px">
      <div class="metric"><div class="metric-label">${li("route",12)} Total km</div><div class="metric-value" style="color:var(--orange)">${toInt(kmRaw)}</div></div>
      <div class="metric"><div class="metric-label">${li("target",12)} Meta ${toInt(META)} km</div><div class="metric-value" style="color:${pctColor}">${pct}%</div></div>
      <div class="metric"><div class="metric-label">📅 Eventos</div><div class="metric-value">${evComp}/${evTotal} <span style="font-size:11px;color:var(--muted)">(${pctEv}%)</span></div></div>
      <div class="metric"><div class="metric-label">⛪ Sede</div><div class="metric-value" style="color:#60b8ff">${sc} <span style="font-size:11px;color:var(--muted)">(${pctSede}%)</span></div></div>
    </div>
    <div style="margin-bottom:14px">
      <div style="font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.4px;margin-bottom:8px">Km por mês — últimos 12 meses</div>
      <div style="display:flex;align-items:flex-end;height:82px;gap:1px">${chartBars}</div>
    </div>
    ${evHistorico.length?`<div style="margin-bottom:14px">
      <div style="font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.4px;margin-bottom:8px">Histórico de eventos comparecidos (${evHistorico.length})</div>
      ${evHistorico.map(h=>`<div style="display:flex;align-items:flex-start;gap:8px;padding:7px 0;border-bottom:1px solid var(--border)">
        <div style="width:7px;height:7px;border-radius:50%;background:var(--orange);flex-shrink:0;margin-top:4px"></div>
        <div style="flex:1;min-width:0">
          <div style="font-size:12px;font-weight:600">${h.nome}</div>
          <div style="font-size:11px;color:var(--muted)">${h.dataDisplay} · ${h.local}${h.km?` · <span style="color:var(--orange);font-weight:600">${toInt(h.km)} km</span>`:''}</div>
        </div>
      </div>`).join('')}
    </div>`:''}
    ${kmAvulso.length?`<div style="margin-bottom:14px">
      <div style="font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.4px;margin-bottom:8px">Km avulso (${kmAvulso.length})</div>
      ${kmAvulso.map(k=>`<div style="display:flex;align-items:center;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--border)">
        <div style="font-size:12px;color:var(--muted)">${k.dataDisplay}${k.desc?` · ${k.desc}`:''}</div>
        <div style="font-size:12px;font-weight:600;color:var(--orange);flex-shrink:0;margin-left:8px">${toInt(k.km)} km</div>
      </div>`).join('')}
    </div>`:''}
    <div style="margin-bottom:14px;padding:12px 14px;background:var(--bg3);border-radius:10px;border:1px solid var(--border)">
      <div style="font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.4px;margin-bottom:8px">Dados pessoais</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;font-size:12px;line-height:1.6">
        ${m.moto?`<div><span style="color:var(--muted)">Moto</span><br><b>${m.moto}</b></div>`:'<div></div>'}
        <div><span style="color:var(--muted)">Aniversário</span><br><b>${nascDisplay}</b></div>
        <div><span style="color:var(--muted)">Cadastro no clube</span><br><b>${cadastroDisplay}</b></div>
        ${m.dataIngresso?`<div><span style="color:var(--muted)">Ingresso no clube</span><br><b style="color:var(--orange)">${m.dataIngresso}</b></div>`:'<div></div>'}
        ${m.email?`<div style="grid-column:1/-1"><span style="color:var(--muted)">Email</span><br><b style="font-size:11px;word-break:break-all">${m.email}</b></div>`:''}
      </div>
      ${m.historicoGraduacoes&&m.historicoGraduacoes.length?`<div style="margin-top:12px;padding-top:10px;border-top:1px solid var(--border)">
        <div style="font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.4px;margin-bottom:8px">Graduações</div>
        ${htmlTimelineGraduacoes(m.historicoGraduacoes)}
      </div>`:''}
    </div>
    ${badges.length?`<div style="margin-bottom:14px">
      <div style="font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.4px;margin-bottom:8px">Conquistas (${badges.length})</div>
      <div style="display:flex;flex-wrap:wrap;gap:6px">${badges.map(b=>`<span title="${b.desc}" style="display:inline-flex;align-items:center;gap:5px;padding:5px 9px;background:var(--bg3);border:1px solid var(--border);border-radius:8px;font-size:11px"><span style="font-size:16px">${b.ic}</span><span style="font-weight:600">${b.nome}</span></span>`).join('')}</div>
    </div>`:''}
    <div style="margin-bottom:12px">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">
        <div style="font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.4px">Observações</div>
        <button id="rel-voz-btn" onclick="window.ativarDitado()" style="padding:5px 10px;border-radius:8px;border:1px solid var(--border);background:var(--bg3);color:var(--white);font-size:11px;cursor:pointer;font-family:inherit">🎤 Voz</button>
      </div>
      <textarea id="rel-obs" rows="4" placeholder="Anotações sobre o membro (ocorrências, histórico, etc.)..."
        style="width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:var(--bg3);color:var(--white);font-size:13px;font-family:inherit;resize:vertical;box-sizing:border-box">${savedObs}</textarea>
      ${obsDataDisplay?`<div style="font-size:10px;color:#555;margin-top:3px">Última atualização: ${obsDataDisplay}</div>`:''}
    </div>
    <button onclick="window.gerarPdfMembro('${uid}')" style="width:100%;padding:12px;border-radius:10px;border:none;background:var(--orange);color:#fff;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit">📄 Gerar PDF</button>
  </div>`;
  window._relMembroUid=uid;
  window._relMembroCtx={m,meses,evComp,evTotal,evHistorico,kmAvulso,sc,totalSextas,pctSede,pctEv,badges,nascDisplay,cadastroDisplay};
  lcr();
};

window.ativarDitado=()=>{
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){showToast('Ditado não suportado. Use Chrome ou Android.',true);return;}
  const ta=document.getElementById('rel-obs');
  const btn=document.getElementById('rel-voz-btn');
  if(!ta)return;
  const rec=new SR();
  rec.lang='pt-BR';rec.interimResults=false;rec.maxAlternatives=1;
  rec.onstart=()=>{if(btn){btn.textContent='🔴 Ouvindo...';btn.style.color='var(--danger)';btn.style.borderColor='var(--danger)';}};
  rec.onresult=e=>{const t=e.results[0][0].transcript;ta.value+=(ta.value?'\n':'')+t;};
  rec.onerror=e=>{showToast('Erro no ditado: '+e.error,true);};
  rec.onend=()=>{if(btn){btn.textContent='🎤 Voz';btn.style.color='';btn.style.borderColor='';}};
  rec.start();
};

window.salvarObsMembro=async(uid,showMsg=true)=>{
  const obs=document.getElementById('rel-obs')?.value||'';
  const id=uid||window._relMembroUid;
  if(!id)return;
  try{
    const ts=new Date().toISOString();
    await setDoc(doc(db,'usuarios',id),{observacoes:obs,observacoesData:ts},{merge:true});
    const m2=MEMBROS.find(mb=>mb.uid===id);
    if(m2){m2.observacoes=obs;m2.observacoesData=ts;}
    if(showMsg)showToast('✓ Observações salvas!');
  }catch(e){if(showMsg)showToast('Erro: '+e.message,true);}
};

window.gerarPdfMembro=async(uid)=>{
  if(!(window.jspdf&&window.jspdf.jsPDF)){showToast('jsPDF não carregado. Verifique conexão.',true);return;}
  const ctx=window._relMembroCtx;
  if(!ctx||ctx.m.uid!==uid){showToast('Selecione o membro primeiro.',true);return;}
  await window.salvarObsMembro(uid,false);
  showToast('Gerando PDF...');
  const{m,meses,evComp,evTotal,evHistorico,kmAvulso,sc,totalSextas,pctSede,pctEv,badges,nascDisplay,cadastroDisplay}=ctx;
  const obs=document.getElementById('rel-obs')?.value||'';
  const ano=new Date().getFullYear();
  const kmRaw=Math.round(m.totalKm||0);
  const pct=Math.round((kmRaw/META)*100);

  const fetchImgB64=async(url,size=100,circle=false)=>{
    if(!url)return null;
    return new Promise(resolve=>{
      const img=new Image();img.crossOrigin='anonymous';
      img.onload=()=>{
        const c=document.createElement('canvas');c.width=c.height=size;
        const ctx2=c.getContext('2d');
        if(circle){ctx2.beginPath();ctx2.arc(size/2,size/2,size/2,0,Math.PI*2);ctx2.clip();}
        ctx2.drawImage(img,0,0,size,size);
        resolve(c.toDataURL(circle?'image/png':'image/jpeg',0.85));
      };
      img.onerror=()=>resolve(null);
      img.src=url+(url.includes('?')?'&':'?')+'_nc='+Date.now();
    });
  };

  const[logoB64,fotoB64]=await Promise.all([
    fetchImgB64('logo.png',80,false),
    m.fotoUrl?fetchImgB64(m.fotoUrl,120,true):Promise.resolve(null)
  ]);

  const {jsPDF}=window.jspdf;
  const pdf=new jsPDF({orientation:'portrait',unit:'mm',format:'a4'});
  const W=210,H=297,ML=15,MR=15;
  const CW=W-ML-MR;
  const FOOTER_H=14;

  // ── helpers
  const rgb=h=>{const v=h.replace('#','');return[parseInt(v.slice(0,2),16),parseInt(v.slice(2,4),16),parseInt(v.slice(4,6),16)];};
  const fill=h=>{const[r,g,b]=rgb(h);pdf.setFillColor(r,g,b);};
  const txtC=h=>{const[r,g,b]=rgb(h);pdf.setTextColor(r,g,b);};
  const stroke=h=>{const[r,g,b]=rgb(h);pdf.setDrawColor(r,g,b);};
  const sep=(y2)=>{stroke('#333333');pdf.setLineWidth(0.2);pdf.line(ML,y2,W-MR,y2);};
  const secTitle=(txt,y2)=>{
    txtC('#ff6600');pdf.setFontSize(11);pdf.setFont('helvetica','bold');
    pdf.text(txt.toUpperCase(),ML,y2);
    sep(y2+2);
  };
  const newPage=()=>{
    drawFooter();
    pdf.addPage();
    fill('#0d0d0d');pdf.rect(0,0,W,H,'F');
  };
  const chk=(y2,n=15)=>{if(y2+n>H-FOOTER_H-4){newPage();return ML;}return y2;};
  const drawFooter=()=>{
    fill('#111111');pdf.rect(0,H-FOOTER_H,W,FOOTER_H,'F');
    stroke('#333333');pdf.setLineWidth(0.2);pdf.line(0,H-FOOTER_H,W,H-FOOTER_H);
    txtC('#555555');pdf.setFontSize(9);pdf.setFont('helvetica','normal');
    const dataHoje=new Date().toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric'});
    pdf.text('Gerado em '+dataHoje+' · Mutantefy · Mutantes MC Itajai',W/2,H-5,{align:'center'});
  };

  // ── Background
  fill('#0d0d0d');pdf.rect(0,0,W,H,'F');

  // ── Header: #1a1a1a, logo left, title center, year right, 2px orange bottom border
  const HDR=34;
  fill('#1a1a1a');pdf.rect(0,0,W,HDR,'F');
  fill('#ff6600');pdf.rect(0,HDR-2,W,2,'F');
  // logo left
  if(logoB64)pdf.addImage(logoB64,'JPEG',ML,5,20,20);
  // title center
  txtC('#ffffff');pdf.setFont('helvetica','bold');pdf.setFontSize(13);
  pdf.text('Mutantes MC Itajai',W/2,13,{align:'center'});
  txtC('#aaaaaa');pdf.setFont('helvetica','normal');pdf.setFontSize(8);
  pdf.text('Relatorio Individual do Membro',W/2,21,{align:'center'});
  // year right
  txtC('#ff6600');pdf.setFont('helvetica','bold');pdf.setFontSize(12);
  pdf.text(String(ano),W-MR,15,{align:'right'});

  // ── Member profile row
  let y=HDR+8;
  if(fotoB64){
    pdf.addImage(fotoB64,'PNG',ML,y,24,24);
    stroke('#ff6600');pdf.setLineWidth(0.5);pdf.circle(ML+12,y+12,12,'S');
  }else{
    fill('#1a1a1a');stroke('#333333');pdf.setLineWidth(0.3);pdf.roundedRect(ML,y,24,24,2,2,'FD');
    stroke('#ff6600');pdf.setLineWidth(0.5);pdf.roundedRect(ML,y,24,24,2,2,'S');
    txtC('#ff6600');pdf.setFontSize(13);pdf.setFont('helvetica','bold');
    pdf.text((m.apelido||'?').charAt(0).toUpperCase(),ML+12,y+16,{align:'center'});
  }
  const nX=ML+28;
  txtC('#ffffff');pdf.setFontSize(14);pdf.setFont('helvetica','bold');pdf.text(m.apelido||'',nX,y+9);
  txtC('#ff6600');pdf.setFontSize(9);pdf.setFont('helvetica','normal');pdf.text(m.nivel||'Membro',nX,y+17);
  if(m.isDiretor||m.isAdmin){txtC('#4caf7d');pdf.setFontSize(7.5);pdf.setFont('helvetica','bold');pdf.text('DIRETORIA',nX,y+24);}
  y+=30;sep(y);y+=6;

  // ── Metric cards 2×2 — #1a1a1a, border #333, label #999 10px, value #ff6600 18px bold
  const pctHex=pct>=100?'#4caf7d':pct>=60?'#ff6600':'#e05252';
  const pctEvHex=pctEv>=80?'#4caf7d':pctEv>=50?'#60b8ff':'#aaaaaa';
  const pctSedeHex=pctSede>=80?'#4caf7d':pctSede>=50?'#60b8ff':'#aaaaaa';
  const cW=(CW-5)/2,cH=22;
  const cards=[
    {lbl:'Km rodados',val:kmRaw.toLocaleString('pt-BR')+' km',col:'#ff6600'},
    {lbl:'Meta ('+Math.round(META/1000)+'k km)',val:pct+'%',col:pctHex},
    {lbl:'Eventos comparecidos',val:evComp+'/'+evTotal+' ('+pctEv+'%)',col:pctEvHex},
    {lbl:'Presencas na sede',val:sc+'/'+totalSextas+' ('+pctSede+'%)',col:pctSedeHex},
  ];
  cards.forEach((c,i)=>{
    const cx=ML+(i%2)*(cW+5),cy=y+Math.floor(i/2)*(cH+4);
    fill('#1a1a1a');stroke('#333333');pdf.setLineWidth(0.25);pdf.roundedRect(cx,cy,cW,cH,2,2,'FD');
    txtC('#999999');pdf.setFontSize(10);pdf.setFont('helvetica','normal');pdf.text(c.lbl,cx+5,cy+8);
    const[r2,g2,b2]=rgb(c.col);pdf.setTextColor(r2,g2,b2);pdf.setFontSize(18);pdf.setFont('helvetica','bold');
    pdf.text(c.val,cx+5,cy+19);
  });
  y+=2*(cH+4)+6;

  // ── Bar chart — full width, #111 bg, #ff6600 bars, #444 axis
  y=chk(y,42);sep(y);y+=5;
  secTitle('Km por mes — ultimos 12 meses',y);y+=6;
  const chartH=28,maxKm2=Math.max(...meses.map(b=>b.km),1),slotW=CW/12;
  fill('#111111');stroke('#444444');pdf.setLineWidth(0.2);pdf.rect(ML,y,CW,chartH,'FD');
  meses.forEach((b,i)=>{
    const bx=ML+i*slotW;
    const bh=Math.max((b.km/maxKm2)*(chartH-2),0);
    if(b.km>0){
      fill('#ff6600');pdf.rect(bx+1,y+chartH-bh-1,slotW-2,bh,'F');
      txtC('#dddddd');pdf.setFontSize(4);

    ['Cadastro no clube',cadastroDisplay],
    m.dataIngresso?['Ingresso no clube',m.dataIngresso]:null,

  // ── Footer on last page

  const fname='relatorio-'+(m.apelido||'membro').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,'-')+'-'+ano+'.pdf';

window.exportarMensalidadesCSV=async()=>{
  try{
    const hoje=new Date();
    const meses=[];
    for(let i=0;i<6;i++){
      const d=new Date(hoje.getFullYear(),hoje.getMonth()-i,1);
      meses.push(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`);
    }
    const snap=await getDocs(collection(db,"mensalidades"));
    const pagtos={};
    snap.docs.forEach(d=>{const r=d.data();pagtos[r.membroId+"_"+r.mes]={pago:r.pago,data:r.data||""};});
    const header=["Membro",...meses.reverse()];
    const linhas=[header];
    MEMBROS.forEach(m=>{
      const linha=[m.apelido];
      meses.forEach(mes=>{
        const p=pagtos[m.uid+"_"+mes];
        linha.push(p?.pago?"Pago"+(p.data?" ("+p.data+")":""):"Pendente");
      });
      linhas.push(linha);
    });
    const csv=linhas.map(l=>l.join(";")).join("\n");
    const blob=new Blob(["\uFEFF"+csv],{type:"text/csv;charset=utf-8;"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url;a.download="mensalidades_mutantes_"+new Date().getFullYear()+".csv";a.click();
    URL.revokeObjectURL(url);
    showToast("✅ Mensalidades exportadas!");
  }catch{showToast("Erro ao exportar.",true);}
};

window.registrarComparecimento=async(membroId,apelido,eventoId)=>{
  const ev=EVENTOS.find(e=>e.id===eventoId);
  if(!ev)return;
  const btnId="btn-comp-"+membroId+"-"+eventoId;
  const btn=document.getElementById(btnId);
  if(btn){btn.disabled=true;btn.textContent="Lançando...";}
  let km=ev.dist>0?ev.dist*2:parseFloat(prompt("Distância total ida+volta (km) do evento "+ev.nome+":"));
  if(!km||isNaN(km)||km<=0){if(btn){btn.disabled=false;btn.textContent="🏁 Compareceu";}return;}
  const m=findMembro(membroId);
  try{
    const regRef=await addDoc(collection(db,"registros"),{membroId,apelido:apelido||m?.apelido||"",desc:ev.nome,data:ev.data,km,tipo:"rota",eventoId,createdAt:serverTimestamp()});
    const nt=(m?.totalKm||0)+km;
    await setDoc(doc(db,"usuarios",resolveDocId(membroId)),{totalKm:nt},{merge:true});
    if(m)m.totalKm=nt;
    await setDoc(doc(db,"presencas",membroId+"_"+eventoId),{resposta:"compareceu",compareceu:true,registroId:regRef.id,kmLancado:km},{merge:true});
    showToast("✓ "+toInt(km)+" km lançado para "+apelido+"!");
    await _recarregarPanelPresenca(eventoId);
    // Push para o membro
    const mToken=m?.fcmToken;
    if(mToken)dispararPush("🏁 Presença confirmada!",`${toInt(km)} km do evento ${ev.nome} foram lançados no seu perfil`,[mToken]);
    registrarLog("compareceu",`registrou comparecimento de ${apelido} — ${toInt(km)} km`,ev.nome);
  }catch(e){
    showToast("Erro ao lançar km.",true);
    const btnEl=document.getElementById(btnId);
    if(btnEl){btnEl.disabled=false;btnEl.textContent="🏁 Compareceu";}
  }
};

window.recalcularTotalKm=async()=>{
  if(!confirm("Recalcular o totalKm de todos os membros?\n\nIsso vai somar todos os registros de km de cada membro e corrigir o valor no Firestore.\nPode demorar alguns segundos."))return;
  showToast("Recalculando...");
  try{
    const snap=await getDocs(collection(db,"registros"));
    const totais={};
    snap.docs.forEach(d=>{
      const r=d.data();
      const id=r.membroId;
      if(id&&typeof r.km==="number")totais[id]=(totais[id]||0)+r.km;
    });
    const batch=[];
    for(const[id,total] of Object.entries(totais)){
      const docId=resolveDocId(id)||id;
      batch.push(setDoc(doc(db,"usuarios",docId),{totalKm:Math.round(total)},{merge:true}));
      const m=MEMBROS.find(m=>m.uid===id||m.authUid===id);
      if(m)m.totalKm=Math.round(total);
    }
    await Promise.all(batch);
    await carregarMembros();
    showToast(`✓ totalKm recalculado para ${Object.keys(totais).length} membros`);
    render();
  }catch(e){showToast("Erro: "+e.message,true);}
};

let _mapa=null;
const _mapas={};

async function _montarMapa(map,orig,dest,nome,pedInfo){
  const dot=L.divIcon({className:"",html:'<div style="width:13px;height:13px;background:#e8670a;border-radius:50%;border:2px solid #fff;box-shadow:0 0 6px #000"></div>',iconSize:[13,13],iconAnchor:[6,6]});
  L.marker(orig,{icon:dot,zIndexOffset:1000}).addTo(map).bindPopup("<b>🏁 Itajaí, SC</b><br><small>Ponto de partida</small>");
  L.marker(dest,{icon:dot,zIndexOffset:1000}).addTo(map).bindPopup(`<b>🏁 ${nome}</b><br><small>Destino</small>`);

  const uid="mp"+Math.random().toString(36).slice(2,7);
  const LABELS=["⚡ Mais rápida","🔀 Alternativa 1","🔀 Alternativa 2"];
  const CORES=["#e8670a","#5b8dd9","#a259d9"];
  let bounds=null,polylines=[],rotaAtual=0;

  // Atualiza painel ao trocar rota
  const atualizarPainel=(idx)=>{
    const info=polylines[idx]?._info;
    if(!info)return;
    const el=document.getElementById(uid+"-info");
    if(el){
      el.innerHTML=`<div style="font-weight:700;margin-bottom:2px">${LABELS[idx]||"Rota"}</div>
        <div>🛣️ ${info.distKm.toLocaleString("pt-BR")} km ida</div>
        <div>⏱️ ~${info.tempoStr} de viagem</div>
        ${pedInfo?`<div style="color:#aaa;font-size:10px;margin-top:3px;line-height:1.4">🚏 ${pedInfo}</div>`:""}`;
    }
  };

  const selecionarRota=(idx)=>{
    rotaAtual=idx;
    polylines.forEach((p,i)=>{
      p.setStyle({color:i===idx?CORES[i]:"#444",weight:i===idx?5:3,opacity:i===idx?.9:.4});
      if(i===idx)p.bringToFront();
    });
    atualizarPainel(idx);
    // mover marcadores para frente
    map.eachLayer(l=>{if(l instanceof L.Marker)l.bringToFront?.();});
  };

  try{
    const r=await fetch(`https://router.project-osrm.org/route/v1/driving/${orig[1]},${orig[0]};${dest[1]},${dest[0]}?overview=full&geometries=geojson&alternatives=true`);
    const d=await r.json();
    if(!d.routes?.length)throw"";

    // Desenha alternativas primeiro (ficam atrás)
    [...d.routes].reverse().forEach((route,ri)=>{
      const i=d.routes.length-1-ri;
      const distKm=Math.round(route.distance/1000);
      const durMin=Math.round(route.duration/60);
      const h=Math.floor(durMin/60),m=durMin%60;
      const tempoStr=h>0?`${h}h${m>0?m+"min":""}`:`${m}min`;
      const pts=route.geometry.coordinates.map(c=>[c[1],c[0]]);
      const poly=L.polyline(pts,{color:i===0?CORES[0]:"#444",weight:i===0?5:3,opacity:i===0?.9:.4,interactive:true}).addTo(map);
      poly._info={distKm,tempoStr};
      poly.bindPopup(`<b>${LABELS[i]||"Rota"}</b><br>📍 ${distKm.toLocaleString("pt-BR")} km · ⏱️ ~${tempoStr}${i>0?`<br><small style="color:#aaa">Clique na linha para selecionar</small>`:""}`);
      poly.on("click",()=>selecionarRota(i));
      polylines[i]=poly;
      if(!bounds)bounds=poly.getBounds();else bounds.extend(poly.getBounds());
    });

    map.fitBounds(bounds,{padding:[20,20]});
  }catch{
    const poly=L.polyline([orig,dest],{color:CORES[0],weight:3,dashArray:"8,5",opacity:.7}).addTo(map);
    poly._info={distKm:0,tempoStr:"—"};
    poly.bindPopup(`<b>${nome}</b>`);
    polylines[0]=poly;
    bounds=L.latLngBounds([orig,dest]);
    map.fitBounds(bounds,{padding:[30,30]});
  }

  // Legenda de rotas (só se tiver alternativas)
  const temAlts=polylines.length>1;
  const infoCtrl=L.control({position:"bottomleft"});
  infoCtrl.onAdd=()=>{
    const div=L.DomUtil.create("div");
    div.style.cssText="background:rgba(10,10,10,.93);border:1px solid #333;border-radius:8px;padding:8px 10px;font-size:11px;color:#eee;line-height:1.7;max-width:175px;box-shadow:0 2px 8px rgba(0,0,0,.5)";
    const btns=temAlts?`<div style="display:flex;gap:5px;margin-bottom:7px;flex-wrap:wrap">${polylines.map((p,i)=>`<button onclick="window._selRota_${uid}(${i})" style="padding:3px 8px;border-radius:5px;border:2px solid ${CORES[i]};background:${i===0?CORES[i]:"transparent"};color:${i===0?"#fff":CORES[i]};font-size:10px;font-weight:700;cursor:pointer;font-family:inherit" id="${uid}-btn-${i}">${LABELS[i]}</button>`).join("")}</div>`:"";
    div.innerHTML=`${btns}<div id="${uid}-info"></div><div id="${uid}-pontos" style="color:#4caf7d;margin-top:4px">⛽ Buscando postos...</div>`;
    return div;
  };
  infoCtrl.addTo(map);

  // Expor função de seleção globalmente para os botões do painel
  window[`_selRota_${uid}`]=(idx)=>{
    selecionarRota(idx);
    polylines.forEach((_,i)=>{
      const btn=document.getElementById(`${uid}-btn-${i}`);
      if(btn){btn.style.background=i===idx?CORES[i]:"transparent";btn.style.color=i===idx?"#fff":CORES[i];}
    });
  };
  atualizarPainel(0);

  // Postos + pedágios via Overpass
  if(bounds){
    const sw=bounds.getSouthWest(),ne=bounds.getNorthEast();
    const postoIcon=L.divIcon({className:"",html:'<div style="background:#0f1f0f;border:1.5px solid #4caf7d;border-radius:5px;padding:1px 4px;font-size:12px;box-shadow:0 2px 5px rgba(0,0,0,.7);line-height:1.3">⛽</div>',iconSize:[24,20],iconAnchor:[12,10]});
    const pedagioIcon=L.divIcon({className:"",html:'<div style="background:#1a1000;border:1.5px solid #f5c518;border-radius:5px;padding:1px 4px;font-size:12px;box-shadow:0 2px 5px rgba(0,0,0,.7);line-height:1.3">🚏</div>',iconSize:[24,20],iconAnchor:[12,10]});
    const q=`[out:json][timeout:25];(node["amenity"="fuel"](${sw.lat},${sw.lng},${ne.lat},${ne.lng});node["barrier"="toll_booth"](${sw.lat},${sw.lng},${ne.lat},${ne.lng}););out body 60;`;
    fetch(`https://overpass-api.de/api/interpreter?data=${encodeURIComponent(q)}`)
      .then(r=>r.json())
      .then(pd=>{
        let postos=0,pedagios=0;
        (pd.elements||[]).forEach(node=>{
          if(node.tags?.amenity==="fuel"){
            postos++;
            const n=node.tags?.name||node.tags?.brand||"Posto";
            const brand=node.tags?.brand||"";
            L.marker([node.lat,node.lon],{icon:postoIcon}).addTo(map)
              .bindPopup(`<b>⛽ ${n}</b>${brand&&brand!==n?`<br><small style="color:#aaa">${brand}</small>`:""}`);
          }else if(node.tags?.barrier==="toll_booth"){
            pedagios++;
            const n=node.tags?.name||node.tags?.ref||"Praça de pedágio";
            const op=node.tags?.operator||"";
            const taxa=node.tags?.charge||"";
            L.marker([node.lat,node.lon],{icon:pedagioIcon}).addTo(map)
              .bindPopup(`<b>🚏 ${n}</b>${op?`<br><small style="color:#aaa">${op}</small>`:""}${taxa?`<br><small style="color:#f5c518">${taxa}</small>`:""}`);
          }
        });
        const el=document.getElementById(uid+"-pontos");
        if(el)el.innerHTML=`${postos>0?`⛽ ${postos} postos`:"⛽ Sem postos mapeados"}${pedagios>0?`<br>🚏 ${pedagios} pedágios`:""}`;
      })
      .catch(()=>{const el=document.getElementById(uid+"-pontos");if(el)el.textContent="";});
  }
}

async function atualizarMapaRota(evId,destCoords,nome,pedInfo){
  const card=document.getElementById("mapa-card");
  const el=document.getElementById("ev-mapa");
  if(!card||!el||!destCoords){if(card)card.style.display="none";return;}
  card.style.display="block";
  // Recriar mapa se saiu do DOM ou trocou de evento
  if(_mapa&&(!document.body.contains(_mapa.getContainer())||_mapa._evId!==evId)){
    _mapa.remove();_mapa=null;
  }
  if(!_mapa){
    _mapa=L.map(el,{zoomControl:true,attributionControl:false});
    _mapa._evId=evId;
    L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",{maxZoom:19}).addTo(_mapa);
    await _montarMapa(_mapa,COORD_ITAJAI,destCoords,nome,pedInfo);
  }else{
    setTimeout(()=>_mapa.invalidateSize(),50);
  }
}

function findMembro(id){return MEMBROS.find(m=>m.uid===id)||MEMBROS.find(m=>m.authUid===id);}

async function migrarParaApelidoLowerId(){
  const snap=await getDocs(collection(db,"usuarios"));
  const antigos=snap.docs.filter(d=>{
    const data=d.data();

    return esperado&&d.id!==esperado&&d.id!=="admin";

}

  const semResp=MEMBROS.filter(m=>!responderam.has(m.uid));
  const secao=(titulo,cor,lista,statusFn)=>lista.length?`
    <div style="font-size:10px;font-weight:700;color:${cor};text-transform:uppercase;letter-spacing:.5px;margin:10px 0 4px">${titulo} (${lista.length})</div>
    ${lista.map(p=>_presCardMembro(p,ev,statusFn(p))).join("")}`:"";
  return`${confirmados.length?`<button onclick="window.confirmarTodosPresentes(${ev.id})" style="width:100%;padding:11px;border-radius:8px;border:1px solid rgba(76,175,125,.3);background:rgba(76,175,125,.12);color:var(--green);font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;margin-bottom:6px">🏁 Confirmar todos os confirmados (${confirmados.length})</button>`:""}
    ${secao("🟢 Compareceram","var(--green)",compareceram,()=>"compareceu")}
    ${secao("🟡 Confirmados","#f5c518",confirmados,p=>normaliza(p.resposta))}
    ${secao("🔴 Desistiram","var(--danger)",desistiram,p=>normaliza(p.resposta))}
    ${semResp.length?`<div style="font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:10px 0 4px">⚪ SEM RESPOSTA (${semResp.length})</div>${semResp.map(m=>_presCardMembro({membroId:m.uid,apelido:m.apelido,registroId:null,kmLancado:0},ev,"pendente")).join("")}`:""}
    <div style="font-size:10px;color:var(--muted);margin-top:10px;padding-top:8px;border-top:1px solid var(--border)">🟢${compareceram.length} · 🟡${confirmados.length} · 🔴${desistiram.length} · ⚪${semResp.length}</div>`;
}

async function carregarProximosEventos(){
  const wrap=document.getElementById("pres-proximos-wrap");
  if(!wrap)return;
  wrap.innerHTML=`<span class="spin">⟳</span>`;
  try{
    const hoje=new Date().toISOString().slice(0,10);
    const futuros=EVENTOS.filter(e=>e.data>=hoje&&e.destino!=="A confirmar");
    if(!futuros.length){wrap.innerHTML=`<div style="font-size:13px;color:var(--muted)">Nenhum evento próximo.</div>`;return;}
    const [presSnaps,regSnaps]=await Promise.all([
      Promise.all(futuros.map(ev=>getDocs(query(collection(db,"presencas"),where("eventoId","==",ev.id))))),
      Promise.all(futuros.map(ev=>getDocs(query(collection(db,"registros"),where("eventoId","==",ev.id)))))
    ]);
    let html="";
    futuros.forEach((ev,i)=>{
      // Build enriched pDocs: presencas as base, registros wins for compareceu status
      const presMap={};
      presSnaps[i].docs.forEach(d=>{const p=d.data();presMap[p.membroId]=p;});
      regSnaps[i].docs.forEach(d=>{
        const r={...d.data(),id:d.id};
        const base=presMap[r.membroId]||{membroId:r.membroId,apelido:r.apelido};
        presMap[r.membroId]={...base,compareceu:true,resposta:"compareceu",registroId:r.id,kmLancado:r.km};
      });
      const pDocs=Object.values(presMap);
      const nComp=pDocs.filter(p=>p.compareceu||p.resposta==="compareceu").length;
      const nConf=pDocs.filter(p=>!p.compareceu&&p.resposta!=="compareceu"&&(p.resposta==="sim"||p.resposta==="confirmado")).length;
      const nDes=pDocs.filter(p=>!p.compareceu&&p.resposta!=="compareceu"&&(p.resposta==="nao"||p.resposta==="desistiu")).length;
      const isFirst=i===0;
      html+=`<div style="border:1px solid var(--border);border-radius:10px;margin-bottom:8px;overflow:hidden">
        <button onclick="window.togglePresAcc(${ev.id})" style="width:100%;background:var(--bg2);border:none;padding:12px 14px;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:10px;text-align:left">
          <div style="flex:1;min-width:0">
            <div style="font-size:13px;font-weight:600;color:var(--white);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${ev.nome}</div>
            <div style="font-size:11px;color:var(--muted)">${fmtDate(ev.data)} · ${ev.destino}</div>
          </div>
          <div style="display:flex;gap:4px;align-items:center;flex-shrink:0">
            ${nComp?`<span style="background:rgba(76,175,125,.2);color:var(--green);border-radius:20px;padding:2px 7px;font-size:10px;font-weight:700">🟢${nComp}</span>`:""}
            ${nConf?`<span style="background:rgba(245,197,24,.15);color:#f5c518;border-radius:20px;padding:2px 7px;font-size:10px;font-weight:700">🟡${nConf}</span>`:""}
            ${nDes?`<span style="background:rgba(224,82,82,.1);color:var(--danger);border-radius:20px;padding:2px 7px;font-size:10px;font-weight:700">🔴${nDes}</span>`:""}
            <span id="pres-acc-ic-${ev.id}" style="color:var(--muted);font-size:12px;margin-left:2px">${isFirst?"▲":"▼"}</span>
          </div>
        </button>
        <div id="pres-acc-body-${ev.id}" style="display:${isFirst?"block":"none"};padding:12px 14px;border-top:1px solid var(--border);background:var(--bg3)">
          ${_htmlPresencaEvento(ev,pDocs)}
        </div>
      </div>`;
    });
    wrap.innerHTML=html;
  }catch(e){wrap.innerHTML=`<div style="color:var(--danger);font-size:12px">Erro ao carregar.</div>`;}
}

async function carregarCorpoEventoAnt(evId){
  const corpo=document.getElementById(`ant-acc-body-${evId}`);
  if(!corpo)return;
  corpo.innerHTML=`<span class="spin">⟳</span>`;
  try{
    const ev=EVENTOS.find(e=>e.id===evId);
    const regSnap=await getDocs(query(collection(db,"registros"),where("eventoId","==",evId)));
    const regs=regSnap.docs.map(d=>({id:d.id,...d.data()}));
    const comRegs=new Set(regs.map(r=>r.membroId));
    const naoCompareceram=MEMBROS.filter(m=>!comRegs.has(m.uid));
    const kmDefault=ev&&ev.dist>0?ev.dist*2:0;
    let html=`<div style="font-size:11px;font-weight:700;color:var(--green);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px">🟢 Compareceram (${regs.length})</div>`;
    if(!regs.length){
      html+=`<div style="font-size:12px;color:var(--muted);margin-bottom:12px">Nenhum registro.</div>`;
    }else{
      regs.forEach(r=>{
        html+=`<div id="ant-row-${r.id}" style="display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--border)">
          <div style="flex:1;min-width:0">
            <div style="font-size:13px;font-weight:600;color:var(--white)">${r.apelido||"?"}</div>
            <div style="font-size:11px;color:var(--muted)">${toInt(r.km)} km</div>
          </div>
          <div id="ant-btns-${r.id}" style="display:flex;gap:4px">
            <button onclick="window.mostrarAntEdit('${r.id}',${r.km},${evId})" style="padding:6px 10px;border-radius:7px;border:1px solid var(--border);background:transparent;color:var(--white);font-size:11px;cursor:pointer;font-family:inherit">${li("pencil",14)}</button>
            <button onclick="window.excluirAntReg('${r.id}','${r.membroId}',${r.km},${evId})" style="padding:6px 9px;border-radius:7px;border:1px solid var(--danger);background:transparent;color:var(--danger);font-size:11px;cursor:pointer;font-family:inherit">✕</button>
          </div>
        </div>
        <div id="ant-edit-form-${r.id}" style="display:none;padding:6px 0 8px;border-bottom:1px solid var(--border)">
          <div style="display:flex;gap:8px;align-items:center">
            <input id="ant-edit-inp-${r.id}" type="number" min="1" step="1" value="${r.km}" placeholder="km" style="flex:1;padding:7px 10px;border-radius:8px;border:1px solid var(--border);background:var(--bg3);color:var(--white);font-size:13px;font-family:inherit"/>
            <button onclick="window.salvarAntEdit('${r.id}','${r.membroId}',${r.km},${evId})" style="padding:7px 12px;border-radius:8px;border:none;background:var(--green);color:#fff;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit">Salvar</button>
            <button onclick="window.cancelarAntEdit('${r.id}')" style="padding:7px 9px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:12px;cursor:pointer;font-family:inherit">✕</button>
          </div>
        </div>`;
      });
    }
    html+=`<div style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:14px 0 6px">⚪ Não compareceram (${naoCompareceram.length})</div>`;
    if(!naoCompareceram.length){
      html+=`<div style="font-size:12px;color:var(--muted)">Todos já têm registro.</div>`;
    }else{
      naoCompareceram.forEach(m=>{
        html+=`<div id="ant-add-row-${m.uid}" style="display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--border)">
          <div style="flex:1;min-width:0"><div style="font-size:13px;font-weight:600;color:var(--white)">${m.apelido||"?"}</div></div>
          <button id="btn-ant-add-${m.uid}" onclick="window.mostrarAntAdd('${m.uid}',${evId})" style="padding:6px 11px;border-radius:7px;border:1px solid var(--green);background:transparent;color:var(--green);font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap">+ Adicionar</button>
        </div>
        <div id="ant-add-form-${m.uid}" style="display:none;padding:6px 0 8px;border-bottom:1px solid var(--border)">
          <div style="display:flex;gap:8px;align-items:center">
            <input id="ant-add-inp-${m.uid}" type="number" min="1" step="1" value="${kmDefault||""}" placeholder="km ida+volta" style="flex:1;padding:7px 10px;border-radius:8px;border:1px solid var(--border);background:var(--bg3);color:var(--white);font-size:13px;font-family:inherit"/>
            <button onclick="window.salvarAntAdd('${m.uid}','${m.apelido||""}',${evId})" style="padding:7px 12px;border-radius:8px;border:none;background:var(--green);color:#fff;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit">Salvar</button>
            <button onclick="window.cancelarAntAdd('${m.uid}')" style="padding:7px 9px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:12px;cursor:pointer;font-family:inherit">✕</button>
          </div>
        </div>`;
      });
    }
    corpo.innerHTML=html;
  }catch(e){corpo.innerHTML=`<div style="color:var(--danger);font-size:12px">Erro: ${e.message}</div>`;}
}

window.mostrarAntEdit=(regId,kmAtual,evId)=>{
  const btns=document.getElementById("ant-btns-"+regId);
  const form=document.getElementById("ant-edit-form-"+regId);
  if(btns)btns.style.display="none";
  if(form)form.style.display="block";
  const inp=document.getElementById("ant-edit-inp-"+regId);
  if(inp){inp.value=kmAtual;inp.focus();}
};
window.cancelarAntEdit=(regId)=>{
  const btns=document.getElementById("ant-btns-"+regId);
  const form=document.getElementById("ant-edit-form-"+regId);
  if(btns)btns.style.display="";
  if(form)form.style.display="none";
};
window.salvarAntEdit=async(regId,membroId,kmAtual,evId)=>{
  const inp=document.getElementById("ant-edit-inp-"+regId);
  const km=parseFloat(inp?.value);
  if(!km||isNaN(km)||km<=0){showToast("Informe um km válido.",true);return;}
  inp.disabled=true;
  try{
    await setDoc(doc(db,"registros",regId),{km},{merge:true});
    const diff=km-kmAtual;
    const mSnap=await getDoc(doc(db,"usuarios",resolveDocId(membroId)));
    const nt=Math.max(0,(mSnap.data()?.totalKm||0)+diff);
    await setDoc(doc(db,"usuarios",resolveDocId(membroId)),{totalKm:nt},{merge:true});
    const m=findMembro(membroId);if(m)m.totalKm=nt;
    showToast(`✓ Km atualizado para ${toInt(km)}!`);
    await carregarCorpoEventoAnt(evId);
  }catch(e){showToast("Erro: "+e.message,true);inp.disabled=false;}
};
window.excluirAntReg=async(regId,membroId,km,evId)=>{
  if(!confirm("Excluir este registro?"))return;
  try{
    await deleteDoc(doc(db,"registros",regId));
    const mSnap=await getDoc(doc(db,"usuarios",resolveDocId(membroId)));
    const nt=Math.max(0,(mSnap.data()?.totalKm||0)-km);
    await setDoc(doc(db,"usuarios",resolveDocId(membroId)),{totalKm:nt},{merge:true});
    const m=findMembro(membroId);if(m)m.totalKm=nt;
    showToast("✓ Registro excluído.");
    await carregarCorpoEventoAnt(evId);
  }catch(e){showToast("Erro: "+e.message,true);}
};
window.mostrarAntAdd=(uid,evId)=>{
  const btn=document.getElementById("btn-ant-add-"+uid);
  const form=document.getElementById("ant-add-form-"+uid);
  if(btn)btn.style.display="none";
  if(form)form.style.display="block";

window.cancelarAntAdd=(uid)=>{

  const form=document.getElementById("ant-add-form-"+uid);

  if(form)form.style.display="none";

window.salvarAntAdd=async(uid,apelido,evId)=>{
  const inp=document.getElementById("ant-add-inp-"+uid);
  const km=parseFloat(inp?.value);
  if(!km||isNaN(km)||km<=0){showToast("Informe um km válido.",true);return;}
  const ev=EVENTOS.find(e=>e.id===evId);
  if(!ev)return;
  inp.disabled=true;
  try{
    await addDoc(collection(db,"registros"),{membroId:uid,apelido,desc:ev.nome,data:ev.data,km,tipo:"rota",eventoId:evId,createdAt:serverTimestamp()});
    const mSnap=await getDoc(doc(db,"usuarios",resolveDocId(uid)));
    const nt=(mSnap.data()?.totalKm||0)+km;
    await setDoc(doc(db,"usuarios",resolveDocId(uid)),{totalKm:nt},{merge:true});
    const m=findMembro(uid);if(m)m.totalKm=nt;
    showToast(`✓ ${toInt(km)} km lançado para ${apelido}!`);
    await carregarCorpoEventoAnt(evId);
  }catch(e){showToast("Erro: "+e.message,true);inp.disabled=false;}
};

window.selecionarEventoMassa=async(evId)=>{
  const corpo=document.getElementById("massa-corpo");
  const gestaoWrap=document.getElementById("gestao-evento-wrap");
  if(!evId){
    if(corpo)corpo.innerHTML="";
    if(gestaoWrap)gestaoWrap.style.display="none";
    return;
  }
  const ev=EVENTOS.find(e=>e.id===evId);
  if(!ev||!corpo)return;
  const kmDefault=ev.dist>0?ev.dist*2:0;
  const membrosHtml=MEMBROS.map(m=>`
    <div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)">
      <input type="checkbox" id="chk-${m.uid}" value="${m.uid}" style="width:16px;height:16px;accent-color:var(--orange);cursor:pointer;flex-shrink:0"/>
      <label for="chk-${m.uid}" style="flex:1;font-size:13px;font-weight:600;color:var(--white);cursor:pointer;user-select:none">${m.apelido}</label>
      <div style="display:flex;align-items:center;gap:4px;flex-shrink:0">
        <input type="number" id="km-massa-${m.uid}" value="${kmDefault||""}" placeholder="km" min="1" step="1" style="width:70px;padding:5px 8px;border-radius:7px;border:1px solid var(--border);background:var(--bg3);color:var(--white);font-size:12px;font-family:inherit;text-align:right"/>
        <span style="font-size:11px;color:var(--muted)">km</span>
      </div>
    </div>`).join("");
  corpo.innerHTML=`
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
      <div style="font-size:11px;color:var(--muted)">Km padrão: <strong style="color:var(--white)">${kmDefault?toInt(kmDefault)+" km":"—"}</strong></div>
      <button onclick="window.marcarTodosMassa()" style="font-size:11px;color:var(--orange);background:transparent;border:none;cursor:pointer;font-family:inherit;font-weight:600;padding:0">Selecionar todos</button>
    </div>
    <div style="max-height:300px;overflow-y:auto;margin-bottom:10px">${membrosHtml}</div>
    <button onclick="window.lancarKmMassa(${ev.id})" style="width:100%;padding:12px;border-radius:10px;border:none;background:var(--orange);color:#fff;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit">🏁 Lançar para selecionados</button>`;
  if(gestaoWrap)gestaoWrap.style.display="block";
  await window.carregarGestaoEvento(evId);
};

window.marcarTodosMassa=()=>{
  MEMBROS.forEach(m=>{const el=document.getElementById("chk-"+m.uid);if(el)el.checked=true;});
};

window.lancarKmMassa=async(evId)=>{
  const ev=EVENTOS.find(e=>e.id===evId);
  if(!ev)return;
  const selecionados=MEMBROS.filter(m=>document.getElementById("chk-"+m.uid)?.checked);
  if(!selecionados.length){showToast("Selecione ao menos um membro.",true);return;}
  const kms={};
  for(const m of selecionados){
    const km=parseFloat(document.getElementById("km-massa-"+m.uid)?.value);
    if(!km||isNaN(km)||km<=0){showToast(`Informe o km para ${m.apelido}.`,true);return;}
    kms[m.uid]=km;
  }
  showToast(`Lançando para ${selecionados.length} membro(s)...`);
  try{
    for(const m of selecionados){
      const km=kms[m.uid];
      await addDoc(collection(db,"registros"),{membroId:m.authUid,apelido:m.apelido||"",desc:ev.nome,data:ev.data,km,tipo:"rota",eventoId:ev.id,createdAt:serverTimestamp()});
      const nt=(m.totalKm||0)+km;
      await setDoc(doc(db,"usuarios",m.uid),{totalKm:nt},{merge:true});
      m.totalKm=nt;
    }
    showToast(`✓ ${selecionados.length} lançamento(s) salvos!`);
    selecionados.forEach(m=>{const el=document.getElementById("chk-"+m.uid);if(el)el.checked=false;});
    await window.carregarGestaoEvento(evId);
  }catch(e){showToast("Erro: "+e.message,true);}
};

window.carregarGestaoEvento=async(evId)=>{

window.editarKmGestao=async(regId,membroId,kmAtual,evId)=>{

async function carregarPresencasAdmin(){
  const wrap=document.getElementById("presenca-wrap");
  if(!wrap)return;
  wrap.innerHTML=`<span class="spin">⟳</span>`;
  try{
    const hoje=new Date().toISOString().slice(0,10);
    const futuros=EVENTOS.filter(e=>e.data>=hoje&&e.destino!=="A confirmar");
    const passados=EVENTOS.filter(e=>e.data<hoje).reverse();
    if(!futuros.length&&!passados.length){wrap.innerHTML=`<div style="font-size:13px;color:#555">Nenhum evento.</div>`;return;}
    // Carrega todos os futuros em paralelo
    const snaps=await Promise.all(futuros.map(ev=>getDocs(query(collection(db,"presencas"),where("eventoId","==",ev.id)))));
    let html="";
    futuros.forEach((ev,i)=>{
      const pDocs=snaps[i].docs.map(d=>d.data());
      const nComp=pDocs.filter(p=>p.compareceu||p.resposta==="compareceu").length;
      const nConf=pDocs.filter(p=>!p.compareceu&&p.resposta!=="compareceu"&&(p.resposta==="sim"||p.resposta==="confirmado")).length;
      const nDes=pDocs.filter(p=>!p.compareceu&&p.resposta!=="compareceu"&&(p.resposta==="nao"||p.resposta==="desistiu")).length;
      const isFirst=i===0;
      html+=`<div style="border:1px solid var(--border);border-radius:10px;margin-bottom:8px;overflow:hidden">
        <button onclick="window.togglePresAcc(${ev.id})" style="width:100%;background:var(--bg2);border:none;padding:12px 14px;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:10px;text-align:left">
          <div style="flex:1;min-width:0">

            ${nComp?`<span style="background:rgba(76,175,125,.2);color:var(--green);border-radius:20px;padding:2px 7px;font-size:10px;font-weight:700">🟢${nComp}</span>`:""}

      html+=`<div style="border-top:1px solid var(--border);margin:12px 0 8px"></div>
        <button onclick="window.togglePresAnteriores()" style="width:100%;background:transparent;border:none;color:var(--muted);font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;text-align:left;display:flex;justify-content:space-between;align-items:center;text-transform:uppercase;letter-spacing:.5px;padding:4px 0;margin-bottom:6px">

        const nDes=pDocs.filter(p=>!p.compareceu&&p.resposta!=="compareceu"&&(p.resposta==="nao"||p.resposta==="desistiu")).length;

  if(!confirm(`Confirmar presença de todos os confirmados em "${ev.nome}"?`))return;
  showToast("Confirmando...");
  const pSnap=await getDocs(query(collection(db,"presencas"),where("eventoId","==",eventoId)));
  const confirmados=pSnap.docs.map(d=>d.data()).filter(p=>!p.compareceu&&(p.resposta==="sim"||p.resposta==="confirmado"));
  for(const p of confirmados){
    await window.registrarComparecimento(p.membroId,p.apelido,eventoId);
  }
};
      
onAuthStateChanged(auth,async user=>{
  // Mostrar splash com logo
  const splashLogo=document.getElementById("splash-logo");
  const splashFb=document.getElementById("splash-logo-fb");
  const logoSalva=localStorage.getItem("mutantes_logo");
  if(splashLogo&&logoSalva){splashLogo.src=logoSalva;splashLogo.style.display="block";if(splashFb)splashFb.style.display="none";}

  CU=user;TA="home";TM="painel";CONF={};
  const esconderSplash=()=>{const s=document.getElementById("splash");if(s){s.classList.add("hide");setTimeout(()=>{s.style.display="none";},650);}};
  if(!user){UP=null;REGS=[];MEMBROS=[];render();setTimeout(esconderSplash,600);return;}
  document.getElementById("app").innerHTML=`<div class="loading"><span class="spin">⟳</span> Carregando...</div>`;
  try{
    // Fase 1: perfil + logo em paralelo — identidade sempre via Firebase Auth UID, nunca localStorage
    const [qSnap,logoSnap]=await Promise.all([
      getDocs(query(collection(db,"usuarios"),where("uid","==",user.uid),limit(1))),
      getDoc(doc(db,"config","logo"))
    ]);
    if(!qSnap.empty){
      MY_DOC_ID=qSnap.docs[0].id;
      UP={uid:user.uid,...qSnap.docs[0].data()};
    }else{
      // Fallback: admin pode não ter campo uid ainda — verifica pelo email
      const adminSnap=await getDoc(doc(db,"usuarios","admin"));
      if(adminSnap.exists()&&adminSnap.data().email===user.email){
        MY_DOC_ID="admin";
        UP={uid:user.uid,...adminSnap.data()};
        // Persiste o uid no doc admin para que próximas consultas sejam diretas
        setDoc(doc(db,"usuarios","admin"),{uid:user.uid},{merge:true}).catch(()=>{});
      }else{
        // Nenhum perfil válido encontrado — bloqueia acesso
        console.error("onAuthStateChanged: sem perfil no Firestore para uid="+user.uid);
        await signOut(auth);render();setTimeout(esconderSplash,600);return;
      }
    }
    if(logoSnap.exists()){const url=logoSnap.data().url;localStorage.setItem("mutantes_logo",url);atualizarIconePWA(url);UP.logoUrl=url;}
    // Fase 2: todo o resto em paralelo
    const tarefas=[carregarRegistros(),carregarConfirmacoes(),carregarPedagiosCustom(),carregarEncontros(),carregarMembros(),carregarProxEventoSede(),carregarConfEventosSede()];
    if(UP.isAdmin||UP.isDiretor||UP.isBarman){tarefas.push(carregarSedePresencas());window._sedeCauntsLoaded=true;}
    await Promise.all(tarefas);
    registrarTokenPush();
  }catch(e){console.error(e);}
  render();
  // Esconder splash
  setTimeout(esconderSplash,800);
  // Confete se bateu a meta recentemente (primeiro login do dia com meta>=100%)
  const km=UP.totalKm||0;
  if(km>=META){
    const key="meta_confete_"+new Date().toDateString();
    if(!localStorage.getItem(key)){localStorage.setItem(key,"1");setTimeout(dispararConfete,1200);}
  }
});
</script>
