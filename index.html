<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="theme-color" content="#e8670a"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="Mutantes MC"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<link id="apple-touch-icon" rel="apple-touch-icon" href=""/>
<link id="pwa-manifest" rel="manifest" href="manifest.json"/>
<title>MUTANTES MC ITAJAÍ — Km Tracker</title>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
<meta http-equiv="Pragma" content="no-cache"/>
<meta http-equiv="Expires" content="0"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0f0f0f;--bg2:rgba(255,255,255,.04);--bg3:rgba(255,255,255,.07);--border:rgba(255,255,255,.08);--orange:#e8670a;--orange-glow:rgba(232,103,10,.28);--white:#ffffff;--muted:rgba(255,255,255,.85);--danger:#e05252;--green:#4caf7d;--shadow-card:0 8px 32px rgba(0,0,0,.4),0 1px 0 rgba(255,255,255,.05);--transition:200ms ease}


body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--white);min-height:100vh;font-size:15px;line-height:1.5}
body::before{content:'';position:fixed;inset:0;background:url('mobile.png') center/cover no-repeat;z-index:-2;pointer-events:none}
body::after{content:'';position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:-1;pointer-events:none}
.app{max-width:480px;margin:0 auto;background:transparent;height:100vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 0 80px rgba(0,0,0,.8),0 0 0 1px rgba(255,255,255,.03)}

/* ── LAYOUT DESKTOP ────────────────────────────────── */
@media(min-width:768px){
  body::before{background-image:url('desktop1.png')}

  .app{
    max-width:100%;height:100vh;
    display:grid;
    grid-template-columns:200px 1fr;
    grid-template-rows:72px 1fr;
    grid-template-areas:
      "sidebar header"
      "sidebar content";
    box-shadow:none;border-radius:0;
    overflow:hidden;
  }

  /* Header fica no topo direito */
  .header{
    grid-area:header;
    padding:10px 24px !important;
    height:72px;
    border:none !important;
    background:transparent !important;
    backdrop-filter:none !important;
    -webkit-backdrop-filter:none !important;
    box-shadow:none !important;
  }
  .header-info h2{font-size:15px !important;font-weight:600 !important}
  .header-info p{font-size:11px !important;margin-top:1px !important}

  /* Sidebar esquerda */
  .bnav{
    grid-area:sidebar;
    flex-direction:column !important;
    height:100%;width:100%;
    border:none !important;
    padding:20px 10px 16px !important;
    overflow-y:auto;gap:2px !important;
    flex-shrink:0;
    justify-content:flex-start !important;
    align-items:stretch !important;
    background:transparent !important;
    backdrop-filter:none !important;
    -webkit-backdrop-filter:none !important;
    box-shadow:none !important;
  }
  .bnav-item{
    flex:none !important;min-height:42px;width:100%;
    flex-direction:row !important;justify-content:flex-start !important;
    gap:10px !important;padding:10px 14px !important;
    border-radius:12px !important;text-align:left;
    transition:background .18s,box-shadow .18s !important;
  }
  .bnav-item:hover{background:rgba(255,255,255,.06) !important}
  .bnav-item.nav-active{
    background:rgba(232,103,10,.14) !important;
    box-shadow:inset 0 0 0 1px rgba(232,103,10,.2),0 2px 12px rgba(232,103,10,.1) !important;
  }
  .bnav-icon{font-size:18px !important;width:22px;text-align:center}
  .bnav-label{font-size:13px !important;font-weight:500 !important;display:block !important}
  .bnav-item.nav-active .bnav-label{color:var(--orange) !important;font-weight:600 !important}

  /* Logo do clube no topo da sidebar */
  .bnav::before{
    content:"🏍️ Mutantes MC";
    display:block;
    font-size:11px;font-weight:700;
    color:var(--orange);
    text-transform:uppercase;letter-spacing:1px;
    padding:0 12px 14px;
    border-bottom:1px solid rgba(255,255,255,.07);
    margin-bottom:10px;width:100%;
  }

  /* Conteúdo principal */
  .body{
    grid-area:content;
    flex:1;
    width:100%;
    padding:2rem !important;
    overflow-y:auto;
  }

  /* Cards em grid responsivo no painel */
  .desktop-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
  .desktop-grid .card{margin-bottom:0}
}

/* ── LOGIN DESKTOP ─────────────────────────────────── */
@media(min-width:768px){
  .app:has(.login-wrap){
    display:flex;
    align-items:center;
    justify-content:center;
    background:transparent;
  }

  .login-wrap{
    width: 420px;
    min-width: 420px;
    background: rgba(22,22,22,.9);
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 24px;
    padding: 44px;
    box-shadow: 0 24px 64px rgba(0,0,0,.7),0 0 0 1px rgba(232,103,10,.07);
  }

  .login-wrap img,
  .login-wrap > div:first-child {
    margin: 0 auto 20px;
    display: block;
  }
}
.splash{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;transition:opacity .6s,transform .6s}
.splash.hide{opacity:0;transform:scale(1.05);pointer-events:none}
.splash-logo{width:130px;height:130px;border-radius:50%;border:3px solid var(--orange);object-fit:contain;background:#111;animation:splashPulse 1.5s ease-in-out infinite;box-shadow:0 0 30px rgba(232,103,10,.4)}
@keyframes splashPulse{0%,100%{box-shadow:0 0 20px rgba(232,103,10,.3)}50%{box-shadow:0 0 40px rgba(232,103,10,.7)}}
.splash-title{font-size:20px;font-weight:700;letter-spacing:2px;margin-top:20px;color:var(--white)}
.splash-sub{font-size:12px;color:var(--muted);margin-top:4px;letter-spacing:1px}
.splash-dots{display:flex;gap:6px;margin-top:24px}
.splash-dot{width:8px;height:8px;border-radius:50%;background:var(--orange);animation:splashDot 1.2s ease-in-out infinite}
.splash-dot:nth-child(2){animation-delay:.2s}
.splash-dot:nth-child(3){animation-delay:.4s}
@keyframes splashDot{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1.2)}}
.confete{position:fixed;inset:0;pointer-events:none;z-index:9998;overflow:hidden}
.confete-p{position:absolute;width:8px;height:8px;border-radius:2px;animation:confeteFall linear forwards}
@keyframes confeteFall{0%{top:-20px;opacity:1;transform:rotate(0deg)}100%{top:110vh;opacity:0;transform:rotate(720deg)}}
.header{display:flex;align-items:center;gap:12px;padding:11px 16px;border-bottom:1px solid rgba(232,103,10,.22);position:relative;overflow:hidden;background:rgba(0,0,0,.2);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);flex-shrink:0}
.header-flames{position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent 0%,rgba(232,103,10,.6) 20%,#e8670a 40%,#ff7a1a 60%,rgba(232,103,10,.6) 80%,transparent 100%)}
.header-info h2{font-size:17px;font-weight:700}
.header-info p{font-size:12px;color:var(--muted);margin-top:2px}
.header-right{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.body{padding:16px;flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.bnav{display:flex;background:rgba(0,0,0,.2);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid rgba(255,255,255,.06);border-bottom:1px solid var(--border);flex-shrink:0;padding:6px 8px;gap:4px}
.bnav::-webkit-scrollbar{display:none}
.bnav-item{flex:1;min-height:48px;padding:6px 2px 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;border:none;background:transparent;font-family:inherit;position:relative;-webkit-tap-highlight-color:transparent;border-radius:10px;transition:background .18s,box-shadow .18s}
.bnav-icon{font-size:18px;line-height:1;transition:transform .15s}
.bnav-label{font-size:9px;color:var(--muted);font-weight:500;letter-spacing:.1px;white-space:nowrap}
.bnav-item.nav-active .bnav-label{color:var(--orange);font-weight:700}
.bnav-item.nav-active .bnav-icon{transform:scale(1.1)}
.bnav-item:active .bnav-icon{transform:scale(.85)}
.bnav-item.nav-active{background:rgba(232,103,10,.14);box-shadow:inset 0 0 0 1px rgba(232,103,10,.18)}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:20px;padding:20px;margin-bottom:16px;box-shadow:var(--shadow-card);transition:border-color .2s,box-shadow .2s;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.prog-bar{height:6px;border-radius:3px;background:var(--bg3);overflow:hidden;margin:8px 0 4px}
.prog-fill{height:100%;border-radius:3px;transition:width 1s cubic-bezier(.4,0,.2,1)}
.prog-labels{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.metric{background:var(--bg3);border-radius:14px;padding:14px;border:1px solid var(--border)}
.metric-label{font-size:10px;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.4px}
.metric-value{font-size:30px;font-weight:700}
.sec-title{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:14px}
.ev-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
.ev-row:last-child{border-bottom:none}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.3px}
.badge-sm{background:rgba(232,103,10,.15);color:var(--orange);border:1px solid rgba(232,103,10,.3)}
.badge-gr{background:rgba(76,175,125,.1);color:var(--green);border:1px solid rgba(76,175,125,.2)}
.badge-admin{background:rgba(232,103,10,.2);color:var(--orange);border:1px solid var(--orange);font-size:9px}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;margin-top:12px;text-transform:uppercase;letter-spacing:.4px;font-weight:600}
input,select{width:100%;padding:13px 14px;border:1px solid var(--border);border-radius:14px;font-size:15px;font-family:inherit;color:var(--white);background:var(--bg3);margin-bottom:14px;transition:border-color .2s,box-shadow .2s}
input:focus,select:focus{outline:none;border-color:var(--orange);box-shadow:0 0 0 3px rgba(232,103,10,.14)}
input::placeholder{color:#444}
select option{background:#161616;color:var(--white)}
.btn{padding:9px 16px;border-radius:50px;border:1px solid var(--border);background:var(--bg3);cursor:pointer;font-size:13px;font-family:inherit;color:var(--white);transition:border-color var(--transition),background var(--transition)}
.btn-primary{width:100%;padding:14px;border-radius:50px;border:none;background:linear-gradient(135deg,#e8670a,#ff8c2a);color:#fff;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;box-shadow:0 4px 18px rgba(232,103,10,.36);transition:transform var(--transition),box-shadow var(--transition)}
.btn-primary:disabled{opacity:.4;cursor:not-allowed}
.btn-outline{width:100%;padding:11px;border-radius:50px;border:1px solid var(--border);background:transparent;color:var(--white);font-size:13px;cursor:pointer;font-family:inherit;transition:border-color var(--transition),background var(--transition)}
.btn-danger{padding:6px 10px;border-radius:6px;border:1px solid rgba(224,82,82,.3);background:transparent;color:var(--danger);font-size:11px;cursor:pointer;font-family:inherit}
.btn-edit{padding:6px 10px;border-radius:6px;border:1px solid rgba(232,103,10,.3);background:transparent;color:var(--orange);font-size:11px;cursor:pointer;font-family:inherit}
.ev-card{background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:14px;margin-bottom:10px;cursor:pointer;transition:border-color .18s}
.ev-card.ev-sim,.ev-card.ev-confirmado{border-color:var(--green);background:rgba(76,175,125,.05)}
.ev-card.ev-nao,.ev-card.ev-desistiu{border-color:var(--danger);background:rgba(224,82,82,.05)}
.ev-card.ev-compareceu{border-color:#2d6e4f;background:rgba(76,175,125,.1)}
.pres-compareceu{background:rgba(76,175,125,.2);border:1px solid rgba(76,175,125,.5);color:var(--green)}
.pres-desistiu{background:rgba(224,82,82,.1);border:1px solid rgba(224,82,82,.3);color:var(--danger)}
.pres-pendente{background:var(--bg3);border:1px solid var(--border);color:var(--muted)}
.pres-confirmado{background:rgba(76,175,125,.1);border:1px solid rgba(76,175,125,.3);color:var(--green)}
.hist-card{background:var(--bg2);border:1px solid var(--border);border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow-card)}
.km-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;background:var(--bg3);border-radius:8px;padding:10px 12px;border:1px solid var(--border)}
.edit-box{background:var(--bg3);border-radius:8px;padding:12px;margin-bottom:10px;border:1px solid rgba(232,103,10,.3);display:none}
.det-box{display:none;margin-top:10px;background:var(--bg3);border-radius:8px;padding:12px;border:1px solid var(--border)}
.ev-det{display:none;margin-top:12px}
.user-card{background:var(--bg3);border:1px solid var(--border);border-radius:16px;padding:14px;margin-bottom:10px}
.rota-result{background:var(--bg3);border-radius:14px;padding:14px;border:1px solid var(--border);margin-bottom:12px}
.rota-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.rota-item small{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;display:block;margin-bottom:2px}
.rota-item span{font-size:14px;font-weight:600}
.alert-warn{font-size:11px;padding:8px 10px;border-radius:6px;color:var(--orange);background:rgba(232,103,10,.1);border:1px solid rgba(232,103,10,.2)}
.alert-ok{font-size:11px;padding:8px 10px;border-radius:6px;color:var(--green);background:rgba(76,175,125,.1);border:1px solid rgba(76,175,125,.2)}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(10px);background:rgba(22,22,22,.96);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);color:#fff;padding:12px 20px 14px;border-radius:16px;font-size:13px;font-weight:600;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;z-index:999;min-width:200px;max-width:320px;box-shadow:0 8px 32px rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.1)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err{border-color:rgba(224,82,82,.4)}
.toast-bar{height:3px;border-radius:2px;margin-top:8px;width:100%;animation:toastBar 2.5s linear forwards}
@keyframes toastBar{from{width:100%}to{width:0%}}
.sub-pills{display:flex;gap:6px;overflow-x:auto;margin-bottom:16px;padding-bottom:4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.sub-pills::-webkit-scrollbar{display:none}
.sub-pill{flex-shrink:0;padding:7px 14px;border-radius:20px;border:1px solid var(--border);background:var(--bg3);font-size:12px;font-weight:500;color:var(--muted);cursor:pointer;font-family:inherit;white-space:nowrap;transition:border-color var(--transition),color var(--transition)}
.sub-pill.active{background:linear-gradient(135deg,#e8670a,#ff8c2a);border-color:transparent;color:#fff;font-weight:600}
.msg-err{font-size:12px;color:var(--danger);margin-bottom:10px;padding:8px 12px;background:rgba(224,82,82,.1);border-radius:8px}
.senha-wrap{position:relative;margin-bottom:14px}
.senha-wrap input{margin-bottom:0;padding-right:44px}
.senha-olho{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:17px;padding:0;line-height:1;color:var(--muted);user-select:none;-webkit-user-select:none}
.msg-ok{font-size:12px;color:var(--green);margin-bottom:10px;padding:8px 12px;background:rgba(76,175,125,.1);border-radius:8px}
.hint-box{font-size:12px;color:var(--muted);margin-bottom:14px;padding:10px 14px;background:var(--bg3);border-radius:12px;border-left:3px solid var(--orange)}
.spin{display:inline-block;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.login-wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px;position:relative;overflow:hidden}
.login-wrap::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 30%,rgba(232,103,10,.12) 0%,transparent 70%);pointer-events:none}
.login-wrap::after{content:"";position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:repeating-linear-gradient(45deg,rgba(232,103,10,.02) 0px,rgba(232,103,10,.02) 1px,transparent 1px,transparent 40px);pointer-events:none}
.loading{padding:40px;text-align:center;color:var(--muted);font-size:14px}
.falta-txt{font-size:10px;color:var(--muted);margin-bottom:5px}
.divider{border:none;border-top:1px solid var(--border);margin:16px 0}
.pres-badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;font-size:12px;margin:2px}
.pres-sim{background:rgba(76,175,125,.1);border:1px solid rgba(76,175,125,.3);color:var(--green)}
.pres-nao{background:rgba(224,82,82,.1);border:1px solid rgba(224,82,82,.3);color:var(--danger)}
.lote-card{background:var(--bg2);border:2px solid rgba(232,103,10,.5);border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:0 0 0 1px rgba(232,103,10,.08)}

/* ── MICROINTERAÇÕES ────────────────────────────────── */
.btn-primary:hover:not(:disabled){transform:scale(1.02);box-shadow:0 6px 26px rgba(232,103,10,.5)}
.btn-primary:active:not(:disabled){transform:scale(.98);box-shadow:0 2px 10px rgba(232,103,10,.3)}
.btn:hover{border-color:rgba(255,255,255,.18);background:rgba(255,255,255,.07)}
.btn:active{background:rgba(255,255,255,.04)}
.btn-outline:hover{border-color:rgba(255,255,255,.22);background:rgba(255,255,255,.04)}
.sub-pill:hover:not(.active){border-color:rgba(232,103,10,.35);color:var(--white)}
.card:hover{border-color:rgba(255,255,255,.14)}
.ev-card:hover{border-color:rgba(255,255,255,.14)}

/* ── SCROLLBAR ───────────────────────────────────────── */
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.25)}
*{scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.15) transparent}

</style>

<body>
<div id="splash" class="splash">
  <img id="splash-logo" src="" class="splash-logo" onerror="this.style.display='none'" style="display:none"/>
  <div id="splash-logo-fb" style="width:130px;height:130px;border-radius:50%;border:3px solid var(--orange);background:#111;display:flex;align-items:center;justify-content:center;font-size:48px;animation:splashPulse 1.5s ease-in-out infinite;box-shadow:0 0 30px rgba(232,103,10,.4)">🏍️</div>
  <div class="splash-title">MUTANTES MC ITAJAÍ</div>
  <div class="splash-sub">KM TRACKER</div>
  <div class="splash-dots"><div class="splash-dot"></div><div class="splash-dot"></div><div class="splash-dot"></div></div>
</div>
<div class="app" id="app"><div class="loading">Carregando...</div></div>
<div class="toast" id="toast"><div id="toast-msg"></div><div class="toast-bar" id="toast-bar" style="background:var(--green)"></div></div>

<div id="pwa-install-banner" style="display:none;position:fixed;bottom:0;left:0;right:0;z-index:9998;padding:12px 16px 20px;background:rgba(18,18,18,.96);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-top:1px solid rgba(255,255,255,.1);box-shadow:0 -4px 32px rgba(0,0,0,.6)">
  <div style="max-width:480px;margin:0 auto;display:flex;align-items:center;gap:12px">
    <img id="pwa-banner-logo" src="icon-192.png" style="width:44px;height:44px;border-radius:10px;object-fit:contain;border:1.5px solid var(--orange);background:#111;flex-shrink:0"/>
    <div style="flex:1;min-width:0">
      <div style="font-size:13px;font-weight:700;color:#f0f0f0">Instalar app na tela inicial</div>

<script>
(function(){
  if(!/Mobi/i.test(navigator.userAgent))return;
  if(localStorage.getItem("pwa_install_dismissed"))return;
  let _deferredPrompt=null;
  const _showBanner=()=>{
    const banner=document.getElementById("pwa-install-banner");
    if(!banner)return;
    const logo=localStorage.getItem("mutantes_logo");
    const img=document.getElementById("pwa-banner-logo");
    if(img&&logo)img.src=logo;
    banner.style.display="block";
  };
  window.addEventListener("beforeinstallprompt",e=>{
    e.preventDefault();
    _deferredPrompt=e;
    _showBanner();
  });
  window.addEventListener("appinstalled",()=>{
    const banner=document.getElementById("pwa-install-banner");
    if(banner)banner.style.display="none";
    localStorage.setItem("pwa_install_dismissed","1");
    _deferredPrompt=null;
  });
  window._pwaBannerInstall=async function(){
    if(!_deferredPrompt)return;
    _deferredPrompt.prompt();
    await _deferredPrompt.userChoice;
    _deferredPrompt=null;
    localStorage.setItem("pwa_install_dismissed","1");
    const banner=document.getElementById("pwa-install-banner");
    if(banner)banner.style.display="none";
  };
  window._pwaBannerClose=function(){
    const banner=document.getElementById("pwa-install-banner");
    if(banner)banner.style.display="none";
    localStorage.setItem("pwa_install_dismissed","1");
  };
})();
</script>

function precoPorEstado(estado){
  const pSC=PRECOS_GAS["SC"]||6.20;
  const pDest=PRECOS_GAS[estado]||pSC;
  return(pSC+pDest)/2;
}

function calcRota(distIda,auto,tanque,estado,pedIda,gasManual){
  const gas=gasManual||precoPorEstado(estado||"SC");
  const dt=distIda*2,lit=dt/auto,comb=lit*gas;
  const ped=pedIda!=null?pedIda*2:0;
  const alcance=tanque*auto,precisa=distIda>alcance;
  const paradas=precisa?Math.ceil((dt-alcance)/alcance):0;
  return{dt,lit,comb,ped,total:comb+ped,precisa,paradas,gas,pedReal:pedIda!=null};
}

function showToast(msg,err=false){
  const t=document.getElementById("toast");
  const m=document.getElementById("toast-msg");
  const b=document.getElementById("toast-bar");
  const ic=err?"❌ ":"✅ ";
  if(m)m.textContent=ic+msg;
  if(b){b.style.background=err?"var(--danger)":"var(--green)";b.style.animation="none";b.offsetHeight;b.style.animation="toastBar 2.5s linear forwards";}
  t.className="toast"+(err?" err":"")+" show";
  clearTimeout(t._to);
  t._to=setTimeout(()=>t.classList.remove("show"),2500);
}

// ── CROPPER DE FOTO (Cropper.js) ─────────────────────────────────────
function abrirCropper(file, onCrop){
  const reader=new FileReader();
  reader.onload=e=>{
    const modal=document.createElement("div");
    modal.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;gap:14px";
    modal.innerHTML=`
      <div style="font-size:14px;font-weight:700;color:#fff">✂️ Ajuste a foto</div>
      <div style="width:min(85vw,320px);height:min(85vw,320px);background:#111">
        <img id="cropperjs-img" src="${e.target.result}" style="max-width:100%;display:block"/>
      </div>
      <div style="font-size:11px;color:#666">Pinça para zoom · Arraste para reposicionar</div>
      <div style="display:flex;gap:10px">
        <button id="crop-cancel" style="padding:12px 24px;border-radius:12px;border:1px solid #444;background:transparent;color:#aaa;font-size:14px;cursor:pointer;font-family:inherit">Cancelar</button>
        <button id="crop-ok" style="padding:12px 28px;border-radius:12px;border:none;background:var(--orange);color:#fff;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit">✓ Usar foto</button>
      </div>`;
    document.body.appendChild(modal);
    const img=document.getElementById("cropperjs-img");
    const cropper=new Cropper(img,{
      aspectRatio:1,viewMode:1,dragMode:"move",
      autoCropArea:1,restore:false,guides:false,
      center:false,highlight:false,cropBoxMovable:false,
      cropBoxResizable:false,toggleDragModeOnDblclick:false,
      background:false,
    });
    document.getElementById("crop-cancel").onclick=()=>{cropper.destroy();modal.remove();};
    document.getElementById("crop-ok").onclick=()=>{
      const canvas=cropper.getCroppedCanvas({width:400,height:400,imageSmoothingQuality:"high"});
      canvas.toBlob(blob=>{
        cropper.destroy();modal.remove();
        onCrop(new File([blob],"foto.jpg",{type:"image/jpeg"}));
      },"image/jpeg",0.92);
    };
  };
  reader.readAsDataURL(file);
}

async function uploadFoto(file){
  const fd=new FormData();
  fd.append("file",file);fd.append("upload_preset",PRESET);fd.append("folder","mutantes-mc");
  const r=await fetch("https://api.cloudinary.com/v1_1/"+CLOUD+"/image/upload",{method:"POST",body:fd});
  const d=await r.json();
  if(!d.secure_url)throw new Error("Falha no upload");
  return d.secure_url;
}

async function uploadFotoComCrop(file, onDone){
  abrirCropper(file, async croppedFile=>{
    showToast("Enviando foto...");
    try{
      const url=await uploadFoto(croppedFile);
      onDone(url);
    }catch{showToast("Erro ao enviar foto.",true);}
  });
}

function atualizarIconePWA(url){
  if(!url)return;
  document.getElementById("apple-touch-icon").href=url;
  const origin=window.location.origin+window.location.pathname.replace(/\/[^/]*$/,"/");
  const manifest={name:"Mutantes MC Itajaí",short_name:"Mutantes MC",start_url:origin,display:"standalone",background_color:"#0f0f0f",theme_color:"#e8670a",icons:[{src:url,sizes:"192x192",type:"image/png",purpose:"any maskable"},{src:url,sizes:"512x512",type:"image/png"}]};
  const blob=new Blob([JSON.stringify(manifest)],{type:"application/json"});
  const old=document.getElementById("pwa-manifest");
  if(old._blobUrl)URL.revokeObjectURL(old._blobUrl);
  const blobUrl=URL.createObjectURL(blob);
  old._blobUrl=blobUrl;
  old.href=blobUrl;
}

function proxQuarta(){
  const hoje=new Date();
  const dia=hoje.getDay();
  const diff=dia<=3?3-dia:7-(dia-3);
  const q=new Date(hoje);
  q.setDate(hoje.getDate()+(diff===0&&dia===3?0:diff===0?7:diff));
  if(dia===3)q.setDate(hoje.getDate());
  return q.toISOString().slice(0,10);
}

function htmlBnav(tabs){
  return`<nav class="bnav">${tabs.map(([t,ic,lb])=>`<button class="bnav-item${TM===t?" nav-active":""}" onclick="window.setTM('${t}')"><span class="bnav-icon">${ic}</span><span class="bnav-label">${lb}</span></button>`).join("")}</nav>`;
}

function proxSexta(){
  const hoje=new Date();
  const dia=hoje.getDay();// 0=dom,5=sex
  const diff=dia<=5?5-dia:6+5-dia+1;
  const sx=new Date(hoje);
  sx.setDate(hoje.getDate()+(diff===0&&dia===5?0:diff===0?7:diff));
  // Se hoje é sexta, usa hoje
  if(dia===5)sx.setDate(hoje.getDate());
  return sx.toISOString().slice(0,10);
}

async function carregarSedeInfo(){
  const abaSede=window._sedeAba||"presenca";
  const isLimpeza=abaSede==="limpeza";
  const data=isLimpeza?proxQuarta():proxSexta();
  const tipo=isLimpeza?"limpeza":"presenca";
  try{
    const snap=await getDocs(query(collection(db,"sede_confirmacoes"),where("data","==",data),where("tipo","==",tipo)));
    const todos=snap.docs.map(d=>d.data());
    const vao=todos.filter(p=>p.resposta==="sim").sort((a,b)=>a.apelido.localeCompare(b.apelido));
    const nao=todos.filter(p=>p.resposta==="nao").sort((a,b)=>a.apelido.localeCompare(b.apelido));
    const responderam=new Set(todos.map(p=>p.membroId));
    const semResposta=MEMBROS.filter(m=>!responderam.has(m.uid)).sort((a,b)=>a.apelido.localeCompare(b.apelido));
    const el=document.getElementById("sede-lista");
    if(el)el.innerHTML=`
      <div style="margin-bottom:10px">
        <div style="font-size:11px;font-weight:600;color:var(--green);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px">✅ ${isLimpeza?"Vão limpar":"Confirmados"} (${vao.length})</div>
        ${vao.length===0?`<div style="font-size:12px;color:#555;padding:4px 0">Nenhuma confirmação ainda</div>`
          :vao.map(p=>`<div style="display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--border)">
            ${avatarEl(MEMBROS.find(m=>m.uid===p.membroId)?.fotoUrl||"",p.apelido,26)}
            <span style="font-size:13px;font-weight:500">${p.apelido}</span>
          </div>`).join("")}
      </div>
      ${nao.length>0?`<div style="margin-bottom:10px">
        <div style="font-size:11px;font-weight:600;color:var(--danger);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px">❌ Não vão (${nao.length})</div>
        ${nao.map(p=>`<div style="display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--border)">
          ${avatarEl(MEMBROS.find(m=>m.uid===p.membroId)?.fotoUrl||"",p.apelido,26)}
          <span style="font-size:13px;color:var(--muted)">${p.apelido}</span>
        </div>`).join("")}
      </div>`:""}
      ${semResposta.length>0?`<div>
        <div style="font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px">⏳ Sem resposta (${semResposta.length})</div>
        <div style="display:flex;flex-wrap:wrap;gap:4px">${semResposta.map(m=>`<span style="font-size:11px;color:var(--muted);background:var(--bg3);padding:2px 7px;border-radius:20px;border:1px solid var(--border)">${m.apelido}</span>`).join("")}</div>
      </div>`:""}`;
  }catch(e){console.error(e);}
  if(!isLimpeza){
    try{
      const [snapBar,snapChur]=await Promise.all([
        getDocs(query(collection(db,"escala_bar"),where("data","==",proxSexta()))),
        getDocs(query(collection(db,"escala_churrasco"),where("data","==",proxSexta())))
      ]);
      const el=document.getElementById("escala-hoje");
      if(el){
        const bar=snapBar.empty?null:snapBar.docs[0].data();
        const chur=snapChur.empty?null:snapChur.docs[0].data();
        if(!bar&&!chur){el.innerHTML=`<span style="font-size:12px;color:#555">Escalas não definidas ainda.</span>`;return;}
        el.innerHTML=`<div style="display:flex;gap:8px;flex-wrap:wrap">
          ${bar?`<div style="flex:1;min-width:110px;background:var(--bg3);border-radius:8px;padding:8px 10px;border:1px solid rgba(232,103,10,.2)">
            <div style="font-size:10px;font-weight:600;color:var(--orange);margin-bottom:3px">🍺 BAR</div>
            <div style="font-size:12px;font-weight:600">${bar.m1} & ${bar.m2}</div>
            ${bar.obs?`<div style="font-size:10px;color:var(--muted)">📝 ${bar.obs}</div>`:""}
          </div>`:""}
          ${chur?`<div style="flex:1;min-width:110px;background:var(--bg3);border-radius:8px;padding:8px 10px;border:1px solid rgba(76,175,125,.2)">
            <div style="font-size:10px;font-weight:600;color:var(--green);margin-bottom:3px">🔥 CHURRASCO</div>
            <div style="font-size:12px;font-weight:600">${[chur.m1,chur.m2,chur.m3,chur.m4,chur.m5].filter(Boolean).join(" · ")}</div>
            ${chur.obs?`<div style="font-size:10px;color:var(--muted)">📝 ${chur.obs}</div>`:""}
          </div>`:""}
        </div>`;
      }
    }catch{}
  }
}

async function carregarEscalaLista(){
  try{
    const canEdit=UP&&(UP.isAdmin||UP.isBarman||UP.isDiretor);
    const abaBar=window._barAba||"bar";
    const col=abaBar==="churrasco"?"escala_churrasco":"escala_bar";
    const snap=await getDocs(query(collection(db,col),orderBy("data","asc")));
    const el=document.getElementById("escala-lista");
    if(!el)return;
    const hoje=new Date().toISOString().slice(0,10);
    const docs=snap.docs.map(d=>({id:d.id,...d.data()})).filter(e=>e.data>=hoje);
    el.innerHTML=docs.length===0?`<span style="font-size:12px;color:#555">Nenhuma escala cadastrada.</span>`:
      docs.map(e=>{
        const nomes=abaBar==="churrasco"
          ?[e.m1,e.m2,e.m3,e.m4,e.m5].filter(Boolean).join(" · ")
          :`${e.m1} & ${e.m2}`;
        return`<div style="display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--border)">
          <div style="flex:1">
            <div style="font-size:13px;font-weight:600">${fmtDate(e.data)}</div>
            <div style="font-size:12px;color:${abaBar==="churrasco"?"var(--green)":"var(--orange)"}">
              ${abaBar==="churrasco"?"🔥":"🍺"} ${nomes}
            </div>
            ${e.obs?`<div style="font-size:11px;color:var(--muted)">📝 ${e.obs}</div>`:""}
          </div>
          ${canEdit?`<button onclick="window.excluirEscala('${e.id}','${col}')" class="btn-danger">✕</button>`:""}
        </div>`;
      }).join("");
  }catch(e){console.error(e);}
}

  ["wpp","mural","rotas"].forEach(a=>{

function dispararConfete(){
  const cores=["#e8670a","#ff8c2a","#ffd700","#4caf7d","#fff","#e05252"];
  const wrap=document.createElement("div");
  wrap.className="confete";
  document.body.appendChild(wrap);
  for(let i=0;i<80;i++){
    const p=document.createElement("div");
    p.className="confete-p";
    p.style.cssText=`left:${Math.random()*100}%;background:${cores[Math.floor(Math.random()*cores.length)]};width:${6+Math.random()*8}px;height:${6+Math.random()*8}px;animation-duration:${2+Math.random()*3}s;animation-delay:${Math.random()*2}s;border-radius:${Math.random()>0.5?"50%":"2px"}`;
    wrap.appendChild(p);
  }
  showToast("🏆 Meta de 5.000 km atingida! Parabéns!");
  setTimeout(()=>wrap.remove(),6000);
}

window.sugerirRota=async()=>{
  const nome=document.getElementById("rs-nome")?.value.trim();
  const dist=parseInt(document.getElementById("rs-dist")?.value)||0;
  const desc=document.getElementById("rs-desc")?.value.trim();
  if(!nome){showToast("Informe o nome da rota.",true);return;}
  try{
    await addDoc(collection(db,"rotas_sugeridas"),{nome,dist,desc:desc||"",autor:UP.apelido,autorId:CU.uid,likes:0,curtidas:{},criadoEm:serverTimestamp()});
    document.getElementById("rs-nome").value="";document.getElementById("rs-dist").value="";document.getElementById("rs-desc").value="";
    showToast("✓ Rota sugerida!");carregarRotasSugeridas();
  }catch{showToast("Erro.",true);}
};

window.curtirRota=async(id,acao)=>{
  try{
    const ref=doc(db,"rotas_sugeridas",id);
    const snap=await getDoc(ref);
    const d=snap.data();
    const curtidas=d.curtidas||{};
    if(acao==="des"){delete curtidas[CU.uid];await setDoc(ref,{curtidas,likes:Math.max(0,(d.likes||1)-1)},{merge:true});}
    else{curtidas[CU.uid]=true;await setDoc(ref,{curtidas,likes:(d.likes||0)+1},{merge:true});}
    carregarRotasSugeridas();
  }catch{showToast("Erro.",true);}
};

window.excluirRotaSugerida=async(id)=>{
  try{await deleteDoc(doc(db,"rotas_sugeridas",id));carregarRotasSugeridas();}catch{showToast("Erro.",true);}
};

// CALENDÁRIO VISUAL DE EVENTOS
// ═══════════════════════════════════════════════════
let _evView="lista";
let _calMes=new Date().getMonth();
let _calAno=new Date().getFullYear();

window.setEvView=(view)=>{
  _evView=view;
  const lista=document.getElementById("ev-lista-wrap");
  const cal=document.getElementById("ev-cal-wrap");
  const btnL=document.getElementById("ev-view-lista");
  const btnC=document.getElementById("ev-view-cal");
  if(!lista||!cal)return;
  lista.style.display=view==="lista"?"block":"none";
  cal.style.display=view==="cal"?"block":"none";
  if(btnL){btnL.style.background=view==="lista"?"var(--orange)":"var(--bg3)";btnL.style.color=view==="lista"?"#fff":"var(--muted)";btnL.style.border=view==="lista"?"none":"1px solid var(--border)";}
  if(btnC){btnC.style.background=view==="cal"?"var(--orange)":"var(--bg3)";btnC.style.color=view==="cal"?"#fff":"var(--muted)";btnC.style.border=view==="cal"?"none":"1px solid var(--border)";}
  if(view==="cal")renderCalendario();
};

function renderCalendario(){
  const cal=document.getElementById("ev-cal-wrap");
  if(!cal)return;
  const hoje=new Date();
  const ano=_calAno, mes=_calMes;
  const primeiroDia=new Date(ano,mes,1).getDay(); // 0=dom
  const diasNoMes=new Date(ano,mes+1,0).getDate();
  const meses=["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
  const dias=["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];

  // Mapear eventos do mês
  const eventosPorDia={};
  EVENTOS.forEach(ev=>{
    const d=new Date(ev.data+"T00:00:00");
    if(d.getMonth()===mes&&d.getFullYear()===ano){
      const dia=d.getDate();
      if(!eventosPorDia[dia])eventosPorDia[dia]=[];
      eventosPorDia[dia].push(ev);
    }
  });

  // Células do calendário
  let cells="";
  // Dias da semana header
  cells+=dias.map(d=>`<div style="text-align:center;font-size:10px;font-weight:700;color:var(--muted);padding:4px 0;text-transform:uppercase">${d}</div>`).join("");

  // Células vazias antes do primeiro dia
  for(let i=0;i<primeiroDia;i++) cells+=`<div></div>`;

  // Dias do mês
  for(let dia=1;dia<=diasNoMes;dia++){
    const ehHoje=hoje.getDate()===dia&&hoje.getMonth()===mes&&hoje.getFullYear()===ano;
    const evs=eventosPorDia[dia]||[];
    const temEv=evs.length>0;
    cells+=`<div onclick="${temEv?`window.verEvDia(${dia},${mes},${ano})`:"return false"}"
      style="min-height:44px;border-radius:8px;padding:4px;cursor:${temEv?"pointer":"default"};
      background:${ehHoje?"rgba(232,103,10,.2)":temEv?"rgba(232,103,10,.08)":"transparent"};
      border:1px solid ${ehHoje?"var(--orange)":temEv?"rgba(232,103,10,.3)":"transparent"};
      position:relative;transition:background .15s">
      <div style="font-size:12px;font-weight:${ehHoje?"700":"400"};color:${ehHoje?"var(--orange)":"var(--white)"};text-align:center">${dia}</div>
      ${temEv?`<div style="display:flex;flex-wrap:wrap;gap:2px;justify-content:center;margin-top:2px">${evs.map(()=>`<div style="width:6px;height:6px;border-radius:50%;background:var(--orange)"></div>`).join("")}</div>`:""}
    </div>`;
  }

  // Detalhe do evento selecionado
  cal.innerHTML=`
    <div class="card">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">

};

window.verEvDia=(dia,mes,ano)=>{
  const evs=EVENTOS.filter(ev=>{
    const d=new Date(ev.data+"T00:00:00");
    return d.getDate()===dia&&d.getMonth()===mes&&d.getFullYear()===ano;

const GALERIA_POR_PAG=30;
let _galeriaCursor=null,_galeriaFiltro=null;

function _fotoHtml(f){
  return`<div style="position:relative;aspect-ratio:1;overflow:hidden;border-radius:8px;cursor:pointer" onclick="window.open('${f.url}','_blank')">
    <img src="${f.url}" style="width:100%;height:100%;object-fit:cover" loading="lazy"/>
    ${UP&&(UP.isAdmin||f.autorId===CU.uid)?`<button onclick="event.stopPropagation();window.excluirFotoGaleria('${f.id}')" style="position:absolute;top:4px;right:4px;background:rgba(0,0,0,.7);color:#fff;border:none;border-radius:50%;width:22px;height:22px;font-size:11px;cursor:pointer">✕</button>`:""}
  </div>`;
}

function _galeriaBtnMais(){
  const wrap=document.createElement("div");
  wrap.style.cssText="grid-column:1/-1;text-align:center;padding:10px 0";
  wrap.innerHTML=`<button id="galeria-mais-btn" onclick="window.carregarMaisGaleria()" style="padding:8px 22px;border-radius:8px;border:1px solid var(--border);background:var(--bg3);color:var(--white);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit">Carregar mais</button>`;
  return wrap;
}

function _galeriaQuery(cursor){
  const base=[collection(db,"galeria"),orderBy("criadoEm","desc")];
  if(_galeriaFiltro&&_galeriaFiltro!=="geral")base.splice(1,0,where("eventoId","==",_galeriaFiltro));
  if(cursor)base.push(startAfter(cursor));
  base.push(limit(GALERIA_POR_PAG));
  return query(...base);
}

async function carregarGaleria(eventoId){
  _galeriaFiltro=eventoId||null;
  _galeriaCursor=null;
  const el=document.getElementById("galeria-grid");
  if(!el)return;
  el.innerHTML=`<span class="spin">⟳</span>`;
  try{
    const snap=await getDocs(_galeriaQuery(null));
    let fotos=snap.docs.map(d=>({id:d.id,...d.data()}));
    if(_galeriaFiltro==="geral")fotos=fotos.filter(f=>!f.eventoId||f.eventoId==="geral");
    _galeriaCursor=snap.docs.length===GALERIA_POR_PAG?snap.docs[snap.docs.length-1]:null;
    if(fotos.length===0){el.innerHTML=`<div style="grid-column:1/-1;font-size:12px;color:#555;padding:10px 0">Nenhuma foto ainda. Seja o primeiro a postar!</div>`;return;}
    el.innerHTML=fotos.map(_fotoHtml).join("");
    if(_galeriaCursor)el.appendChild(_galeriaBtnMais());
  }catch(e){el.innerHTML=`<div style="font-size:12px;color:var(--danger)">Erro ao carregar.</div>`;}
}

window.carregarMaisGaleria=async()=>{
  if(!_galeriaCursor)return;
  const el=document.getElementById("galeria-grid");
  const btn=document.getElementById("galeria-mais-btn");
  if(!el||!btn)return;
  btn.textContent="Carregando...";btn.disabled=true;
  try{
    const snap=await getDocs(_galeriaQuery(_galeriaCursor));
    let fotos=snap.docs.map(d=>({id:d.id,...d.data()}));
    if(_galeriaFiltro==="geral")fotos=fotos.filter(f=>!f.eventoId||f.eventoId==="geral");
    _galeriaCursor=snap.docs.length===GALERIA_POR_PAG?snap.docs[snap.docs.length-1]:null;
    btn.parentElement.remove();
    fotos.forEach(f=>{
      const div=document.createElement("div");
      div.style.cssText="position:relative;aspect-ratio:1;overflow:hidden;border-radius:8px;cursor:pointer";
      div.onclick=()=>window.open(f.url,"_blank");
      div.innerHTML=`<img src="${f.url}" style="width:100%;height:100%;object-fit:cover" loading="lazy"/>${UP&&(UP.isAdmin||f.autorId===CU.uid)?`<button onclick="event.stopPropagation();window.excluirFotoGaleria('${f.id}')" style="position:absolute;top:4px;right:4px;background:rgba(0,0,0,.7);color:#fff;border:none;border-radius:50%;width:22px;height:22px;font-size:11px;cursor:pointer">✕</button>`:""}`;
      el.appendChild(div);
    });
    if(_galeriaCursor)el.appendChild(_galeriaBtnMais());
  }catch{btn.textContent="Carregar mais";btn.disabled=false;}
};

window.filtrarGaleria=()=>{
  const val=document.getElementById("galeria-filtro-evento")?.value;
  carregarGaleria(val||null);
};

window.uploadFotosGaleria=async(input)=>{
  const files=Array.from(input.files);
  if(!files.length)return;
  const eventoId=document.getElementById("galeria-filtro-evento")?.value||"geral";
  showToast(`Enviando ${files.length} foto(s)...`);
  try{
    for(const file of files){
      const url=await uploadFoto(file);
      const ref=await addDoc(collection(db,"galeria"),{url,eventoId:eventoId||"geral",autorId:CU.uid,autorApelido:UP.apelido,criadoEm:serverTimestamp()});
      // Adiciona foto imediatamente no grid sem esperar re-fetch do Firestore
      const grid=document.getElementById("galeria-grid");
      if(grid){
        const vazio=grid.querySelector("div[style*='Nenhuma foto']");
        if(vazio)grid.innerHTML="";
        const div=document.createElement("div");
        div.style.cssText="position:relative;aspect-ratio:1;overflow:hidden;border-radius:8px;cursor:pointer";
        div.onclick=()=>window.open(url,"_blank");
        div.innerHTML=`<img src="${url}" style="width:100%;height:100%;object-fit:cover" loading="lazy"/><button onclick="event.stopPropagation();window.excluirFotoGaleria('${ref.id}')" style="position:absolute;top:4px;right:4px;background:rgba(0,0,0,.7);color:#fff;border:none;border-radius:50%;width:22px;height:22px;font-size:11px;cursor:pointer">✕</button>`;
        grid.insertBefore(div,grid.firstChild);
      }
    }
    showToast("✓ Fotos enviadas!");input.value="";
  }catch{showToast("Erro ao enviar.",true);}
};

window.excluirFotoGaleria=async(id)=>{

function calcConquistas(membro,regs){
  const km=membro.totalKm||0;
  const saidas=regs?regs.filter(r=>r.membroId===membro.uid).length:0;
  const badges=[];
  if(saidas>=1)badges.push({ic:"🏁",nome:"Primeira Saída",desc:"Participou da primeira saída"});
  if(km>=500)badges.push({ic:"🛣️",nome:"500 km",desc:"500 km rodados"});
  if(km>=1000)badges.push({ic:"🔥",nome:"1.000 km",desc:"1.000 km rodados"});
  if(km>=2500)badges.push({ic:"⚡",nome:"2.500 km",desc:"2.500 km rodados"});
  if(km>=META)badges.push({ic:"🏆",nome:"Meta Atingida",desc:`${toInt(META)} km — meta anual`});
  if(saidas>=5)badges.push({ic:"🤝",nome:"Membro Ativo",desc:"5 saídas no ano"});
  if(saidas>=10)badges.push({ic:"🦅",nome:"Veterano",desc:"10 saídas no ano"});
  if(membro.isDiretor||membro.isAdmin)badges.push({ic:"👑",nome:"Liderança",desc:"Membro da diretoria"});
  return badges;
}

function htmlConquistas(membro,regs){
  const badges=calcConquistas(membro,regs);
  if(badges.length===0)return`<div style="font-size:12px;color:#555">Nenhuma conquista ainda — comece a rodar!</div>`;
  return badges.map(b=>`<div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)">
    <span style="font-size:26px">${b.ic}</span>
    <div><div style="font-size:13px;font-weight:700">${b.nome}</div><div style="font-size:11px;color:var(--muted)">${b.desc}</div></div>
  </div>`).join("");
}

const _climaCache={};
async function buscarClimaEvento(cidade,elId,dataEvento){
  const el=document.getElementById(elId);
  if(!el)return;
  const cacheKey=cidade+"_"+dataEvento;
  if(_climaCache[cacheKey]){el.innerHTML=_climaCache[cacheKey];return;}
  try{
    const geo=await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(cidade.split(" - ")[0])}&count=1&language=pt&format=json`);
    const gd=await geo.json();
    if(!gd.results||!gd.results[0]){el.innerHTML="";return;}
    const {latitude:lat,longitude:lon}=gd.results[0];
    // Pegar 7 dias a partir da data do evento
    const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,weathercode&timezone=America%2FSao_Paulo&start_date=${dataEvento}&forecast_days=7`);
    const d=await r.json();
    if(!d.daily)return;
    const wcIc=wc=>wc===0?"☀️":wc<=3?"🌤️":wc<=45?"🌥️":wc<=67?"🌧️":wc<=77?"❄️":"⛈️";
    const dias=["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];
    const hoje=new Date().toISOString().slice(0,10);
    const html=`<div style="margin-top:8px;background:var(--bg3);border-radius:10px;padding:8px;border:1px solid rgba(232,103,10,.2)">
      <div style="font-size:10px;color:var(--orange);font-weight:700;text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px">🌤️ Previsão — ${cidade.split(" - ")[0]}</div>
      ${d.daily.weathercode.map((wc,i)=>{
        const data=d.daily.time[i];
        const diaSem=dias[new Date(data+"T00:00:00").getDay()];
        const isEvento=i===0;
        const tmax=Math.round(d.daily.temperature_2m_max[i]);
        const tmin=Math.round(d.daily.temperature_2m_min[i]);
        const chuva=d.daily.precipitation_probability_max[i]||0;
        return`<div style="display:flex;align-items:center;gap:8px;padding:4px 0;${i<d.daily.weathercode.length-1?"border-bottom:1px solid var(--border)":""}">
          <span style="font-size:10px;font-weight:${isEvento?"700":"400"};color:${isEvento?"var(--orange)":"var(--muted)"};width:32px">${diaSem}</span>
          <span style="font-size:16px">${wcIc(wc)}</span>
          <span style="font-size:11px;color:var(--white);font-weight:${isEvento?"700":"400"};flex:1">${tmax}°<span style="color:var(--muted)">/${tmin}°</span></span>
          ${chuva>20?`<span style="font-size:10px;color:${chuva>60?"var(--orange)":"var(--muted)"}">🌧️${chuva}%</span>`:""}
          ${isEvento?`<span style="font-size:9px;background:rgba(232,103,10,.2);color:var(--orange);padding:1px 5px;border-radius:6px">Evento</span>`:""}
        </div>`;
      }).join("")}
    </div>`;
    _climaCache[cacheKey]=html;
    if(el)el.outerHTML=html;
  }catch{if(el)el.innerHTML="";}
}

async function buscarClima(cidade,elId,dataEvento){
  const el=document.getElementById(elId);
  if(!el)return;
  if(_climaCache[cidade]){el.innerHTML=_climaCache[cidade];return;}
  try{
    // Geocoding
    const geo=await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(cidade.split(" - ")[0])}&count=1&language=pt&format=json`);
    const gd=await geo.json();
    if(!gd.results||!gd.results[0]){el.innerHTML="";return;}
    const {latitude:lat,longitude:lon}=gd.results[0];
    // Previsão
    const data=dataEvento||new Date().toISOString().slice(0,10);
    const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,weathercode&timezone=America%2FSao_Paulo&start_date=${data}&end_date=${data}`);
    const d=await r.json();
    if(!d.daily||!d.daily.weathercode){el.innerHTML="";return;}
    const wc=d.daily.weathercode[0];
    const tmax=Math.round(d.daily.temperature_2m_max[0]);
    const tmin=Math.round(d.daily.temperature_2m_min[0]);
    const chuva=d.daily.precipitation_probability_max[0]||0;
    const wcIc=wc===0?"☀️":wc<=3?"🌤️":wc<=45?"🌥️":wc<=67?"🌧️":wc<=77?"❄️":"⛈️";
    const wcDesc=wc===0?"Céu limpo":wc<=3?"Parcialmente nublado":wc<=45?"Nublado":wc<=67?"Chuva":wc<=77?"Neve":"Tempestade";
    const html=`${wcIc} ${wcDesc} · ${tmin}°–${tmax}°C · 🌧️ ${chuva}%`;
    _climaCache[cidade]=html;
    if(el)el.innerHTML=html;
  }catch{if(el)el.innerHTML="";}
}

async function carregarMensalidades(){

  const hoje=new Date();
  const mesAtual=`${hoje.getFullYear()}-${String(hoje.getMonth()+1).padStart(2,"0")}`;
  const meses=[];
  for(let i=0;i<6;i++){
    const d=new Date(hoje.getFullYear(),hoje.getMonth()-i,1);

  }
  try{
    const snap=await getDocs(collection(db,"mensalidades"));
    const pagtos={};
    snap.docs.forEach(d=>{const r=d.data();const k=r.membroId+"_"+r.mes;pagtos[k]={id:d.id,...r};});
    const mesLabel=(m)=>{const [y,mo]=m.split("-");const nomes=["","Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];return`${nomes[parseInt(mo)]}/${y.slice(2)}`;};

      </div>

        const mes=window._mesAtual||mesAtual;
        const pagos=MEMBROS.filter(m=>pagtos[m.uid+"_"+mes]?.pago);

        </div>

          const k=m.uid+"_"+mes;

async function carregarEventosSede(){
  const el=document.getElementById("eventos-sede-lista");
  if(!el)return;
  try{
    const hoje=new Date().toISOString().slice(0,10);
    const snap=await getDocs(query(collection(db,"eventos_sede"),orderBy("data","asc")));
    const docs=snap.docs.map(d=>({id:d.id,...d.data()}));
    const futuros=docs.filter(e=>e.data>=hoje);
    const passados=docs.filter(e=>e.data<hoje).slice(-3).reverse();
    if(docs.length===0){el.innerHTML=`<div style="font-size:12px;color:#555">Nenhum evento cadastrado.</div>`;return;}
    const isAdmin=UP&&(UP.isAdmin||UP.isDiretor);
    const renderEv=(e,passado=false)=>{
      const hoje2=new Date();hoje2.setHours(0,0,0,0);
      const evData=new Date(e.data+"T00:00:00");
      const dias=Math.round((evData-hoje2)/(1000*60*60*24));
      const diasLabel=dias===0?"🔴 Hoje!":dias===1?"🟠 Amanhã":dias>0?`🕐 ${dias} dias`:"";
      return`<div style="padding:12px 0;border-bottom:1px solid var(--border);opacity:${passado?".6":"1"}">
        <div style="display:flex;align-items:flex-start;justify-content:space-between">
          <div>
            <div style="font-size:14px;font-weight:700">${e.nome}</div>
            <div style="font-size:12px;color:var(--muted)">${fmtDate(e.data)}${e.hora?` · ${e.hora}`:""}</div>
            ${e.desc?`<div style="font-size:12px;color:var(--muted);margin-top:2px">${e.desc}</div>`:""}
          </div>
          <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px">
            ${diasLabel?`<span style="font-size:10px;font-weight:700;color:${dias===0?"var(--danger)":dias<=7?"var(--orange)":"var(--muted)"};background:${dias===0?"rgba(224,82,82,.15)":dias<=7?"rgba(232,103,10,.15)":"var(--bg3)"};padding:2px 8px;border-radius:20px;border:1px solid ${dias===0?"rgba(224,82,82,.3)":dias<=7?"rgba(232,103,10,.3)":"var(--border)"}">${diasLabel}</span>`:""}
            ${isAdmin?`<button onclick="window.excluirEventoSede('${e.id}')" style="font-size:10px;color:var(--danger);background:transparent;border:none;cursor:pointer">✕</button>`:""}
          </div>
        </div>
      </div>`;
    };
    el.innerHTML=(futuros.length===0?`<div style="font-size:12px;color:#555;margin-bottom:10px">Nenhum evento futuro.</div>`:"")
      +futuros.map(e=>renderEv(e)).join("")
      +(passados.length>0?`<div style="font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;margin-top:12px;margin-bottom:6px">Passados</div>`+passados.map(e=>renderEv(e,true)).join(""):"");
  }catch(e){el.innerHTML=`<div style="font-size:12px;color:var(--danger)">Erro.</div>`;}
}

function htmlConfirmacoesReuniao(r){
  const confs=r.confirmacoes||{};
  const vao=MEMBROS.filter(m=>confs[m.uid]==="sim");
  const nao=MEMBROS.filter(m=>confs[m.uid]==="nao");
  const semResp=MEMBROS.filter(m=>!confs[m.uid]);
  return`<div style="display:flex;flex-wrap:wrap;gap:4px;margin-bottom:5px">
    ${vao.map(m=>`<span class="pres-badge pres-sim" style="font-size:10px">✅ ${m.apelido}</span>`).join("")}
    ${nao.map(m=>`<span class="pres-badge pres-nao" style="font-size:10px">❌ ${m.apelido}</span>`).join("")}
  </div>
  <div style="font-size:10px;color:var(--muted)">✅ ${vao.length} · ❌ ${nao.length} · ⏳ ${semResp.length} sem resposta</div>`;
}

window.confirmarReuniao=async(reuniaoId,resp)=>{
  try{
    await setDoc(doc(db,"reunioes",reuniaoId),{[`confirmacoes.${CU.uid}`]:resp},{merge:true});
    showToast(resp==="sim"?"✅ Presença confirmada!":"❌ Ausência registrada.");
    carregarReunioes();
  }catch{showToast("Erro.",true);}
};

window.agendarReuniao=async()=>{
  const data=document.getElementById("reun-data")?.value;
  const hora=document.getElementById("reun-hora")?.value;
  const pauta=document.getElementById("reun-pauta")?.value.trim();
  const err=document.getElementById("reun-err");
  if(!data){err.textContent="Preencha a data.";err.style.display="block";return;}
  err.style.display="none";
  try{
    await addDoc(collection(db,"reunioes"),{data,hora:hora||"",pauta:pauta||"",confirmacoes:{},ata:"",ataAnexoUrl:"",ataAnexoNome:"",criadoPor:UP.apelido,criadoEm:serverTimestamp()});
    showToast("✅ Reunião agendada!");
    registrarLog("reuniao_agendada",`agendou reunião para ${fmtDate(data)}`,"");
    window.trocarAbaReuniao("proxima");
  }catch{showToast("Erro ao agendar.",true);}
};

window.salvarAta=async(reuniaoId)=>{
  const ata=document.getElementById("reun-ata-"+reuniaoId)?.value.trim();
  const input=document.getElementById("reun-anexo-"+reuniaoId);
  const f=input?.files[0];
  try{
    let anexoUrl="",anexoNome="";
    if(f){showToast("Enviando anexo...");anexoUrl=await uploadFoto(f);anexoNome=f.name;}
    const update={ata:ata||""};
    if(anexoUrl){update.ataAnexoUrl=anexoUrl;update.ataAnexoNome=anexoNome;}
    await setDoc(doc(db,"reunioes",reuniaoId),update,{merge:true});
    showToast("✅ Ata salva!");
    registrarLog("ata_salva","salvou ata da reunião","");
    carregarReunioes();
  }catch{showToast("Erro ao salvar ata.",true);}
};

window.excluirReuniao=async(reuniaoId)=>{
  if(!confirm("Excluir esta reunião?"))return;
  try{
    await deleteDoc(doc(db,"reunioes",reuniaoId));
    showToast("Reunião excluída.");carregarReunioes();
  }catch{showToast("Erro.",true);}
};

window.recalcTotal=(evId)=>{
  const key=evId!=null?evId:"custom";
  const pedEl=document.getElementById("ped-manual-"+key);
  const gasEl=document.getElementById("gas-manual-"+key);
  const totEl=document.getElementById("total-est-"+key);
  if(!pedEl||!gasEl||!totEl)return;
  const ped=parseFloat(pedEl.value.replace(",","."))||0;
  const gas=parseFloat(gasEl.value.replace(",","."))||0;
  // Busca litros da última calc (guardado em data-lit)
  const lit=parseFloat(pedEl.closest(".rota-result")?.dataset.lit)||0;
  const comb=lit*gas;
  totEl.textContent="R$"+brl(comb+ped);
};

window.atualizarHistorico=async(tipo)=>{
  const el=document.getElementById("hist-conteudo-"+tipo);
  if(!el)return;
  const aberto=window["_hist_"+tipo];
  el.style.display=aberto?"block":"none";
  if(!aberto)return;
  el.innerHTML=`<span class="spin">⟳</span>`;
  try{
    if(tipo==="presenca"||tipo==="limpeza"){
      // Últimas 8 sextas (presenca) ou quartas (limpeza)
      const datas=[];
      const hoje=new Date();
      let d=new Date(hoje);
      const divoSemana=tipo==="limpeza"?3:5;
      const diasAtras=(hoje.getDay()>=divoSemana)?hoje.getDay()-divoSemana:7-(divoSemana-hoje.getDay());
      d.setDate(d.getDate()-diasAtras);
      for(let i=0;i<8;i++){datas.push(d.toISOString().slice(0,10));d.setDate(d.getDate()-7);}
      const snap=await getDocs(query(collection(db,"sede_confirmacoes"),where("data","in",datas),where("tipo","==",tipo)));
      const porData={};
      snap.docs.forEach(doc=>{const r=doc.data();if(!porData[r.data])porData[r.data]={sim:[],nao:[]};porData[r.data][r.resposta].push(r.apelido);});
      const html=datas.filter(s=>porData[s]).map(s=>{
        const v=porData[s].sim||[],n=porData[s].nao||[];
        return`<div style="padding:10px 0;border-bottom:1px solid var(--border)">
          <div style="display:flex;justify-content:space-between;margin-bottom:5px">
            <div style="font-size:13px;font-weight:600">${fmtDate(s)}</div>
            <div style="font-size:11px;color:var(--muted)">✅ ${v.length} · ❌ ${n.length}</div>
          </div>
          <div style="display:flex;flex-wrap:wrap;gap:3px">
            ${v.map(a=>`<span class="pres-badge pres-sim" style="font-size:10px;padding:2px 7px">${a}</span>`).join("")}
            ${n.map(a=>`<span class="pres-badge pres-nao" style="font-size:10px;padding:2px 7px">${a}</span>`).join("")}
          </div>
        </div>`;
      }).join("");
      el.innerHTML=html||`<div style="font-size:12px;color:#555;padding:8px 0">Nenhum histórico.</div>`;
    }else{
      // Bar ou Churrasco — últimas 8 semanas
      const col=tipo==="bar"?"escala_bar":"escala_churrasco";
      const hoje=new Date().toISOString().slice(0,10);
      const snap=await getDocs(query(collection(db,col),orderBy("data","desc")));
      const docs=snap.docs.filter(d=>d.data().data<hoje).slice(0,8);
      const html=docs.map(d=>{
        const e=d.data();
        const nomes=tipo==="bar"?`${e.m1} & ${e.m2}`:[e.m1,e.m2,e.m3,e.m4,e.m5].filter(Boolean).join(" · ");
        return`<div style="padding:10px 0;border-bottom:1px solid var(--border)">
          <div style="font-size:13px;font-weight:600">${fmtDate(e.data)}</div>
          <div style="font-size:12px;color:${tipo==="bar"?"var(--orange)":"var(--green)"}">${tipo==="bar"?"🍺":"🔥"} ${nomes}</div>
          ${e.obs?`<div style="font-size:11px;color:var(--muted)">📝 ${e.obs}</div>`:""}
        </div>`;
      }).join("");
      el.innerHTML=html||`<div style="font-size:12px;color:#555;padding:8px 0">Nenhum histórico.</div>`;
    }
  }catch(e){el.innerHTML=`<div style="font-size:12px;color:var(--danger)">Erro ao carregar.</div>`;}
};

window.exportarRankingCSV=()=>{
  const sorted=[...MEMBROS].filter(m=>m.totalKm>0).sort((a,b)=>(b.totalKm||0)-(a.totalKm||0));
  const linhas=[["Posição","Apelido","Km Rodados","% da Meta","Meta Atingida"]];
  sorted.forEach((m,i)=>{
    const pct=Math.round(((m.totalKm||0)/META)*100);
    linhas.push([i+1,m.apelido,m.totalKm||0,pct+"%",pct>=100?"Sim":"Não"]);
  });
  const csv=linhas.map(l=>l.join(";")).join("\n");
  const blob=new Blob(["\uFEFF"+csv],{type:"text/csv;charset=utf-8;"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;a.download="ranking_mutantes_"+new Date().getFullYear()+".csv";a.click();
  URL.revokeObjectURL(url);

};

window.exportarMensalidadesCSV=async()=>{
  try{
    const hoje=new Date();
    const meses=[];
    for(let i=0;i<6;i++){
      const d=new Date(hoje.getFullYear(),hoje.getMonth()-i,1);
      meses.push(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`);
    }
    const snap=await getDocs(collection(db,"mensalidades"));
    const pagtos={};
    snap.docs.forEach(d=>{const r=d.data();pagtos[r.membroId+"_"+r.mes]={pago:r.pago,data:r.data||""};});
    const header=["Membro",...meses.reverse()];
    const linhas=[header];
    MEMBROS.forEach(m=>{
      const linha=[m.apelido];
      meses.forEach(mes=>{
        const p=pagtos[m.uid+"_"+mes];
        linha.push(p?.pago?"Pago"+(p.data?" ("+p.data+")":""):"Pendente");
      });
      linhas.push(linha);
    });
    const csv=linhas.map(l=>l.join(";")).join("\n");
    const blob=new Blob(["\uFEFF"+csv],{type:"text/csv;charset=utf-8;"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url;a.download="mensalidades_mutantes_"+new Date().getFullYear()+".csv";a.click();
    URL.revokeObjectURL(url);
    showToast("✅ Mensalidades exportadas!");
  }catch{showToast("Erro ao exportar.",true);}
};

window.registrarComparecimento=async(membroId,apelido,eventoId)=>{
  const ev=EVENTOS.find(e=>e.id===eventoId);
  if(!ev)return;
  const btnId="btn-comp-"+membroId+"-"+eventoId;
  const btn=document.getElementById(btnId);
  if(btn){btn.disabled=true;btn.textContent="Lançando...";}
  let km=ev.dist>0?ev.dist*2:parseFloat(prompt("Distância total ida+volta (km) do evento "+ev.nome+":"));
  if(!km||isNaN(km)||km<=0){if(btn){btn.disabled=false;btn.textContent="🏁 Compareceu";}return;}
  const m=findMembro(membroId);
  try{
    const regRef=await addDoc(collection(db,"registros"),{membroId,apelido:apelido||m?.apelido||"",desc:ev.nome,data:ev.data,km,tipo:"rota",eventoId,createdAt:serverTimestamp()});
    const nt=(m?.totalKm||0)+km;
    await setDoc(doc(db,"usuarios",resolveDocId(membroId)),{totalKm:nt},{merge:true});
    if(m)m.totalKm=nt;
    await setDoc(doc(db,"presencas",membroId+"_"+eventoId),{resposta:"compareceu",compareceu:true,registroId:regRef.id,kmLancado:km},{merge:true});
    showToast("✓ "+toInt(km)+" km lançado para "+apelido+"!");
    await _recarregarPanelPresenca(eventoId);
    // Push para o membro
    const mToken=m?.fcmToken;
    if(mToken)dispararPush("🏁 Presença confirmada!",`${toInt(km)} km do evento ${ev.nome} foram lançados no seu perfil`,[mToken]);
    registrarLog("compareceu",`registrou comparecimento de ${apelido} — ${toInt(km)} km`,ev.nome);
  }catch(e){
    showToast("Erro ao lançar km.",true);
    const btnEl=document.getElementById(btnId);
    if(btnEl){btnEl.disabled=false;btnEl.textContent="🏁 Compareceu";}
  }
};

window.limparDadosTeste=async()=>{
  if(!confirm("Limpar TODOS os dados de teste?\n\nIsso vai apagar:\n• Notificações\n• Presenças em eventos\n• Confirmações de sede\n• Registros de km de teste\n• Log de ações"))return;
  showToast("Limpando...");
  try{
    const [notifSnap,presSnap,sedeSnap,logSnap]=await Promise.all([
      getDocs(collection(db,"notificacoes")),
      getDocs(collection(db,"presencas")),
      getDocs(collection(db,"sede_confirmacoes")),
      getDocs(collection(db,"audit_log")),
    ]);
    for(const d of notifSnap.docs)await deleteDoc(doc(db,"notificacoes",d.id));
    for(const d of presSnap.docs)await deleteDoc(doc(db,"presencas",d.id));
    for(const d of sedeSnap.docs)await deleteDoc(doc(db,"sede_confirmacoes",d.id));
    for(const d of logSnap.docs)await deleteDoc(doc(db,"audit_log",d.id));
    // Zera km de todos que tiveram registros de teste
    const regSnap=await getDocs(collection(db,"registros"));
    for(const d of regSnap.docs){
      const r=d.data();
      const m=MEMBROS.find(m=>m.uid===r.membroId);
      if(m){const nt=Math.max(0,(m.totalKm||0)-r.km);await setDoc(doc(db,"usuarios",r.membroId),{totalKm:nt},{merge:true});m.totalKm=nt;}
      await deleteDoc(doc(db,"registros",d.id));
    }
    CONF_SEDE={};
    await carregarRegistros();
    showToast("✓ Tudo limpo!");render();

};

async function carregarFicha(uid){

    el.innerHTML=docs.map(d=>{
      const r=d.data();
      const ts=r.criadoEm?.toDate?r.criadoEm.toDate():new Date();
      const hora=ts.toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});
      return`<div style="padding:10px;border-radius:8px;background:var(--bg);border:1px solid var(--border);margin-bottom:8px">

        </div>
        ${r.obs?`<div style="font-size:13px;white-space:pre-wrap">${r.obs}</div>`:""}
        ${r.anexoUrl?`<div style="margin-top:8px">
          ${r.anexoTipo&&r.anexoTipo.startsWith("image")?
            `<img src="${r.anexoUrl}" style="max-width:100%;border-radius:6px;cursor:pointer" onclick="window.open('${r.anexoUrl}','_blank')"/>`:
            `<a href="${r.anexoUrl}" target="_blank" style="display:flex;align-items:center;gap:6px;color:var(--orange);font-size:12px;text-decoration:none;padding:6px 10px;border:1px solid rgba(232,103,10,.3);border-radius:6px;background:rgba(232,103,10,.05)">📎 ${r.anexoNome||"Anexo"}</a>`}

let _mapa=null;
const _mapas={};

async function _montarMapa(map,orig,dest,nome,pedInfo){
  const dot=L.divIcon({className:"",html:'<div style="width:13px;height:13px;background:#e8670a;border-radius:50%;border:2px solid #fff;box-shadow:0 0 6px #000"></div>',iconSize:[13,13],iconAnchor:[6,6]});
  L.marker(orig,{icon:dot,zIndexOffset:1000}).addTo(map).bindPopup("<b>🏁 Itajaí, SC</b><br><small>Ponto de partida</small>");
  L.marker(dest,{icon:dot,zIndexOffset:1000}).addTo(map).bindPopup(`<b>🏁 ${nome}</b><br><small>Destino</small>`);

  const uid="mp"+Math.random().toString(36).slice(2,7);
  const LABELS=["⚡ Mais rápida","🔀 Alternativa 1","🔀 Alternativa 2"];
  const CORES=["#e8670a","#5b8dd9","#a259d9"];
  let bounds=null,polylines=[],rotaAtual=0;

  // Atualiza painel ao trocar rota
  const atualizarPainel=(idx)=>{
    const info=polylines[idx]?._info;
    if(!info)return;
    const el=document.getElementById(uid+"-info");
    if(el){
      el.innerHTML=`<div style="font-weight:700;margin-bottom:2px">${LABELS[idx]||"Rota"}</div>
        <div>🛣️ ${info.distKm.toLocaleString("pt-BR")} km ida</div>
        <div>⏱️ ~${info.tempoStr} de viagem</div>
        ${pedInfo?`<div style="color:#aaa;font-size:10px;margin-top:3px;line-height:1.4">🚏 ${pedInfo}</div>`:""}`;
    }
  };

  const selecionarRota=(idx)=>{
    rotaAtual=idx;
    polylines.forEach((p,i)=>{
      p.setStyle({color:i===idx?CORES[i]:"#444",weight:i===idx?5:3,opacity:i===idx?.9:.4});
      if(i===idx)p.bringToFront();
    });
    atualizarPainel(idx);
    // mover marcadores para frente
    map.eachLayer(l=>{if(l instanceof L.Marker)l.bringToFront?.();});
  };

  try{
    const r=await fetch(`https://router.project-osrm.org/route/v1/driving/${orig[1]},${orig[0]};${dest[1]},${dest[0]}?overview=full&geometries=geojson&alternatives=true`);
    const d=await r.json();
    if(!d.routes?.length)throw"";

    // Desenha alternativas primeiro (ficam atrás)
    [...d.routes].reverse().forEach((route,ri)=>{
      const i=d.routes.length-1-ri;
      const distKm=Math.round(route.distance/1000);
      const durMin=Math.round(route.duration/60);
      const h=Math.floor(durMin/60),m=durMin%60;
      const tempoStr=h>0?`${h}h${m>0?m+"min":""}`:`${m}min`;
      const pts=route.geometry.coordinates.map(c=>[c[1],c[0]]);
      const poly=L.polyline(pts,{color:i===0?CORES[0]:"#444",weight:i===0?5:3,opacity:i===0?.9:.4,interactive:true}).addTo(map);
      poly._info={distKm,tempoStr};
      poly.bindPopup(`<b>${LABELS[i]||"Rota"}</b><br>📍 ${distKm.toLocaleString("pt-BR")} km · ⏱️ ~${tempoStr}${i>0?`<br><small style="color:#aaa">Clique na linha para selecionar</small>`:""}`);
      poly.on("click",()=>selecionarRota(i));
      polylines[i]=poly;
      if(!bounds)bounds=poly.getBounds();else bounds.extend(poly.getBounds());
    });

    map.fitBounds(bounds,{padding:[20,20]});
  }catch{
    const poly=L.polyline([orig,dest],{color:CORES[0],weight:3,dashArray:"8,5",opacity:.7}).addTo(map);
    poly._info={distKm:0,tempoStr:"—"};
    poly.bindPopup(`<b>${nome}</b>`);
    polylines[0]=poly;
    bounds=L.latLngBounds([orig,dest]);
    map.fitBounds(bounds,{padding:[30,30]});
  }

  // Legenda de rotas (só se tiver alternativas)
  const temAlts=polylines.length>1;
  const infoCtrl=L.control({position:"bottomleft"});
  infoCtrl.onAdd=()=>{
    const div=L.DomUtil.create("div");
    div.style.cssText="background:rgba(10,10,10,.93);border:1px solid #333;border-radius:8px;padding:8px 10px;font-size:11px;color:#eee;line-height:1.7;max-width:175px;box-shadow:0 2px 8px rgba(0,0,0,.5)";
    const btns=temAlts?`<div style="display:flex;gap:5px;margin-bottom:7px;flex-wrap:wrap">${polylines.map((p,i)=>`<button onclick="window._selRota_${uid}(${i})" style="padding:3px 8px;border-radius:5px;border:2px solid ${CORES[i]};background:${i===0?CORES[i]:"transparent"};color:${i===0?"#fff":CORES[i]};font-size:10px;font-weight:700;cursor:pointer;font-family:inherit" id="${uid}-btn-${i}">${LABELS[i]}</button>`).join("")}</div>`:"";
    div.innerHTML=`${btns}<div id="${uid}-info"></div><div id="${uid}-pontos" style="color:#4caf7d;margin-top:4px">⛽ Buscando postos...</div>`;
    return div;
  };
  infoCtrl.addTo(map);

  // Expor função de seleção globalmente para os botões do painel
  window[`_selRota_${uid}`]=(idx)=>{
    selecionarRota(idx);
    polylines.forEach((_,i)=>{
      const btn=document.getElementById(`${uid}-btn-${i}`);
      if(btn){btn.style.background=i===idx?CORES[i]:"transparent";btn.style.color=i===idx?"#fff":CORES[i];}
    });
  };
  atualizarPainel(0);

  // Postos + pedágios via Overpass
  if(bounds){
    const sw=bounds.getSouthWest(),ne=bounds.getNorthEast();
    const postoIcon=L.divIcon({className:"",html:'<div style="background:#0f1f0f;border:1.5px solid #4caf7d;border-radius:5px;padding:1px 4px;font-size:12px;box-shadow:0 2px 5px rgba(0,0,0,.7);line-height:1.3">⛽</div>',iconSize:[24,20],iconAnchor:[12,10]});
    const pedagioIcon=L.divIcon({className:"",html:'<div style="background:#1a1000;border:1.5px solid #f5c518;border-radius:5px;padding:1px 4px;font-size:12px;box-shadow:0 2px 5px rgba(0,0,0,.7);line-height:1.3">🚏</div>',iconSize:[24,20],iconAnchor:[12,10]});
    const q=`[out:json][timeout:25];(node["amenity"="fuel"](${sw.lat},${sw.lng},${ne.lat},${ne.lng});node["barrier"="toll_booth"](${sw.lat},${sw.lng},${ne.lat},${ne.lng}););out body 60;`;
    fetch(`https://overpass-api.de/api/interpreter?data=${encodeURIComponent(q)}`)
      .then(r=>r.json())
      .then(pd=>{
        let postos=0,pedagios=0;
        (pd.elements||[]).forEach(node=>{
          if(node.tags?.amenity==="fuel"){
            postos++;
            const n=node.tags?.name||node.tags?.brand||"Posto";
            const brand=node.tags?.brand||"";
            L.marker([node.lat,node.lon],{icon:postoIcon}).addTo(map)
              .bindPopup(`<b>⛽ ${n}</b>${brand&&brand!==n?`<br><small style="color:#aaa">${brand}</small>`:""}`);
          }else if(node.tags?.barrier==="toll_booth"){
            pedagios++;
            const n=node.tags?.name||node.tags?.ref||"Praça de pedágio";
            const op=node.tags?.operator||"";
            const taxa=node.tags?.charge||"";
            L.marker([node.lat,node.lon],{icon:pedagioIcon}).addTo(map)
              .bindPopup(`<b>🚏 ${n}</b>${op?`<br><small style="color:#aaa">${op}</small>`:""}${taxa?`<br><small style="color:#f5c518">${taxa}</small>`:""}`);
          }
        });
        const el=document.getElementById(uid+"-pontos");
        if(el)el.innerHTML=`${postos>0?`⛽ ${postos} postos`:"⛽ Sem postos mapeados"}${pedagios>0?`<br>🚏 ${pedagios} pedágios`:""}`;
      })
      .catch(()=>{const el=document.getElementById(uid+"-pontos");if(el)el.textContent="";});
  }
}

async function atualizarMapaRota(evId,destCoords,nome,pedInfo){
  const card=document.getElementById("mapa-card");
  const el=document.getElementById("ev-mapa");
  if(!card||!el||!destCoords){if(card)card.style.display="none";return;}
  card.style.display="block";
  // Recriar mapa se saiu do DOM ou trocou de evento
  if(_mapa&&(!document.body.contains(_mapa.getContainer())||_mapa._evId!==evId)){
    _mapa.remove();_mapa=null;
  }
  if(!_mapa){
    _mapa=L.map(el,{zoomControl:true,attributionControl:false});
    _mapa._evId=evId;
    L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",{maxZoom:19}).addTo(_mapa);
    await _montarMapa(_mapa,COORD_ITAJAI,destCoords,nome,pedInfo);
  }else{
    setTimeout(()=>_mapa.invalidateSize(),50);
  }
}

window.lancarKm=async()=>{
  const membroId=document.getElementById("km-membro")?.value;
  const tipo=document.getElementById("km-tipo")?.value;
  const data=document.getElementById("km-data")?.value;
  const km=parseFloat(document.getElementById("km-valor")?.value);
  const err=document.getElementById("km-err");
  const btn=document.getElementById("km-btn");
  let desc="",eventoId=null;
  if(tipo==="rota"){
    const sel=document.getElementById("km-evento");
    const opt=sel?.options[sel.selectedIndex];
    if(!opt?.value){err.textContent="Selecione um evento.";err.style.display="block";return;}
    desc=opt.dataset.nome||"";eventoId=parseInt(opt.value);
  }else{
    desc=document.getElementById("km-desc")?.value.trim();
    if(!desc){err.textContent="Informe a descrição.";err.style.display="block";return;}
  }
  if(!membroId||!data||!km){err.textContent="Preencha todos os campos.";err.style.display="block";return;}
  btn.disabled=true;btn.textContent="Lançando...";err.style.display="none";
  const m=findMembro(membroId);
  try{
    await addDoc(collection(db,"registros"),{membroId,apelido:m?.apelido||"",desc,data,km,tipo,eventoId,createdAt:serverTimestamp()});
    const nt=(m?.totalKm||0)+km;
    await setDoc(doc(db,"usuarios",resolveDocId(membroId)),{totalKm:nt},{merge:true});
    if(m)m.totalKm=nt;
    await carregarRegistros();
    showToast("✓ "+toInt(km)+" km lançado!");
    ["km-membro","km-evento","km-data","km-valor"].forEach(id=>{const el=document.getElementById(id);if(el)el.value="";});
    const kd=document.getElementById("km-desc");if(kd)kd.value="";
    btn.disabled=false;btn.textContent="Lançar km";render();
    // Push para o membro
    const mToken=m?.fcmToken;
    if(mToken)dispararPush("🏍️ Km lançado!",`${toInt(km)} km registrados para você — ${desc}`,[mToken]);
    registrarLog("km_lancado",`lançou ${toInt(km)} km para ${m?.apelido||""}`,desc);
  }catch(e){err.textContent="Erro: "+e.message;err.style.display="block";btn.disabled=false;btn.textContent="Lançar km";}
};
window.salvarEdicao=async(id,membroId,kmAntigo)=>{

  if(!desc||!data||!km)return;

    await setDoc(doc(db,"registros",id),{desc,data,km},{merge:true});

    if(diff!==0){const m=findMembro(membroId);if(m){const nt=Math.max(0,(m.totalKm||0)+diff);await setDoc(doc(db,"usuarios",resolveDocId(membroId)),{totalKm:nt},{merge:true});m.totalKm=nt;}}
    await carregarRegistros();showToast("✓ Atualizado!");

    render();
  }catch{showToast("Erro ao salvar.",true);}
};

function findMembro(id){return MEMBROS.find(m=>m.uid===id)||MEMBROS.find(m=>m.authUid===id);}

async function migrarParaApelidoLowerId(){
  const snap=await getDocs(collection(db,"usuarios"));
  const antigos=snap.docs.filter(d=>{
    const data=d.data();
    const esperado=(data.apelido||"").toLowerCase();
    return esperado&&d.id!==esperado&&d.id!=="admin";
  });
  if(!antigos.length){console.log("Migração usuarios: nada a fazer.");return;}
  for(const d of antigos){
    const data=d.data();
    const novoId=data.apelido.toLowerCase();
    await setDoc(doc(db,"usuarios",novoId),{...data,uid:d.id,apelidoLower:novoId});
    await deleteDoc(doc(db,"usuarios",d.id));
  }
  console.log(`Migração usuarios: ${antigos.length} documentos migrados para ID=apelidoLower.`);
}

async function carregarConfirmacoes(){
  if(!CU||!UP)return;
  try{
    const snap=await getDocs(query(collection(db,"presencas"),where("membroId","==",CU.uid)));
    CONF={};snap.docs.forEach(d=>{
      const r=d.data().resposta;
      // normaliza legados: "sim"→"confirmado", "nao"→"desistiu"
      CONF[d.data().eventoId]=r==="sim"?"confirmado":r==="nao"?"desistiu":r||"pendente";
    });
  }catch{}
  try{
    const snap=await getDocs(query(collection(db,"sede_confirmacoes"),where("membroId","==",CU.uid)));
    CONF_SEDE={};
    snap.docs.forEach(d=>{
      const r=d.data();
      const tp=r.tipo||"presenca";
      CONF_SEDE[tp+"_"+r.data]=r.resposta;
      if(!r.tipo)CONF_SEDE[r.data]=r.resposta; // backward compat
    });
  }catch{}
}

    sim:{cls:"pres-confirmado",label:"🟡 Confirmado"},
    desistiu:{cls:"pres-desistiu",label:"🔴 Desistiu"},
    nao:{cls:"pres-desistiu",label:"🔴 Desistiu"},
    pendente:{cls:"pres-pendente",label:"⚪ Sem resposta"},

    ?`<button onclick="window.mostrarFormComp('${uid}',${evId},'editar','${p.registroId||""}',${p.kmLancado||0})" style="padding:7px 10px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--white);font-size:11px;cursor:pointer;font-family:inherit" title="Editar km">✏️</button>

function _htmlPresencaEvento(ev,pDocs){
  const normaliza=r=>r==="sim"?"confirmado":r==="nao"?"desistiu":r||"pendente";
  const compareceram=pDocs.filter(p=>p.compareceu||p.resposta==="compareceu");
  const confirmados=pDocs.filter(p=>!p.compareceu&&p.resposta!=="compareceu"&&(p.resposta==="sim"||p.resposta==="confirmado"));
  const desistiram=pDocs.filter(p=>!p.compareceu&&p.resposta!=="compareceu"&&(p.resposta==="nao"||p.resposta==="desistiu"));
  const responderam=new Set(pDocs.map(p=>p.membroId));
  const semResp=MEMBROS.filter(m=>!responderam.has(m.uid));
  const secao=(titulo,cor,lista,statusFn)=>lista.length?`
    <div style="font-size:10px;font-weight:700;color:${cor};text-transform:uppercase;letter-spacing:.5px;margin:10px 0 4px">${titulo} (${lista.length})</div>
    ${lista.map(p=>_presCardMembro(p,ev,statusFn(p))).join("")}`:"";
  return`${confirmados.length?`<button onclick="window.confirmarTodosPresentes(${ev.id})" style="width:100%;padding:11px;border-radius:8px;border:1px solid rgba(76,175,125,.3);background:rgba(76,175,125,.12);color:var(--green);font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;margin-bottom:6px">🏁 Confirmar todos os confirmados (${confirmados.length})</button>`:""}
    ${secao("🟢 Compareceram","var(--green)",compareceram,()=>"compareceu")}
    ${secao("🟡 Confirmados","#f5c518",confirmados,p=>normaliza(p.resposta))}
    ${secao("🔴 Desistiram","var(--danger)",desistiram,p=>normaliza(p.resposta))}
    ${semResp.length?`<div style="font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:10px 0 4px">⚪ SEM RESPOSTA (${semResp.length})</div>${semResp.map(m=>_presCardMembro({membroId:m.uid,apelido:m.apelido,registroId:null,kmLancado:0},ev,"pendente")).join("")}`:""}
    <div style="font-size:10px;color:var(--muted);margin-top:10px;padding-top:8px;border-top:1px solid var(--border)">🟢${compareceram.length} · 🟡${confirmados.length} · 🔴${desistiram.length} · ⚪${semResp.length}</div>`;
}
