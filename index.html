window.salvarGaragemModal=async()=>{
  const moto=document.getElementById("pm-nome")?.value.trim();
  const ano=document.getElementById("pm-ano")?.value;
  const cil=document.getElementById("pm-cil")?.value.trim();
  const cor=document.getElementById("pm-cor")?.value.trim();
  const autonomia=parseFloat(document.getElementById("pm-autonomia")?.value)||0;
  const tanque=parseFloat(document.getElementById("pm-tanque")?.value)||0;
  const gasolina=parseFloat(document.getElementById("pm-gasolina")?.value)||0;
  if(!moto){showToast("Informe o nome da moto.",true);return;}
  try{
    await setDoc(doc(db,"usuarios",MY_DOC_ID),{moto,motoAno:ano||"",motoCil:cil||"",motoCor:cor||"",autonomia,tanque,gasolina},{merge:true});
    UP.moto=moto;UP.motoAno=ano;UP.motoCil=cil;UP.motoCor=cor;
    UP.autonomia=autonomia;UP.tanque=tanque;UP.gasolina=gasolina;
    showToast("✓ Garagem salva!");document.getElementById("perfil-modal-overlay")?.remove();render();

window.salvarDadosModal=async()=>{
  const cargo=document.getElementById("pm-cargo")?.value||"";
  const rawNasc=document.getElementById("pm-nascimento")?.value||"";
  const ingresso=document.getElementById("pm-ingresso")?.value.trim()||"";
  const err=document.getElementById("pm-dados-err");
  if(err)err.style.display="none";
  const nasc=rawNasc?nascForStorage(rawNasc):"";
  if(rawNasc&&!nasc){if(err){err.textContent="Data de nascimento inválida. Use DD/MM/AAAA.";err.style.display="block";}return;}
  if(ingresso&&!/^\d{2}\/\d{2}\/\d{4}$/.test(ingresso)){if(err){err.textContent="Data de ingresso inválida. Use DD/MM/AAAA.";err.style.display="block";}return;}
  const updates={};
  if(cargo)updates.nivel=cargo;
  if(nasc)updates.nascimento=nasc;
  updates.dataIngresso=ingresso;
  try{
    await setDoc(doc(db,"usuarios",MY_DOC_ID),updates,{merge:true});
    if(cargo)UP.nivel=cargo;
    if(nasc)UP.nascimento=nasc;
    UP.dataIngresso=ingresso;
    showToast("✓ Dados salvos!");document.getElementById("perfil-modal-overlay")?.remove();render();
  }catch(e){if(err){err.textContent="Erro: "+e.message;err.style.display="block";}}
};

window.adicionarGraduacaoModal=async()=>{

    UP.historicoGraduacoes=grads;showToast("✓ Graduação adicionada!");
    document.getElementById("perfil-modal-overlay")?.remove();
    window.abrirPerfilModal("graduacoes");
  }catch(e){showToast("Erro: "+e.message,true);}
};

window.trocarSenhaModal=async()=>{
  const email=document.getElementById("pm-email")?.value.trim()||CU.email;

  if(err)err.style.display="none";if(ok)ok.style.display="none";
  if(!email||!atual||!nova||!conf){if(err){err.textContent="Preencha todos os campos.";err.style.display="block";}return;}
  if(nova.length<6){if(err){err.textContent="Mínimo 6 caracteres.";err.style.display="block";}return;}
  if(nova!==conf){if(err){err.textContent="As senhas não coincidem.";err.style.display="block";}return;}
  try{
    const cred=EmailAuthProvider.credential(email,atual);
    await reauthenticateWithCredential(CU,cred);
    await updatePassword(CU,nova);
    if(ok){ok.textContent="✓ Senha alterada!";ok.style.display="block";}
    ["pm-atual","pm-nova","pm-conf"].forEach(id=>{const el=document.getElementById(id);if(el)el.value="";});
  }catch(e){
    if(err){err.textContent=e.code&&(e.code.includes("wrong-password")||e.code.includes("invalid-credential"))?"Senha atual incorreta.":"Erro: "+e.message;err.style.display="block";}
  }
};

function calcConquistas(membro,regs){
  const km=membro.totalKm||0;
  const saidas=regs?regs.filter(r=>r.membroId===membro.authUid||r.membroId===membro.uid).length:0;
  const isSelf=membro.authUid===CU?.uid||membro.uid===MY_DOC_ID;
  const sc=_sedeCount(membro)||(isSelf?meuSedeCount():0);
  const badges=[];
  if(saidas>=1)badges.push({ic:"🏁",nome:"Primeira Saída",desc:"Participou da primeira saída"});
  if(km>=500)badges.push({ic:"🛣️",nome:"500 km",desc:"500 km rodados"});
  if(km>=1000)badges.push({ic:"🔥",nome:"1.000 km",desc:"1.000 km rodados"});
  if(km>=2500)badges.push({ic:"⚡",nome:"2.500 km",desc:"2.500 km rodados"});
  if(km>=META)badges.push({ic:"🏆",nome:"Meta Atingida",desc:`${toInt(META)} km — meta anual`});
  if(saidas>=5)badges.push({ic:"🤝",nome:"Membro Ativo",desc:"5 saídas no ano"});
  if(saidas>=10)badges.push({ic:"🦅",nome:"Veterano",desc:"10 saídas no ano"});
  if(sc>=1)badges.push({ic:"⛪",nome:"Presente na Sede",desc:"Confirmou presença em uma sexta-feira"});
  if(sc>=5)badges.push({ic:"🏠",nome:"Habitué da Sede",desc:"5 presenças confirmadas na sede"});
  if(sc>=10)badges.push({ic:"🔑",nome:"Dono da Sede",desc:"10 presenças confirmadas na sede"});
  if(membro.isDiretor||membro.isAdmin)badges.push({ic:"👑",nome:"Liderança",desc:"Membro da diretoria"});
  return badges;
}

function htmlConquistas(membro,regs){
  const badges=calcConquistas(membro,regs);
  if(badges.length===0)return`<div style="font-size:12px;color:#555">Nenhuma conquista ainda — comece a rodar!</div>`;
  return badges.map(b=>`<div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)">
    <span style="font-size:26px">${b.ic}</span>
    <div><div style="font-size:13px;font-weight:700">${b.nome}</div><div style="font-size:11px;color:var(--muted)">${b.desc}</div></div>
  </div>`).join("");
}

function nascForDisplay(v){
  if(!v)return"";
  if(/^\d{4}-\d{2}-\d{2}$/.test(v)){const[y,m,d]=v.split("-");return`${d}/${m}/${y}`;}
  return v;
}
function nascForStorage(v){
  const m=v.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
  return m?`${m[3]}-${m[2]}-${m[1]}`:"";
}
window.maskNasc=el=>{

};

        }).join("")}`;

}

window.toggleMensalidade=async(uid,apelido,mes,docId)=>{
  try{

      await setDoc(doc(db,"mensalidades",docId),{pago:!pago,data:!pago?new Date().toISOString().slice(0,10):""},{merge:true});
    }else{
      await addDoc(collection(db,"mensalidades"),{membroId:uid,apelido,mes,pago:true,data:new Date().toISOString().slice(0,10),criadoPor:UP.apelido,criadoEm:serverTimestamp()});

};

async function carregarEventosSede(){
  const el=document.getElementById("eventos-sede-lista");
  if(!el)return;
  try{
    const hoje=new Date().toISOString().slice(0,10);
    const snap=await getDocs(query(collection(db,"eventos_sede"),orderBy("data","asc")));
    const docs=snap.docs.map(d=>({id:d.id,...d.data()})).filter(e=>e.categoria!=='limpeza'&&e.categoria!=='viagem'||!e.categoria);
    const futuros=docs.filter(e=>e.data>=hoje);
    const passados=docs.filter(e=>e.data<hoje).slice(-3).reverse();
    if(docs.length===0){el.innerHTML=`<div style="font-size:12px;color:#555">Nenhum evento cadastrado.</div>`;return;}
    const isAdmin=UP&&(UP.isAdmin||UP.isDiretor);

    // Carregar contagem de confirmados por evento
    const confSnap=await getDocs(query(collection(db,"sede_confirmacoes"),where("tipo","==","evento_sede")));
    const confCounts={};
    confSnap.docs.forEach(d=>{
      const r=d.data();
      if(!confCounts[r.eventoId])confCounts[r.eventoId]={confirmado:0,compareceu:0};
      if(r.resposta==="confirmado")confCounts[r.eventoId].confirmado++;
      if(r.resposta==="compareceu")confCounts[r.eventoId].compareceu++;
    });

    const renderEv=(e,passado=false)=>{
      const hoje2=new Date();hoje2.setHours(0,0,0,0);
      const evData=new Date(e.data+"T00:00:00");
      const dias=Math.round((evData-hoje2)/(1000*60*60*24));
      const diasLabel=dias===0?"🔴 Hoje!":dias===1?"🟠 Amanhã":dias>0?`🕐 ${dias} dias`:"";
      const meuStatus=CONF_EVENTO_SEDE[e.id]||"sem_resposta";
      const counts=confCounts[e.id]||{};
      const confirmadosNum=(counts.confirmado||0)+(counts.compareceu||0);
      const acoesHtml=!passado?`<div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap">
        ${meuStatus==="confirmado"||meuStatus==="compareceu"
          ?`<button onclick="window.confirmarEventoSede('${e.id}','desistiu')" style="padding:6px 12px;border-radius:8px;border:1px solid var(--danger);background:transparent;color:var(--danger);font-size:12px;font-weight:700;cursor:pointer;font-family:inherit">❌ Desistir</button>
             <span style="font-size:11px;color:var(--green);align-self:center">${meuStatus==="compareceu"?"🏁 Compareceu":"✅ Confirmado"}</span>`
          :meuStatus==="desistiu"
          ?`<button onclick="window.confirmarEventoSede('${e.id}','confirmado')" style="padding:6px 12px;border-radius:8px;border:none;background:var(--orange);color:#fff;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit">✅ Confirmar presença</button>
             <span style="font-size:11px;color:var(--danger);align-self:center">🔴 Desistiu</span>`
          :`<button onclick="window.confirmarEventoSede('${e.id}','confirmado')" style="padding:6px 12px;border-radius:8px;border:none;background:var(--orange);color:#fff;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit">✅ Confirmar presença</button>`}
        ${isAdmin&&meuStatus==="confirmado"?`<button onclick="window.marcarCompareceuEventoSede('${e.id}')" style="padding:6px 12px;border-radius:8px;border:1px solid var(--green);background:transparent;color:var(--green);font-size:12px;font-weight:700;cursor:pointer;font-family:inherit">🏁 Compareceu</button>`:""}
        ${isAdmin?`<button onclick="window.verConfsEventoSede('${e.id}','${e.nome}')" style="padding:6px 10px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:11px;cursor:pointer;font-family:inherit">👥 Ver lista</button>`:""}
      </div>`:"";
      return`<div id="evs-card-${e.id}" style="padding:12px 0;border-bottom:1px solid var(--border);opacity:${passado?".6":"1"}">
        <div style="display:flex;align-items:flex-start;justify-content:space-between">
          <div style="flex:1">
            <div style="font-size:14px;font-weight:700">${e.nome}</div>
            <div style="font-size:12px;color:var(--muted)">${fmtDate(e.data)}${e.hora?` · ${e.hora}`:""}</div>
            ${e.obrigatorio===false?`<span style="font-size:10px;font-weight:600;color:var(--muted);background:var(--bg3);border:1px solid var(--border);padding:2px 7px;border-radius:20px;display:inline-block;margin-top:3px">Não obrigatório</span>`:""}
            ${e.desc?`<div style="font-size:12px;color:var(--muted);margin-top:2px">${e.desc}</div>`:""}
            ${e.endereco?`<div style="font-size:12px;color:var(--muted);margin-top:2px">${e.endereco} <a href="https://www.google.com/maps/search/?q=${encodeURIComponent(e.endereco)}" target="_blank" rel="noopener" style="color:var(--orange);font-weight:600;text-decoration:none">Maps</a> <a href="https://waze.com/ul?q=${encodeURIComponent(e.endereco)}" target="_blank" rel="noopener" style="color:var(--orange);font-weight:600;text-decoration:none">Waze</a></div>`:""}
            ${confirmadosNum>0?`<div style="font-size:11px;color:var(--green);margin-top:3px">✅ ${confirmadosNum} confirmado${confirmadosNum!==1?"s":""}</div>`:""}
          </div>
          <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px">
            ${diasLabel?`<span style="font-size:10px;font-weight:700;color:${dias===0?"var(--danger)":dias<=7?"var(--orange)":"var(--muted)"};background:${dias===0?"rgba(224,82,82,.15)":dias<=7?"rgba(232,103,10,.15)":"var(--bg3)"};padding:2px 8px;border-radius:20px;border:1px solid ${dias===0?"rgba(224,82,82,.3)":dias<=7?"rgba(232,103,10,.3)":"var(--border)"}">${diasLabel}</span>`:""}
            ${isAdmin?`<div style="display:flex;gap:4px">
              <button onclick="window.abrirEditarEvSede('${e.id}')" style="font-size:12px;color:var(--muted);background:transparent;border:none;cursor:pointer;padding:4px" title="Editar">✏️</button>
              <button onclick="window._confirmarExcluirEvSede('${e.id}')" style="font-size:10px;color:var(--danger);background:transparent;border:none;cursor:pointer">✕</button>
            </div>`:""}
          </div>
        </div>
        ${acoesHtml}
      </div>`;
    };
    el.innerHTML=(futuros.length===0?`<div style="font-size:12px;color:#555;margin-bottom:10px">Nenhum evento futuro.</div>`:"")
      +futuros.map(e=>renderEv(e)).join("")
      +(passados.length>0?`<div style="font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;margin-top:12px;margin-bottom:6px">Passados</div>`+passados.map(e=>renderEv(e,true)).join(""):"");
  }catch(e){el.innerHTML=`<div style="font-size:12px;color:var(--danger)">Erro.</div>`;}
}

function htmlReunioes(){
  return`<div class="card">
    <div style="display:flex;gap:6px;margin-bottom:14px">
      <button id="reun-tab-proxima" onclick="window.trocarAbaReuniao('proxima')" style="padding:6px 14px;border-radius:20px;border:none;background:var(--orange);color:#fff;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit">📅 Próxima</button>
      <button id="reun-tab-agendar" onclick="window.trocarAbaReuniao('agendar')" style="padding:6px 14px;border-radius:20px;border:1px solid var(--border);background:var(--bg3);color:var(--muted);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit">➕ Agendar</button>
      <button id="reun-tab-historico" onclick="window.trocarAbaReuniao('historico')" style="padding:6px 14px;border-radius:20px;border:1px solid var(--border);background:var(--bg3);color:var(--muted);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit">📋 Histórico</button>
    </div>
    <div id="reun-conteudo"><span class="spin">⟳</span></div>
  </div>`;

window.trocarAbaReuniao=(aba)=>{
  ["proxima","agendar","historico"].forEach(a=>{
    const btn=document.getElementById("reun-tab-"+a);
    if(!btn)return;
    const active=a===aba;
    btn.style.background=active?"var(--orange)":"var(--bg3)";
    btn.style.color=active?"#fff":"var(--muted)";
    btn.style.border=active?"none":"1px solid var(--border)";
  });
  window._reunAba=aba;
  if(aba==="agendar")renderAbaAgendarReuniao();
  else carregarReunioes();
};

function renderAbaAgendarReuniao(){
  const el=document.getElementById("reun-conteudo");
  if(!el)return;
  el.innerHTML=`
    <label>Data</label><input type="date" id="reun-data" autocomplete="off" style="margin-bottom:8px"/>
    <label>Hora</label><input type="time" id="reun-hora" value="20:00" autocomplete="off" style="margin-bottom:8px"/>
    <label>Pauta</label>
    <textarea id="reun-pauta" placeholder="Tópicos que serão discutidos na reunião..." style="width:100%;min-height:80px;padding:10px;border:1px solid var(--border);border-radius:8px;background:var(--bg3);color:var(--white);font-family:inherit;font-size:13px;resize:vertical;margin-bottom:10px"></textarea>
    <div id="reun-err" class="msg-err" style="display:none"></div>
    <button class="btn-primary" onclick="window.agendarReuniao()">Agendar reunião</button>`;
}

async function carregarReunioes(){
  const el=document.getElementById("reun-conteudo");
  if(!el)return;
  const aba=window._reunAba||"proxima";
  el.innerHTML=`<span class="spin">⟳</span>`;
  try{
    const hoje=new Date().toISOString().slice(0,10);
    const snap=await getDocs(query(collection(db,"reunioes"),orderBy("data","desc")));
    const todas=snap.docs.map(d=>({id:d.id,...d.data()}));
    const futuras=[...todas.filter(r=>r.data>=hoje)].reverse();
    const passadas=todas.filter(r=>r.data<hoje);
    if(aba==="proxima"){
      if(futuras.length===0){el.innerHTML=`<div style="font-size:12px;color:#555;padding:8px 0">Nenhuma reunião agendada. Use ➕ Agendar para criar.</div>`;return;}
      const r=futuras[0];
      const hoje2=new Date();hoje2.setHours(0,0,0,0);
      const dias=Math.round((new Date(r.data+"T00:00:00")-hoje2)/(1000*60*60*24));
      const minhaResp=(r.confirmacoes||{})[CU.uid]||"";
      const podeEditar=UP&&(UP.isAdmin||UP.isDiretor);
      el.innerHTML=`
        <div style="background:rgba(232,103,10,.06);border:1px solid rgba(232,103,10,.2);border-radius:10px;padding:14px;margin-bottom:14px">
          <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:8px">
            <div>
              <div style="font-size:15px;font-weight:700">📅 ${fmtDate(r.data)}</div>
              <div style="font-size:13px;color:var(--muted)">🕐 ${r.hora||"--:--"}</div>
            </div>
            ${dias>=0?`<span style="font-size:11px;color:${dias===0?"var(--danger)":dias<=7?"var(--orange)":"var(--muted)"};font-weight:700;background:${dias===0?"rgba(224,82,82,.15)":dias<=7?"rgba(232,103,10,.15)":"var(--bg3)"};padding:3px 8px;border-radius:20px;border:1px solid ${dias===0?"rgba(224,82,82,.3)":dias<=7?"rgba(232,103,10,.3)":"var(--border)"}">${dias===0?"🔴 Hoje!":dias===1?"🟠 Amanhã":"🕐 "+dias+" dias"}</span>`:""}
          </div>
          ${r.pauta?`<div style="font-size:12px;background:var(--bg3);border-radius:6px;padding:8px;margin-bottom:10px;border-left:3px solid var(--orange)">📋 <strong>Pauta:</strong><br>${r.pauta}</div>`:""}
          <div style="display:flex;gap:8px;margin-bottom:10px">
            <button onclick="window.confirmarReuniao('${r.id}','sim')" style="flex:1;padding:10px;border-radius:8px;border:none;background:${minhaResp==="sim"?"#2a6e3f":"var(--orange)"};color:#fff;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit">✅ Vou!</button>
            <button onclick="window.confirmarReuniao('${r.id}','nao')" style="flex:1;padding:10px;border-radius:8px;border:1px solid var(--danger);background:${minhaResp==="nao"?"rgba(224,82,82,.2)":"transparent"};color:var(--danger);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit">❌ Não vou</button>
          </div>
          ${minhaResp?`<div class="hint-box">${minhaResp==="sim"?"✅ Você confirmou presença!":"❌ Você marcou que não vai."}</div>`:""}
        </div>
        <div class="sec-title">👥 Confirmações</div>
        <div style="margin-bottom:16px">${htmlConfirmacoesReuniao(r)}</div>
        <div style="border-top:1px solid var(--border);padding-top:14px">
          <div class="sec-title">📝 Ata pós-reunião</div>
          ${r.ata?`<div style="background:var(--bg3);border-radius:8px;padding:10px 12px;border-left:3px solid var(--green);margin-bottom:10px;font-size:13px;line-height:1.5;white-space:pre-wrap">${r.ata}</div>`:"<div style='font-size:12px;color:#555;margin-bottom:10px'>Ata não registrada ainda.</div>"}
          ${r.ataAnexoUrl?`<div style="margin-bottom:12px">${r.ataAnexoUrl.match(/\.(jpg|jpeg|png|gif|webp)/i)?`<img src="${r.ataAnexoUrl}" style="max-width:100%;border-radius:8px;cursor:pointer" onclick="window.open('${r.ataAnexoUrl}','_blank')">`:`<a href="${r.ataAnexoUrl}" target="_blank" style="display:inline-flex;align-items:center;gap:6px;color:var(--orange);font-size:12px;text-decoration:none;padding:8px 12px;border:1px solid rgba(232,103,10,.3);border-radius:8px">📎 ${r.ataAnexoNome||"Anexo da ata"}</a>`}</div>`:""}
          ${podeEditar?`
          <textarea id="reun-ata-${r.id}" placeholder="Registre as decisões, encaminhamentos, votações..." style="width:100%;min-height:100px;padding:10px;border:1px solid var(--border);border-radius:8px;background:var(--bg3);color:var(--white);font-family:inherit;font-size:13px;resize:vertical;margin-bottom:8px">${r.ata||""}</textarea>
          <div style="display:flex;gap:8px;align-items:center;margin-bottom:10px">
            <label for="reun-anexo-${r.id}" style="text-transform:none;letter-spacing:0;font-size:12px;cursor:pointer;padding:7px 12px;border:1px solid var(--border);border-radius:8px;background:var(--bg3);color:var(--white);margin:0;flex-shrink:0">📎 Anexar</label>
            <input type="file" id="reun-anexo-${r.id}" accept="image/*,.pdf,.doc,.docx" style="display:none;margin:0" onchange="document.getElementById('reun-anexo-nome-${r.id}').textContent=this.files[0]?.name||''"/>
            <span id="reun-anexo-nome-${r.id}" style="font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></span>
          </div>
          <div style="display:flex;gap:8px">
            <button class="btn-primary" style="flex:1" onclick="window.salvarAta('${r.id}')">💾 Salvar ata</button>
            <button onclick="window.excluirReuniao('${r.id}')" style="padding:9px 14px;border-radius:8px;border:1px solid rgba(224,82,82,.3);background:transparent;color:var(--danger);cursor:pointer;font-family:inherit;font-size:13px">${li("trash-2",14)}</button>
          </div>`:""}
        </div>`;
    }else{
      if(passadas.length===0){el.innerHTML=`<div style="font-size:12px;color:#555">Nenhuma reunião passada ainda.</div>`;return;}
      el.innerHTML=passadas.map(r=>`
        <div style="padding:12px 0;border-bottom:1px solid var(--border)">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">
            <div>
              <div style="font-size:13px;font-weight:600">📅 ${fmtDate(r.data)} · 🕐 ${r.hora||"—"}</div>
              ${r.pauta?`<div style="font-size:11px;color:var(--muted);margin-top:2px">📋 ${r.pauta}</div>`:""}
            </div>
            <span style="font-size:10px;color:var(--muted)">✅ ${Object.values(r.confirmacoes||{}).filter(v=>v==="sim").length} presentes</span>
          </div>
          ${r.ata?`<div style="font-size:12px;background:var(--bg3);border-radius:6px;padding:8px;border-left:3px solid var(--green);white-space:pre-wrap;margin-bottom:4px">${r.ata}</div>`:`<div style="font-size:11px;color:#555">Sem ata.</div>`}
          ${r.ataAnexoUrl?`<a href="${r.ataAnexoUrl}" target="_blank" style="display:inline-flex;align-items:center;gap:5px;color:var(--orange);font-size:11px;text-decoration:none;margin-top:4px">📎 ${r.ataAnexoNome||"Anexo"}</a>`:""}
        </div>`).join("");
    }
  }catch(e){el.innerHTML=`<div style="font-size:12px;color:var(--danger)">Erro ao carregar.</div>`;}
}

function htmlConfirmacoesReuniao(r){
  const confs=r.confirmacoes||{};
  const vao=MEMBROS.filter(m=>confs[m.uid]==="sim");
  const nao=MEMBROS.filter(m=>confs[m.uid]==="nao");
  const semResp=MEMBROS.filter(m=>!confs[m.uid]);
  return`<div style="display:flex;flex-wrap:wrap;gap:4px;margin-bottom:5px">
    ${vao.map(m=>`<span class="pres-badge pres-sim" style="font-size:10px">✅ ${m.apelido}</span>`).join("")}
    ${nao.map(m=>`<span class="pres-badge pres-nao" style="font-size:10px">❌ ${m.apelido}</span>`).join("")}
  </div>
  <div style="font-size:10px;color:var(--muted)">✅ ${vao.length} · ❌ ${nao.length} · ⏳ ${semResp.length} sem resposta</div>`;
}

window.confirmarReuniao=async(reuniaoId,resp)=>{
  try{
    await setDoc(doc(db,"reunioes",reuniaoId),{[`confirmacoes.${CU.uid}`]:resp},{merge:true});
    showToast(resp==="sim"?"✅ Presença confirmada!":"❌ Ausência registrada.");
    carregarReunioes();
  }catch{showToast("Erro.",true);}
};

window.agendarReuniao=async()=>{
  const data=document.getElementById("reun-data")?.value;
  const hora=document.getElementById("reun-hora")?.value;
  const pauta=document.getElementById("reun-pauta")?.value.trim();
  const err=document.getElementById("reun-err");
  if(!data){err.textContent="Preencha a data.";err.style.display="block";return;}
  err.style.display="none";
  try{
    await addDoc(collection(db,"reunioes"),{data,hora:hora||"",pauta:pauta||"",confirmacoes:{},ata:"",ataAnexoUrl:"",ataAnexoNome:"",criadoPor:UP.apelido,criadoEm:serverTimestamp()});
    showToast("✅ Reunião agendada!");
    registrarLog("reuniao_agendada",`agendou reunião para ${fmtDate(data)}`,"");
    window.trocarAbaReuniao("proxima");
  }catch{showToast("Erro ao agendar.",true);}
};

window.salvarAta=async(reuniaoId)=>{
  const ata=document.getElementById("reun-ata-"+reuniaoId)?.value.trim();
  const input=document.getElementById("reun-anexo-"+reuniaoId);
  const f=input?.files[0];
  try{
    let anexoUrl="",anexoNome="";
    if(f){showToast("Enviando anexo...");anexoUrl=await uploadFoto(f);anexoNome=f.name;}
    const update={ata:ata||""};
    if(anexoUrl){update.ataAnexoUrl=anexoUrl;update.ataAnexoNome=anexoNome;}
    await setDoc(doc(db,"reunioes",reuniaoId),update,{merge:true});
    showToast("✅ Ata salva!");
    registrarLog("ata_salva","salvou ata da reunião","");
    carregarReunioes();
  }catch{showToast("Erro ao salvar ata.",true);}
};

window.excluirReuniao=async(reuniaoId)=>{
  if(!confirm("Excluir esta reunião?"))return;
  try{
    await deleteDoc(doc(db,"reunioes",reuniaoId));
    showToast("Reunião excluída.");carregarReunioes();
  }catch{showToast("Erro.",true);}
};

        ${avatarEl(r.fotoUrl||"",r.autor,28)}

window.recalcTotal=(evId)=>{
  const key=evId!=null?evId:"custom";
  const pedEl=document.getElementById("ped-manual-"+key);
  const gasEl=document.getElementById("gas-manual-"+key);
  const totEl=document.getElementById("total-est-"+key);
  if(!pedEl||!gasEl||!totEl)return;
  const ped=parseFloat(pedEl.value.replace(",","."))||0;
  const gas=parseFloat(gasEl.value.replace(",","."))||0;
  // Busca litros da última calc (guardado em data-lit)

  totEl.textContent="R$"+brl(comb+ped);
};

window.confirmarSede=async(data,resposta,tipo)=>{
  const tp=tipo||"presenca";
  const docId=CU.uid+"_"+tp+"_"+data;
  const anterior=CONF_SEDE[tp+"_"+data];
  try{
    await setDoc(doc(db,"sede_confirmacoes",docId),{membroId:CU.uid,apelido:UP.apelido,data,resposta,tipo:tp,updatedAt:serverTimestamp()});
    CONF_SEDE[tp+"_"+data]=resposta;
    if(tp==="presenca"){
      const uid=CU.uid;
      if(resposta==="sim"&&anterior!=="sim")SEDE_COUNTS[uid]=(SEDE_COUNTS[uid]||0)+1;
      else if(resposta!=="sim"&&anterior==="sim")SEDE_COUNTS[uid]=Math.max(0,(SEDE_COUNTS[uid]||1)-1);
    }
    showToast(resposta==="sim"?(tp==="limpeza"?"🧹 Confirmado para limpeza!":"⛪ Presença confirmada!"):"❌ Ausência registrada.");
    registrarLog("sede_confirmada",`${resposta==="sim"?"confirmou":"recusou"} ${tp==="limpeza"?"limpeza":"presença na sede"}`,fmtDate(data));
    if(resposta==="sim")registrarFeed(CU.uid,UP.apelido,tp==="limpeza"?"limpeza":"sede",`${UP.apelido} confirmou ${tp==="limpeza"?"participação na limpeza":"presença na sede"}`);
    render();
    setTimeout(carregarSedeInfo,200);
  }catch{showToast("Erro ao confirmar.",true);}
};

  const data=nascForStorage(raw);
  if(!data){showToast("Data inválida. Use DD/MM/AAAA.",true);return;}

  if(data>=hoje){showToast("A data deve ser anterior a hoje.",true);return;}
  const docId1=CU.uid+"_presenca_"+data;
  const docId2=CU.uid+"_sede_"+data;
  try{
    const [snap1,snap2]=await Promise.all([getDoc(doc(db,"sede_confirmacoes",docId1)),getDoc(doc(db,"sede_confirmacoes",docId2))]);
    if(snap1.exists()||snap2.exists()){showToast("Presença já registrada para esta data.",true);return;}
    await setDoc(doc(db,"sede_confirmacoes",docId2),{membroId:CU.uid,apelido:UP.apelido,data,tipo:"sede",compareceu:true,resposta:"sim",updatedAt:serverTimestamp()});

    inp.value="";

};
window.atualizarHistorico=async(tipo)=>{
  const el=document.getElementById("hist-conteudo-"+tipo);
  if(!el)return;
  const aberto=window["_hist_"+tipo];
  el.style.display=aberto?"block":"none";
  if(!aberto)return;
  el.innerHTML=`<span class="spin">⟳</span>`;
  try{
    if(tipo==="presenca"||tipo==="limpeza"){
      // Últimas 8 sextas (presenca) ou quartas (limpeza)
      const datas=[];
      const hoje=new Date();
      let d=new Date(hoje);
      const divoSemana=tipo==="limpeza"?3:5;
      const diasAtras=(hoje.getDay()>=divoSemana)?hoje.getDay()-divoSemana:7-(divoSemana-hoje.getDay());
      d.setDate(d.getDate()-diasAtras);
      for(let i=0;i<8;i++){datas.push(d.toISOString().slice(0,10));d.setDate(d.getDate()-7);}
      const snap=await getDocs(query(collection(db,"sede_confirmacoes"),where("data","in",datas),where("tipo","==",tipo)));
      const porData={};
      snap.docs.forEach(doc=>{const r=doc.data();if(!porData[r.data])porData[r.data]={sim:[],nao:[]};porData[r.data][r.resposta].push(r.apelido);});
      const html=datas.filter(s=>porData[s]).map(s=>{
        const v=porData[s].sim||[],n=porData[s].nao||[];
        return`<div style="padding:10px 0;border-bottom:1px solid var(--border)">
          <div style="display:flex;justify-content:space-between;margin-bottom:5px">
            <div style="font-size:13px;font-weight:600">${fmtDate(s)}</div>
            <div style="font-size:11px;color:var(--muted)">✅ ${v.length} · ❌ ${n.length}</div>
          </div>
          <div style="display:flex;flex-wrap:wrap;gap:3px">
            ${v.map(a=>`<span class="pres-badge pres-sim" style="font-size:10px;padding:2px 7px">${a}</span>`).join("")}
            ${n.map(a=>`<span class="pres-badge pres-nao" style="font-size:10px;padding:2px 7px">${a}</span>`).join("")}
          </div>
        </div>`;
      }).join("");
      el.innerHTML=html||`<div style="font-size:12px;color:#555;padding:8px 0">Nenhum histórico.</div>`;
    }else{
      // Bar ou Churrasco — últimas 8 semanas
      const col=tipo==="bar"?"escala_bar":"escala_churrasco";
      const hoje=new Date().toISOString().slice(0,10);
      const snap=await getDocs(query(collection(db,col),orderBy("data","desc")));
      const docs=snap.docs.filter(d=>d.data().data<hoje).slice(0,8);
      const html=docs.map(d=>{
        const e=d.data();
        const nomes=tipo==="bar"?`${e.m1} & ${e.m2}`:[e.m1,e.m2,e.m3,e.m4,e.m5].filter(Boolean).join(" · ");
        return`<div style="padding:10px 0;border-bottom:1px solid var(--border)">
          <div style="font-size:13px;font-weight:600">${fmtDate(e.data)}</div>
          <div style="font-size:12px;color:${tipo==="bar"?"var(--orange)":"var(--green)"}">${tipo==="bar"?"🍺":"🔥"} ${nomes}</div>
          ${e.obs?`<div style="font-size:11px;color:var(--muted)">📝 ${e.obs}</div>`:""}
        </div>`;
      }).join("");
      el.innerHTML=html||`<div style="font-size:12px;color:#555;padding:8px 0">Nenhum histórico.</div>`;
    }
  }catch(e){el.innerHTML=`<div style="font-size:12px;color:var(--danger)">Erro ao carregar.</div>`;}
};

window.salvarEscalaBar=async()=>{
  const data=document.getElementById("bar-data")?.value;
  const m1=document.getElementById("bar-m1")?.value;
  const m2=document.getElementById("bar-m2")?.value;
  const obs=document.getElementById("bar-obs")?.value.trim();
  const err=document.getElementById("bar-err");
  if(!data||!m1||!m2){err.textContent="Selecione a data e os dois membros.";err.style.display="block";return;}
  if(m1===m2){err.textContent="Selecione dois membros diferentes.";err.style.display="block";return;}
  err.style.display="none";
  try{
    await addDoc(collection(db,"escala_bar"),{data,m1,m2,obs:obs||"",criadoEm:serverTimestamp(),criadoPor:UP.apelido});
    showToast("✓ Escala salva!");
    document.getElementById("bar-obs").value="";
    carregarEscalaLista();
  }catch{showToast("Erro ao salvar escala.",true);}
};
window.excluirEscala=async(id,col)=>{

  try{await deleteDoc(doc(db,col||"escala_bar",id));showToast("Escala excluída.");carregarEscalaLista();}catch{showToast("Erro.",true);}
};
window.salvarEscalaChurrasco=async()=>{
  const data=document.getElementById("chur-data")?.value;
  const m1=document.getElementById("chur-m1")?.value;
  const m2=document.getElementById("chur-m2")?.value;
  const m3=document.getElementById("chur-m3")?.value;
  const m4=document.getElementById("chur-m4")?.value;
  const m5=document.getElementById("chur-m5")?.value||"";
  const obs=document.getElementById("chur-obs")?.value.trim();
  const err=document.getElementById("chur-err");
  if(!data||!m1||!m2||!m3||!m4){err.textContent="Selecione a data e os 4 membros.";err.style.display="block";return;}
  const escolhidos=[m1,m2,m3,m4,...(m5?[m5]:[])].filter(Boolean);
  if(new Set(escolhidos).size<escolhidos.length){err.textContent="Selecione membros diferentes.";err.style.display="block";return;}
  err.style.display="none";
  try{
    await addDoc(collection(db,"escala_churrasco"),{data,m1,m2,m3,m4,m5:m5||"",obs:obs||"",criadoEm:serverTimestamp(),criadoPor:UP.apelido});
    showToast("✓ Escala do churrasco salva!");
    document.getElementById("chur-obs").value="";
    carregarEscalaLista();
  }catch{showToast("Erro ao salvar.",true);}
};

    showToast(novo?`✓ ${apelido} agora gerencia o bar`:`✓ Acesso Bar removido de ${apelido}`);render();

};
window.salvarEncontro=async(eventoId)=>{
  const local=document.getElementById("enc-local-"+eventoId)?.value.trim();
  const hora=document.getElementById("enc-hora-"+eventoId)?.value;
  const resp=document.getElementById("enc-resp-"+eventoId)?.value;
  const obs=document.getElementById("enc-obs-"+eventoId)?.value.trim();
  if(!local){showToast("Informe o local de encontro.",true);return;}
  try{
    ENCONTROS[eventoId]={local,hora:hora||"",resp:resp||"",obs:obs||""};
    await setDoc(doc(db,"config","encontros"),ENCONTROS);
    const ev=EVENTOS.find(e=>e.id===eventoId);
    registrarLog("encontro_salvo",`definiu ponto de encontro: ${local}`,ev?.nome||"");
    showToast("✓ Ponto de encontro salvo!");render();
  }catch(e){showToast("Erro ao salvar.",true);}
};

window.carregarRegsPorMembro=async()=>{
  const uid=document.getElementById("pormembro-sel")?.value;
  const lista=document.getElementById("pormembro-lista");
  if(!lista)return;
  if(!uid){lista.innerHTML="";return;}
  lista.innerHTML=`<div style="font-size:12px;color:var(--muted);padding:8px 0"><span class="spin">⟳</span> Carregando...</div>`;
  try{
    const mb=findMembro(uid);
    const ids=[...new Set([uid,mb?.authUid].filter(Boolean))];
    const allRegs=[];
    const allSedes=[];
    for(const id of ids){
      const [rs,ss]=await Promise.all([
        getDocs(query(collection(db,"registros"),where("membroId","==",id),orderBy("createdAt","desc"))),
        getDocs(query(collection(db,"sede_confirmacoes"),where("membroId","==",id)))
      ]);
      rs.docs.forEach(d=>allRegs.push({id:d.id,...d.data()}));
      ss.docs.forEach(d=>allSedes.push({id:d.id,...d.data()}));
    }
    const seen=new Set();
    const regs=allRegs.filter(r=>{if(seen.has(r.id))return false;seen.add(r.id);return true;}).sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));
    const seenS=new Set();
    const sedes=allSedes.filter(s=>{if(seenS.has(s.id))return false;seenS.add(s.id);return true;}).sort((a,b)=>(b.data||"").localeCompare(a.data||""));
    const tipoSedeLabel=t=>t==="presenca"?"🏠 Presença Sede":t==="limpeza"?"🧹 Limpeza":t==="evento_sede"?"🎉 Evento Sede":"🏠 Sede";
    const respostaLabel=r=>r==="sim"?"✅ Confirmou":r==="não"||r==="nao"?"❌ Não vai":r==="compareceu"?"🏁 Compareceu":r||"—";
    const rowStyle="display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border)";
    const btnDel=fn=>`<button onclick="${fn}" style="padding:5px 8px;border-radius:6px;border:1px solid rgba(224,82,82,.3);background:transparent;color:var(--danger);font-size:15px;cursor:pointer;flex-shrink:0;line-height:1;margin-left:10px" title="Excluir">🗑️</button>`;
    const emptyMsg=`<div style="font-size:12px;color:var(--muted);padding:8px 0">Nenhum registro encontrado.</div>`;
    const blocoKm=`<div style="font-size:11px;font-weight:700;color:var(--orange);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px;margin-top:4px">🏍️ KM Rodado</div>`
      +(regs.length?regs.map(r=>`<div style="${rowStyle}"><div style="flex:1;min-width:0"><div style="font-size:11px;color:var(--muted)">${fmtDate(r.data)}</div><div style="font-size:13px;font-weight:600">${r.tipo==="extra"?"⭐ Km avulso":"🗺️ Presença"} — ${toInt(r.km||0)} km</div>${r.desc?`<div style="font-size:11px;color:var(--muted);margin-top:1px">${r.desc}</div>`:""}</div>${btnDel(`window.excluirRegPorMembro('${r.id}','${uid}',${r.km||0})`)}</div>`).join(""):emptyMsg);
    const blocoSede=`<div style="font-size:11px;font-weight:700;color:var(--orange);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px;margin-top:16px">🏠 Presenças na Sede</div>`
      +(sedes.length?sedes.map(s=>`<div style="${rowStyle}"><div style="flex:1;min-width:0"><div style="font-size:11px;color:var(--muted)">${fmtDate(s.data)}</div><div style="font-size:13px;font-weight:600">${tipoSedeLabel(s.tipo)}</div><div style="font-size:11px;color:var(--muted);margin-top:1px">${respostaLabel(s.resposta)}</div></div>${btnDel(`window.excluirSedeConfPorMembro('${s.id}')`)}</div>`).join(""):emptyMsg);
    lista.innerHTML=blocoKm+blocoSede;
  }catch(e){lista.innerHTML=`<div style="font-size:12px;color:var(--danger);padding:8px 0">Erro: ${e.message}</div>`;}
};
window.excluirRegPorMembro=(id,membroId,km)=>{
  window.confirmarAcao("Tem certeza que deseja excluir este registro? Esta ação não pode ser desfeita.",async()=>{
    try{
      await deleteDoc(doc(db,"registros",id));
      const presSnap=await getDocs(query(collection(db,"presencas"),where("registroId","==",id)));
      for(const pd of presSnap.docs)await deleteDoc(pd.ref);
      await recalcularKmMembro(membroId);
      await carregarRegistros();
      showToast("Registro excluído.");
      render();
      window.carregarRegsPorMembro();
    }catch{showToast("Erro ao excluir.",true);}
  });
};

function htmlNotifBanner(){
  if(!('Notification' in window))return'';
  if(Notification.permission==='granted')return'';
  const _base='background:rgba(0,0,0,.55);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:14px;padding:11px 14px;margin-bottom:12px;display:flex;align-items:center;gap:10px';
  const _isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent)&&!window.MSStream;
  const _isStandalone=window.matchMedia('(display-mode:standalone)').matches||!!window.navigator.standalone;
  // iOS fora do standalone — push requer app instalado na tela inicial
  if(_isIOS&&!_isStandalone){
    return`<div id="notif-push-banner" style="${_base};border:1px solid rgba(255,193,7,.3)">
      <span style="font-size:22px;flex-shrink:0">🍎</span>
      <div style="flex:1;min-width:0;font-size:12px;color:var(--muted);line-height:1.4">No iPhone/iPad, <strong style="color:#fff">instale o app na tela inicial</strong> primeiro para receber notificações push.</div>
      <button onclick="window.dispensarNotifBanner()" style="background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;line-height:1;padding:0 2px;flex-shrink:0">✕</button>
    </div>`;
  }
  // Permissão explicitamente bloqueada — orientar nas configurações do browser
  if(Notification.permission==='denied'){
    return`<div id="notif-push-banner" style="${_base};border:1px solid rgba(224,82,82,.3)">
      <span style="font-size:22px;flex-shrink:0">🔕</span>
      <div style="flex:1;min-width:0;font-size:12px;color:var(--muted);line-height:1.4">Notificações <strong style="color:var(--danger)">bloqueadas</strong>. Para ativar, abra as configurações do navegador e permita notificações para este site.</div>
      <button onclick="window.dispensarNotifBanner()" style="background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;line-height:1;padding:0 2px;flex-shrink:0">✕</button>
    </div>`;
  }
  // Estado 'default' — ainda não decidiu
  return`<div id="notif-push-banner" style="${_base};border:1px solid rgba(255,102,0,.25)">
    <span style="font-size:22px;flex-shrink:0">🔔</span>
    <div style="flex:1;min-width:0;font-size:12px;color:var(--muted);line-height:1.4">Ative as notificações para não perder nada do clube!</div>
    <button id="notif-ativar-btn" onclick="window.ativarNotificacoes()" style="padding:7px 12px;min-height:34px;border-radius:20px;border:none;background:var(--orange);color:#fff;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;flex-shrink:0;white-space:nowrap">Ativar agora</button>
    <button onclick="window.dispensarNotifBanner()" style="background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;line-height:1;padding:0 2px;flex-shrink:0">✕</button>
  </div>`;
}

window.ativarNotificacoes=async()=>{
  const btn=document.getElementById('notif-ativar-btn');
  if(btn){btn.disabled=true;btn.textContent='Aguarde...';}
  try{
    await registrarTokenPush(true);
    document.getElementById('notif-push-banner')?.remove();
    if(Notification.permission==='granted')showToast('✓ Notificações ativadas!');
    else render();
  }catch{
    document.getElementById('notif-push-banner')?.remove();
  }
};

window.dispensarNotifBanner=()=>{
  document.getElementById('notif-push-banner')?.remove();
};

window.pwaInstalar=async function(){
  if(window._pwaDeferred){
    try{
      window._pwaDeferred.prompt();
      await window._pwaDeferred.userChoice;
    }catch(e){}
    window._pwaDeferred=null;
    localStorage.setItem('mutantes_install_dismissed','1');
    const el=document.getElementById('pwa-inicio-banner');
    if(el)el.remove();
    return;
  }
  // Sem prompt nativo (iPhone ou Chrome restritivo) — modal com instruções
  const isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent);
  const instrucoes=isIOS
    ?`<div style="font-size:13px;font-weight:700;margin-bottom:10px;color:var(--orange)">iPhone / iPad (Safari)</div>
      <div style="font-size:14px;color:var(--white);line-height:1.8">
        1. Toque no ícone de compartilhar <strong style="font-size:16px">□↑</strong> na barra inferior<br>
        2. Role para baixo e toque em <strong>"Adicionar à Tela de Início"</strong><br>
        3. Toque em <strong>"Adicionar"</strong> no canto superior direito
      </div>`
    :`<div style="font-size:13px;font-weight:700;margin-bottom:10px;color:var(--orange)">Android (Chrome)</div>
      <div style="font-size:14px;color:var(--white);line-height:1.8">
        1. Toque nos 3 pontinhos <strong>⋮</strong> no canto superior direito<br>
        2. Toque em <strong>"Adicionar à tela inicial"</strong><br>
        3. Confirme tocando em <strong>"Adicionar"</strong>
      </div>`;
  const modal=document.createElement('div');
  modal.id='pwa-manual-modal';
  modal.style.cssText='position:fixed;inset:0;z-index:9995;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.65);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)';
  modal.innerHTML=`<div style="width:100%;max-width:480px;background:rgba(15,15,15,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.1);border-top:2px solid var(--orange);border-radius:20px 20px 0 0;padding:24px 20px 36px">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px">
      <div style="font-size:16px;font-weight:700">${li("smartphone",18)} Instalar app</div>
      <button onclick="document.getElementById('pwa-manual-modal').remove()" style="background:none;border:none;color:var(--muted);font-size:22px;cursor:pointer;line-height:1;padding:0 4px">✕</button>
    </div>
    ${instrucoes}
    <button onclick="document.getElementById('pwa-manual-modal').remove();window.pwaDispensar()" style="width:100%;padding:14px;min-height:44px;border-radius:50px;border:none;background:linear-gradient(135deg,#ff6600,#ff8c2a);color:#fff;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;margin-top:20px">Entendido</button>
  </div>`;
  modal.addEventListener('click',e=>{if(e.target===modal)modal.remove();});
  document.body.appendChild(modal);
  lcr();
};

window.enviarReset=async()=>{
  const email=document.getElementById("esqueci-email")?.value.trim();
  const ok=document.getElementById("esqueci-ok");
  if(!email){showToast("Informe o e-mail.",true);return;}
  try{

    if(ok)ok.style.display="block";
    showToast("✅ Link enviado para "+email);

};

window.exportarRankingCSV=()=>{
  const sorted=[...MEMBROS].filter(m=>m.totalKm>0).sort((a,b)=>(b.totalKm||0)-(a.totalKm||0));
  const linhas=[["Posição","Apelido","Km Rodados","% da Meta","Meta Atingida"]];
  sorted.forEach((m,i)=>{
    const pct=Math.round(((m.totalKm||0)/META)*100);
    linhas.push([i+1,m.apelido,m.totalKm||0,pct+"%",pct>=100?"Sim":"Não"]);
  });
  const csv=linhas.map(l=>l.join(";")).join("\n");
  const blob=new Blob(["\uFEFF"+csv],{type:"text/csv;charset=utf-8;"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;a.download="ranking_mutantes_"+new Date().getFullYear()+".csv";a.click();
  URL.revokeObjectURL(url);
  showToast("✅ Ranking exportado!");
};

window.carregarRelMembro=async(uid)=>{
  const area=document.getElementById('rel-membro-area');
  if(!area)return;
  if(!uid){area.innerHTML='';return;}
  area.innerHTML='<div style="text-align:center;padding:24px"><span class="spin">⟳</span></div>';
  const m=MEMBROS.find(mb=>mb.uid===uid);
  if(!m){area.innerHTML='<div style="font-size:13px;color:var(--muted);padding:12px 0">Membro não encontrado.</div>';return;}

  let savedObs='',savedObsTs='';
  try{
    const snap=await getDoc(doc(db,'usuarios',uid));
    if(snap.exists()){savedObs=snap.data().observacoes||'';savedObsTs=snap.data().observacoesData||'';}
  }catch{}

  const memRegs=REGS.filter(r=>r.membroId===m.authUid||r.membroId===m.uid);
  const nowD=new Date();

  const meses=Array.from({length:12},(_,i)=>{
    const d=new Date(nowD.getFullYear(),nowD.getMonth()-11+i,1);
    return{label:d.toLocaleDateString('pt-BR',{month:'short'}).replace('.','')+" '"+String(d.getFullYear()).slice(2),km:0,mes:d.getMonth(),ano:d.getFullYear()};
  });
  memRegs.forEach(r=>{
    const rd=r.data?new Date(r.data+'T12:00:00'):(r.createdAt?.toDate?r.createdAt.toDate():r.createdAt?new Date(r.createdAt):null);
    if(!rd)return;
    const b=meses.find(b=>b.mes===rd.getMonth()&&b.ano===rd.getFullYear());
    if(b)b.km+=(r.km||0);

  const kmAvulso=memRegs
    .filter(r=>r.tipo==='extra')
    .map(r=>{const ds=r.data||'';return{data:ds,dataDisplay:nascForDisplay(ds)||ds,km:r.km||0,desc:r.desc||''};})
    .sort((a,b)=>b.data.localeCompare(a.data));

  let evComp=0,evHistorico=[];
  const evTotal=EVENTOS.filter(e=>new Date(e.data+'T00:00:00')<=nowD).length;
  try{
    const pSnap=await getDocs(query(collection(db,'presencas'),where('membroId','==',m.authUid)));
    const pSnap2=(m.uid&&m.uid!==m.authUid)?await getDocs(query(collection(db,'presencas'),where('membroId','==',m.uid))):null;
    const presCompareceu=[...pSnap.docs,...(pSnap2?.docs||[])].filter(d=>d.data().resposta==='compareceu').map(d=>d.data());
    evComp=presCompareceu.length;
    evHistorico=presCompareceu.map(p=>{
      const ev=EVENTOS.find(e=>e.id===p.eventoId);
      const reg=memRegs.find(r=>r.eventoId===p.eventoId&&r.tipo==='rota');
      const ds=ev?.data||'';
      return{nome:p.nomeEvento||ev?.nome||'—',data:ds,dataDisplay:nascForDisplay(ds)||ds,local:[ev?.destino,ev?.estado].filter(Boolean).join(' ')||'—',km:reg?.km||p.kmLancado||0};
    }).sort((a,b)=>b.data.localeCompare(a.data));
  }catch{}

  if(!window._sedeCountsLoaded){await carregarSedePresencas();}
  const sc=_sedeCount(m);
  const scEv=_sedeCountEv(m);
  const scLimp=_sedeCountLimp(m);
  const totalSextas=contarSextasDoAno(ANO_ATIVO);
  const totalEvSede=TOTAL_EVENTOS_SEDE;
  const totalLimpezas=TOTAL_LIMPEZAS;
  const pctSede=totalSextas>0?Math.round((sc/totalSextas)*100):0;
  const pctEvSede=totalEvSede>0?Math.round((scEv/totalEvSede)*100):0;
  const pctLimp=totalLimpezas>0?Math.round((scLimp/totalLimpezas)*100):0;
  const pctEv=evTotal>0?Math.round((evComp/evTotal)*100):0;

  const kmRaw=m.totalKm||0;

    const h=Math.round((b.km/maxKm)*56);

      <div style="font-size:8px;color:var(--muted);line-height:1;white-space:nowrap">${b.km>0?toInt(b.km):''}</div>
      <div style="width:90%;background:${b.km>0?'var(--orange)':'rgba(255,255,255,.06)'};height:${Math.max(h,2)}px;border-radius:2px 2px 0 0;transition:height .4s"></div>
      <div style="font-size:7.5px;color:#555;white-space:nowrap;text-align:center">${b.label}</div>
    </div>`;
  }).join('');

  const nascDisplay=nascForDisplay(m.nascimento)||'—';

  try{if(m.createdAt){const cd=m.createdAt?.toDate?m.createdAt.toDate():new Date(m.createdAt);cadastroDisplay=cd.toLocaleDateString('pt-BR');}}catch{}
  const obsDataDisplay=savedObsTs?new Date(savedObsTs).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}):'';

  area.innerHTML=`<div style="margin-top:14px">

      ${avatarEl(m.fotoUrl,m.apelido,52)}
      <div>

        ${m.isDiretor||m.isAdmin?'<div style="font-size:10px;color:var(--green);font-weight:700;margin-top:3px">DIRETORIA</div>':''}
      </div>
    </div>
    <div class="grid2" style="margin-bottom:14px">
      <div class="metric"><div class="metric-label">${li("route",12)} Total km</div><div class="metric-value" style="color:var(--orange)">${toInt(kmRaw)}</div></div>
      <div class="metric"><div class="metric-label">${li("target",12)} Meta ${toInt(META)} km</div><div class="metric-value" style="color:${pctColor}">${pct}%</div></div>
      <div class="metric"><div class="metric-label">📅 Eventos</div><div class="metric-value">${evComp}/${evTotal} <span style="font-size:11px;color:var(--muted)">(${pctEv}%)</span></div></div>
      <div class="metric"><div class="metric-label">🗓️ Sextas sede</div><div class="metric-value" style="color:#60b8ff">${sc}/${totalSextas} <span style="font-size:11px;color:var(--muted)">(${pctSede}%)</span></div></div>
      <div class="metric"><div class="metric-label">🎉 Eventos sede</div><div class="metric-value" style="color:#60b8ff">${scEv}/${totalEvSede} <span style="font-size:11px;color:var(--muted)">(${pctEvSede}%)</span></div></div>
      ${totalLimpezas>0?`<div class="metric"><div class="metric-label">🧹 Limpezas</div><div class="metric-value" style="color:#60b8ff">${scLimp}/${totalLimpezas} <span style="font-size:11px;color:var(--muted)">(${pctLimp}%)</span></div></div>`:''}
    </div>
    <div style="margin-bottom:14px">
      <div style="font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.4px;margin-bottom:8px">Km por mês — últimos 12 meses</div>
      <div style="display:flex;align-items:flex-end;height:82px;gap:1px">${chartBars}</div>
    </div>
    ${evHistorico.length?`<div style="margin-bottom:14px">
      <div style="font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.4px;margin-bottom:8px">Histórico de eventos comparecidos (${evHistorico.length})</div>
      ${evHistorico.map(h=>`<div style="display:flex;align-items:flex-start;gap:8px;padding:7px 0;border-bottom:1px solid var(--border)">
        <div style="width:7px;height:7px;border-radius:50%;background:var(--orange);flex-shrink:0;margin-top:4px"></div>

          <div style="font-size:12px;font-weight:600">${h.nome}</div>

    ${kmAvulso.length?`<div style="margin-bottom:14px">

  const memRegsSortedAsc=[...memRegs].sort((a,b)=>(a.data||'').localeCompare(b.data||''));

  const passedEvsSorted2=EVENTOS.filter(e=>new Date(e.data+'T00:00:00')<=nowD).sort((a,b)=>a.data.localeCompare(b.data));

  window._relMembroCtx={m,meses,evComp,evTotal,evHistorico,kmAvulso,sc,scEv,scLimp,totalSextas,totalEvSede,totalLimpezas,pctSede,pctEvSede,pctLimp,pctEv,badges,nascDisplay,cadastroDisplay,longestTrip,firstReg:firstReg2,lastReg:lastReg2,clubAvgKm:clubAvgKm2,maxEvStreak};

};

window.ativarDitado=()=>{
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){showToast('Ditado não suportado. Use Chrome ou Android.',true);return;}
  const ta=document.getElementById('rel-obs');
  const btn=document.getElementById('rel-voz-btn');
  if(!ta)return;
  const rec=new SR();
  rec.lang='pt-BR';rec.interimResults=false;rec.maxAlternatives=1;
  rec.onstart=()=>{if(btn){btn.textContent='🔴 Ouvindo...';btn.style.color='var(--danger)';btn.style.borderColor='var(--danger)';}};
  rec.onresult=e=>{const t=e.results[0][0].transcript;ta.value+=(ta.value?'\n':'')+t;};
  rec.onerror=e=>{showToast('Erro no ditado: '+e.error,true);};
  rec.onend=()=>{if(btn){btn.textContent='🎤 Voz';btn.style.color='';btn.style.borderColor='';}};
  rec.start();
};

window.salvarObsMembro=async(uid,showMsg=true)=>{
  const obs=document.getElementById('rel-obs')?.value||'';
  const id=uid||window._relMembroUid;
  if(!id)return;
  try{
    const ts=new Date().toISOString();
    await setDoc(doc(db,'usuarios',id),{observacoes:obs,observacoesData:ts},{merge:true});
    const m2=MEMBROS.find(mb=>mb.uid===id);
    if(m2){m2.observacoes=obs;m2.observacoesData=ts;}
    if(showMsg)showToast('✓ Observações salvas!');
  }catch(e){if(showMsg)showToast('Erro: '+e.message,true);}
};

window.gerarPdfMembro=async(uid)=>{
  if(!(window.jspdf&&window.jspdf.jsPDF)){showToast('jsPDF não carregado. Verifique conexão.',true);return;}
  const ctx=window._relMembroCtx;
  if(!ctx||ctx.m.uid!==uid){showToast('Selecione o membro primeiro.',true);return;}
  await window.salvarObsMembro(uid,false);
  showToast('Gerando PDF...');
  const{m,meses,evComp,evTotal,evHistorico,kmAvulso,sc,scEv,totalSextas,totalEvSede,pctSede,pctEvSede,pctEv,badges,nascDisplay,cadastroDisplay,longestTrip,firstReg,lastReg,clubAvgKm,maxEvStreak}=ctx;
  const obs=document.getElementById('rel-obs')?.value||'';
  const ano=ANO_ATIVO;
  const kmRaw=Math.round(m.totalKm||0);
  const pct=Math.round((kmRaw/META)*100);

  const fetchImgB64=async(url,size=100,circle=false)=>{
    if(!url)return null;
    return new Promise(resolve=>{
      const img=new Image();img.crossOrigin='anonymous';
      img.onload=()=>{
        const c=document.createElement('canvas');c.width=c.height=size;
        const ctx2=c.getContext('2d');
        if(circle){ctx2.beginPath();ctx2.arc(size/2,size/2,size/2,0,Math.PI*2);ctx2.clip();}
        ctx2.drawImage(img,0,0,size,size);
        resolve(c.toDataURL(circle?'image/png':'image/jpeg',0.85));
      };
      img.onerror=()=>resolve(null);
      img.src=url+(url.includes('?')?'&':'?')+'_nc='+Date.now();
    });
  };

  const[logoB64,fotoB64]=await Promise.all([
    fetchImgB64('logo.png',80,false),
    m.fotoUrl?fetchImgB64(m.fotoUrl,120,true):Promise.resolve(null)
  ]);

  const {jsPDF}=window.jspdf;
  const pdf=new jsPDF({orientation:'portrait',unit:'mm',format:'a4'});
  const W=210,H=297,ML=15,MR=15;
  const CW=W-ML-MR;
  const FOOTER_H=14;

  // ── helpers
  const rgb=h=>{const v=h.replace('#','');return[parseInt(v.slice(0,2),16),parseInt(v.slice(2,4),16),parseInt(v.slice(4,6),16)];};
  const fill=h=>{const[r,g,b]=rgb(h);pdf.setFillColor(r,g,b);};
  const txtC=h=>{const[r,g,b]=rgb(h);pdf.setTextColor(r,g,b);};
  const stroke=h=>{const[r,g,b]=rgb(h);pdf.setDrawColor(r,g,b);};
  const sep=(y2)=>{stroke('#333333');pdf.setLineWidth(0.2);pdf.line(ML,y2,W-MR,y2);};
  const secTitle=(txt,y2)=>{
    txtC('#ff6600');pdf.setFontSize(11);pdf.setFont('helvetica','bold');
    pdf.text(txt.toUpperCase(),ML,y2);
    sep(y2+2);
  };
  const newPage=()=>{
    drawFooter();
    pdf.addPage();
    fill('#0d0d0d');pdf.rect(0,0,W,H,'F');
  };
  const chk=(y2,n=15)=>{if(y2+n>H-FOOTER_H-4){newPage();return ML;}return y2;};
  const drawFooter=()=>{
    fill('#111111');pdf.rect(0,H-FOOTER_H,W,FOOTER_H,'F');
    stroke('#333333');pdf.setLineWidth(0.2);pdf.line(0,H-FOOTER_H,W,H-FOOTER_H);
    txtC('#555555');pdf.setFontSize(9);pdf.setFont('helvetica','normal');
    const dataHoje=new Date().toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric'});
    pdf.text('Gerado em '+dataHoje+' · Mutantefy · Mutantes MC Itajai',W/2,H-5,{align:'center'});
  };

  // ── Background
  fill('#0d0d0d');pdf.rect(0,0,W,H,'F');

  // ── Header: #1a1a1a, logo left, title center, year right, 2px orange bottom border
  const HDR=34;
  fill('#1a1a1a');pdf.rect(0,0,W,HDR,'F');
  fill('#ff6600');pdf.rect(0,HDR-2,W,2,'F');
  // logo left
  if(logoB64)pdf.addImage(logoB64,'JPEG',ML,5,20,20);
  // title center
  txtC('#ffffff');pdf.setFont('helvetica','bold');pdf.setFontSize(13);
  pdf.text('Mutantes MC Itajai',W/2,13,{align:'center'});
  txtC('#aaaaaa');pdf.setFont('helvetica','normal');pdf.setFontSize(8);
  pdf.text('Relatorio Individual do Membro',W/2,21,{align:'center'});
  // year right
  txtC('#ff6600');pdf.setFont('helvetica','bold');pdf.setFontSize(12);
  pdf.text(String(ano),W-MR,15,{align:'right'});

  // ── Member profile row
  let y=HDR+8;
  if(fotoB64){
    pdf.addImage(fotoB64,'PNG',ML,y,24,24);
    stroke('#ff6600');pdf.setLineWidth(0.5);pdf.circle(ML+12,y+12,12,'S');
  }else{
    fill('#1a1a1a');stroke('#333333');pdf.setLineWidth(0.3);pdf.roundedRect(ML,y,24,24,2,2,'FD');
    stroke('#ff6600');pdf.setLineWidth(0.5);pdf.roundedRect(ML,y,24,24,2,2,'S');
    txtC('#ff6600');pdf.setFontSize(13);pdf.setFont('helvetica','bold');
    pdf.text((m.apelido||'?').charAt(0).toUpperCase(),ML+12,y+16,{align:'center'});
  }
  const nX=ML+28;
  txtC('#ffffff');pdf.setFontSize(14);pdf.setFont('helvetica','bold');pdf.text(m.apelido||'',nX,y+9);
  txtC('#ff6600');pdf.setFontSize(9);pdf.setFont('helvetica','normal');pdf.text(m.nivel||'Membro',nX,y+17);
  if(m.isDiretor||m.isAdmin){txtC('#4caf7d');pdf.setFontSize(7.5);pdf.setFont('helvetica','bold');pdf.text('DIRETORIA',nX,y+24);}
  y+=30;sep(y);y+=6;

  // ── Metric cards 2×2 — #1a1a1a, border #333, label #999 10px, value #ff6600 18px bold
  const pctHex=pct>=100?'#4caf7d':pct>=60?'#ff6600':'#e05252';
  const pctEvHex=pctEv>=80?'#4caf7d':pctEv>=50?'#60b8ff':'#aaaaaa';
  const pctSedeHex=pctSede>=80?'#4caf7d':pctSede>=50?'#60b8ff':'#aaaaaa';
  const pctEvSedeHex=pctEvSede>=80?'#4caf7d':pctEvSede>=50?'#60b8ff':'#aaaaaa';
  const cW=(CW-5)/2,cH=22;
  const cards=[
    {lbl:'Km rodados',val:kmRaw.toLocaleString('pt-BR')+' km',col:'#ff6600'},
    {lbl:'Meta ('+Math.round(META/1000)+'k km)',val:pct+'%',col:pctHex},
    {lbl:'Eventos comparecidos',val:evComp+'/'+evTotal+' ('+pctEv+'%)',col:pctEvHex},
    {lbl:'Sextas na sede',val:sc+'/'+totalSextas+' ('+pctSede+'%)',col:pctSedeHex},
    {lbl:'Eventos na sede',val:scEv+'/'+totalEvSede+' ('+pctEvSede+'%)',col:pctEvSedeHex},
  ];
  cards.forEach((c,i)=>{
    const cx=ML+(i%2)*(cW+5),cy=y+Math.floor(i/2)*(cH+4);
    fill('#1a1a1a');stroke('#333333');pdf.setLineWidth(0.25);pdf.roundedRect(cx,cy,cW,cH,2,2,'FD');
    txtC('#999999');pdf.setFontSize(10);pdf.setFont('helvetica','normal');pdf.text(c.lbl,cx+5,cy+8);
    const[r2,g2,b2]=rgb(c.col);pdf.setTextColor(r2,g2,b2);pdf.setFontSize(18);pdf.setFont('helvetica','bold');
    pdf.text(c.val,cx+5,cy+19);
  });
  y+=3*(cH+4)+6;

  // ── Bar chart — full width, #111 bg, #ff6600 bars, #444 axis
  y=chk(y,42);sep(y);y+=5;
  secTitle('Km por mes — ultimos 12 meses',y);y+=6;
  const chartH=28,maxKm2=Math.max(...meses.map(b=>b.km),1),slotW=CW/12;
  fill('#111111');stroke('#444444');pdf.setLineWidth(0.2);pdf.rect(ML,y,CW,chartH,'FD');
  meses.forEach((b,i)=>{
    const bx=ML+i*slotW;
    const bh=Math.max((b.km/maxKm2)*(chartH-2),0);
    if(b.km>0){
      fill('#ff6600');pdf.rect(bx+1,y+chartH-bh-1,slotW-2,bh,'F');
      txtC('#dddddd');pdf.setFontSize(4);
      pdf.text(b.km>=1000?Math.round(b.km/100)/10+'k':String(Math.round(b.km)),bx+slotW/2,y+chartH-bh-2,{align:'center'});
    }
    txtC('#444444');pdf.setFontSize(4.5);pdf.text(b.label,bx+slotW/2,y+chartH+3.5,{align:'center'});
  });
  y+=chartH+8;

  // ── Cumulative km line chart
  if(meses.some(b=>b.km>0)){
    y=chk(y,42);sep(y);y+=5;
    secTitle('Evolucao acumulada de km — ano atual',y);y+=6;
    const cumH=26,slotCW=CW/12;
    let _acc=0;const cumKm=meses.map(b=>{_acc+=b.km;return _acc;});
    const maxCum=Math.max(...cumKm,1);
    fill('#111111');stroke('#444444');pdf.setLineWidth(0.2);pdf.rect(ML,y,CW,cumH,'FD');
    const pts=cumKm.map((v,i)=>({x:ML+i*slotCW+slotCW/2,y2:y+cumH-(v/maxCum)*(cumH-3)-1}));
    stroke('#ff6600');pdf.setLineWidth(0.8);
    for(let i=1;i<pts.length;i++){if(cumKm[i-1]>0||cumKm[i]>0)pdf.line(pts[i-1].x,pts[i-1].y2,pts[i].x,pts[i].y2);}
    pts.forEach((p,i)=>{
      if(cumKm[i]>0){
        fill('#ff6600');pdf.circle(p.x,p.y2,0.9,'F');
        if(i===0||i===pts.length-1||meses[i].km>0){
          txtC('#ff6600');pdf.setFontSize(4.5);
          pdf.text(cumKm[i]>=1000?Math.round(cumKm[i]/100)/10+'k':String(Math.round(cumKm[i])),p.x,p.y2-2.5,{align:'center'});
        }
      }
    });
    meses.forEach((b,i)=>{txtC('#444444');pdf.setFontSize(4.5);pdf.text(b.label,ML+i*slotCW+slotCW/2,y+cumH+3.5,{align:'center'});});
    y+=cumH+9;
  }

  // ── Destaques individuais
  {
    y=chk(y,34);sep(y);y+=5;
    secTitle('Destaques',y);y+=6;
    const vsClube=clubAvgKm>0?Math.round(((kmRaw-clubAvgKm)/clubAvgKm)*100):0;
    const dests=[
      {lb:'Sequencia de eventos',val:maxEvStreak>0?String(maxEvStreak)+' seguido'+(maxEvStreak!==1?'s':''):'—'},
      {lb:'Viagem mais longa',val:longestTrip?toInt(longestTrip.km)+' km — '+longestTrip.nome:'—'},
      {lb:'Primeiro registro',val:firstReg?firstReg.display:'—'},
      {lb:'Ultimo registro',val:lastReg?lastReg.display:'—'},
      {lb:'vs Media do clube',val:clubAvgKm>0?(vsClube>=0?'+':'')+vsClube+'% (media: '+toInt(clubAvgKm)+' km)':'—'},
    ];
    const dCW=(CW-4)/2,dH=11;
    dests.forEach((d,i)=>{
      const dx=ML+(i%2)*(dCW+4),dy=y+Math.floor(i/2)*(dH+3);
      fill('#1a1a1a');stroke('#333333');pdf.setLineWidth(0.2);pdf.roundedRect(dx,dy,dCW,dH,1.5,1.5,'FD');
      txtC('#999999');pdf.setFontSize(6.5);pdf.setFont('helvetica','normal');pdf.text(d.lb,dx+3,dy+4.5);
      txtC('#ff6600');pdf.setFontSize(7.5);pdf.setFont('helvetica','bold');
      pdf.text(pdf.splitTextToSize(d.val,dCW-6)[0]||d.val,dx+3,dy+9.5);
    });
    y+=Math.ceil(dests.length/2)*(dH+3)+6;
  }

  // ── Viagens realizadas — tabela completa
  if(evHistorico&&evHistorico.length){
    y=chk(y,30);sep(y);y+=5;
    secTitle('Viagens realizadas ('+evHistorico.length+')',y);y+=7;
    const vCols=[{lbl:'Data',x:ML,w:22},{lbl:'Viagem',x:ML+23,w:68},{lbl:'Local',x:ML+92,w:60},{lbl:'Km',x:ML+153,w:27}];
    fill('#333333');pdf.rect(ML,y-4,CW,6,'F');
    vCols.forEach(c=>{txtC('#ff6600');pdf.setFontSize(8);pdf.setFont('helvetica','bold');pdf.text(c.lbl,c.x+1,y);});
    y+=4;
    let totalKmViagens=0;
    evHistorico.forEach((h,i)=>{
      y=chk(y,7);
      fill(i%2===0?'#111111':'#1a1a1a');pdf.rect(ML,y-3.5,CW,6.5,'F');
      txtC('#cccccc');pdf.setFontSize(9);pdf.setFont('helvetica','normal');
      pdf.text(h.dataDisplay||'—',vCols[0].x+1,y);
      pdf.text(pdf.splitTextToSize(h.nome,vCols[1].w-2)[0]||'',vCols[1].x+1,y);
      pdf.text(pdf.splitTextToSize(h.local||'—',vCols[2].w-2)[0]||'',vCols[2].x+1,y);
      if(h.km){txtC('#ff6600');pdf.setFont('helvetica','bold');}else txtC('#666666');
      pdf.text(h.km?toInt(h.km)+' km':'—',vCols[3].x+1,y);
      totalKmViagens+=h.km||0;
      y+=6.5;
    });
    // Total row
    y=chk(y,8);
    fill('#1a1a1a');pdf.rect(ML,y-3.5,CW,7,'F');
    pdf.setDrawColor(255,102,0);pdf.setLineWidth(0.3);pdf.line(ML,y-3.5,W-MR,y-3.5);
    txtC('#aaaaaa');pdf.setFontSize(8);pdf.setFont('helvetica','bold');pdf.text('Total',vCols[0].x+1,y+0.5);
    txtC('#ff6600');pdf.text(toInt(totalKmViagens)+' km',vCols[3].x+1,y+0.5);
    y+=10;
  }

  // ── Event history — table: Data · Evento · Local · Km
  if(evHistorico&&evHistorico.length){
    y=chk(y,30);sep(y);y+=5;
    secTitle('Historico de eventos comparecidos',y);y+=7;
    // header row
    const cols=[{lbl:'Data',x:ML,w:22},{lbl:'Evento',x:ML+23,w:68},{lbl:'Local',x:ML+92,w:60},{lbl:'Km',x:ML+153,w:27}];
    fill('#333333');pdf.rect(ML,y-4,CW,6,'F');
    cols.forEach(c=>{txtC('#ff6600');pdf.setFontSize(8);pdf.setFont('helvetica','bold');pdf.text(c.lbl,c.x+1,y);});
    y+=4;
    evHistorico.forEach((h,i)=>{
      y=chk(y,7);
      fill(i%2===0?'#111111':'#1a1a1a');pdf.rect(ML,y-3.5,CW,6.5,'F');
      txtC('#cccccc');pdf.setFontSize(9);pdf.setFont('helvetica','normal');
      const nomeT=pdf.splitTextToSize(h.nome,cols[1].w-2)[0]||'';
      const localT=pdf.splitTextToSize(h.local||'—',cols[2].w-2)[0]||'';
      pdf.text(h.dataDisplay||'—',cols[0].x+1,y);
      pdf.text(nomeT,cols[1].x+1,y);
      pdf.text(localT,cols[2].x+1,y);
      if(h.km){txtC('#ff6600');pdf.setFont('helvetica','bold');}
      pdf.text(h.km?h.km.toLocaleString('pt-BR'):'—',cols[3].x+1,y);
      y+=6.5;
    });
    y+=5;
  }

  // ── Avulso km
  if(kmAvulso&&kmAvulso.length){
    y=chk(y,25);sep(y);y+=5;
    secTitle('Km avulso',y);y+=7;
    kmAvulso.forEach((k,i)=>{
      y=chk(y,7);
      fill(i%2===0?'#111111':'#1a1a1a');pdf.rect(ML,y-3.5,CW,6.5,'F');

      pdf.text(k.dataDisplay+(k.desc?' · '+k.desc:''),ML+2,y);
      txtC('#ff6600');pdf.setFont('helvetica','bold');
      pdf.text(k.km.toLocaleString('pt-BR')+' km',W-MR,y,{align:'right'});

    });

  // ── Personal data
  y=chk(y,25);sep(y);y+=5;
  secTitle('Dados Pessoais',y);y+=7;
  const personalFields=[
    m.moto?['Moto',m.moto]:null,
    ['Aniversario',nascDisplay],
    ['Cadastro no clube',cadastroDisplay],
    m.dataIngresso?['Ingresso no clube',m.dataIngresso]:null,
    m.email?['Email',m.email.substring(0,50)]:null,
  ].filter(Boolean);
  personalFields.forEach(([lbl,val])=>{
    y=chk(y,7);
    txtC('#999999');pdf.setFontSize(9);pdf.setFont('helvetica','normal');pdf.text(lbl,ML,y);

  });
  y+=4;

  // ── Graduações
  if(m.historicoGraduacoes&&m.historicoGraduacoes.length){
    y=chk(y,20);sep(y);y+=5;
    secTitle('Historico de Graduacoes',y);y+=7;
    m.historicoGraduacoes.forEach((g,i)=>{
      y=chk(y,7);

      fill('#ff6600');pdf.circle(ML+2,y-0.5,1.5,'F');

    y+=4;
  }

  // ── Achievements — one per line with orange bullet
  if(badges.length){
    y=chk(y,20);sep(y);y+=5;
    secTitle('Conquistas ('+badges.length+')',y);y+=7;
    badges.forEach(b=>{
      y=chk(y,7);
      fill('#ff6600');pdf.circle(ML+2,y-0.5,1.5,'F');
      txtC('#cccccc');pdf.setFontSize(11);pdf.setFont('helvetica','normal');
      pdf.text(b.nome,ML+6,y);
      y+=6.5;
    });
    y+=4;
  }

  // ── Observations — plain text in #1a1a1a box, border #333
  if(obs.trim()){
    y=chk(y,30);sep(y);y+=5;
    secTitle('Observacoes',y);y+=7;

    fill('#1a1a1a');stroke('#333333');pdf.setLineWidth(0.25);pdf.roundedRect(ML,y-2,CW,obsBoxH,2,2,'FD');
    txtC('#cccccc');pdf.setFontSize(11);pdf.setFont('helvetica','normal');
    obsLines.forEach(l2=>{
      if(y>H-FOOTER_H-6){drawFooter();pdf.addPage();fill('#0d0d0d');pdf.rect(0,0,W,H,'F');y=ML;}

  }

  // ── Footer on last page
  drawFooter();

  const fname='relatorio-'+(m.apelido||'membro').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,'-')+'-'+ano+'.pdf';
  pdf.save(fname);
  showToast('PDF salvo: '+fname);
};

window.exportarMensalidadesCSV=async()=>{
  try{
    const hoje=new Date();
    const meses=[];
    for(let i=0;i<6;i++){
      const d=new Date(hoje.getFullYear(),hoje.getMonth()-i,1);
      meses.push(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`);
    }
    const snap=await getDocs(collection(db,"mensalidades"));
    const pagtos={};
    snap.docs.forEach(d=>{const r=d.data();pagtos[r.membroId+"_"+r.mes]={pago:r.pago,data:r.data||""};});
    const header=["Membro",...meses.reverse()];
    const linhas=[header];
    MEMBROS.forEach(m=>{
      const linha=[m.apelido];
      meses.forEach(mes=>{
        const p=pagtos[m.uid+"_"+mes];
        linha.push(p?.pago?"Pago"+(p.data?" ("+p.data+")":""):"Pendente");
      });
      linhas.push(linha);
    });
    const csv=linhas.map(l=>l.join(";")).join("\n");
    const blob=new Blob(["\uFEFF"+csv],{type:"text/csv;charset=utf-8;"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url;a.download="mensalidades_mutantes_"+new Date().getFullYear()+".csv";a.click();
    URL.revokeObjectURL(url);
    showToast("✅ Mensalidades exportadas!");
  }catch{showToast("Erro ao exportar.",true);}
};

window.filtrarMembros=(texto)=>{
  const q=texto.toLowerCase().trim();
  document.querySelectorAll(".membro-item").forEach(el=>{
    const apelido=el.dataset.apelido||"";
    el.style.display=(!q||apelido.includes(q))?"block":"none";
  });
};

async function carregarStatusMembros(){
  try{
    const dataSex=proxSexta();
    const snap=await getDocs(query(collection(db,"sede_confirmacoes"),where("data","==",dataSex),where("tipo","==","presenca")));
    const confs={};
    snap.docs.forEach(d=>{const r=d.data();confs[r.membroId]=r.resposta;});
    MEMBROS.forEach(m=>{
      const el=document.getElementById("status-"+m.uid);
      if(!el)return;
      const r=confs[m.uid];
      el.style.background=r==="sim"?"var(--green)":r==="nao"?"var(--danger)":"#444";
      el.title=r==="sim"?"✅ Confirmado esta sexta":r==="nao"?"❌ Não vai esta sexta":"⏳ Sem resposta";
    });
  }catch{}
}

window.registrarComparecimento=async(membroId,apelido,eventoId)=>{
  const ev=EVENTOS.find(e=>e.id===eventoId);
  if(!ev)return;
  const btnId="btn-comp-"+membroId+"-"+eventoId;
  const btn=document.getElementById(btnId);
  if(btn){btn.disabled=true;btn.textContent="Lançando...";}
  let km=ev.dist>0?ev.dist*2:parseFloat(prompt("Distância total ida+volta (km) do evento "+ev.nome+":"));
  if(!km||isNaN(km)||km<=0){if(btn){btn.disabled=false;btn.textContent="🏁 Compareceu";}return;}
  const m=findMembro(membroId);
  try{
    const regRef=await addDoc(collection(db,"registros"),{membroId,apelido:apelido||m?.apelido||"",desc:ev.nome,data:ev.data,km,tipo:"rota",eventoId,createdAt:serverTimestamp()});
    const nt=(m?.totalKm||0)+km;
    await setDoc(doc(db,"usuarios",resolveDocId(membroId)),{totalKm:nt},{merge:true});
    if(m)m.totalKm=nt;
    await setDoc(doc(db,"presencas",membroId+"_"+eventoId),{resposta:"compareceu",compareceu:true,registroId:regRef.id,kmLancado:km},{merge:true});
    showToast("✓ "+toInt(km)+" km lançado para "+apelido+"!");
    await _recarregarPanelPresenca(eventoId);
    // Push para o membro
    const mToken=m?.fcmToken;
    if(mToken)dispararPush("🏁 Presença confirmada!",`${toInt(km)} km do evento ${ev.nome} foram lançados no seu perfil`,[mToken]);
    registrarLog("compareceu",`registrou comparecimento de ${apelido} — ${toInt(km)} km`,ev.nome);
  }catch(e){
    showToast("Erro ao lançar km.",true);
    const btnEl=document.getElementById(btnId);
    if(btnEl){btnEl.disabled=false;btnEl.textContent="🏁 Compareceu";}
  }
};

};

window.salvarFormComp=async(uid,apelido,evId)=>{
  const inp=document.getElementById("comp-inp-"+uid+"-"+evId);
  const km=parseFloat(inp?.value);
  if(!km||isNaN(km)||km<=0){showToast("Informe um km válido.",true);return;}
  const info=_compFormMode[uid+"_"+evId]||{};
  const ev=EVENTOS.find(e=>e.id===evId);
  if(!ev)return;
  if(inp)inp.disabled=true;
  try{
    if(info.mode==="editar"){
      const m=findMembro(uid);
      if(info.regId)await setDoc(doc(db,"registros",info.regId),{km},{merge:true});
      await recalcularKmMembro(uid);
      await setDoc(doc(db,"presencas",uid+"_"+evId),{kmLancado:km},{merge:true});
      showToast("✓ Km atualizado para "+toInt(km)+"!");
    }else{
      const m=findMembro(uid);
      const regRef=await addDoc(collection(db,"registros"),{membroId:uid,apelido:apelido||m?.apelido||"",desc:ev.nome,data:ev.data,km,tipo:"rota",eventoId:evId,createdAt:serverTimestamp()});
      const nt=(m?.totalKm||0)+km;
      await setDoc(doc(db,"usuarios",resolveDocId(uid)),{totalKm:nt},{merge:true});
      if(m)m.totalKm=nt;
      await setDoc(doc(db,"presencas",uid+"_"+evId),{resposta:"compareceu",compareceu:true,registroId:regRef.id,kmLancado:km},{merge:true});
      const mToken=m?.fcmToken;
      if(mToken)dispararPush("🏁 Presença confirmada!",`${toInt(km)} km do evento ${ev.nome} foram lançados no seu perfil`,[mToken]);
      registrarLog("compareceu",`registrou comparecimento de ${apelido||uid} — ${toInt(km)} km`,ev.nome);

    }
    await _recarregarPanelPresenca(evId);
  }catch(e){showToast("Erro: "+e.message,true);if(inp)inp.disabled=false;}
};
window.limparDadosTeste=async()=>{
  if(!confirm("Limpar TODOS os dados de teste?\n\nIsso vai apagar:\n• Notificações\n• Presenças em eventos\n• Confirmações de sede\n• Registros de km de teste\n• Log de ações"))return;
  showToast("Limpando...");
  try{
    const [notifSnap,presSnap,sedeSnap,logSnap]=await Promise.all([
      getDocs(collection(db,"notificacoes")),
      getDocs(collection(db,"presencas")),
      getDocs(collection(db,"sede_confirmacoes")),
      getDocs(collection(db,"audit_log")),
    ]);
    for(const d of notifSnap.docs)await deleteDoc(doc(db,"notificacoes",d.id));
    for(const d of presSnap.docs)await deleteDoc(doc(db,"presencas",d.id));
    for(const d of sedeSnap.docs)await deleteDoc(doc(db,"sede_confirmacoes",d.id));
    for(const d of logSnap.docs)await deleteDoc(doc(db,"audit_log",d.id));
    // Zera km de todos que tiveram registros de teste
    const regSnap=await getDocs(collection(db,"registros"));
    for(const d of regSnap.docs){
      const r=d.data();
      const m=MEMBROS.find(m=>m.uid===r.membroId);
      if(m){const nt=Math.max(0,(m.totalKm||0)-r.km);await setDoc(doc(db,"usuarios",r.membroId),{totalKm:nt},{merge:true});m.totalKm=nt;}
      await deleteDoc(doc(db,"registros",d.id));
    }
    CONF_SEDE={};
    await carregarRegistros();
    showToast("✓ Tudo limpo!");render();
  }catch(e){showToast("Erro: "+e.message,true);}
};
window.recalcularTotalKm=async()=>{
  if(!confirm("Recalcular o totalKm de todos os membros?\n\nIsso vai somar todos os registros de km de cada membro e corrigir o valor no Firestore.\nPode demorar alguns segundos."))return;
  showToast("Recalculando...");
  try{
    const snap=await getDocs(collection(db,"registros"));
    const totais={};
    snap.docs.forEach(d=>{
      const r=d.data();
      const id=r.membroId;
      if(id&&typeof r.km==="number")totais[id]=(totais[id]||0)+r.km;
    });
    const batch=[];
    for(const[id,total] of Object.entries(totais)){
      const docId=resolveDocId(id)||id;
      batch.push(setDoc(doc(db,"usuarios",docId),{totalKm:Math.round(total)},{merge:true}));
      const m=MEMBROS.find(m=>m.uid===id||m.authUid===id);
      if(m)m.totalKm=Math.round(total);
    }
    await Promise.all(batch);
    await carregarMembros();
    showToast(`✓ totalKm recalculado para ${Object.keys(totais).length} membros`);
    render();
  }catch(e){showToast("Erro: "+e.message,true);}
};

window.salvarNovaViagem=async()=>{
  const nome=document.getElementById("nv-nome")?.value.trim();
  const dataRaw=document.getElementById("nv-data")?.value.trim();
  const local=document.getElementById("nv-local")?.value.trim();
  const distIda=parseFloat(document.getElementById("nv-dist")?.value)||0;
  const tipo=document.getElementById("nv-tipo")?.value||"Passeio";
  const desc=document.getElementById("nv-desc")?.value.trim()||"";
  const endereco=document.getElementById("nv-endereco")?.value.trim()||"";
  const obrigatorio=document.getElementById("nv-obrigatorio")?.checked!==false;
  const err=document.getElementById("nv-err");
  if(err)err.style.display="none";
  if(!nome||!dataRaw||!local){if(err){err.textContent="Preencha nome, data e local.";err.style.display="block";}return;}
  if(!/^\d{2}\/\d{2}\/\d{4}$/.test(dataRaw)){if(err){err.textContent="Data inválida. Use DD/MM/AAAA.";err.style.display="block";}return;}
  const [dd,mm,yyyy]=dataRaw.split("/");
  const dataISO=`${yyyy}-${mm}-${dd}`;
  try{
    await addDoc(collection(db,"eventos_sede"),{nome,data:dataISO,destino:local,dist:distIda,distIdaVolta:distIda*2,tipo,desc,endereco,obrigatorio,categoria:"viagem",criadoPor:UP.apelido,criadoEm:serverTimestamp()});
    showToast("✓ Viagem salva!");
    document.getElementById("nova-viagem-modal")?.remove();
    await carregarViagensExtra();
  }catch(e){if(err){err.textContent="Erro: "+e.message;err.style.display="block";}}
};

window.zerarTemporada=async()=>{
  if(!UP?.isAdmin)return;
  if(!confirm("⚠️ Tem certeza?\n\nIsso zerará o totalKm de todos os membros e arquivará todos os registros de km.\n\nEssa ação não pode ser desfeita."))return;
  const confirmText=prompt("Para confirmar, digite CONFIRMAR:");
  if(confirmText!=="CONFIRMAR"){showToast("Operação cancelada.",true);return;}
  showToast("Zerando temporada...");
  try{
    const ano=new Date().getFullYear();
    const regSnap=await getDocs(collection(db,"registros"));
    // Arquiva todos os registros
    for(const d of regSnap.docs){
      await setDoc(doc(db,`registros_arquivo/${ano}/registros`,d.id),d.data());
      await deleteDoc(doc(db,"registros",d.id));
    }
    // Zera totalKm de todos os membros
    const userSnap=await getDocs(collection(db,"usuarios"));
    for(const d of userSnap.docs){
      await setDoc(doc(db,"usuarios",d.id),{totalKm:0},{merge:true});
    }
    MEMBROS.forEach(m=>{m.totalKm=0;});
    if(UP)UP.totalKm=0;
    // Audit log
    await addDoc(collection(db,"audit_log"),{tipo:"zerar_temporada",autor:UP.apelido,autorId:CU.uid,ano,registrosArquivados:regSnap.docs.length,criadoEm:serverTimestamp()});
    await carregarRegistros();
    showToast(`✓ Temporada zerada! ${regSnap.docs.length} registros arquivados em registros_arquivo/${ano}.`);
    render();
  }catch(e){showToast("Erro: "+e.message,true);}
};
async function recalcularKmMembro(membroId){
  const m=findMembro(membroId);
  const docId=resolveDocId(membroId)||membroId;
  const ids=[...new Set([membroId,m?.uid,m?.authUid].filter(Boolean))];
  let total=0;
  for(const id of ids){
    const snap=await getDocs(query(collection(db,"registros"),where("membroId","==",id)));
    snap.docs.forEach(d=>{total+=d.data().km||0;});
  }
  const rounded=Math.round(total);
  await setDoc(doc(db,"usuarios",docId),{totalKm:rounded},{merge:true});
  if(m)m.totalKm=rounded;
  if(UP&&(UP.uid===docId||resolveDocId(membroId)===MY_DOC_ID))UP.totalKm=rounded;
  return rounded;
}
